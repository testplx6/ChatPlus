  const col = colonieDe(state.world, regionId);
  return col ? col.faction : null;
}

// ---------------------------------------------------------------------------
// Combat impliquant le joueur
// ---------------------------------------------------------------------------

function combatContre(state, bande, log, ctx) {
  const rng = ctx.rng;
  const posture = POSTURES[state.player.posture] || POSTURES.neutre;
  const squad = state.player.squad.filter(estVivant);
  const combattants = squad.filter((c) => c.etat !== 'mort');

  const res = resoudreCombat(combattants, bande.membres, {
    rng,
    biome: state.world.regions[state.player.regionId].biome,
    posture,
    bonusDegats: (state.base.recherche.balistique || 0) * 0.1,
    bonusArmure: (state.base.recherche.blindage || 0) * 0.1,
    letalA: state.player.politique.achever ? 0.5 : 0.06,
    letalB: bande.letal,
  });

  const lieu = nomRegion(state.world, state.player.regionId);
  let texte;
  if (res.vainqueur === 'A') {
    const b = butin(bande, rng);
    let ramasse = 0;
    for (const k of Object.keys(b.loot)) ramasse += ajouterAuSac(state, k, b.loot[k]);
    state.player.credits += b.credits;
    for (const o of b.objets) {
      if (state.player.objets.length < 30) state.player.objets.push(o);
    }
    reputation(state, bande.faction, -6);
    // Les ennemis d'un ennemi apprécient
    for (const k of Object.keys(state.world.factions)) {
      if (k === bande.faction || k === 'essaim') continue;
      const g = state.world.guerres.some(
        (w) => (w.a === k && w.b === bande.faction) || (w.b === k && w.a === bande.faction)
      );
      if (g) reputation(state, k, 2);
    }
    state.stats.combatsGagnes++;
    texte = `${bande.nom} mis en déroute à ${lieu} — ${ramasse} unités et ${b.credits} cr récupérés.`;
  } else if (res.vainqueur === 'B') {
    texte = perdreCombat(state, bande, log, ctx, lieu);
  } else {
    texte = `Accrochage indécis avec ${bande.nom} à ${lieu}. Chacun décroche.`;
  }

  state.stats.combats++;
  const morts = state.player.squad.filter((c) => c.etat === 'mort' && !c._compte);
  for (const m of morts) {
    m._compte = true;
    log({ type: 'mort', texte: `${m.nom} est mort à ${lieu}.`, important: true });
  }

  log({
    type: 'combat',
    texte,
    important: true,
    regionId: state.player.regionId,
    // On garde le début de l'échange et son épilogue : le détail complet
    // noie l'écran sur mobile.
    detail: res.journal.length > 12
      ? res.journal.slice(0, 7).map((j) => j.txt)
        .concat([`… ${res.journal.length - 12} échanges …`])
        .concat(res.journal.slice(-5).map((j) => j.txt))
      : res.journal.map((j) => j.txt),
  });
  return res;
}

function perdreCombat(state, bande, log, ctx, lieu) {
  const rng = ctx.rng;
  state.stats.defaites++;

  if (bande.faction === 'essaim') {
    // L'Essaim ne fait pas de prisonniers
    for (const c of state.player.squad) {
      if (c.etat === 'ko' && rng.chance(0.3)) {
        blesser(c, 40, 'torse', rng, { letal: true });
      }
    }
    return `L’Essaim submerge l’escouade à ${lieu}.`;
  }

  // Dépouillés et abandonnés plus loin : on survit, on repart de rien.
  let perdu = 0;
  for (const k of COMMODITY_KEYS) {
    const q = state.player.inventaire[k] || 0;
    const pris = Math.round(q * rng.range(0.5, 0.85));
    state.player.inventaire[k] = q - pris;
    perdu += pris;
  }
  const cr = Math.round(state.player.credits * rng.range(0.4, 0.8));
  state.player.credits -= cr;
  if (state.player.objets.length && rng.chance(0.6)) {
    state.player.objets.splice(rng.int(state.player.objets.length), 1);
  }
  reputation(state, bande.faction, -3);

  // On se réveille ailleurs, quelques heures plus tard. Dépouillés, pas égorgés :
  // ces gens voulaient le sac, pas les cadavres.
  const options = voisins(state.player.regionId);
  if (options.length) state.player.regionId = rng.pick(options);
  state.player.ordre = { type: 'repos' };
  for (const c of state.player.squad) {
    if (c.etat === 'mort') continue;
    c.sang = Math.min(c.sang, 6);
    if (c.etat === 'ko') c.koHeures = Math.max(c.koHeures, rng.irange(4, 12));
  }
  return `Escouade battue à ${lieu} : ${perdu} unités et ${cr} cr perdus, réveil à ${nomRegion(state.world, state.player.regionId)}.`;
}

// ---------------------------------------------------------------------------
// Table de rencontres
// ---------------------------------------------------------------------------

function bandeLocale(state, ctx) {
  const rng = ctx.rng;
  const regionId = state.player.regionId;
  const dominante = factionDominante(state, regionId);
  const repu = dominante ? (state.player.reputation[dominante] || 0) : 0;

  // Une faction dont on est mal vu envoie ses hommes ; sinon, la faune du coin.
  let faction;
  if (dominante && repu < -25 && rng.chance(0.6)) faction = dominante;
  else {
    faction = rng.weighted([
      ['bandits', 3],
      ['essaim', state.world.regions[regionId].biome === 'plastique' ? 2.2 : 1.1],
      [dominante || 'bandits', dominante ? 1.4 : 0],
    ]);
  }
  // Le monde durcit lentement, mais les bandes restent le plus souvent
  // inférieures en nombre : c'est au joueur de choisir quand ça vaut le coup.
  const niveauMonde = Math.min(2, Math.floor(state.temps / 2500));
  const debout = state.player.squad.filter(estDebout).length || 1;
  const taille = Math.max(1, Math.round(rng.weighted([
    [1, 3], [2, 3], [3, 2], [debout, 1.5], [debout + 1, 0.6],
  ])));
  return genererBande(rng, faction, Math.min(6, taille), niveauMonde);
}

/** Tente une rencontre sur l'heure écoulée. Retourne true si quelque chose est arrivé. */
function tenterRencontre(state, log, ctx, multiplicateur = 1) {
  const rng = ctx.rng;
  const regionId = state.player.regionId;
  const r = state.world.regions[regionId];
  const posture = POSTURES[state.player.posture] || POSTURES.neutre;
  const col = colonieDe(state.world, regionId);

  // En ville, on est relativement tranquille
  let p = r.danger * multiplicateur * (col ? 0.25 : 1);
  // Furtivité du plus discret de l'escouade
  let furtif = 0;
  const debout = state.player.squad.filter(estDebout);
  if (debout.length) {
    furtif = Math.max(...debout.map((c) => comp(c, 'furtivite')));
  }
  p *= 1 - Math.min(0.55, furtif / 190);
  p *= 1 - posture.evitement * 0.7;
  // Une armée dans le secteur, c'est du monde sur les routes
  const armeesIci = state.world.armees.filter((a) => distance(a.regionId, regionId) <= 1).length;
  p *= 1 + armeesIci * 0.6;

  if (!rng.chance(Math.min(0.5, p))) return false;

  const type = rng.weighted([
    ['hostile', 5],
    ['epave', 2],
    ['errant', 1.1],
    ['caravane', col ? 0.4 : 1.3],
    ['peage', r.controle ? 1.5 : 0.2],
  ]);

  switch (type) {
    case 'hostile': {
      const bande = bandeLocale(state, ctx);
      if (posture.evitement > 0 && rng.chance(posture.evitement * 0.8)) {
        log({ type: 'esquive', texte: `${bande.nom} repéré à temps. Contournement.`, regionId });
        for (const c of debout) gagnerXp(c, 'furtivite', 1.2);
        return true;
      }
      combatContre(state, bande, log, ctx);
      return true;
    }
    case 'epave': {
      const biome = state.world.regions[regionId].biome;
      const table = { dalles: 'composant', friche: 'isotope', plastique: 'polymere', relais: 'composant' };
      const k = table[biome] || rng.pick(['ferraille', 'minerai', 'alliage']);
      const q = rng.irange(3, 14);
      const pris = ajouterAuSac(state, k, q);
      const cr = rng.irange(0, 60);
      state.player.credits += cr;
      for (const c of debout) gagnerXp(c, 'ingenierie', 1.5);
      log({
        type: 'trouvaille',
        texte: `Épave fouillée : ${pris} ${COMMODITIES[k].nom.toLowerCase()}${cr ? ` et ${cr} cr` : ''}.`,
        regionId,
      });
      return true;
    }
    case 'errant': {
      const max = tailleEscouadeMax(state.base);
      const vivants = state.player.squad.filter(estVivant).length;
      const prix = rng.irange(120, 420);
      if (!state.player.politique.recruter || vivants >= max || state.player.credits < prix) {
        log({
          type: 'rencontre',
          texte: `Un errant propose ses services (${prix} cr). Décliné.`,
          regionId,
          discret: true,
        });
        return true;
      }
      const c = makeCharacter(rng, { niveau: rng.irange(0, 1) });
      state.player.credits -= prix;
      state.player.squad.push(c);
      log({
        type: 'recrue',
        texte: `${c.nom} (${c.archetypeNom}) rejoint l’escouade pour ${prix} cr.`,
        regionId,
        important: true,
      });
      return true;
    }
    case 'caravane': {
      if (!state.player.politique.commercer) {
        log({ type: 'rencontre', texte: 'Une caravane passe. On la laisse filer.', regionId, discret: true });
        return true;
      }
      const stock = COMMODITY_KEYS.filter((k) => (state.player.inventaire[k] || 0) > 0);
      if (!stock.length) {
        log({ type: 'rencontre', texte: 'Une caravane passe. Rien à lui vendre.', regionId, discret: true });
        return true;
      }
      const k = rng.pick(stock);
      const q = Math.min(state.player.inventaire[k], rng.irange(3, 25));
      const negoc = debout.length
        ? debout.reduce((a, b) => (comp(a, 'commerce') >= comp(b, 'commerce') ? a : b))
        : null;
      const bonus = negoc ? comp(negoc, 'commerce') / 260 : 0;
      const prix = Math.round(COMMODITIES[k].prix * (1.15 + bonus) * q);
      state.player.inventaire[k] -= q;
      state.player.credits += prix;
      if (negoc) gagnerXp(negoc, 'commerce', 1.4);
      log({
        type: 'commerce',
        texte: `Caravane : ${q} ${COMMODITIES[k].nom.toLowerCase()} vendus pour ${prix} cr.`,
        regionId,
      });
      return true;
    }
    case 'peage': {
      const f = r.controle || 'bandits';
      const taxe = rng.irange(40, 220);
      const agressif = state.player.posture === 'agressif';
      if (!agressif && state.player.credits >= taxe && state.player.politique.payerPeage) {
        state.player.credits -= taxe;
        reputation(state, f, 1);
        log({
          type: 'peage',
          texte: `Péage ${FACTIONS[f] ? FACTIONS[f].nom : 'local'} : ${taxe} cr versés.`,
          regionId,
        });
      } else {
        const bande = genererBande(rng, FACTIONS[f] ? f : 'bandits', rng.irange(2, 4), Math.min(2, Math.floor(state.temps / 900)));
        log({ type: 'peage', texte: `Péage refusé. Ça tourne mal.`, regionId });
        reputation(state, f, -8);
        combatContre(state, bande, log, ctx);
      }
      return true;
    }
    default:
      return false;
  }
}

/**
 * Aléa environnemental du biome (radiations, pluie acide, éboulement…).
 * `exposition` : 1 en plein travail dehors, ~0.3 au repos ou à l'abri.
 */
function tenterAlea(state, log, ctx, exposition = 1) {
  const rng = ctx.rng;
  const regionId = state.player.regionId;
  const r = state.world.regions[regionId];
  const h = BIOMES[r.biome].hazard;
  if (!h) return false;
  const col = colonieDe(state.world, regionId);
  const abri = col ? 0.25 : 1;
  const protege = state.base.fonde && state.base.regionId === regionId ? 0.3 : 1;
  if (!rng.chance(h.p * exposition * abri * protege)) return false;

  const touches = [];
  for (const c of state.player.squad) {
    if (!estVivant(c)) continue;
    if (!rng.chance(0.7)) continue;
    const armure = c.equip.armure ? (ITEMS[c.equip.armure].armure || 0) : 0;
    const reduc = 1 - Math.min(0.6, armure / 30);
    const d = h.degats * rng.range(0.6, 1.4) * reduc;
    if (d > 0.5) {
      const res = blesser(c, d, rng.pick(['torse', 'tete', 'brasG', 'jambeD']), rng);
      if (res.mort) log({ type: 'mort', texte: `${c.nom} succombe : ${h.nom.toLowerCase()}.`, important: true });
    }
    c.fatigue = Math.min(120, c.fatigue + h.fatigue * rng.range(0.5, 1.2));
    touches.push(c.nom);
  }
  if (!touches.length) return false;
  log({
    type: 'alea',
    texte: `${h.nom} sur ${nomRegion(state.world, regionId)}. ${touches.length} membre(s) touché(s).`,
    regionId,
  });
  return true;
}

/** Résumé lisible d'une entrée de journal (utilisé par l'UI). */
function couleurLog(type) {
  switch (type) {
    case 'combat': case 'mort': case 'raid': return 'danger';
    case 'capture': case 'guerre': case 'siege': case 'bataille': return 'guerre';
    case 'trouvaille': case 'commerce': case 'recrue': return 'gain';
    case 'base': case 'recherche': case 'chantier': return 'base';
    default: return 'neutre';
  }
}

// ===== src/squad.js ==================================================
// Résolution des ordres de l'escouade, heure par heure.


const ORDRES = {
  repos: { nom: 'Repos', desc: 'Récupération, soins, rien d’autre.', effort: 0 },
  fouille: { nom: 'Fouiller', desc: 'Ratisser la région pour tout ce qui traîne.', effort: 1 },
  mine: { nom: 'Extraire', desc: 'Minerai et métaux, à la force du poignet.', effort: 1.2 },
  chasse: { nom: 'Chasser', desc: 'Biomasse et viande, de quoi manger.', effort: 1 },
  entrainement: { nom: 'S’entraîner', desc: 'Progresser vite, consommer des vivres.', effort: 1.1 },
  patrouille: { nom: 'Patrouiller', desc: 'Chercher l’affrontement dans le secteur.', effort: 1.1 },
  voyage: { nom: 'En route', desc: 'Déplacement vers une région.', effort: 1 },
};

// ---------------------------------------------------------------------------
// Ordres
// ---------------------------------------------------------------------------

function donnerOrdre(state, ordre) {
  if (ordre.type === 'voyage') {
    const mods = { reductionVoyage: (state.base.recherche.logistique || 0) * 0.06 };
    const route = chemin(state.world, state.player.regionId, ordre.dest, mods);
    if (!route || !route.length) return { ok: false, motif: 'Aucune route.' };
    state.player.ordre = {
      type: 'voyage',
      dest: ordre.dest,
      route,
      etape: 0,
      progres: 0,
    };
    return { ok: true };
  }
  if (!ORDRES[ordre.type]) return { ok: false, motif: 'Ordre inconnu.' };
  state.player.ordre = Object.assign({}, ordre);
  return { ok: true };
}

// ---------------------------------------------------------------------------
// Récolte
// ---------------------------------------------------------------------------

const FILTRES = {
  fouille: null, // tout ce que le biome donne
  mine: ['minerai', 'ferraille', 'alliage', 'isotope'],
  chasse: ['biomasse'],
};

const SKILL_ORDRE = { fouille: 'ingenierie', mine: 'force', chasse: 'tir' };

function recolter(state, type, log, ctx) {
  const rng = ctx.rng;
  const regionId = state.player.regionId;
  const r = state.world.regions[regionId];
  const biome = BIOMES[r.biome];
  const posture = POSTURES[state.player.posture] || POSTURES.neutre;
  const skill = SKILL_ORDRE[type];
  const filtre = FILTRES[type];

  const travailleurs = state.player.squad.filter(estDebout);
  if (!travailleurs.length) return {};

  // Même un désert nourrit son homme, mal : la chasse a un plancher partout,
  // sinon un ordre parfaitement raisonnable rend zéro sans prévenir.
  const rendements = Object.assign({}, biome.yields);
  if (type === 'chasse') {
    rendements.biomasse = Math.max(rendements.biomasse || 0, r.biome === 'relais' ? 0.05 : 0.18);
  }

  const epuisement = 1 - Math.min(0.8, r.fouille);
  const recolte = {};
  for (const c of travailleurs) {
    const habilete = 0.45 + comp(c, skill) / 115;
    for (const k of Object.keys(rendements)) {
      if (filtre && !filtre.includes(k)) continue;
      const q = rendements[k] * r.richesse * habilete * posture.rendement * epuisement * rng.range(0.75, 1.25);
      recolte[k] = (recolte[k] || 0) + q;
    }
    gagnerXp(c, skill, 1.1);
    gagnerXp(c, 'endurance', 0.4);
  }
  // La chasse transforme une part de la biomasse en rations directes
  // Chasser, c'est manger : l'essentiel part en rations, pas en biomasse brute
  // qu'on ne saurait pas transformer sans avant-poste.
  if (type === 'chasse' && recolte.biomasse) {
    recolte.rations = (recolte.rations || 0) + recolte.biomasse * 0.7;
    recolte.biomasse *= 0.3;
  }

  // Épuisement local : rester camper au même endroit rapporte de moins en
  // moins. Assez lent pour laisser une région exploitable plusieurs semaines.
  r.fouille = Math.min(0.6, r.fouille + 0.0012 * travailleurs.length);

  // Les rendements horaires sont fractionnaires : sans report d'une heure sur
  // l'autre, tout ce qui rapporte moins d'une unité par heure rapporte zéro.
  const reste = state.player.reste || (state.player.reste = {});
  let total = 0;
  const detail = [];
  for (const k of Object.keys(recolte)) {
    const cumul = (reste[k] || 0) + recolte[k];
    const q = Math.floor(cumul);
    reste[k] = cumul - q;
    if (q <= 0) continue;
    const pris = ajouterAuSac(state, k, q);
    reste[k] += q - pris; // sac plein : on ne jette pas, on garde en attente
    if (pris > 0) {
      total += pris;
      detail.push(`${pris} ${COMMODITIES[k].nom.toLowerCase()}`);
    }
  }
  if (total > 0) {
    state.stats.recolte += total;
    state.player.recolteHeure = detail.join(', ');
  } else {
    state.player.recolteHeure = null;
  }
  return recolte;
}

// ---------------------------------------------------------------------------
// Soins
// ---------------------------------------------------------------------------

function qualiteSoin(state, auRepos) {
  const debout = state.player.squad.filter(estDebout);
  let medic = 0;
  for (const c of debout) medic = Math.max(medic, comp(c, 'medecine'));
  let q = 0.25 + medic / 90;
  q *= 1 + (state.base.recherche.medecine || 0) * 0.25;
  if (state.base.fonde && state.player.regionId === state.base.regionId) {
    q *= 1 + nivBat(state.base, 'infirmerie') * 0.35;
  }
  if (!auRepos) q *= 0.35;
  return q;
}

/** Consomme un medkit sur le plus mal en point si ça vaut le coup. */
function utiliserMedkit(state, log, ctx) {
  if ((state.player.inventaire.medkit || 0) < 1) return;
  const blesses = state.player.squad.filter((c) => estVivant(c) && (pvTotal(c).pct < 0.55 || c.sang > 20));
  if (!blesses.length) return;
  const cible = blesses.reduce((a, b) => (pvTotal(a).pct <= pvTotal(b).pct ? a : b));
  state.player.inventaire.medkit -= 1;
  cible.sang = 0;
  for (const p of Object.keys(cible.corps)) {
    const part = cible.corps[p];
    part.pv = Math.min(part.max, part.pv + part.max * 0.22);
  }
  const soigneur = state.player.squad.filter(estDebout)
    .reduce((a, b) => (!a || comp(b, 'medecine') > comp(a, 'medecine') ? b : a), null);
  if (soigneur) gagnerXp(soigneur, 'medecine', 3);
  if (cible.etat === 'ko' && pvTotal(cible).pct > 0.45) {
    cible.etat = 'ok';
    cible.koHeures = 0;
  }
  log({ type: 'soin', texte: `Medkit utilisé sur ${cible.nom}.`, discret: true });
}

// ---------------------------------------------------------------------------
// Voyage
// ---------------------------------------------------------------------------

function avancerVoyage(state, log, ctx) {
  const o = state.player.ordre;
  const debout = state.player.squad.filter(estDebout);
  if (!debout.length) return;

  // Vitesse dictée par le plus lent, alourdie par le sac et les K.O. portés
  let vitesse = Infinity;
  for (const c of debout) {
    const v = 0.5 + comp(c, 'endurance') / 90;
    vitesse = Math.min(vitesse, v);
  }
  const cap = Math.max(1, capacitePortage(state));
  const charge = poidsInventaire(state.player.inventaire) / cap;
  vitesse *= 1 - Math.min(0.55, Math.max(0, charge - 0.6) * 0.9);
  const portes = state.player.squad.filter((c) => c.etat === 'ko').length;
  vitesse *= 1 - Math.min(0.5, portes * 0.18);
  vitesse = Math.max(0.15, vitesse);

  o.progres += vitesse;
  const prochaine = o.route[o.etape];
  const mods = { reductionVoyage: (state.base.recherche.logistique || 0) * 0.06 };
  const cout = coutTraversee(state.world, prochaine, mods);

  if (o.progres >= cout) {
    o.progres = 0;
    state.player.regionId = prochaine;
    o.etape++;
    const rayon = 1 + (state.base.recherche.optique || 0);
    decouvrir(state.world, prochaine, rayon);
    for (const c of debout) gagnerXp(c, 'endurance', 1.2);

    const col = colonieDe(state.world, prochaine);
    if (col) {
      log({
        type: 'voyage',
        texte: `Arrivée à ${col.nom} (${col.faction ? state.world.factions[col.faction].nom : 'sans maître'}).`,
        regionId: prochaine,
      });
    }
    if (o.etape >= o.route.length) {
      state.player.ordre = { type: 'repos' };
      log({
        type: 'voyage',
        texte: `Destination atteinte : ${nomRegion(state.world, prochaine)}.`,
        regionId: prochaine,
        important: true,
      });
    }
  }
}

// ---------------------------------------------------------------------------
// Tick
// ---------------------------------------------------------------------------

function tickSquad(state, log, ctx) {
  const rng = ctx.rng;
  const vivants = state.player.squad.filter(estVivant);
  if (!vivants.length) {
    if (!state.fin) {
      state.fin = 'extinction';
      log({ type: 'fin', texte: 'L’escouade a cessé d’exister. Fin de partie.', important: true });
    }
    return;
  }

  const ordre = state.player.ordre || { type: 'repos' };
  const def = ORDRES[ordre.type] || ORDRES.repos;
  let effort = def.effort;

  // Cycle jour/nuit : on campe la nuit, sauf en marche forcée. C'est ce qui
  // permet à la fatigue de redescendre — sans ça, elle se colle au plafond.
  const heure = state.temps % 24;
  const nuit = heure >= 22 || heure < 6;
  let travaille = true;
  if (nuit && ordre.type !== 'voyage') {
    travaille = false;
    effort = 0;
  } else if (nuit) {
    effort = 1.35; // marche de nuit : épuisant
  }
  state.player.nuit = nuit;

  // Personne debout : on ne fait que survivre
  const debout = state.player.squad.filter(estDebout);
  if (!debout.length) { effort = 0; travaille = false; }

  // --- Nourriture : on mange dès qu'on a faim et de quoi
  for (const c of vivants) {
    if (c.faim > 42) {
      const dispo = state.player.inventaire.rations || 0;
      const mange = nourrir(c, dispo);
      if (mange > 0) state.player.inventaire.rations -= mange;
    }
  }

  // --- Exécution de l'ordre
  if (debout.length && travaille) {
    switch (ordre.type) {
      case 'voyage':
        avancerVoyage(state, log, ctx);
        break;
      case 'fouille':
      case 'mine':
      case 'chasse':
        recolter(state, ordre.type, log, ctx);
        break;
      case 'entrainement': {
        const skill = ordre.skill || 'melee';
        const cout = Math.ceil(debout.length / 2);
        if ((state.player.inventaire.rations || 0) >= cout) {
          state.player.inventaire.rations -= cout;
          for (const c of debout) {
            const av = c.skills[skill];
            gagnerXp(c, skill, 5.5);
            if (c.skills[skill] > av) {
              log({ type: 'progres', texte: `${c.nom} : ${skill} ${c.skills[skill]}.`, discret: true });
            }
          }
        } else {
          effort = 0.2;
          state.player.ordre = { type: 'repos' };
          log({ type: 'ordre', texte: 'Plus de rations : entraînement interrompu.', regionId: state.player.regionId });
        }
        break;
      }
      case 'patrouille': {
        const f = state.world.regions[state.player.regionId].controle;
        if (f) reputation(state, f, 0.05);
        break;
      }
      default:
        break;
    }
  }

  // --- Aléas et rencontres
  const exposition = travaille ? 1 : 0.35;
  tenterAlea(state, log, ctx, exposition);
  if (!state.fin) {
    let mult = ordre.type === 'patrouille' ? 2.4 : ordre.type === 'repos' ? 0.45 : 1;
    if (!travaille) mult *= 0.5; // camp de nuit, feu éteint
    tenterRencontre(state, log, ctx, mult);
  }

  // --- Soins et besoins
  const auRepos = effort <= 0.05;
  const q = qualiteSoin(state, auRepos);
  utiliserMedkit(state, log, ctx);
  for (const c of state.player.squad) {
    const msgs = tickPerso(c, effort, rng, { soin: q, premiersSecours: debout.length > 0 });
    for (const m of msgs) {
      log({ type: m.type, texte: m.texte, important: m.type === 'mort' });
    }
  }

  // La région se régénère lentement de la fouille
  for (const r of state.world.regions) {
    if (r.fouille > 0) r.fouille = Math.max(0, r.fouille - 0.003);
  }

  // Fin de partie
  if (!state.player.squad.some(estVivant) && !state.fin) {
    state.fin = 'extinction';
    log({ type: 'fin', texte: 'L’escouade a cessé d’exister. Fin de partie.', important: true });
  }
}

// ===== src/sim.js ====================================================
// Orchestration : création de partie, tick horaire, rattrapage du temps passé
// hors ligne. `state.world` est la moitié partagée de l'état (celle qui vivrait
// côté serveur en multijoueur), `state.player` / `state.base` la moitié privée.


/** Durée réelle d'une heure de jeu, à vitesse ×1. */
const TICK_MS = 20000;
/** Plafond de rattrapage hors ligne : 48 h réelles à ×1. */
const RATTRAPAGE_MAX = 8640;

const VITESSES = [1, 4, 16];

// ---------------------------------------------------------------------------
// Création
// ---------------------------------------------------------------------------

function nouvellePartie(seed, opts = {}) {
  const rng = new Rng(seed);
  const world = genererMonde(rng);

  // On démarre chez les Communes Libres si elles existent : le moins hostile.
  let depart = null;
  const libres = world.colonies.filter((c) => c.faction === 'libres');
  if (libres.length) depart = rng.pick(libres);
  else depart = rng.pick(world.colonies);

  // On part équipé : sans armure, la première bande de pillards venue
  // liquide l'escouade avant qu'elle ait appris quoi que ce soit.
  const squad = [];
  const depart2 = [
    { archetype: 'ferrailleur', arme: 'machette', armure: 'cuir' },
    { archetype: 'chasseur', arme: 'clous', armure: 'cuir' },
    { archetype: 'medic', arme: 'barre', armure: 'cuir' },
  ];
  for (const d of depart2) squad.push(makeCharacter(rng, d));

  const inventaire = {};
  for (const k of COMMODITY_KEYS) inventaire[k] = 0;
  inventaire.rations = 45;
  inventaire.ferraille = 20;
  inventaire.medkit = 2;

  const reputation = {};
  for (const k of DIPLO_FACTIONS) reputation[k] = 0;
  reputation[depart.faction] = 12;

  const state = {
    version: 1,
    seed,
    rngState: rng.save(),
    temps: 0,
    vitesse: 1,
    dernierReel: opts.maintenant ?? 0,
    nom: opts.nom || 'Convoi sans nom',
    world,
    player: {
      credits: 450,
      regionId: depart.regionId,
      squad,
      ordre: { type: 'repos' },
      inventaire,
      objets: ['machette', 'cuir'],
      reputation,
      posture: 'neutre',
      politique: {
        recruter: true,
        commercer: true,
        payerPeage: true,
        achever: false,
      },
      recolteHeure: null,
      reste: {},
      nuit: false,
    },
    base: creerBase(),
    journal: [],
    nonLus: 0,
    stats: {
      ticks: 0,
      combats: 0,
      combatsGagnes: 0,
      defaites: 0,
      recolte: 0,
      creditsGagnes: 0,
    },
    fin: null,
  };

  decouvrir(world, depart.regionId, 2);
  const log = creerLogger(state);
  log({
    type: 'debut',
    texte: `Le convoi s’arrête à ${depart.nom}. Trois bouches à nourrir, 450 crédits, et un monde qui ne demande rien à personne.`,
    important: true,
    regionId: depart.regionId,
  });
  return state;
}

// ---------------------------------------------------------------------------
// Tick
// ---------------------------------------------------------------------------

/** Fait passer une heure de jeu. */
function tick(state) {
  const rng = new Rng(state.rngState);
  const ctx = { rng };
  const log = creerLogger(state);

  state.temps += 1;
  state.stats.ticks += 1;

  // Le monde d'abord : il tourne que le joueur agisse ou non.
  for (const col of state.world.colonies) tickColonie(state.world, col, rng);
  tickFactions(state.world, state.temps, log, ctx);

  // Puis l'avant-poste et l'escouade.
  tickBase(state, log, ctx);
  if (!state.fin) tickSquad(state, log, ctx);

  state.rngState = rng.save();
  return state;
}

/** Enchaîne `n` heures. Retourne le nombre de ticks réellement joués. */
function avancer(state, n) {
  let joues = 0;
  for (let i = 0; i < n; i++) {
    if (state.fin) break;
    tick(state);
    joues++;
  }
  return joues;
}

/**
 * Rattrapage : applique le temps réel écoulé depuis la dernière session.
 * Retourne { ticks, tronque } — `tronque` si on a tapé le plafond.
 */
function rattraper(state, maintenantMs) {
  if (!state.dernierReel) {
    state.dernierReel = maintenantMs;
    return { ticks: 0, tronque: false };
  }
  const ecoule = Math.max(0, maintenantMs - state.dernierReel);
  const pas = TICK_MS / (state.vitesse || 1);
  let ticks = Math.floor(ecoule / pas);
  const tronque = ticks > RATTRAPAGE_MAX;
  if (tronque) ticks = RATTRAPAGE_MAX;
  const joues = avancer(state, ticks);
  // On garde le reste pour ne pas perdre les fractions d'heure
  state.dernierReel = maintenantMs - (ecoule - ticks * pas);
  if (tronque) state.dernierReel = maintenantMs;
  return { ticks: joues, tronque };
}

// ---------------------------------------------------------------------------
// Lecture du temps
// ---------------------------------------------------------------------------

function horloge(t) {
  const jour = Math.floor(t / 24) + 1;
  const heure = t % 24;
  return { jour, heure, texte: `J${jour} ${String(heure).padStart(2, '0')}:00` };
}

function resumeMonde(state) {
  const w = state.world;
  return {
    guerres: w.guerres.map((g) => ({
      a: FACTIONS[g.a].nom,
      b: FACTIONS[g.b].nom,
      depuis: g.depuis,
      batailles: g.batailles,
    })),
    armees: w.armees.map((a) => ({
      faction: FACTIONS[a.faction].nom,
      couleur: FACTIONS[a.faction].couleur,
      force: a.force,
      etat: a.etat,
      lieu: nomRegion(w, a.regionId),
      cible: a.cible ? (colonieParId(w, a.cible) || {}).nom : null,
    })),
  };
}

// ===== src/save.js ===================================================
// Sauvegarde locale. L'état est du JSON pur : pas de classes, pas de
// références circulaires, pas de fonctions. C'est ce qui rend possible à la
// fois la persistance navigateur et, plus tard, un envoi au serveur.

const CLE = 'cendres.save.v1';
const VERSION = 1;

function serialiser(state) {
  return JSON.stringify(state);
}

function deserialiser(txt) {
  const state = JSON.parse(txt);
  if (!state || state.version !== VERSION) {
    throw new Error('Sauvegarde incompatible.');
  }
  return state;
}

function stockage() {
  try {
    if (typeof localStorage !== 'undefined') return localStorage;
  } catch (e) {
    // Mode privé, quota, iframe verrouillée…
  }
  return null;
}

function sauvegarder(state) {
  const s = stockage();
  if (!s) return { ok: false, motif: 'Stockage local indisponible.' };
  try {
    s.setItem(CLE, serialiser(state));
    return { ok: true };
  } catch (e) {
    return { ok: false, motif: 'Écriture impossible (quota ?).' };
  }
}

function charger() {
  const s = stockage();
  if (!s) return null;
  const txt = s.getItem(CLE);
  if (!txt) return null;
  try {
    return deserialiser(txt);
  } catch (e) {
    return null;
  }
}

function effacer() {
  const s = stockage();
  if (s) s.removeItem(CLE);
}

function existeSauvegarde() {
  const s = stockage();
  return !!(s && s.getItem(CLE));
}

// ===== src/ui.js =====================================================
// Interface : rendu HTML + carte pixel sur canvas. C'est le SEUL module qui
// touche au DOM — tout le reste du dossier src/ tourne aussi bien sous Node.


// ---------------------------------------------------------------------------
// État local de l'interface
// ---------------------------------------------------------------------------

let S = null;
let ACTIONS = {};
let onglet = 'carte';
let selection = null;
let ouverts = new Set();
let filtreJournal = 'tout';
let modale = null;
let dernierRendu = -1;
let dernierRenduMs = 0;
let derniereInteraction = 0;
let toastTimer = null;

/** Cadence minimale entre deux reconstructions complètes de l'écran (ms). */
const RENDU_MIN_MS = 600;
/** Après un geste de l'utilisateur, on laisse le DOM tranquille un instant. */
const REPIT_APRES_CLIC_MS = 400;

const $ = (sel) => document.querySelector(sel);

function attacherEtat(state) {
  S = state;
  selection = state ? state.player.regionId : null;
}

function monterUI(api) {
  ACTIONS = api;
  $('#ecran').addEventListener('click', surClic);
  $('#barre-nav').addEventListener('click', surClic);
  $('#barre-haut').addEventListener('click', surClic);
  $('#modale').addEventListener('click', surClic);
  document.addEventListener('toggle', (ev) => {
    const d = ev.target.closest('details[data-id]');
    if (!d) return;
    if (d.open) ouverts.add(d.dataset.id);
    else ouverts.delete(d.dataset.id);
  }, true);
}

// ---------------------------------------------------------------------------
// Utilitaires
// ---------------------------------------------------------------------------

function e(s) {
  return String(s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function n(v, dec = 0) {
  if (!Number.isFinite(v)) return '—';
  return v.toLocaleString('fr-FR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}

function jauge(pct, cls = '', couleur) {
  const p = Math.max(0, Math.min(100, pct * 100));
  const st = `width:${p.toFixed(0)}%` + (couleur ? `;background:${couleur}` : '');
  return `<div class="jauge ${cls}"><i style="${st}"></i></div>`;
}

function toast(msg, err) {
  const vieux = document.querySelector('.toast');
  if (vieux) vieux.remove();
  const d = document.createElement('div');
  d.className = 'toast' + (err ? ' err' : '');
  d.textContent = msg;
  document.body.appendChild(d);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => d.remove(), 2600);
}

function logger() {
  return creerLogger(S);
}

function coutTexte(cout) {
  return Object.keys(cout)
    .map((k) => `${n(cout[k])} ${k === 'credits' ? 'cr' : COMMODITIES[k].nom.toLowerCase()}`)
    .join(' · ');
}

function dureeTexte(h) {
  if (h < 24) return `${Math.ceil(h)} h`;
  const j = Math.floor(h / 24);
  const r = Math.ceil(h % 24);
  return r ? `${j} j ${r} h` : `${j} j`;
}

function couleurFaction(k) {
  return (FACTIONS[k] && FACTIONS[k].couleur) || '#7b8699';
}

// ---------------------------------------------------------------------------
// Rendu principal
// ---------------------------------------------------------------------------

function rafraichir(force) {
  if (!S) { rendreAccueil(); return; }
  const maintenant = (typeof performance !== 'undefined' ? performance.now() : Date.now());
  if (!force) {
    if (S.temps === dernierRendu) return;
    // On reconstruit tout l'écran d'un bloc : à vitesse ×16 cela arriverait
    // plusieurs fois par seconde et pourrait avaler le geste de l'utilisateur.
    if (maintenant - dernierRenduMs < RENDU_MIN_MS) return;
    if (maintenant - derniereInteraction < REPIT_APRES_CLIC_MS) return;
  }
  dernierRendu = S.temps;
  dernierRenduMs = maintenant;

  const ecran = $('#ecran');
  const scroll = ecran.scrollTop;

  rendreBarreHaut();
  rendreNav();

  switch (onglet) {
    case 'carte': ecran.innerHTML = ecranCarte(); break;
    case 'escouade': ecran.innerHTML = ecranEscouade(); break;
    case 'base': ecran.innerHTML = ecranBase(); break;
    case 'monde': ecran.innerHTML = ecranMonde(); break;
    case 'journal': ecran.innerHTML = ecranJournal(); break;
    default: ecran.innerHTML = ecranCarte();
  }
  ecran.scrollTop = scroll;

  const cv = $('#carte');
  if (cv) {
    dessinerCarte(cv);
    if (!cv.dataset.lie) {
      cv.dataset.lie = '1';
      cv.addEventListener('click', surClicCarte);
    }
  }
  if (modale) rendreModale();
}

function rendreBarreHaut() {
  const h = horloge(S.temps);
  const p = S.player;
  const cap = capacitePortage(S);
  const poids = poidsInventaire(p.inventaire);
  const charge = cap > 0 ? poids / cap : 1;
  const vivants = p.squad.filter(estVivant).length;
  const debout = p.squad.filter(estDebout).length;

  $('#barre-haut').innerHTML = `
    <div class="hd-bloc"><span class="hd-eti">${p.nuit ? 'nuit' : 'jour'}</span>
      <span class="hd-val cyan">${h.texte}</span></div>
    <div class="hd-bloc"><span class="hd-eti">cr</span>
      <span class="hd-val ambre">${n(p.credits)}</span></div>
    <div class="hd-bloc"><span class="hd-eti">sac</span>
      <span class="hd-val ${charge > 0.95 ? 'rouge' : ''}">${n(poids)}/${n(cap)}</span></div>
    <div class="hd-bloc"><span class="hd-eti">esc</span>
      <span class="hd-val ${debout < vivants ? 'rouge' : ''}">${debout}/${vivants}</span></div>
    <div class="hd-pousse vitesse" role="group" aria-label="Vitesse">
      ${VITESSES.map((v) => `<button data-a="vitesse" data-v="${v}"
        aria-pressed="${S.vitesse === v}">×${v}</button>`).join('')}
    </div>`;
}

function rendreNav() {
  const tabs = [
    ['carte', '▚', 'CARTE'],
    ['escouade', '⌂', 'ESCOUADE'],
    ['base', '⌸', 'BASE'],
    ['monde', '◈', 'MONDE'],
    ['journal', '≡', 'JOURNAL'],
  ];
  $('#barre-nav').innerHTML = tabs.map(([k, g, l]) => `
    <button data-a="onglet" data-k="${k}" aria-current="${onglet === k ? 'page' : 'false'}">
      <span class="glyphe" aria-hidden="true">${g}</span>${l}
      ${k === 'journal' && S.nonLus ? `<span class="pastille">${S.nonLus > 99 ? '99' : S.nonLus}</span>` : ''}
    </button>`).join('');
}

// ---------------------------------------------------------------------------
// Carte pixel
// ---------------------------------------------------------------------------

const CELL = 16;

/** Bruit déterministe : la même case a toujours la même texture. */
function bruit(i, j) {
  let h = (i * 374761393 + j * 668265263) >>> 0;
  h = (h ^ (h >>> 13)) >>> 0;
  h = Math.imul(h, 1274126177) >>> 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

function dessinerCarte(cv) {
  const w = S.world;
  const L = w.largeur * CELL;
  const H = w.hauteur * CELL;
  if (cv.width !== L) { cv.width = L; cv.height = H; }
  const g = cv.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.fillStyle = '#05070a';
  g.fillRect(0, 0, L, H);

  for (const r of w.regions) {
    const x = r.x * CELL;
    const y = r.y * CELL;
    if (!r.decouvert) {
      g.fillStyle = '#0b0e14';
      g.fillRect(x, y, CELL, CELL);
      for (let k = 0; k < 4; k++) {
        const b = bruit(r.i, k);
        g.fillStyle = 'rgba(120,132,152,.07)';
        g.fillRect(x + Math.floor(b * 14), y + Math.floor(bruit(r.i, k + 9) * 14), 2, 2);
      }
      continue;
    }
    const cols = BIOMES[r.biome].couleurs;
    g.fillStyle = cols[0];
    g.fillRect(x, y, CELL, CELL);
    // Texture : quelques pixels plus clairs et plus sombres, toujours les mêmes
    for (let k = 0; k < 11; k++) {
      const b = bruit(r.i, k);
      const px = x + Math.floor(bruit(r.i, k + 31) * (CELL - 2));
      const py = y + Math.floor(bruit(r.i, k + 57) * (CELL - 2));
      g.fillStyle = b > 0.5 ? cols[1] : cols[2];
      g.fillRect(px, py, 2, 2);
    }
    // Territoire d'une faction : liseré dans sa couleur
    if (r.controle) {
      g.fillStyle = couleurFaction(r.controle);
      g.globalAlpha = 0.5;
      g.fillRect(x, y, CELL, 1);
      g.fillRect(x, y, 1, CELL);
      g.globalAlpha = 1;
    }
    // Épuisement de la région : voile sombre
    if (r.fouille > 0.15) {
      g.fillStyle = `rgba(0,0,0,${(r.fouille * 0.45).toFixed(2)})`;
      g.fillRect(x, y, CELL, CELL);
    }
  }

  // Colonies
  for (const col of w.colonies) {
    const r = w.regions[col.regionId];
    if (!r.decouvert) continue;
    const x = r.x * CELL;
    const y = r.y * CELL;
    const t = 3 + col.taille;
    const ox = x + Math.floor((CELL - t) / 2);
    const oy = y + Math.floor((CELL - t) / 2);
    g.fillStyle = '#05070a';
    g.fillRect(ox - 1, oy - 1, t + 2, t + 2);
    g.fillStyle = couleurFaction(col.faction);
    g.fillRect(ox, oy, t, t);
    g.fillStyle = '#05070a';
    g.fillRect(ox + 1, oy + 1, t - 2, t - 2);
  }

  // Avant-poste
  if (S.base.fonde) {
    const r = w.regions[S.base.regionId];
    if (r) {
      const x = r.x * CELL;
      const y = r.y * CELL;
      g.strokeStyle = '#4fd0e3';
      g.lineWidth = 1;
      g.strokeRect(x + 2.5, y + 2.5, CELL - 5, CELL - 5);
    }
  }

  // Armées
  for (const a of w.armees) {
    const r = w.regions[a.regionId];
    if (!r || !r.decouvert) continue;
    const x = r.x * CELL;
    const y = r.y * CELL;
    g.fillStyle = couleurFaction(a.faction);
    g.fillRect(x + 11, y + 2, 3, 3);
    g.fillStyle = '#05070a';
    g.fillRect(x + 12, y + 3, 1, 1);
  }

  // Escouade du joueur
  const rp = w.regions[S.player.regionId];
  if (rp) {
    const x = rp.x * CELL;
    const y = rp.y * CELL;
    g.fillStyle = '#05070a';
    g.fillRect(x + 5, y + 5, 6, 6);
    g.fillStyle = '#f2f6fb';
    g.fillRect(x + 6, y + 6, 4, 4);
    g.fillStyle = '#05070a';
    g.fillRect(x + 7, y + 7, 2, 2);
  }

  // Itinéraire en cours
  const o = S.player.ordre;
  if (o && o.type === 'voyage' && o.route) {
    g.fillStyle = 'rgba(242,246,251,.55)';
    for (let k = o.etape; k < o.route.length; k++) {
      const r = w.regions[o.route[k]];
      g.fillRect(r.x * CELL + 7, r.y * CELL + 7, 2, 2);
    }
  }

  // Sélection
  if (selection != null) {
    const r = w.regions[selection];
    g.strokeStyle = '#f2f6fb';
    g.lineWidth = 1;
    g.strokeRect(r.x * CELL + 0.5, r.y * CELL + 0.5, CELL - 1, CELL - 1);
  }
}

function surClicCarte(ev) {
  const cv = ev.currentTarget;
  const rect = cv.getBoundingClientRect();
  const echelle = cv.width / rect.width;
  const px = (ev.clientX - rect.left) * echelle;
  const py = (ev.clientY - rect.top) * echelle;
  const x = Math.floor(px / CELL);
  const y = Math.floor(py / CELL);
  if (x < 0 || y < 0 || x >= S.world.largeur || y >= S.world.hauteur) return;
  selection = y * S.world.largeur + x;
  rafraichir(true);
}

// ---------------------------------------------------------------------------
// Écran CARTE
// ---------------------------------------------------------------------------

function etaVoyage(dest) {
  const mods = { reductionVoyage: (S.base.recherche.logistique || 0) * 0.06 };
  const route = chemin(S.world, S.player.regionId, dest, mods);
  if (!route) return null;
  let h = 0;
  for (const i of route) h += coutTraversee(S.world, i, mods);
  const debout = S.player.squad.filter(estDebout);
  let v = 1;
  if (debout.length) v = Math.min(...debout.map((c) => 0.5 + comp(c, 'endurance') / 90));
  return { heures: Math.ceil(h / Math.max(0.2, v)), cases: route.length };
}

function blocRegionCourante() {
  const rid = S.player.regionId;
  const r = S.world.regions[rid];
  const b = BIOMES[r.biome];
  const col = colonieDe(S.world, rid);
  const o = S.player.ordre;
  const ici = S.base.fonde && S.base.regionId === rid;

  let etat = ORDRES[o.type] ? ORDRES[o.type].nom : 'Repos';
  if (o.type === 'voyage') {
    const restant = o.route.length - o.etape;
    etat = `En route — ${restant} région${restant > 1 ? 's' : ''} restante${restant > 1 ? 's' : ''}`;
  }

  const rendements = Object.keys(b.yields)
    .map((k) => `${COMMODITIES[k].nom.toLowerCase()} ${b.yields[k].toFixed(2)}`)
    .join(' · ');

  const ordresDispo = ['repos', 'fouille', 'mine', 'chasse', 'patrouille'];

  return `
  <section class="panneau">
    <h2 class="titre">Position <span class="droite">${e(nomRegion(S.world, rid))}</span></h2>
    <div class="ligne"><span class="k">Biome</span><span class="v">${e(b.nom)}</span></div>
    <div class="ligne"><span class="k">Richesse</span><span class="v">×${r.richesse.toFixed(2)}</span></div>
    <div class="ligne"><span class="k">Épuisement</span><span class="v">${(r.fouille * 100).toFixed(0)} %</span></div>
    <div class="ligne"><span class="k">Rencontres</span><span class="v">${(r.danger * 100).toFixed(1)} %/h</span></div>
    <div class="ligne"><span class="k">Aléa</span><span class="v">${e(b.hazard.nom)}</span></div>
    ${r.controle ? `<div class="ligne"><span class="k">Territoire</span>
      <span class="v" style="color:${couleurFaction(r.controle)}">${e(FACTIONS[r.controle].nom)}</span></div>` : ''}
    <div class="sep"></div>
    <div class="titre" style="margin-bottom:3px">Ressources sur place · par heure de travail</div>
    <div class="aide">${e(rendements)}</div>
  </section>

  <section class="panneau">
    <h2 class="titre">Ordre en cours <span class="droite">${e(etat)}</span></h2>
    <div class="grille3">
      ${ordresDispo.map((k) => `<button class="act mini" data-a="ordre" data-k="${k}"
        aria-pressed="${o.type === k}">${e(ORDRES[k].nom)}</button>`).join('')}
      <button class="act mini" data-a="modale" data-m="entrainement">Entraîner</button>
    </div>
    <div class="aide" style="margin-top:6px">${e(ORDRES[o.type] ? ORDRES[o.type].desc : '')}</div>
    ${S.player.recolteHeure ? `<div class="aide" style="color:var(--vert)">Dernière heure : ${e(S.player.recolteHeure)}</div>` : ''}
  </section>

  ${col ? blocColonie(col) : ''}
  ${ici ? `<section class="panneau">
      <h2 class="titre">Avant-poste</h2>
      <div class="rangee">
        <button class="act mini" data-a="modale" data-m="transfert">Transférer des ressources</button>
      </div>
    </section>` : ''}`;
}

function blocColonie(col) {
  const repu = S.player.reputation[col.faction] || 0;
  const cls = repu > 20 ? 'ok' : repu < -20 ? 'mal' : 'att';
  return `
  <section class="panneau">
    <h2 class="titre">${e(col.nom)}
      <span class="droite" style="color:${couleurFaction(col.faction)}">${e(FACTIONS[col.faction].nom)}</span></h2>
    <div class="grille2">
      <div class="ligne"><span class="k">Population</span><span class="v">${n(col.pop)}</span></div>
      <div class="ligne"><span class="k">Défense</span><span class="v">${n(col.defense)}</span></div>
      <div class="ligne"><span class="k">Agitation</span><span class="v">${(col.unrest * 100).toFixed(0)} %</span></div>
      <div class="ligne"><span class="k">Réputation</span><span class="v"><span class="puce ${cls}">${repu > 0 ? '+' : ''}${n(repu)}</span></span></div>

    <div class="sep"></div>

    </div>
  </section>`;
}

function blocSelection() {
  if (selection == null || selection === S.player.regionId) return '';
  const r = S.world.regions[selection];
  const col = colonieDe(S.world, selection);
  const eta = etaVoyage(selection);
  const c = coord(selection);
  const nomCase = `${String.fromCharCode(65 + c.x)}${c.y + 1}`;

  if (!r.decouvert) {
    return `<section class="panneau">
      <h2 class="titre">Secteur ${nomCase} <span class="droite">inexploré</span></h2>
      <div class="aide">Rien de connu sur ce secteur. Il faudra aller voir.</div>
      ${eta ? `<div class="sep"></div><button class="act primaire" data-a="voyage" data-r="${selection}">
        Y aller — ${dureeTexte(eta.heures)}</button>` : ''}
    </section>`;
  }

  return `<section class="panneau">
    <h2 class="titre">${e(col ? col.nom : `Secteur ${nomCase}`)}
      <span class="droite">${e(BIOMES[r.biome].nom)}</span></h2>
    ${col ? `<div class="ligne"><span class="k">Tenue par</span>
      <span class="v" style="color:${couleurFaction(col.faction)}">${e(FACTIONS[col.faction].nom)}</span></div>
      <div class="ligne"><span class="k">Population</span><span class="v">${n(col.pop)}</span></div>
      <div class="ligne"><span class="k">Défense</span><span class="v">${n(col.defense)}</span></div>` : ''}
    <div class="ligne"><span class="k">Distance</span><span class="v">${distance(S.player.regionId, selection)} cases</span></div>
    <div class="ligne"><span class="k">Rencontres</span><span class="v">${(r.danger * 100).toFixed(1)} %/h</span></div>
    ${armeesIci(selection)}
    <div class="sep"></div>
    ${eta ? `<button class="act primaire" data-a="voyage" data-r="${selection}">
      Y aller — ${dureeTexte(eta.heures)} (${eta.cases} régions)</button>`
    : '<div class="aide">Aucune route connue.</div>'}
  </section>`;
}

function armeesIci(rid) {
  const as = S.world.armees.filter((a) => a.regionId === rid);
  if (!as.length) return '';
  return as.map((a) => `<div class="ligne"><span class="k">Colonne</span>
    <span class="v" style="color:${couleurFaction(a.faction)}">${e(FACTIONS[a.faction].nom)} · ${n(a.force)} · ${e(a.etat)}</span></div>`).join('');
}

function ecranCarte() {
  return `
  <div id="carte-boite"><canvas id="carte" aria-label="Carte du monde"></canvas></div>
  <div class="legende">
    <span><i style="background:#f2f6fb"></i>escouade</span>
    <span><i style="border:1px solid #4fd0e3"></i>avant-poste</span>
    ${classement(S.world).slice(0, 6).map((f) =>
    `<span><i style="background:${f.couleur}"></i>${e(FACTIONS[f.key].court)}</span>`).join('')}
  </div>
  ${blocSelection()}
  ${blocRegionCourante()}`;
}

function ficheMembre(c) {
  const t = pvTotal(c);
  const et = etatCourt(c);
  const cls = c.etat === 'mort' ? 'mal' : c.etat === 'ko' ? 'mal' : t.pct < 0.6 ? 'att' : 'ok';
  const ouvert = ouverts.has(c.id) ? ' open' : '';

  const membres = BODY_KEYS.map((p) => {
    const b = c.corps[p];
    const pr = ratio(c, p);
    const g = pr > 0.66 ? 'vert' : pr > 0.33 ? 'ambre' : 'rouge';
    return `<div class="membre ${b.perdu ? 'perdu' : ''}">
      <div class="n">${e(BODY_PARTS[p].nom)}${b.perdu ? ' ✕' : ''}</div>
      ${jauge(pr, g)}
    </div>`;
  }).join('');

  const comps = SKILL_KEYS.map((k) => {
    const v = c.skills[k];
    const eff = comp(c, k);
    return `<div class="comp-l"><span class="n">${e(SKILLS[k])}</span>
      <span class="j">${jauge(v / 100)}</span>
      <span class="v" title="effectif ${eff.toFixed(0)}">${v}</span></div>`;
  }).join('');

  const arme = c.equip.arme ? ITEMS[c.equip.arme].nom : '—';
  const armure = c.equip.armure ? ITEMS[c.equip.armure].nom : '—';
  const greffes = Object.keys(c.equip.greffes).map((m) => ITEMS[c.equip.greffes[m]].nom).join(', ') || '—';

  return `<details class="perso" data-id="${e(c.id)}"${ouvert}>
    <summary>
      <span class="puce ${cls}">${e(et)}</span>
      <span class="nom">${e(c.nom)} <span class="arch">${e(c.archetypeNom)}</span></span>
      <span class="mono-num" style="color:var(--texte-3)">${(t.pct * 100).toFixed(0)}%</span>
    </summary>
    <div class="corps-detail">
      <div class="grille2" style="margin-bottom:8px">
        <div><span class="aide">Faim</span>${jauge(c.faim / 100, c.faim > 75 ? 'rouge' : c.faim > 45 ? 'ambre' : 'vert')}</div>
        <div><span class="aide">Fatigue</span>${jauge(c.fatigue / 100, c.fatigue > 75 ? 'rouge' : c.fatigue > 45 ? 'ambre' : 'vert')}</div>
        <div><span class="aide">Moral</span>${jauge(c.moral / 100, c.moral < 30 ? 'rouge' : 'vert')}</div>
        <div><span class="aide">Saignement</span>${jauge(c.sang / 100, c.sang > 5 ? 'rouge' : '')}</div>
      </div>
      <div class="titre">Blessures</div>
      <div class="membres">${membres}</div>
      <div class="sep"></div>
      <div class="titre">Compétences</div>
      <div class="comps">${comps}</div>
      <div class="sep"></div>
      <div class="ligne"><span class="k">Arme</span><span class="v">${e(arme)}</span></div>
      <div class="ligne"><span class="k">Armure</span><span class="v">${e(armure)}</span></div>
      <div class="ligne"><span class="k">Greffes</span><span class="v">${e(greffes)}</span></div>
      <div class="ligne"><span class="k">Éliminations</span><span class="v">${c.kills}</span></div>
      <div class="sep"></div>
      <button class="act mini" data-a="modale" data-m="equipement" data-c="${e(c.id)}">Équiper</button>
    </div>
  </details>`;
}

function blocInventaire() {
  const inv = S.player.inventaire;
  const cap = capacitePortage(S);
  const poids = poidsInventaire(inv);
  const lignes = COMMODITY_KEYS.filter((k) => (inv[k] || 0) > 0)
    .map((k) => `<div class="ligne"><span class="k">${e(COMMODITIES[k].nom)}</span>
      <span class="v">${n(inv[k])}</span></div>`).join('') || '<div class="aide">Sac vide.</div>';

  const objets = S.player.objets.length
    ? S.player.objets.map((o) => `<span class="puce">${e(ITEMS[o].nom)}</span>`).join(' ')
    : '<span class="aide">Aucun équipement en réserve.</span>';

  return `<section class="panneau">
    <h2 class="titre">Sac <span class="droite">${n(poids)} / ${n(cap)} kg</span></h2>
    ${jauge(cap ? poids / cap : 1, poids / cap > 0.95 ? 'rouge' : poids / cap > 0.8 ? 'ambre' : '')}
    <div style="margin-top:7px">${lignes}</div>
    <div class="sep"></div>
    <div class="titre">Réserve d’équipement</div>
    <div>${objets}</div>
  </section>`;
}

  <section class="panneau">
    <h2 class="titre">Posture</h2>

      ${POSTURE_KEYS.map((k) => `<button class="act mini" data-a="posture" data-k="${k}"
        aria-pressed="${p.posture === k}">${e(POSTURES[k].nom)}</button>`).join('')}

  <section class="panneau">

    <div class="pile">
      ${[
    ['recruter', 'Recruter les errants croisés en route'],
    ['commercer', 'Traiter avec les caravanes'],
    ['payerPeage', 'Payer les péages plutôt que se battre'],

function ecranBase() {
  const b = S.base;
  if (!b.fonde) {
    const r = S.world.regions[S.player.regionId];
    const inv = S.player.inventaire;
    const manque = Object.keys(COUT_FONDATION)
      .filter((k) => (inv[k] || 0) < COUT_FONDATION[k])
      .map((k) => `${COMMODITIES[k].nom.toLowerCase()} ${n(inv[k] || 0)}/${COUT_FONDATION[k]}`);
    const enVille = !!r.colonie;
    return `<section class="panneau">
      <h2 class="titre">Aucun avant-poste</h2>
      <div class="aide">Un avant-poste vous donne un entrepôt, des chaînes de production
      et la recherche. Il faut le bâtir hors d’une ville existante, et il pourra être attaqué.</div>
      <div class="sep"></div>
      <div class="ligne"><span class="k">Coût</span><span class="v">${e(coutTexte(COUT_FONDATION))}</span></div>
      <div class="ligne"><span class="k">Emplacement</span><span class="v">${e(nomRegion(S.world, S.player.regionId))}</span></div>
      ${manque.length ? `<div class="aide" style="color:var(--rouge)">Manque : ${e(manque.join(', '))}</div>` : ''}
      ${enVille ? '<div class="aide" style="color:var(--rouge)">Impossible ici : une ville occupe déjà la région.</div>' : ''}
      <div class="sep"></div>
      <button class="act primaire" data-a="fonder" ${manque.length || enVille ? 'disabled' : ''}>
        Fonder l’avant-poste ici</button>
    </section>`;
  }

  const en = energie(b);
  const stock = totalStock(b);
  const capa = capaciteStock(b);

  const fileHtml = b.file.length ? b.file.map((it, i) => `
    <div style="margin-bottom:6px">
      <div class="ligne"><span class="k">${e(BUILDINGS[it.key].nom)} → niv. ${it.niveau}</span>
        <span class="v">${dureeTexte(Math.max(0, it.restant))}</span></div>
      ${jauge(1 - it.restant / it.total, 'cyan')}
      ${i === 0 ? '' : ''}
      <button class="act mini" data-a="annuler" data-i="${i}" style="margin-top:4px">Annuler (70 % remboursé)</button>
    </div>`).join('') : '<div class="aide">Rien en construction.</div>';

  const batHtml = BUILDING_KEYS.map((k) => {
    const bd = BUILDINGS[k];
    const niv = nivBat(b, k);
    const enFile = b.file.filter((x) => x.key === k).length;
    const cout = coutBatiment(b, k);
    const dispo = Object.keys(cout).every((c) => (b.stock[c] || 0) >= cout[c]);
    const plein = niv + enFile >= bd.max;
    return `<div style="border-bottom:1px solid #1b2029;padding:6px 0">
      <div class="ligne"><span class="k">${e(bd.nom)} <span class="puce">niv ${niv}${enFile ? `+${enFile}` : ''}</span></span>
        <span class="v">${bd.energie > 0 ? `+${bd.energie * (niv + 1)}` : bd.energie < 0 ? `${bd.energie * (niv + 1)}` : '—'} én.</span></div>
      <div class="aide">${e(bd.desc)}</div>
      <div class="aide">Coût : ${e(coutTexte(cout))} · ${dureeTexte(tempsBatiment(b, k))}</div>
      <button class="act mini" data-a="construire" data-k="${k}" ${plein || !dispo ? 'disabled' : ''}
        style="margin-top:4px">${plein ? 'Niveau maximum' : `Construire niv. ${niv + enFile + 1}`}</button>
    </div>`;
  }).join('');

  const rechHtml = RESEARCH_KEYS.map((k) => {
    const rd = RESEARCH[k];
    const niv = niveauRech(b, k);
    const enFile = b.fileRech.filter((x) => x.key === k).length;
    const cout = coutRecherche(b, k);
    const dispo = Object.keys(cout).every((c) => (c === 'credits' ? S.player.credits : (b.stock[c] || 0)) >= cout[c]);
    const plein = niv + enFile >= rd.max;
    const sansAntenne = nivBat(b, 'antenne') < 1;
    return `<div style="border-bottom:1px solid #1b2029;padding:6px 0">
      <div class="ligne"><span class="k">${e(rd.nom)}</span><span class="v"><span class="puce">niv ${niv}/${rd.max}</span></span></div>
      <div class="aide">${e(rd.desc)}</div>
      <div class="aide">Coût : ${e(coutTexte(cout))} · ${dureeTexte(tempsRecherche(b, k))}</div>
      <button class="act mini" data-a="chercher" data-k="${k}"
        ${plein || !dispo || sansAntenne ? 'disabled' : ''} style="margin-top:4px">
        ${plein ? 'Terminé' : sansAntenne ? 'Antenne requise' : 'Lancer'}</button>
    </div>`;
  }).join('');

  const stockHtml = COMMODITY_KEYS.map((k) => `<div class="ligne">
    <span class="k">${e(COMMODITIES[k].nom)}</span><span class="v">${n(b.stock[k] || 0)}</span></div>`).join('');

  return `
  <section class="panneau">
    <h2 class="titre">${e(b.nom)} <span class="droite">${e(nomRegion(S.world, b.regionId))}</span></h2>
    <div class="grille2">
      <div class="ligne"><span class="k">Énergie</span>
        <span class="v ${en.ratio < 1 ? '' : ''}">${n(en.prod)} / ${n(en.conso)}</span></div>
      <div class="ligne"><span class="k">Défense</span><span class="v">${n(b.defense)}</span></div>
    </div>
    ${en.ratio < 1 ? `<div class="aide" style="color:var(--ambre)">Production réduite à ${(en.ratio * 100).toFixed(0)} % :
      ${(b.stock.carburant || 0) <= 0 ? 'plus de carburant.' : 'énergie insuffisante.'}</div>` : ''}
    <div class="sep"></div>
    <div class="ligne"><span class="k">Entrepôt</span><span class="v">${n(stock)} / ${n(capa)}</span></div>
    ${jauge(stock / capa, stock / capa > 0.95 ? 'rouge' : '')}
  </section>

  <section class="panneau">
    <h2 class="titre">File de construction <span class="droite">${b.file.length}/5</span></h2>
    ${fileHtml}
  </section>

  <section class="panneau">
    <h2 class="titre">Bâtiments</h2>
    ${batHtml}
  </section>

  <section class="panneau">
    <h2 class="titre">Recherche <span class="droite">${b.fileRech.length}/3</span></h2>
    ${b.fileRech.length ? b.fileRech.map((it) => `
      <div style="margin-bottom:6px">
        <div class="ligne"><span class="k">${e(RESEARCH[it.key].nom)} → niv. ${it.niveau}</span>
          <span class="v">${dureeTexte(Math.max(0, it.restant))}</span></div>
        ${jauge(1 - it.restant / it.total, 'cyan')}
      </div>`).join('') : '<div class="aide">Aucune recherche en cours.</div>'}
    <div class="sep"></div>
    ${rechHtml}
  </section>

  <section class="panneau">
    <h2 class="titre">Stock</h2>
    ${stockHtml}
  </section>`;
}
