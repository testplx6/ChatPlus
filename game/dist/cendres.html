      signerPaix(world, key, autre, t, log);
    }
  }

  // 2) Déclarer une guerre si une cible est faible et mal aimée
  const enGuerreAvec = new Set(guerresDe(world, key).map((g) => (g.a === key ? g.b : g.a)));
  // Une cause donne du courage à qui n'en aurait pas eu : un chef que la guerre
  // ne tente pas se décide tout de même contre un régime qu'il réprouve.
  const indignation = Math.max(...DIPLO_FACTIONS.map(
    (k) => (k === key ? 0 : distanceMorale(world, key, k))));
  if (enGuerreAvec.size < 2 && rng.chance(f.agression * 0.5
      * penchant(world, key, 'guerre') * (1 + indignation * 1.8))) {
    const candidats = DIPLO_FACTIONS.filter(
      (k) => k !== key && !enGuerreAvec.has(k) && coloniesDe(world, k).length > 0
    ).map((k) => {
      const rel = relation(world, key, k);
      const rapport = maPuissance / Math.max(1, puissance(world, k));
      const prox = cibleLaPlusProche(world, key, k);
      if (!prox) return [k, 0];
      // Ce qu'on reproche à leur régime compte autant que ce qu'on convoite :
      // un Conciliateur ne fait la guerre à personne, sauf à un marchand
      // d'hommes.
      const morale = distanceMorale(world, key, k);
      const poids = Math.max(0, (40 - rel) / 40) * Math.max(0, rapport - 0.85)
        * (1 / (1 + prox.dist * 0.25)) * (1 + morale * 2.5);
      return [k, poids];
    }).filter((e) => e[1] > 0.02);
    if (candidats.length) {
      const victime = rng.weighted(candidats);
      const prox = cibleLaPlusProche(world, key, victime);
      // Quand c'est le régime qu'on vise et pas la carte, la guerre le dit.
      const morale = distanceMorale(world, key, victime);
      const but = morale > 0.45
        ? { type: 'abolition', texte: 'pour en finir avec leurs marchés d’hommes', batailles: rng.irange(2, 4) }
        : butDeGuerre(world, key, victime, rng, prox && prox.cible);
      declarerGuerre(world, key, victime, t, log, but);
    }
  }

  // 3) Lever des colonnes sur les fronts ouverts
  for (const g of guerresDe(world, key)) {
    const ennemi = g.a === key ? g.b : g.a;
    const dejaEnRoute = world.armees.filter((a) => a.faction === key).length;
    if (dejaEnRoute >= 2) break;
    if (!rng.chance(Math.min(1, 0.75 * penchant(world, key, 'colonne')))) continue;
    const prox = cibleLaPlusProche(world, key, ennemi);
    if (!prox) continue;
    const force = Math.min(
      Math.floor(f.tresor / 5.2),
      Math.round(prox.cible.defense * rng.range(1.1, 2.0) + 25)
    );
    if (force >= 25 && f.tresor >= coutArmee(force)) {
      leverArmee(world, key, force, prox.depuis.regionId, prox.cible.id, log);
    }
  }

  // 4) Reprendre une ville libre. Une révolte réussie laisse un bourg sans
  //    drapeau ; si personne ne va le chercher, la carte se remplit lentement
  //    de villes sans loi et le monde perd ses frontières. Un conseil qui voit
  //    une place vacante à trois jours de marche y envoie du monde — c'est bien
  //    moins cher que de fonder, et ça rapporte une ville faite.
  const libres = world.colonies.filter(
    (c) => !c.ruine && !c.faction
      && mesColonies.some((m) => distance(m.regionId, c.regionId) <= 5)
  );
  if (libres.length && !world.armees.some((a) => a.faction === key && a.cible === libres[0].id)) {
    const cible = libres.reduce((a, b) => {
      const da = Math.min(...mesColonies.map((m) => distance(m.regionId, a.regionId)));
      const db = Math.min(...mesColonies.map((m) => distance(m.regionId, b.regionId)));
      return db < da ? b : a;
    });
    const depuis = mesColonies.reduce((a, b) => (
      distance(b.regionId, cible.regionId) < distance(a.regionId, cible.regionId) ? b : a));
    const force = Math.max(25, Math.round(cible.defense * 1.6 + 20));
    // Pas pendant une guerre, et sans empressement : à 0,55 de chance par
    // séance, plus une seule ville ne restait libre en fin de partie et l'état
    // le plus intéressant du monde — un bourg sans drapeau ni loi — ne durait
    // jamais assez pour qu'on aille y voir.
    if (!guerresDe(world, key).length && f.tresor >= coutArmee(force) * 1.5
        && rng.chance(0.16 * penchant(world, key, 'expansion'))) {
      leverArmee(world, key, force, depuis.regionId, cible.id, log);
    }
  }

  // 5) Fonder : une faction riche et en paix pousse un nouveau poste sur une
  //    case vide de son voisinage. La carte bouge autrement que par conquête.
  const enPaix = !guerresDe(world, key).length;
  // Le plafond suit la taille de la carte. Écrit en dur à sept, il valait
  // « jamais » dès que le monde a compté cinquante-quatre villes pour six
  // factions : aucune n'était plus jamais sous son plafond, et plus une seule
  // ville n'a été fondée de toute une partie.
  const plafond = Math.max(7, Math.round(world.regions.length / 36));
  if (mesColonies.length < plafond
      && rng.chance(Math.min(0.9, 0.4 * penchant(world, key, 'expansion')))
      && f.tresor > (enPaix ? 1700 : 4200)) {
    // Une case libre, à portée de nos terres mais assez loin des villes
    // existantes pour ne pas se marcher dessus. Chercher parmi les seules
    // cases adjacentes était contradictoire : elles sont toutes à distance 1
    // d'une colonie, donc aucune ne passait jamais le filtre d'espacement.
    const candidates = [];
    for (const r of world.regions) {
      if (r.colonie || r.biome === 'relais') continue;
      const tropPres = world.colonies.some((c) => !c.ruine && distance(c.regionId, r.i) < 2);
      if (tropPres) continue;
      const aPortee = mesColonies.some((c) => distance(c.regionId, r.i) <= 3);
      if (aPortee) candidates.push(r);
    }
    if (candidates.length) {
      const r = rng.pick(candidates);
      const col = fonderColonie(world, key, r, rng, t);
      f.tresor -= 1500;
      crediterDirigeant(world, key, 'fondation');
      log({
        type: 'fondation',
        texte: `${FACTIONS[key].nom} fonde ${col.nom} en terrain vierge.`,
        regionId: r.i,
        factions: [key],
        important: true,
      });
      return;
    }
  }

  // 5) Sinon, investir : murs et défense
  if (!guerresDe(world, key).length && f.tresor > 900 && rng.chance(0.6)) {
    const col = rng.pick(mesColonies);
    col.murs += 1;
    f.tresor -= 400;
    log({
      type: 'chantier',
      texte: `${FACTIONS[key].nom} renforce${FACTIONS[key].pluriel ? 'nt' : ''} les défenses de ${col.nom}.`,
      regionId: col.regionId,
      factions: [key],
      discret: true,
    });
  }
}

const NOMS_NEUFS = [
  'Aval', 'Bréchant', 'Cendrier', 'Dorne', 'Escarre', 'Fauvel', 'Givre',
  'Houle', 'Ithaque', 'Jonque', 'Klaxon', 'Limaille', 'Meute', 'Norne',
];

/** Crée une colonie neuve pour une faction. Petite, fragile, mais bien réelle. */
function fonderColonie(world, key, region, rng, t) {
  const stock = {};
  for (const k of COMMODITY_KEYS) stock[k] = rng.irange(10, 60);
  world.prochaineColonieId = (world.prochaineColonieId || world.colonies.length) + 1;
  const col = {
    id: `s${world.prochaineColonieId}`,
    nom: `${rng.pick(['Poste', 'Halte', 'Camp', 'Enclos'])}-${rng.pick(NOMS_NEUFS)}`,
    regionId: region.i,
    faction: key,
    taille: 1,
    pop: rng.irange(90, 170),
    defense: 0,
    defenseMax: 0,
    murs: rng.irange(2, 5),
    stock,
    unrest: 0.1,
    marche: 1.35,
    prises: 0,
    banc: null,
    geole: null,
    declin: 0,
    fondeeA: t,
    factionOrigine: key,
  };
  col.defenseMax = Math.round(col.pop * 0.09 + col.murs * 12);
  col.defense = col.defenseMax;
  world.colonies.push(col);
  world.factions[key].colonies.push(col.id);
  region.colonie = col.id;
  region.controle = key;
  // Une ville neuve naît complète : des gens qui y travaillent, et quelqu'un
  // pour la tenir. La laisser vide jusqu'au premier tick, c'est la laisser sans
  // métiers ni notables pendant plusieurs heures de jeu, et tout ce qui la lit
  // doit alors se défendre contre l'absence.
  col.emplois = emploisInitiaux(world, col, rng);
  pourvoirCharges(col, rng, t);
  return col;
}

// ---------------------------------------------------------------------------
// Ce qu'on pense du régime d'en face
// ---------------------------------------------------------------------------

/** L'ordre des peines, du plus doux au plus dur : sert à mesurer un écart. */
const DURETE = { legere: 0, ferme: 1, expeditive: 2 };

/**
 * Ce que le régime de `autre` a d'insupportable pour `key`, entre 0 et 1.
 *
 * Les lois n'existaient que vers l'intérieur : autoriser le commerce d'hommes
 * abîmait la réputation du joueur auprès de tous ceux qui l'interdisaient, mais
 * les factions, elles, s'en moquaient entre elles. Un pays esclavagiste ne se
 * faisait aucun ennemi, et un voisin clément n'y voyait aucun motif — alors que
 * c'est le casus belli le plus évident qu'un monde puisse produire.
 *
 * Ce qui pèse : le commerce d'hommes d'abord, et de très loin ; l'écart de
 * sévérité ensuite, qui n'indigne personne mais éloigne. Et tout est pondéré
 * par le chef : un Rapace ne s'offusque de rien, un Conciliateur de tout.
 */
function distanceMorale(world, key, autre) {
  const la = loisDe(world, key);
  const lb = loisDe(world, autre);
  const d = dirigeant(world, key);
  const temp = d ? TEMPERAMENTS[d.temperament] : null;
  const conscience = temp ? temp.humain : 1;
  let x = 0;
  // On ne reproche à personne ce qu'on pratique soi-même.
  if (lb.esclavage && !la.esclavage) x += 0.62;
  x += Math.abs((DURETE[lb.peine] ?? 1) - (DURETE[la.peine] ?? 1)) * 0.12;
  return Math.max(0, Math.min(1, x * conscience));
}

/**
 * Ce que les régimes d'en face font aux relations, séance après séance. Petit
 * par tour, décisif sur une saison : deux voisins que tout oppose finissent
 * sous le seuil où une guerre se déclare toute seule.
 */
function jugerLesAutres(world, key) {
  for (const autre of DIPLO_FACTIONS) {
    if (autre === key) continue;
    if (!coloniesDe(world, autre).length) continue;
    const d = distanceMorale(world, key, autre);
    if (d > 0.25) majRelation(world, key, autre, -d * 2.2);
    else if (d < 0.05) majRelation(world, key, autre, 0.4);
  }
}

// ---------------------------------------------------------------------------
// Politique intérieure
// ---------------------------------------------------------------------------

/**
 * Combien de temps une loi tient avant qu'on puisse la rouvrir. Un conseil qui
 * légiférerait à chaque séance ne serait pas un gouvernement, ce serait du
 * bruit : le joueur verrait l'impôt changer trois fois par saison sans jamais
 * pouvoir en tirer de conclusion.
 */
const DELAI_LOI = 700;

/** L'état d'un pays, tel que son conseil le lit avant de légiférer. */
function etatDuPays(world, key) {
  const villes = coloniesDe(world, key);
  if (!villes.length) return null;
  let grogne = 0;
  let routes = 0;
  for (const c of villes) {
    grogne += c.unrest || 0;
    routes += (world.regions[c.regionId].insecurite || 0);
  }
  return {
    villes,
    grogne: grogne / villes.length,
    routes: routes / villes.length,
    // Le trésor par ville : mille crédits pour une faction de deux villes et
    // pour une faction de douze, ce n'est pas la même aisance.
    caisse: world.factions[key].tresor / villes.length,
    enGuerre: guerresDe(world, key).length > 0,
  };
}

/** Le taux d'imposition que ce conseil vise, converti en palier réel. */
function impotVise(temp, pays) {
  // On part de l'ordinaire et on corrige : le caractère du chef, ce que coûte
  // la guerre, ce que la caisse permet, et ce que le pays supporte.
  //
  // La première version poussait systématiquement vers le haut : caisse basse
  // et guerre ajoutaient un demi-palier chacune sans rien pour les contredire,
  // l'impôt lourd faisait gronder, la grogne coupait les recettes, la caisse
  // restait basse. Une boucle qui ne se referme pas. Le banc l'a chiffrée en
  // A/B : 55 % des conseils à l'ordinaire, 31 % au lourd, 14 % au léger, et le
  // joueur perdait six escouades et huit avant-postes sur soixante parties.
  //
  // Ce qui la referme : un chef à la main légère ne répond pas à une caisse
  // vide en prélevant davantage — il coupe les dépenses —, et la grogne freine
  // en deux temps au lieu d'un.
  // La correction inverse a raté tout autant, et le banc l'a dit aussi : deux
  // freins en escalier qui se déclenchaient dès 32 % de grogne ont mis 74 % des
  // conseils à l'impôt léger, et le joueur y a perdu autant — des factions
  // pauvres lèvent moins de colonnes, donc tiennent moins les routes et donnent
  // moins d'ordres de mission. Les deux extrêmes coûtent, chacun à sa façon :
  // c'est ce qui fait que le choix de qui l'on sert compte.
  //
  // Ce qui reste : le caractère du chef décide de la ligne, les circonstances la
  // corrigent à la marge, et le frein de la grogne est continu au lieu d'être
  // un escalier qui bascule tout le monde du même côté.
  let cible = 0.05 + (temp.fisc - 1) * 0.075;
  if (pays.caisse < 700) cible += 0.02 * temp.fisc;
  if (pays.caisse > 3200) cible -= 0.015;
  if (pays.enGuerre && temp.fisc >= 1) cible += 0.015;
  cible -= Math.max(0, pays.grogne - 0.35) * 0.06;
  // On prend le palier le plus proche : un conseil ne vote pas 7,3 %.
  let best = IMPOTS[0];
  for (const imp of IMPOTS) {
    if (Math.abs(imp.taux - cible) < Math.abs(best.taux - cible)) best = imp;
  }
  return best;
}

/** La sévérité que ce conseil juge nécessaire. */
function peineVisee(temp, pays) {
  // Des routes sûres ne réclament pas de corde ; un pays qui gronde, si — et un
  // chef dur y voit toujours la solution, ce qui n'est pas la même chose que
  // d'avoir raison.
  const score = (temp.severite - 1) + (pays.routes - 0.3) * 1.6 + pays.grogne * 0.6;
  if (score > 0.35) return 'expeditive';
  if (score < -0.2) return 'legere';
  return 'ferme';
}

/**
 * Un conseil qui vote ses propres lois.
 *
 * Sans ça, le monde n'avait de politique intérieure que là où le joueur en
 * faisait : six factions gouvernaient toutes à l'impôt ordinaire et à la
 * justice ferme, pour toujours. Un Rapace à la tête des Corpos doit prélever
 * comme un rapace, et un Conciliateur doit relâcher — sinon le tempérament ne
 * veut rien dire ailleurs que sur un champ de bataille.
 *
 * Une exception, et c'est tout le sens du grade : **tant que le joueur tient la
 * charge de Commandeur, le conseil s'efface.** Il ne repasse derrière lui que
 * le jour où il l'a perdue — ce qui arrive quand ses lois ont ruiné le pays.
 */
function legiferer(world, key, t, log, ctx) {
  // Témoin du banc : on gèle la législation pour mesurer ce qu'elle coûte ou
  // rapporte au joueur. Voir test/equilibre.js, SANS=lois.
  if (ctx && ctx.sansLois) return;
  const lois = loisDe(world, key);
  if (ctx && ctx.legislateur === key) return;
  if (t - (lois.depuis || 0) < DELAI_LOI) return;
  const d = dirigeant(world, key);
  if (!d) return;
  const temp = TEMPERAMENTS[d.temperament];
  const pays = etatDuPays(world, key);
  if (!temp || !pays) return;

  const changements = [];

  const imp = impotVise(temp, pays);
  if (Math.abs(imp.taux - lois.impot) > 0.001) {
    const monte = imp.taux > lois.impot;
    lois.impot = imp.taux;
    changements.push(`l’impôt ${monte ? 'passe à' : 'retombe à'} ${Math.round(imp.taux * 100)} %`);
  }

  const peine = peineVisee(temp, pays);
  if (peine !== lois.peine) {
    lois.peine = peine;
    changements.push(`la justice devient ${PEINES[peine].nom.toLowerCase()}`);
  }

  // L'esclavage ne se vote pas par idéologie : on l'ouvre quand la caisse est
  // vide et qu'on a un chef que ça n'empêche pas de dormir, on le referme
  // quand le pays gronde ou qu'un autre chef arrive.
  const veutOuvrir = !lois.esclavage && temp.humain < 0.85
    && pays.caisse < 600 && pays.grogne < 0.4;
  // On ferme aussi le marché quand il coûte une guerre : c'est la façon la plus
  // nette dont la pression extérieure entre dans la politique intérieure.
  const attaquePourCa = guerresDe(world, key).some(
    (g) => g.but && g.but.type === 'abolition' && g.batailles >= 2);
  const veutFermer = lois.esclavage
    && (temp.humain > 1.05 || pays.grogne > 0.55 || attaquePourCa);
  if (veutOuvrir || veutFermer) {
    lois.esclavage = veutOuvrir;
    changements.push(veutOuvrir
      ? 'le commerce d’hommes est ouvert'
      : 'le commerce d’hommes est fermé');
    for (const c of pays.villes) {
      c.unrest = Math.max(0, Math.min(1, c.unrest + (veutOuvrir ? 0.06 : -0.03)));
    }
  }

  if (!changements.length) return;
  lois.depuis = t;
  log({
    type: 'loi',
    texte: `${FACTIONS[key].nom} : ${d.titre} ${d.nom} légifère — ${changements.join(', ')}.`,
    important: true,
    factions: [key],
  });
}

// ---------------------------------------------------------------------------
// Tick global
// ---------------------------------------------------------------------------

function tickFactions(world, t, log, ctx) {
  for (const key of Object.keys(world.factions)) {
    const f = world.factions[key];
    f.prochainConseil -= 1;
    if (f.prochainConseil <= 0) conseil(world, key, t, log, ctx);
  }

  // Les chefs vieillissent une fois par jour de jeu, pas vingt-quatre : leur
  // usure se compte en années, pas en heures.
  if (t % 24 === 0) {
    for (const key of DIPLO_FACTIONS) {
      // Un chef répond aussi de l'humeur de son pays, pas seulement de ses
      // guerres : la grogne moyenne entre directement dans sa légitimité.
      const pays = etatDuPays(world, key);
      tickDirigeant(world, key, ctx.rng, 24, t, log, pays ? pays.grogne : 0);
    }
  }

  for (const armee of world.armees.slice()) {
    if (!world.armees.includes(armee)) continue;
    tickArmee(world, armee, t, log, ctx);
  }

  // Le plus fort se fait détester : les autres se liguent doucement contre
  // celui qui domine. Sans cela, le vainqueur d'une guerre gagne toutes les
  // suivantes et la carte se referme.
  if (t % 24 === 0) {
    let chef = null;
    let chefP = 0;
    for (const k of DIPLO_FACTIONS) {
      if (!world.factions[k].colonies.length) continue;
      const p = puissance(world, k);
      if (p > chefP) { chefP = p; chef = k; }
    }
    if (chef) {
      for (const k of DIPLO_FACTIONS) {
        if (k === chef || !world.factions[k].colonies.length) continue;
        majRelation(world, chef, k, -1.2);
      }
    }
  }

  // Dérive lente des relations vers la neutralité, sauf en guerre
  if (t % 24 === 0) {
    for (const a of DIPLO_FACTIONS) {
      for (const b of DIPLO_FACTIONS) {
        if (a >= b) continue;
        const v = relation(world, a, b);
        if (enGuerre(world, a, b)) {
          if (v > -100) majRelation(world, a, b, -1);
        } else if (v !== 0) {
          majRelation(world, a, b, v > 0 ? -0.5 : 0.5);
        }
      }
    }
  }
}

/** Faction qui domine réellement le monde, pour l'écran MONDE. */
function classement(world) {
  return Object.keys(world.factions)
    .filter((k) => k !== 'essaim')
    .map((k) => ({
      key: k,
      nom: FACTIONS[k].nom,
      couleur: FACTIONS[k].couleur,
      puissance: puissance(world, k),
      colonies: world.factions[k].colonies.length,
      tresor: Math.round(world.factions[k].tresor),
    }))
    .sort((a, b) => b.puissance - a.puissance);
}

// ===== src/influence.js ==============================================
// Ce qu'un grade permet de faire, et ce dont il faut répondre.
//
// Première version, à jeter : le gradé « demandait », un dé décidait, et
// demander coûtait du capital politique qu'on ait été écouté ou non. C'était
// une aberration à deux titres. Un Commandeur n'implore pas son propre conseil,
// il commande. Et faire payer une décision refusée, c'est punir le joueur pour
// avoir cliqué.
//
// Ce qui remplace : un grade est une **charge**. Elle donne des prérogatives
// qu'on exerce directement — sans dé, sans coût, immédiatement, parce que c'est
// précisément ce que veut dire avoir de l'autorité. Ce qui la borne, ce n'est
// pas le hasard : c'est l'étendue de la charge, et le fait qu'on en répond.
//
//   Agent        ravitaille les siens, et rien d'autre.
//   Lieutenant   dispose des colonnes déjà levées : il les envoie où il veut.
//   Capitaine    lève des colonnes sur le trésor, fait fonder des postes.
//   Commandeur   déclare la guerre et signe la paix.
//
// Et l'on rend des comptes. Chaque acte est inscrit, son issue est jugée : une
// colonne qu'on a envoyée se faire détruire, une guerre qu'on a déclarée et
// perdue, cela se paie en crédit — et le crédit épuisé, on est rétrogradé. Le
// pouvoir n'est pas gratuit ; il est simplement réel.


/**
 * Ce que chaque charge permet. `rang` est l'indice minimal dans RANGS.
 * Aucune de ces actions n'a de probabilité : on les exerce ou on n'y a pas
 * droit.
 */
const PREROGATIVES = {
  envoyer: {
    nom: 'Envoyer une colonne',
    desc: 'Détourner une colonne déjà levée vers la ville de votre choix.',
    rang: 2, // Lieutenant
    charge: 'Vous répondez de ce qu’elle devient.',
  },
  lever: {
    nom: 'Lever une colonne',
    desc: 'Faire armer des hommes sur le trésor de la faction, et les envoyer.',
    rang: 3, // Capitaine
    charge: 'Le trésor est celui de vos gens. On vous demandera des comptes.',
  },
  fonder: {
    nom: 'Faire fonder un poste',
    desc: 'Ordonner qu’on plante un bourg sur une case libre de vos terres.',
    rang: 3,
    charge: 'Un poste qui s’effondre est un poste que vous avez voulu.',
  },
  garnison: {
    nom: 'Renforcer la garnison',
    desc: 'Payer des hommes et des murs pour la ville dont vous répondez.',
    rang: 3,
    charge: 'Le trésor est celui de vos gens ; la ville est la vôtre.',
  },
  grenier: {
    nom: 'Ouvrir les greniers',
    desc: 'Faire acheter du grain pour votre ville. Une ville qui mange se tait.',
    rang: 3,
    charge: 'Nourrir aujourd’hui ce qu’on n’a pas produit hier se paie demain.',
  },
  guerre: {
    nom: 'Déclarer la guerre',
    desc: 'Engager la faction contre une autre, sur-le-champ.',
    rang: 4, // Commandeur
    charge: 'Une guerre perdue coûte la place de celui qui l’a voulue.',
  },
  paix: {
    nom: 'Signer la paix',
    desc: 'Mettre fin aux hostilités, quoi qu’en pense le conseil.',
    rang: 4,
    charge: 'Une paix qui rend une ville se retient longtemps.',
  },
  loi: {
    nom: 'Fixer la loi',
    desc: 'La sévérité des peines, l’esclavage, l’impôt. Pour toute la faction.',
    rang: 4,
    charge: 'Une loi s’applique aussi à ceux qui l’ont votée.',
  },
};

const PREROGATIVE_KEYS = Object.keys(PREROGATIVES);

/** Force d'une colonne levée sur ordre : elle suit ce que la faction peut payer. */
const FORCE_LEVEE = 60;

// ---------------------------------------------------------------------------
// Charge et crédit
// ---------------------------------------------------------------------------

/** Le meilleur grade tenu auprès de cette faction, ou null. */
function chargeAupres(state, faction) {
  let best = null;
  for (const g of groupesEngages(state, faction)) {
    const r = rangDe(g.allegeance);
    if (!best || r.index > best.index) best = r;
  }
  return best;
}

/**
 * Le crédit d'un officier : ce qui reste quand on a retranché ses échecs. Ce
 * n'est pas une monnaie qu'on dépense en commandant — commander est gratuit —,
 * c'est ce dont on répond. À zéro, on est relevé de sa charge.
 */
function credit(state, faction) {
  let c = 0;
  for (const g of groupesEngages(state, faction)) {
    const all = g.allegeance;
    c += 100 + Math.min(120, all.points / 8) - (all.manques || 0) * 10;
    c -= (all.fautes || 0) * 25;
  }
  return Math.round(c);
}

function peutExercer(state, faction, key) {
  const def = PREROGATIVES[key];
  if (!def) return { ok: false, motif: 'Prérogative inconnue.' };
  const charge = chargeAupres(state, faction);
  if (!charge) return { ok: false, motif: `Vous ne servez pas ${FACTIONS[faction].nom}.` };
  if (charge.index < def.rang) {
    return { ok: false, motif: `Charge de ${RANGS[def.rang].nom} requise.` };
  }
  if (!dirigeant(state.world, faction)) {
    return { ok: false, motif: 'Cette faction n’a plus de conseil.' };
  }
  if (credit(state, faction) <= 0) {
    return { ok: false, motif: 'On ne vous confie plus rien.' };
  }
  return { ok: true, charge };
}

/**
 * Inscrire un acte au dossier de l'officier. C'est là que la responsabilité
 * devient concrète : l'issue sera jugée quand elle sera connue, pas au moment
 * de décider.
 */
function inscrireActe(state, faction, acte) {
  for (const g of groupesEngages(state, faction)) {
    if (!g.allegeance.actes) g.allegeance.actes = [];
    g.allegeance.actes.push(acte);
    // On ne garde que ce dont on peut encore répondre.
    if (g.allegeance.actes.length > 8) g.allegeance.actes.shift();
    return g;
  }
  return null;
}

/** Une faute portée au dossier : elle ronge le crédit, et le crédit la charge. */
function porterFaute(state, faction, quoi, log, n = 1) {
  for (const g of groupesEngages(state, faction)) {
    g.allegeance.fautes = (g.allegeance.fautes || 0) + n;
  }
  if (log) {
    log({
      type: 'influence',
      texte: `On vous impute ${quoi}. Le conseil ${FACTIONS[faction].genitif} en prend note.`,
      important: true,
      factions: [faction],
    });
  }
}

/** Un succès porté au dossier : il assoit la charge et fait monter. */
function porterMerite(state, faction, quoi, points, log) {
  for (const g of groupesEngages(state, faction)) {
    g.allegeance.points += points;
    g.allegeance.fautes = Math.max(0, (g.allegeance.fautes || 0) - 1);
  }
  crediterDirigeant(state.world, faction, 'prise', 0);
  if (log) {
    log({
      type: 'influence',
      texte: `${quoi} On vous en sait gré.`,
      important: true,
      factions: [faction],
    });
  }
}

/**
 * Rétrogradation : quand le crédit est épuisé, la charge est retirée. C'est la
 * contrepartie de pouvoir ordonner sans rien demander à personne.
 */
function tickCharges(state, log) {
  for (const g of state.player.groupes) {
    const all = g.allegeance;
    if (!all) continue;
    const rang = rangDe(all);
    if (rang.index < 2) continue;
    if (credit(state, all.faction) > 0) continue;
    // On retombe au grade précédent, et le compteur de fautes repart : on ne
    // dégringole pas toute l'échelle d'un coup pour une seule mauvaise passe.
    all.points = Math.max(0, RANGS[rang.index - 1].points);
    all.fautes = 0;
    all.manques = 0;
    log({
      type: 'allegeance',
      texte: `${FACTIONS[all.faction].nom} vous retire votre charge. `
        + `${g.nom} redescend au rang de ${RANGS[rang.index - 1].nom}.`,
      important: true,
      groupe: g.id,
      factions: [all.faction],
    });
  }
}

// ---------------------------------------------------------------------------
// Prérogatives
// ---------------------------------------------------------------------------

/** Les colonnes de la faction qu'un officier peut détourner. */
function colonnesDe(state, faction) {
  return state.world.armees.filter((a) => a.faction === faction);
}

/** La ville de la faction la plus proche d'une case : d'où l'on part. */
function villeLaPlusProche(world, faction, regionId) {
  let best = null;
  let d = Infinity;
  for (const c of coloniesDe(world, faction)) {
    const dd = distance(c.regionId, regionId);
    if (dd < d) { d = dd; best = c; }
  }
  return best;
}

/**
 * Envoyer une colonne où l'on veut. Immédiat, sans dé : c'est un ordre.
 * L'officier répond de ce qu'elle devient — voir `jugerActes`.
 */
function envoyerColonne(state, faction, armeeId, cibleId, log) {
  const v = peutExercer(state, faction, 'envoyer');
  if (!v.ok) return v;
  const a = state.world.armees.find((x) => x.id === armeeId && x.faction === faction);
  if (!a) return { ok: false, motif: 'Cette colonne n’existe plus.' };
  const col = colonieParId(state.world, cibleId);
  if (!col || col.ruine) return { ok: false, motif: 'Cette ville n’existe plus.' };
  a.cible = cibleId;
  a.route = chemin(state.world, a.regionId, col.regionId) || [];
  a.etape = 0;
  a.progres = 0;
  a.etat = 'marche';
  a.surOrdre = true;
  inscrireActe(state, faction, { type: 'envoi', armee: a.id, cible: cibleId, t: state.temps });
  if (log) {
    log({
      type: 'influence',
      texte: `Sur votre ordre, une colonne ${FACTIONS[faction].genitif} marche sur ${col.nom}.`,
      important: true,
      factions: [faction],
    });
  }
  return { ok: true };
}

/** Ce que coûte une colonne levée sur ordre. */
function coutLevee() {
  return Math.round(FORCE_LEVEE * 5.2);
}

/**
 * Lever une colonne sur le trésor. Le trésor est celui de vos gens.
 *
 * `depuisId` peut être nul : un officier dit « marchez sur X », il ne dit pas
 * de quelle caserne on sort. On part alors de la plus proche des nôtres.
 */
function leverColonne(state, faction, depuisId, cibleId, log) {
  const v = peutExercer(state, faction, 'lever');
  if (!v.ok) return v;
  const f = state.world.factions[faction];
  const cout = coutLevee();
  if (f.tresor < cout) {
    return { ok: false, motif: `Le trésor ne suit pas : ${Math.round(f.tresor)} / ${cout} cr.` };
  }
  const cible = colonieParId(state.world, cibleId);
  if (!cible || cible.ruine) return { ok: false, motif: 'Cette ville n’existe plus.' };
  const depuis = depuisId
    ? colonieParId(state.world, depuisId)
    : villeLaPlusProche(state.world, faction, cible.regionId);
  if (!depuis || depuis.faction !== faction) return { ok: false, motif: 'Il faut partir d’une de vos villes.' };
  f.tresor -= cout;
  const a = {
    id: `a${state.world.prochainArmeeId++}`,
    faction,
    regionId: depuis.regionId,
    force: FORCE_LEVEE,
    forceMax: FORCE_LEVEE,
    cible: cibleId,
    route: chemin(state.world, depuis.regionId, cible.regionId) || [],
    etape: 0,
    progres: 0,
    etat: 'marche',
    ravitaillement: 60 + Math.round(FORCE_LEVEE / 4),
    surOrdre: true,
  };
  state.world.armees.push(a);
  inscrireActe(state, faction, { type: 'levee', armee: a.id, cible: cibleId, cout, t: state.temps });
  if (log) {
    log({
      type: 'influence',
      texte: `Sur votre ordre, ${FACTIONS[faction].nom} lève une colonne à ${depuis.nom} `
        + `pour marcher sur ${cible.nom} (${cout} cr).`,
      important: true,
      factions: [faction],
    });
  }
  return { ok: true, armee: a };
}

// ---------------------------------------------------------------------------
// Fonder
// ---------------------------------------------------------------------------

/** Ce que coûte un poste neuf au trésor de la faction. */
const COUT_POSTE = 1500;

/**
 * Les cases où l'on peut planter un bourg : libres, à portée de nos terres, et
 * pas dans les jambes d'une ville existante. Les mêmes règles que celles que
 * suit le conseil quand il décide seul — un officier ne fonde pas ailleurs, il
 * fonde plus tôt.
 */
function sitesFondation(world, faction) {
  const miennes = coloniesDe(world, faction);
  if (!miennes.length) return [];
  const sites = [];
  for (const r of world.regions) {
    if (r.colonie || r.biome === 'relais') continue;
    if (world.colonies.some((c) => !c.ruine && distance(c.regionId, r.i) < 2)) continue;
    if (!miennes.some((c) => distance(c.regionId, r.i) <= 3)) continue;
    sites.push(r);
  }
  return sites;
}

/**
 * Ordonner qu'on plante un poste. L'officier choisit la case ; ce qu'il ne
 * choisit pas, c'est si le poste tiendra — et c'est de cela qu'on lui
 * demandera compte.
 */
function fonderPoste(state, faction, regionIndex, rng, log) {
  const v = peutExercer(state, faction, 'fonder');
  if (!v.ok) return v;
  const f = state.world.factions[faction];
  if (f.tresor < COUT_POSTE) {
    return { ok: false, motif: `Le trésor ne suit pas : ${Math.round(f.tresor)} / ${COUT_POSTE} cr.` };
  }
  const r = state.world.regions[regionIndex];
  if (!r) return { ok: false, motif: 'Cette case n’existe pas.' };
  if (!sitesFondation(state.world, faction).some((s) => s.i === r.i)) {
    return { ok: false, motif: 'On ne fonde pas là : trop loin des vôtres, ou trop près d’une ville.' };
  }
  f.tresor -= COUT_POSTE;
  const col = fonderColonie(state.world, faction, r, rng, state.temps);
  crediterDirigeant(state.world, faction, 'fondation');
  inscrireActe(state, faction, { type: 'fondation', colonie: col.id, t: state.temps });
  if (log) {
    log({
      type: 'fondation',
      texte: `Sur votre ordre, ${FACTIONS[faction].nom} plante ${col.nom} `
        + `(${COUT_POSTE} cr). On verra bien si ça tient.`,
      important: true,
      regionId: r.i,
      factions: [faction],
    });
  }
  return { ok: true, colonie: col };
}

// ---------------------------------------------------------------------------
// Guerre et paix
// ---------------------------------------------------------------------------

/** Contre qui l'on peut encore déclarer la guerre. */
function cibleGuerre(state, faction) {
  return DIPLO_FACTIONS.filter((k) => k !== faction
    && !enGuerre(state.world, faction, k)
    && coloniesDe(state.world, k).length > 0);
}

/**
 * Déclarer la guerre. Pas de délibération : un Commandeur qui veut la guerre
 * l'a. Ce qu'il n'a pas, c'est le droit de la perdre impunément — la balance
 * des villes au moment de la déclaration est notée, et relue à la paix.
 */
function declarerGuerreA(state, faction, contre, rng, log) {
  const v = peutExercer(state, faction, 'guerre');
  if (!v.ok) return v;
  if (!cibleGuerre(state, faction).includes(contre)) {
    return { ok: false, motif: 'Pas contre ceux-là.' };
  }
  const prox = plusProche(state.world, faction, contre);
  declarerGuerre(state.world, faction, contre, state.temps, log,
    butDeGuerre(state.world, faction, contre, rng, prox));
  inscrireActe(state, faction, {
    type: 'guerre',
    contre,
    villes: coloniesDe(state.world, faction).length,
    t: state.temps,
  });
  return { ok: true };
}

/** La ville ennemie la plus proche des nôtres : ce qu'une guerre vise d'abord. */
function plusProche(world, faction, contre) {
  const miennes = coloniesDe(world, faction);
  let best = null;
  let d = Infinity;
  for (const c of coloniesDe(world, contre)) {
    for (const m of miennes) {
      const dd = distance(m.regionId, c.regionId);
      if (dd < d) { d = dd; best = c; }
    }
  }
  return best;
}

/** Les guerres qu'on peut arrêter d'un trait de plume. */
function guerresArretables(state, faction) {
  return guerresDe(state.world, faction).map((g) => ({
    guerre: g,
    contre: g.a === faction ? g.b : g.a,
  }));
}

/**
 * Signer la paix. Immédiate elle aussi — et jugée sur-le-champ, parce qu'une
 * paix se lit tout de suite : on a obtenu ce qu'on voulait, ou on a rendu.
 */
function signerPaixAvec(state, faction, contre, log) {
  const v = peutExercer(state, faction, 'paix');
  if (!v.ok) return v;
  const g = guerresDe(state.world, faction).find(
    (w) => w.a === contre || w.b === contre
  );
  if (!g) return { ok: false, motif: 'Vous n’êtes pas en guerre avec eux.' };
  const etat = etatGuerre(state.world, g, faction);
  signerPaix(state.world, faction, contre, state.temps, log, etat === 'atteint' ? 'atteint' : null);
  if (etat === 'atteint') {
    porterMerite(state, faction,
      `La paix ${FACTIONS[contre].genitif} scelle ce que vous étiez allé chercher.`, 90, log);
  } else if (etat === 'perdu') {
    porterFaute(state, faction, 'une paix signée les mains vides', log);
  }
  return { ok: true };
}

/**
 * Où en est une guerre pour nous. On reprend le but s'il y en a un ; sinon on
 * s'en remet au nombre de batailles perdues, faute de mieux.
 */
function etatGuerre(world, g, faction) {
  const but = g.but;
  if (but && but.type === 'conquete' && but.villeId) {
    const ville = colonieParId(world, but.villeId);
    if (ville && ville.faction === faction) return 'atteint';
    return g.batailles > 2 ? 'perdu' : null;
  }
  if (but && but.batailles) return g.batailles >= but.batailles ? 'atteint' : 'perdu';
  return null;
}

// ---------------------------------------------------------------------------
// La ville confiée
// ---------------------------------------------------------------------------

/** Ce que coûte un cran de garnison, et ce qu'il rapporte en défense. */
const COUT_GARNISON = 700;
const COUT_GRENIER = 500;

/** La ville dont on répond : celle qui est au centre de son secteur. */
function villeConfiee(state, faction) {
  for (const g of groupesEngages(state, faction)) {
    const s = g.allegeance.secteur;
    if (s && s.ville) {
      const col = colonieParId(state.world, s.ville);
      if (col && !col.ruine && col.faction === faction) return col;
    }
  }
  return null;
}

/**
 * Renforcer la garnison. Un Capitaine ne demande pas des murs : il les fait
 * payer. Ce qu'il ne peut pas faire, c'est les payer indéfiniment — le trésor
 * est celui de ses gens, et le conseil relit les comptes.
 */
function renforcerGarnison(state, faction, log) {
  const v = peutExercer(state, faction, 'garnison');
  if (!v.ok) return v;
  const col = villeConfiee(state, faction);
  if (!col) return { ok: false, motif: 'Aucune ville ne vous est confiée.' };
  const f = state.world.factions[faction];
  if (f.tresor < COUT_GARNISON) {
    return { ok: false, motif: `Le trésor ne suit pas : ${Math.round(f.tresor)} / ${COUT_GARNISON} cr.` };
  }
  f.tresor -= COUT_GARNISON;
  col.murs += 2;
  col.defenseMax = Math.round(col.pop * 0.09 + col.murs * 12);
  col.defense = Math.min(col.defenseMax, col.defense + Math.round(col.defenseMax * 0.3));
  if (log) {
    log({
      type: 'influence',
      texte: `Sur votre ordre, on relève les murs de ${col.nom} (${COUT_GARNISON} cr).`,
      important: true,
      regionId: col.regionId,
      factions: [faction],
    });
  }
  return { ok: true, colonie: col };
}

/** Ouvrir les greniers : la ville mange, la ville se tait. Un temps. */
function ouvrirGreniers(state, faction, log) {
  const v = peutExercer(state, faction, 'grenier');
  if (!v.ok) return v;
  const col = villeConfiee(state, faction);
  if (!col) return { ok: false, motif: 'Aucune ville ne vous est confiée.' };
  const f = state.world.factions[faction];
  if (f.tresor < COUT_GRENIER) {
    return { ok: false, motif: `Le trésor ne suit pas : ${Math.round(f.tresor)} / ${COUT_GRENIER} cr.` };
  }
  f.tresor -= COUT_GRENIER;
  col.stock.rations = (col.stock.rations || 0) + Math.round(col.pop * 0.9);
  col.unrest = Math.max(0, (col.unrest || 0) - 0.18);
  if (log) {
    log({
      type: 'influence',
      texte: `Sur votre ordre, ${col.nom} distribue du grain (${COUT_GRENIER} cr). On se tait, pour l’instant.`,
      important: true,
      regionId: col.regionId,
      factions: [faction],
    });
  }
  return { ok: true, colonie: col };
}

// ---------------------------------------------------------------------------
// La loi
// ---------------------------------------------------------------------------

/**
 * Fixer la loi. Un Commandeur ne propose pas une réforme : il la promulgue.
 * Ce qu'il ne contrôle pas, c'est ce que le pays en fait — l'impôt lourd
 * remplit le trésor et fait gronder les villes, la peine expéditive tient les
 * routes et fait peur, l'esclavage enrichit et fait de vous ce qu'on dit.
 */
function fixerLoi(state, faction, quoi, valeur, log) {
  const v = peutExercer(state, faction, 'loi');
  if (!v.ok) return v;
  const lois = loisDe(state.world, faction);
  let texte = null;
  if (quoi === 'peine') {
    if (!PEINES[valeur]) return { ok: false, motif: 'Cette peine n’existe pas.' };
    if (lois.peine === valeur) return { ok: false, motif: 'C’est déjà la loi.' };
    lois.peine = valeur;
    texte = `Justice ${PEINES[valeur].nom.toLowerCase()} : ${PEINES[valeur].desc}`;
  } else if (quoi === 'esclavage') {
    const veut = !!valeur;
    if (lois.esclavage === veut) return { ok: false, motif: 'C’est déjà la loi.' };
    lois.esclavage = veut;
    texte = veut
      ? 'Le commerce d’hommes est autorisé. Les marchés s’ouvriront vite.'
      : 'Le commerce d’hommes est interdit. Les marchés fermeront lentement.';
    // Ce n'est pas une décision technique : on est jugé dessus, par les autres
    // factions et par ses propres villes.
    for (const col of coloniesDe(state.world, faction)) {
      col.unrest = Math.max(0, Math.min(1, (col.unrest || 0) + (veut ? 0.06 : -0.03)));
    }
  } else if (quoi === 'impot') {
    const taux = IMPOTS.find((x) => x.key === valeur);
    if (!taux) return { ok: false, motif: 'Ce taux n’existe pas.' };
    if (lois.impot === taux.taux) return { ok: false, motif: 'C’est déjà la loi.' };
    lois.impot = taux.taux;
    texte = `Impôt ${taux.nom.toLowerCase()} : ${taux.desc}`;
  } else {
    return { ok: false, motif: 'On ne légifère pas là-dessus.' };
  }
  // Une loi promulguée par le joueur est une loi comme une autre : elle tient
  // son délai avant que quiconque puisse la rouvrir, conseil compris.
  lois.depuis = state.temps;
  inscrireActe(state, faction, { type: 'loi', quoi, t: state.temps });
  if (log) {
    log({
      type: 'influence',
      texte: `${FACTIONS[faction].nom} promulgue votre loi. ${texte}`,
      important: true,
      factions: [faction],
    });
  }
  return { ok: true };
}

// ---------------------------------------------------------------------------
// Jugement
// ---------------------------------------------------------------------------

/** Au bout de combien d'heures un acte cesse d'être en suspens. */
const DELAI_JUGEMENT = 1200;

/**
 * Juger ce qu'on a ordonné. Appelé au tick : une colonne détruite est une faute,
 * une ville prise est un mérite, un poste qui s'effondre est un poste qu'on a
 * voulu. C'est ce qui donne son poids à l'autorité — le grade ne coûte rien à
 * l'exercice, il coûte à l'arrivée.
 */
function jugerActes(state, log) {
  for (const g of state.player.groupes) {
    const all = g.allegeance;
    if (!all || !all.actes || !all.actes.length) continue;
    const restants = [];
    for (const acte of all.actes) {
      if (!juger(state, all.faction, acte, log)) restants.push(acte);
    }
    all.actes = restants;
  }
}

/** Vrai quand l'acte est soldé — jugé, ou trop vieux pour qu'on y revienne. */
function juger(state, faction, acte, log) {
  const w = state.world;
  const vieux = state.temps - acte.t >= DELAI_JUGEMENT;

  if (acte.type === 'envoi' || acte.type === 'levee') {
    const a = w.armees.find((x) => x.id === acte.armee);
    const col = colonieParId(w, acte.cible);
    if (a) return vieux; // toujours en campagne : rien à juger, sauf enlisement
    // La colonne n'existe plus : soit elle a pris la ville, soit elle est morte.
    if (col && col.faction === faction) {
      porterMerite(state, faction, `${col.nom} est tombée comme vous l’aviez ordonné.`, 120, log);
    } else {
      porterFaute(state, faction, 'la perte d’une colonne que vous aviez envoyée', log);
    }
    return true;
  }

  if (acte.type === 'fondation') {
    const col = colonieParId(w, acte.colonie);
    if (!col || col.ruine || col.faction !== faction) {
      porterFaute(state, faction, 'la perte d’un poste que vous aviez fait fonder', log);
      return true;
    }
    if (!vieux) return false;
    porterMerite(state, faction, `${col.nom} tient, et c’est vous qui l’avez voulue.`, 80, log);
    return true;
  }

  if (acte.type === 'loi') {
    // Une loi se juge sur ce qu'elle a fait au pays, pas sur son intention.
    if (!vieux) return false;
    let trouble = 0;
    const villes = coloniesDe(w, faction);
    for (const c of villes) trouble += c.unrest || 0;
    const moyen = villes.length ? trouble / villes.length : 0;
    if (moyen > 0.55) {
      porterFaute(state, faction, 'un pays qui gronde depuis vos lois', log);
    } else if (moyen < 0.2) {
      porterMerite(state, faction, 'Le pays est calme, et vos lois y sont pour quelque chose.', 70, log);
    }
    return true;
  }

  if (acte.type === 'guerre') {
    if (enGuerre(w, faction, acte.contre)) return false; // elle dure : on attend
    const maintenant = coloniesDe(w, faction).length;
    if (maintenant > acte.villes) {
      porterMerite(state, faction,
        `Votre guerre ${FACTIONS[acte.contre].genitif} a rapporté une ville.`, 110, log);
    } else if (maintenant < acte.villes) {
      porterFaute(state, faction, 'une guerre déclarée par vous et payée par les autres', log, 2);
    }
    return true;
  }

  return true;
}

// ===== src/justice.js ================================================
// Ce qu'on fait des gens qu'on n'a pas tués.
//
// Le combat produisait déjà des mises hors de combat — la moitié des pillards
// d'une bande finissent à terre, vivants. Ils disparaissaient ensuite du modèle
// sans qu'on y pense : on ramassait leurs affaires et on repartait. C'est une
// perte sèche, parce que c'est précisément là que le jeu touche à la société.
// Un homme à terre pose une question qu'aucun butin ne pose : qu'est-ce qu'on
// en fait ?
//
// Cinq réponses, et chacune coûte quelque chose :
//
//   Livrer     à la justice de la ville. Prime, et une piste plus sûre.
//   Rançonner  aux siens, s'ils sont de quelqu'un et qu'on n'est pas en guerre.
//   Vendre     là où la loi le permet. C'est le plus rentable, et ça se sait.
//   Enrôler    quelqu'un qui n'a pas choisi de vous suivre.
//   Relâcher   pour rien, ce qui n'est jamais pour rien.
//
// Ce qui borne le nombre de prisonniers n'est écrit nulle part : il faut des
// bras pour les garder, ils mangent, ils ralentissent, et ceux qu'on ne
// surveille pas s'en vont — parfois en emportant quelque chose.


/** Combien de prisonniers une paire de bras surveille sans y penser. */
const PAR_GARDIEN = 1.5;

/** Ce qu'un prisonnier mange par heure, comparé à un des vôtres. */
const RATION_PRISONNIER = 0.6;

// ---------------------------------------------------------------------------
// Capturer
// ---------------------------------------------------------------------------

function prisonniersDe(g) {
  return (g && g.prisonniers) || [];
}

/** Combien l'escouade sait en garder, d'après ceux qui tiennent debout. */
function capaciteGarde(g) {
  let bras = 0;
  for (const c of g.membres || []) {
    if (!estDebout(c)) continue;
    if ((c.formation && c.formation.restant > 0) || c.enseigne) continue;
    bras++;
  }
  return bras * PAR_GARDIEN;
}

/** Ce qui dépasse ce qu'on sait garder. Rien ne l'interdit ; ça se paie. */
function surveillanceManquante(g) {
  return Math.max(0, prisonniersDe(g).length - capaciteGarde(g));
}

/**
 * Ce que traîner des prisonniers retire à la vitesse. Comme pour l'attelage,
 * une courbe qui tend vers l'immobilité sans jamais l'atteindre : dix
 * prisonniers ne vous figent pas, ils vous réduisent au pas.
 */
function lenteurPrisonniers(g) {
  const n = prisonniersDe(g).length;
  if (!n) return 0;
  const l = n * 0.05 + surveillanceManquante(g) * 0.06;
  return 1 - 1 / (1 + l);
}

/**
 * Ce qu'on peut prendre après une victoire. On ne capture pas les morts, on ne
 * capture pas ce qu'on ne saurait pas garder, et on ne capture jamais l'Essaim
 * — on ne négocie pas avec ça, et personne n'en veut.
 */
function capturables(g, bande) {
  if (!bande || bande.faction === 'essaim') return [];
  const place = Math.floor(capaciteGarde(g) - prisonniersDe(g).length);
  if (place <= 0) return [];
  return (bande.membres || [])
    .filter((c) => estVivant(c) && !estDebout(c))
    .slice(0, place);
}

/**
 * Faire des prisonniers. Retourne ceux qu'on a effectivement pris — l'appelant
 * les retire de la bande, qui n'existe de toute façon plus après le combat.
 */
function fairePrisonniers(state, g, bande, gens, log) {
  if (!gens || !gens.length) return [];
  if (!g.prisonniers) g.prisonniers = [];
  const pris = [];
  for (const c of gens) {
    // Un prisonnier n'est plus un combattant : on le remet debout pour qu'il
    // marche, mais amoché, et on note d'où il vient. Sans ça, on ne saurait
    // plus à qui le rendre ni pour quoi le juger.
    c.captif = {
      faction: bande.faction || null,
      depuis: state.temps,
      // Ce qu'il a sur la conscience, aux yeux de la loi : c'est ce qui fixe
      // la prime, et ce qui fait qu'un pillard vaut plus qu'un soldat.
      brigandage: !bande.faction || bande.faction === 'bandits',
    };
    c.etat = 'ok';
    for (const part of Object.keys(c.corps)) {
      const b = c.corps[part];
      if (b.pv <= 0) b.pv = Math.max(1, Math.round(b.max * 0.15));
    }
    g.prisonniers.push(c);
    pris.push(c);
  }
  if (log && pris.length) {
    log({
      type: 'prisonnier',
      texte: pris.length === 1
        ? `${pris[0].nom} est fait prisonnier. Reste à savoir ce qu’on en fait.`
        : `${pris.length} prisonniers. Reste à savoir ce qu’on en fait.`,
      important: true,
      groupe: g.id,
    });
  }
  return pris;
}

// ---------------------------------------------------------------------------
// Ce qu'ils coûtent, heure par heure
// ---------------------------------------------------------------------------

/**
 * Une heure de captivité. Ils mangent sur vos vivres, et ceux que personne ne
 * regarde finissent par partir. C'est ce qui borne leur nombre sans qu'aucune
 * règle ne l'interdise.
 */
function tickPrisonniers(state, g, rng, log) {
  const gens = prisonniersDe(g);
  if (!gens.length) return;

  // On les nourrit sur le sac. Affamés, ils s'affaiblissent — et un prisonnier
  // mort ne vaut rien du tout.
  const veut = gens.length * RATION_PRISONNIER / 24;
  const dispo = g.inventaire.rations || 0;
  const servi = Math.min(dispo, veut);
  g.inventaire.rations = dispo - servi;
  const nourri = veut <= 0 || servi >= veut * 0.9;

  const manque = surveillanceManquante(g);
  const restants = [];
  for (const c of gens) {
    if (!nourri) {
      const t = c.corps.torse;
      t.pv = Math.max(0, t.pv - 0.12);
      if (t.pv <= 0) {
        c.etat = 'mort';
        if (log) {
          log({
            type: 'prisonnier',
            texte: `${c.nom} meurt de faim, les mains liées. On ne se vantera pas de celle-là.`,
            important: true,
            groupe: g.id,
          });
        }
        continue;
      }
    }
    // S'évader : d'autant plus facile que personne ne regarde, et qu'on est
    // rapide. Un prisonnier bien gardé ne s'évade pas — c'est le sens de
    // « bien gardé ».
    if (manque > 0) {
      const part = manque / gens.length;
      const chance = 0.004 * part * (1 + comp(c, 'furtivite') / 90);
      if (rng.chance(chance)) {
        if (log) {
          log({
            type: 'prisonnier',
            texte: `${c.nom} a profité de ce que personne ne le regardait. Envolé.`,
            important: true,
            groupe: g.id,
          });
        }
        continue;
      }
    }
    restants.push(c);
  }
  g.prisonniers = restants;
}

// ---------------------------------------------------------------------------
// Ce qu'on peut en faire
// ---------------------------------------------------------------------------

/** Ce qu'un prisonnier vaut, avant qu'on décide de son sort. */
function valeurCaptif(c) {
  const forme = Math.max(comp(c, 'melee'), comp(c, 'tir'));
  return Math.round(70 + forme * 8 + (c.diplomes || []).length * 90);
}

/** La prime que la justice d'ici verse pour un brigand livré. */
function primeLivraison(state, col, c) {
  const loi = loiIci(state, col);
  if (loi.sansLoi) return 0;
  const cap = c.captif || {};
  // On paie pour les brigands, et pour les ennemis déclarés. Livrer le soldat
  // d'une faction avec qui l'on est en paix n'intéresse personne.
  if (!cap.brigandage && !(cap.faction && enGuerre(state.world, col.faction, cap.faction))) {
    return 0;
  }
  return Math.round(valeurCaptif(c) * 0.55 * loi.peine.prime);
}

/** Ce que les siens paieraient pour le récupérer. */
function rancon(state, col, c) {
  const cap = c.captif || {};
  if (!cap.faction || cap.faction === 'bandits' || cap.faction === 'essaim') return 0;
  if (enGuerre(state.world, cap.faction, col && col.faction)) return 0;
  const f = state.world.factions[cap.faction];
  if (!f) return 0;
  return Math.min(Math.round(f.tresor * 0.15), Math.round(valeurCaptif(c) * 1.1));
}

/** Ce qu'un négrier en donne. Beaucoup, et c'est bien le problème. */
function prixEsclave(state, col, c) {
  const loi = loiIci(state, col);
  if (!loi.esclavage) return 0;
  // Une ville sans loi paie moins : le marché y est moins organisé qu'ailleurs.
  return Math.round(valeurCaptif(c) * (loi.sansLoi ? 1.4 : 1.9));
}

/** Ce qu'on peut faire de ce prisonnier, ici, avec les prix. */
function optionsPour(state, col, g, c) {
  const out = [];
  const prime = col ? primeLivraison(state, col, c) : 0;
  const ranc = col ? rancon(state, col, c) : 0;
  const esc = col ? prixEsclave(state, col, c) : 0;
  if (prime > 0) {
    out.push({
      key: 'livrer', nom: 'Livrer à la justice', prix: prime,
      aide: 'La ville l’enferme. Une piste de moins où l’on se fait détrousser.',
    });
  }
  if (ranc > 0) {
    out.push({
      key: 'rancon', nom: 'Rançonner les siens', prix: ranc,
      aide: 'Ils paient et le reprennent. On ne les fâche pas plus que ça.',
    });
  }
  if (esc > 0) {
    out.push({
      key: 'vendre', nom: 'Vendre', prix: esc,
      aide: 'C’est légal ici. Ce n’est pas pour ça que ça s’oublie.',
    });
  }
  out.push({
    key: 'enroler', nom: 'Enrôler', prix: 0,
    aide: 'Il n’a pas choisi de vous suivre. Ça se verra.',
  });
  out.push({
    key: 'relacher', nom: 'Relâcher', prix: 0,
    aide: 'Pour rien. Ce qui n’est jamais tout à fait pour rien.',
  });
  return out;
}

function retirerCaptif(g, c) {
  const i = prisonniersDe(g).findIndex((x) => x.id === c.id);
  if (i >= 0) g.prisonniers.splice(i, 1);
}

function noterReputation(state, faction, delta) {
  if (!faction || !FACTIONS[faction] || faction === 'bandits') return;
  state.player.reputation[faction] = Math.max(-100, Math.min(100,
    (state.player.reputation[faction] || 0) + delta));
}

/**
 * Disposer d'un prisonnier. Toutes les issues passent par ici, parce que toutes
 * ont un effet sur autre chose que la bourse — c'est ce qui en fait des choix.
 */
function disposer(state, g, captifId, quoi, log) {
  const col = colonieDe(state.world, g.regionId);
  const c = prisonniersDe(g).find((x) => x.id === captifId);
  if (!c) return { ok: false, motif: 'Il n’est plus là.' };
  const cap = c.captif || {};
  const loi = loiIci(state, col);

  if (quoi === 'relacher') {
    retirerCaptif(g, c);
    noterReputation(state, cap.faction, 4);
    if (log) {
      log({
        type: 'prisonnier',
        texte: `${c.nom} est relâché. Il ne dira pas merci, mais il s’en souviendra.`,
        groupe: g.id,
      });
    }
    return { ok: true, prix: 0 };
  }

  if (quoi === 'enroler') {
    retirerCaptif(g, c);
    delete c.captif;
    // On n'enrôle pas quelqu'un de force sans que ça se voie : il arrive usé,
    // sans attachement, et il faudra faire avec.
    c.moral = Math.min(c.moral !== undefined ? c.moral : 50, 25);
    c.liens = {};
    g.membres.push(c);
    if (log) {
      log({
        type: 'prisonnier',
        texte: `${c.nom} accepte de porter un sac plutôt que des chaînes. Pour l’instant.`,
        important: true,
        groupe: g.id,
      });
    }
    return { ok: true, prix: 0, perso: c };
  }

  if (!col || col.ruine) return { ok: false, motif: 'Il faut être en ville.' };

  if (quoi === 'livrer') {
    const prime = primeLivraison(state, col, c);
    if (prime <= 0) return { ok: false, motif: 'La justice d’ici n’a rien à lui reprocher.' };
    retirerCaptif(g, c);
    state.player.credits += prime;
    ecrouer(state, col, c, loi);
    noterReputation(state, col.faction, 2);
    noterReputation(state, cap.faction, -3);
    // Livrer un brigand à la faction qu'on sert, c'est du service rendu — et
    // c'est ce qui relie la geôle à la carrière.
    if (g.allegeance && g.allegeance.faction === col.faction) {
      crediter(state, 14 + Math.round(prime / 25), log, 'Brigand livré à la justice', g);
    }
    if (log) {
      log({
        type: 'prisonnier',
        texte: `${c.nom} est livré à la justice de ${col.nom} (${prime} cr, peine ${loi.peine.nom.toLowerCase()}).`,
        important: true,
        regionId: col.regionId,
        groupe: g.id,
      });
    }
    return { ok: true, prix: prime };
  }

  if (quoi === 'rancon') {
    const prix = rancon(state, col, c);
    if (prix <= 0) return { ok: false, motif: 'Personne ne paiera pour lui.' };
    retirerCaptif(g, c);
    state.world.factions[cap.faction].tresor -= prix;
    state.player.credits += prix;
    // On rend un homme : c'est mieux vu que de le vendre, moins bien que de
    // l'avoir laissé tranquille.
    noterReputation(state, cap.faction, 3);
    if (log) {
      log({
        type: 'prisonnier',
        texte: `${FACTIONS[cap.faction].nom} rachète ${c.nom} pour ${prix} cr.`,
        important: true,
        regionId: col.regionId,
        groupe: g.id,
      });
    }
    return { ok: true, prix };
  }

  if (quoi === 'vendre') {
    const prix = prixEsclave(state, col, c);
    if (prix <= 0) return { ok: false, motif: 'On ne vend pas d’hommes ici.' };
    retirerCaptif(g, c);
    state.player.credits += prix;
    // Ça se sait. Auprès des siens d'abord, et auprès de tous ceux qui l'ont
    // interdit chez eux — ce qui donne son poids à la loi d'en face.
    noterReputation(state, cap.faction, -14);
    for (const k of DIPLO_FACTIONS) {
      if (k === col.faction || k === cap.faction) continue;
      if (!loisDe(state.world, k).esclavage) noterReputation(state, k, -4);
    }
    col.unrest = Math.min(1, (col.unrest || 0) + 0.02);
    if (log) {
      log({
        type: 'prisonnier',
        texte: `${c.nom} est vendu à ${col.nom} pour ${prix} cr. On vous a vu.`,
        important: true,
        regionId: col.regionId,
        groupe: g.id,
      });
    }
    return { ok: true, prix };
  }

  return { ok: false, motif: 'On ne fait pas ça.' };
}

// ---------------------------------------------------------------------------
// La geôle
// ---------------------------------------------------------------------------

/** Ce qu'une ville tient enfermé. */
function geoleDe(col) {
  if (!col.geole) col.geole = { detenus: [], majA: 0 };
  return col.geole;
}

/** Écrouer quelqu'un : il quitte le modèle des personnages, il devient un chiffre. */
function ecrouer(state, col, c, loi) {
  const geole = geoleDe(col);
  // On ne garde pas la fiche complète : un détenu n'est plus un personnage
  // jouable, c'est une bouche à nourrir et une durée. Garder l'objet entier,
  // ce serait faire grossir la sauvegarde d'une ville à chaque arrestation.
  geole.detenus.push({
    nom: c.nom,
    faction: (c.captif && c.captif.faction) || null,
    sortie: state.temps + loi.peine.duree,
  });
}

/**
 * Une geôle pleine coûte à la ville et finit par gronder — mais tant qu'elle
 * tient, elle tient aussi les routes : ce sont autant de gens qui ne
 * détroussent personne.
 */
function tickGeole(state, col, dt) {
  if (!col.geole || !col.geole.detenus.length) return;
  const geole = col.geole;
  const restants = [];
  for (const d of geole.detenus) {
    if (state.temps >= d.sortie) continue;
    restants.push(d);
  }
  geole.detenus = restants;
  const n = restants.length;
  if (!n) return;
  // On les nourrit sur le grenier de la ville. Une geôle qu'on ne nourrit pas
  // se révolte, et une révolte de geôle est une révolte de ville.
  const veut = n * 0.02 * dt;
  const dispo = col.stock.rations || 0;
  col.stock.rations = Math.max(0, dispo - veut);
  if (dispo < veut) col.unrest = Math.min(1, (col.unrest || 0) + 0.004 * dt);
  // Au-delà de ce qu'une ville de cette taille peut tenir, la geôle déborde.
  const capacite = 4 + col.taille * 6;
  if (n > capacite) col.unrest = Math.min(1, (col.unrest || 0) + 0.0015 * (n - capacite) * dt);
}

/**
 * Ce que la sévérité fait à l'humeur d'une ville, heure par heure.
 *
 * `PEINES[].ordre` existait depuis le début et rien ne le lisait : une justice
 * expéditive coûtait donc zéro et rapportait des primes. Une ville où l'on pend
 * vite se tient, mais elle se tient par la peur, et la peur s'accumule.
 */
function tickOrdrePublic(state, col, dt) {
  if (!col.faction || col.ruine) return;
  const peine = PEINES[loisDe(state.world, col.faction).peine];
  if (!peine || !peine.ordre) return;
  // Une dérive sans borne n'est pas une politique : écrite comme une simple
  // addition, la justice expéditive ajoutait 0,048 de grogne tous les dix jours
  // et poussait toute ville à la révolte en une partie. La peur a un palier —
  // une ville où l'on pend vite reste rancunière, elle ne se soulève pas pour
  // autant ; une ville clémente s'apaise sans devenir angélique.
  const u = col.unrest || 0;
  const palier = peine.ordre > 0 ? 0.45 : 0.05;
  if ((peine.ordre > 0 && u >= palier) || (peine.ordre < 0 && u <= palier)) return;
  col.unrest = Math.max(0, Math.min(1, u + peine.ordre * 0.0004 * dt));
}

/** Ce que les geôles de la faction retirent à l'insécurité des environs. */
function apaisementGeole(col) {
  const n = col.geole ? col.geole.detenus.length : 0;
  if (!n) return 0;
  // Chaque détenu est quelqu'un qui ne coupe plus les routes. L'effet sature :
  // vider la steppe de ses pillards ne la rend pas sûre pour autant.
  return Math.min(0.0025, n * 0.00025);
}

// ===== src/secteur.js ================================================
// Ce dont un gradé répond tous les jours.
//
// Le banc a chiffré le défaut de la version précédente : sur six cent une
// occasions où un Lieutenant pouvait exercer sa seule prérogative, cinq cent
// treize fois sa faction n'avait aucune colonne sur les routes, et quatre cent
// soixante-huit fois elle n'était en guerre avec personne. La charge était vide
// neuf fois sur dix, parce qu'elle attendait que le monde lui donne une
// occasion. Trois mille six cents heures au service de quelqu'un pour mourir
// Lieutenant.
//
// Une charge, ce n'est pas un droit qu'on exerce quand l'occasion se présente :
// c'est une chose dont on répond en permanence, qu'il se passe quelque chose ou
// non. On confie donc au Lieutenant **un secteur** — une poignée de cases
// autour d'une ville des siens — et on lui demande simplement qu'il y soit sûr
// de circuler. Personne ne lui dit comment ; on relève l'état des routes tous
// les dix jours, et on le note.
//
// L'insécurité n'est pas une statistique décorative : elle multiplie les
// mauvaises rencontres pour tout le monde, joueur compris, et elle saigne la
// ville dont le secteur dépend. Un secteur qu'on laisse pourrir se sent.


/** Rayon du secteur confié. Treize cases : de quoi faire une tournée. */
const RAYON_SECTEUR = 2;

/** Grade à partir duquel on répond d'un morceau de territoire. */
const RANG_SECTEUR = 2; // Lieutenant

/** Tous les combien on relève l'état des routes. Dix jours de jeu. */
const PERIODE_BILAN = 240;

/**
 * Au-dessus, le conseil considère que le secteur n'est plus tenu ; en dessous,
 * qu'il l'est bien. Entre les deux, on ne dit rien : la plupart des tournées ne
 * méritent ni éloge ni reproche, et un jeu qui commente tout n'est plus lu.
 */
const SEUIL_FAUTE = 0.55;
const SEUIL_MERITE = 0.24;

/**
 * L'insécurité ne monte pas indéfiniment : elle tend vers un niveau de repos.
 *
 * La première version faisait dériver toutes les cases vers le haut à taux
 * constant. Le banc l'a réfutée en une mesure : au bout de six cents heures,
 * tout ce qui n'était pas collé à une ville saturait à « infréquentable », les
 * secteurs affichaient 0,79 de moyenne, les défaites passaient de 266 à 459 et
 * le carriériste perdait sa charge pour une faute qu'aucun effort ne pouvait
 * éviter. Une pente sans plafond n'est pas une simulation, c'est un compte à
 * rebours.
 *
 * Ce qui remplace : chaque case a un niveau de repos, fonction de son
 * éloignement de toute ville et de l'état de la ville la plus proche. Les
 * pistes s'y installent d'elles-mêmes ; l'effort les tire en dessous, la
 * négligence les y laisse remonter. Une piste éloignée est mauvaise en
 * permanence — pas mortelle, mauvaise.
 */
const REPOS_BASE = 0.15;
const REPOS_PAR_CASE = 0.09;
/** Combien d'heures pour rejoindre le niveau de repos : environ 250. */
const RAPPEL = 0.004;

/**
 * Tous les combien on repasse sur les quatre cent trente-deux cases.
 *
 * Écrit naïvement — chaque case cherchant à chaque heure la ville la plus
 * proche parmi quatre-vingt-six — ce seul calcul faisait passer le tick de
 * 130 à 589 µs, quatre fois le budget. L'insécurité dérive de moins d'un
 * millième par heure et son temps de retour au repos se compte en centaines :
 * la relever une fois par jour donne la même courbe pour un soixantième du
 * travail.
 */
const PAS_INSECURITE = 24;

// ---------------------------------------------------------------------------
// Le secteur lui-même
// ---------------------------------------------------------------------------

/**
 * Les cases dont on répond. On balaie la boîte englobante plutôt que la carte :
 * treize cases à trouver parmi quatre cent trente-deux, ce serait trente fois
 * trop de travail pour un appel qui sert aussi à l'affichage.
 */
function casesDe(world, secteur) {
  if (!secteur) return [];
  const rayon = secteur.rayon || RAYON_SECTEUR;
  const c = coord(secteur.centre);
  const out = [];
  for (let y = Math.max(0, c.y - rayon); y <= Math.min(HAUTEUR - 1, c.y + rayon); y++) {
    for (let x = Math.max(0, c.x - rayon); x <= Math.min(LARGEUR - 1, c.x + rayon); x++) {
      if (Math.abs(x - c.x) + Math.abs(y - c.y) > rayon) continue;
      out.push(world.regions[idx(x, y)]);
    }
  }
  return out;
}

function insecuriteDe(world, regionId) {
  const r = world.regions[regionId];
  return (r && r.insecurite) || 0;
}

/**
 * Le niveau qu'ont les pistes ordinaires, une fois le monde installé. Il sert
 * de zéro : l'insécurité doit se lire en écart à la normale, pas en valeur
 * absolue.
 */
const NIVEAU_ORDINAIRE = 0.28;

/**
 * Ce que l'insécurité fait au risque de mauvaise rencontre, pour tout le monde.
 *
 * Écrite d'abord comme `1 + insecurite × 1,4`, elle multipliait par 1,57 les
 * rencontres de la carte entière : les défaites passaient de 266 à 474 par
 * lot de quarante-huit parties et les avant-postes fondés de 35 à 28. Ce n'est
 * pas ce qu'on voulait dire. Un secteur mal tenu doit être plus dangereux que
 * les autres, pas rendre le monde plus dangereux qu'avant. On la centre donc
 * sur la normale : tenir son secteur *rend les pistes plus sûres qu'elles ne
 * l'étaient*, et c'est la récompense qu'on sent avant de lire le chiffre.
 */
function menace(world, regionId) {
  const v = 1 + (insecuriteDe(world, regionId) - NIVEAU_ORDINAIRE) * 1.5;
  return v < 0.7 ? 0.7 : v > 1.9 ? 1.9 : v;
}

/** L'état moyen des routes du secteur : c'est là-dessus qu'on est jugé. */
function etatSecteur(world, secteur) {
  const cases = casesDe(world, secteur);
  if (!cases.length) return 0;
  let s = 0;
  for (const r of cases) s += r.insecurite || 0;
  return s / cases.length;
}

/** Vrai si le groupe se trouve dans le secteur dont il répond. */
function dansSonSecteur(g) {
  const s = g.allegeance && g.allegeance.secteur;
  if (!s) return false;
  return distance(g.regionId, s.centre) <= (s.rayon || RAYON_SECTEUR);
}

/**
 * Confier un secteur. On le prend autour de la ville de la faction la plus
 * proche de là où l'on sert : un conseil ne détache pas son lieutenant à
 * l'autre bout de la carte pour le plaisir.
 */
function confierSecteur(state, g, log) {
  const all = g.allegeance;
  if (!all || all.secteur) return null;
  const villes = state.world.colonies.filter(
    (c) => !c.ruine && c.faction === all.faction
  );
  if (!villes.length) return null;
  let ville = villes[0];
  let d = Infinity;
  for (const c of villes) {
    const dd = distance(c.regionId, g.regionId);
    if (dd < d) { d = dd; ville = c; }
  }
  all.secteur = {
    centre: ville.regionId,
    ville: ville.id,
    rayon: RAYON_SECTEUR,
    depuis: state.temps,
    prochainBilan: state.temps + PERIODE_BILAN,
    bilans: 0,
  };
  if (log) {
    log({
      type: 'allegeance',
      texte: `${FACTIONS[all.faction].nom} vous confie les routes autour de ${ville.nom}. `
        + `On ne vous dira pas comment faire ; on relèvera l’état du secteur.`,
      important: true,
      groupe: g.id,
      regionId: ville.regionId,
      factions: [all.faction],
    });
  }
  return all.secteur;
}

/** Rendre le secteur : on ne répond plus de rien, et ça se voit tout de suite. */
function rendreSecteur(g) {
  if (g.allegeance) g.allegeance.secteur = null;
}

// ---------------------------------------------------------------------------
// Tick
// ---------------------------------------------------------------------------

/**
 * L'insécurité du monde entier dérive vers le haut : les pistes se referment
 * quand personne ne les tient. Ce qui la fait baisser, c'est la présence armée
 * — les colonnes des factions, les garnisons, et vous.
 */
function tickInsecurite(state) {
  const w = state.world;
  if (w.majInsecurite === undefined) w.majInsecurite = state.temps;
  const dt = state.temps - w.majInsecurite;
  if (dt < PAS_INSECURITE) return;
  w.majInsecurite = state.temps;

  // Ce que chaque case peut espérer : on part des villes et on s'en éloigne en
  // largeur, quatre cent trente-deux visites au lieu de trente-sept mille
  // distances. La ville qui atteint une case la première est celle dont elle
  // dépend, ce qui est exactement la bonne définition.
  const dist = new Int8Array(w.regions.length).fill(9);
  const source = new Int32Array(w.regions.length).fill(-1);
  let front = [];
  for (const col of w.colonies) {
    if (col.ruine) continue;
    dist[col.regionId] = 0;
    source[col.regionId] = col.regionId;
    front.push(col.regionId);
  }
  for (let d = 1; d <= 4 && front.length; d++) {
    const suivant = [];
    for (const i of front) {
      for (const v of voisins(i)) {
        if (dist[v] <= d) continue;
        dist[v] = d;
        source[v] = source[i];
        suivant.push(v);
      }
    }
    front = suivant;
  }
  // Ce que la ville la plus proche transmet à ses pistes : son désordre, et la
  // sévérité de sa loi. `PEINES[].routes` valait 0,6 à 1,5 sans que rien ne le
  // lise — une justice expéditive rapportait des primes et ne tenait rien.
  const troubleDe = new Map();
  const dissuasionDe = new Map();
  for (const col of w.colonies) {
    if (col.ruine) continue;
    troubleDe.set(col.regionId, col.unrest || 0);
    const peine = col.faction ? PEINES[loisDe(w, col.faction).peine] : null;
    dissuasionDe.set(col.regionId, peine ? peine.routes : 1);
  }

  // Ce qui tient activement les routes, en plus de la simple proximité : les
  // murs d'une ville, et les colonnes en marche. C'est la raison d'être des
  // colonnes, et ça donne un effet visible aux guerres lointaines.
  const tenu = new Map();
  const ajouter = (i, v) => tenu.set(i, (tenu.get(i) || 0) + v);
  for (const col of w.colonies) {
    if (col.ruine) continue;
    // Les murs tiennent la ville ; la geôle tient les routes. Chaque détenu
    // est quelqu'un qui ne détrousse plus personne, et c'est ce qui relie la
    // justice au secteur.
    const tient = col.defense * 0.00006 * (1 - (col.unrest || 0)) + apaisementGeole(col);
    ajouter(col.regionId, tient);
    for (const v of voisins(col.regionId)) ajouter(v, apaisementGeole(col) * 0.5);
  }
  for (const a of w.armees) ajouter(a.regionId, 0.006);

  for (const r of w.regions) {
    // Les pistes s'effacent quand plus personne ne passe. On le fait dans cette
    // boucle-ci plutôt que dans la sienne : on paie déjà le parcours des quatre
    // cent trente-deux cases une fois par jour de jeu, et une seconde boucle
    // pour une multiplication serait du travail pour rien.
    if (r.piste > 0.002) r.piste *= 1 - 0.0006 * dt;
    else r.piste = 0;
    const d = dist[r.i];
    // Une ville qui gronde ne tient plus ses abords : son désordre déborde sur
    // les pistes, et c'est ce qui reliera un jour l'ordre public au secteur.
    const trouble = source[r.i] >= 0 ? (troubleDe.get(source[r.i]) || 0) : 0.5;
    const dissuasion = source[r.i] >= 0 ? (dissuasionDe.get(source[r.i]) || 1) : 1;
    const cible = Math.max(0, Math.min(1,
      REPOS_BASE + REPOS_PAR_CASE * Math.min(4, d === 9 ? 4 : d) + trouble * 0.22
        - (dissuasion - 1) * 0.07));
    const v0 = r.insecurite || 0;
    const v = v0 + ((cible - v0) * RAPPEL - (tenu.get(r.i) || 0)) * dt;
    r.insecurite = v <= 0 ? 0 : v >= 1 ? 1 : v;
  }
}

/**
 * Ce que le groupe fait à l'insécurité de la case où il se trouve. Patrouiller
 * est de loin le plus efficace — c'est précisément le geste du métier —, mais
 * être là compte déjà pour quelque chose.
 */
function effetPresence(state, g, dt) {
  const r = state.world.regions[g.regionId];
  if (!r) return;
  const bras = (g.membres || []).filter((c) => estVivant(c) && c.etat !== 'ko').length;
  if (!bras) return;
  const type = g.ordre && g.ordre.type;
  const force = type === 'patrouille' ? 0.011 : type === 'repos' ? 0.001 : 0.003;
  // Deux fois plus de monde ne tient pas deux fois mieux : on couvre plus de
  // terrain, pas le même terrain deux fois.
  r.insecurite = Math.max(0, r.insecurite - force * Math.sqrt(bras) * dt);
}

/**
 * Le bilan : tous les dix jours, on relève l'état des routes du secteur et on
 * le porte au dossier. C'est ce qui fait qu'un Lieutenant a quelque chose à
 * faire tous les jours, guerre ou pas.
 */
function tickSecteurs(state, log, ctx) {
  const dt = 1;
  tickInsecurite(state);
  for (const g of state.player.groupes) {
    const all = g.allegeance;
    if (!all) continue;
    const rang = rangDe(all);
    if (rang.index < RANG_SECTEUR) { all.secteur = null; continue; }
    if (!all.secteur) { confierSecteur(state, g, log); continue; }

    effetPresence(state, g, dt);

    // La ville de référence est tombée ou a changé de mains : le secteur n'a
    // plus de sens, on en reçoit un autre.
    const ville = colonieParId(state.world, all.secteur.ville);
    if (!ville || ville.ruine || ville.faction !== all.faction) {
      all.secteur = null;
      confierSecteur(state, g, log);
      continue;
    }

    if (state.temps < all.secteur.prochainBilan) continue;
    all.secteur.prochainBilan = state.temps + PERIODE_BILAN;
    all.secteur.bilans++;
    const etat = etatSecteur(state.world, all.secteur);
    all.secteur.dernier = Number(etat.toFixed(3));
    if (etat >= SEUIL_FAUTE) {
      porterFaute(state, all.faction,
        `l’état des routes autour de ${ville.nom} — on n’y circule plus`, log);
    } else if (etat <= SEUIL_MERITE) {
      porterMerite(state, all.faction,
        `On passe sans escorte autour de ${ville.nom}, et c’est votre secteur.`,
        60 + Math.round(rang.index * 15), log);
    }
  }
}

/** Ce qu'on peut dire de l'état d'un secteur, en un mot. */
function motEtat(etat) {
  if (etat <= SEUIL_MERITE) return 'sûr';
  if (etat <= 0.40) return 'praticable';
  if (etat < SEUIL_FAUTE) return 'mauvais';
  return 'infréquentable';
}

/** La case la plus mal tenue du secteur : là où il faut aller. */
function pireCase(world, secteur) {
  let pire = null;
  for (const r of casesDe(world, secteur)) {
    if (!pire || (r.insecurite || 0) > (pire.insecurite || 0)) pire = r;
  }
  return pire;
}

/** Le secteur en une ligne, pour l'affichage et pour les tests. */
function resumeSecteur(world, secteur) {
  if (!secteur) return null;
  const etat = etatSecteur(world, secteur);
  const pire = pireCase(world, secteur);
  return {
    etat,
    mot: motEtat(etat),
    cases: casesDe(world, secteur).length,
    pire: pire ? nomRegion(world, pire.i) : null,
    pireId: pire ? pire.i : null,
  };
}

// ===== src/base.js ===================================================
// L'avant-poste : files de construction et de recherche à la OGame, chaîne de
// production contrainte par l'énergie, stockage plafonné, raids à encaisser.


function creerBase() {
  const stock = {};
  for (const k of COMMODITY_KEYS) stock[k] = 0;
  return {
    fonde: false,
    regionId: null,
    // Qui fait quoi. Les habitants sans poste restent des manœuvres.
    postes: {},
    nom: 'Avant-poste',
    batiments: {},
    file: [],
    recherche: {},
    fileRech: [],
    stock,
    defense: 0,
    derniereAttaque: -999,
    // Ce que l'entrepôt n'a pas pu prendre, cumulé. L'écrêtage était muet.
    gaspille: 0,
    gaspilleJour: 0,
    dernierGaspillage: -999,
    // Les habitants se placent eux-mêmes dans les métiers ouverts. Voir
    // `embaucher` : sans ça, un avant-poste de quarante habitants tourne avec
    // personne affecté à rien.
    autoEmploi: true,
    majEmploi: -999,
    // L'entrée de `world.colonies` qui donne à ce camp une existence pour les
    // autres, une fois qu'il compte. Voir `reconnaitreAvantPoste`.
    colonieId: null,
    majVitrine: -999,
    // Laisser les colporteurs traiter avec l'intendance. Voir `visiteMarchand`.
    commerce: true,
    dernierMarchand: -9999,
    // Un avant-poste n'est pas un entrepôt avec des murs : des gens finissent
    // par s'y installer, y travailler, et y manger.
    pop: 0,
    moral: 60,
    recrues: 0,
  };
}

/**
 * Ce que le campement lui-même vaut, avant toute construction.
 *
 * C'était le trou du jeu : fonder un avant-poste ne rendait rien tant qu'on n'y
 * avait pas monté trois bâtiments, et on ne pouvait pas se les payer parce
 * qu'on dépensait tout en nourriture. On planquait donc des matériaux dans un
 * trou pendant des semaines sans contrepartie, et le banc était formel — mieux
 * valait ne pas s'installer du tout.
 *
 * Un campement, même vide, c'est un toit et un dépôt. Le toit se paie ici, le
 * dépôt existait déjà (huit cents unités de stock sans le moindre entrepôt).
 */
const ABRI_CAMP = 1.7;
const ABRI_PAR_BARAQUEMENT = 0.22;

/** Le facteur de récupération d'un repos pris dans cette région. */
function abriDe(state, regionId) {
  const base = state.base;
  if (base && base.fonde && base.regionId === regionId) {
    return ABRI_CAMP + niveau(base, 'baraquement') * ABRI_PAR_BARAQUEMENT;
  }
  // À partir du grade de Lieutenant, les villes des siens vous logent. C'est le
  // pendant du campement pour qui a choisi de servir plutôt que de bâtir.
  if (garnison(state, regionId)) return ABRI_CAMP;
  return 1;
}

/** Combien de personnes l'avant-poste peut loger et nourrir. */
/** Ce qu'on tire d'une chaîne quand personne ne fournit de courant. */
const SOCLE_MANUEL = 0.4;

function populationMax(base) {
  return niveau(base, 'baraquement') * 9 + niveau(base, 'hydroponie') * 4;
}

// ---------------------------------------------------------------------------
// Métiers
// ---------------------------------------------------------------------------

/** Places ouvertes pour un métier, d'après le bâtiment qui l'abrite. */
function placesMetier(base, key) {
  const m = METIERS[key];
  if (!m) return 0;
  return niveau(base, m.batiment) * m.parNiveau;
}

/** Habitants effectivement à ce poste — jamais plus que de places. */
function affectes(base, key) {
  const n = (base.postes && base.postes[key]) || 0;
  return Math.max(0, Math.min(n, placesMetier(base, key)));
}

/** Ceux qui n'ont pas de poste : ils aident partout, sans rien faire de précis. */
function manoeuvres(base) {
  let pris = 0;
  for (const k of METIER_KEYS) pris += affectes(base, k);
  return Math.max(0, Math.round((base.pop || 0) - pris));
}

/**
 * Le travail des habitants sans poste, en multiplicateur général. Volontairement
 * plus faible que ce que rend une place tenue : c'est ce qui rend la
 * spécialisation intéressante plutôt que décorative.
 */
function mainDoeuvre(base) {
  return 1 + Math.min(0.6, manoeuvres(base) / 60);
}

/**
 * Ce qu'un métier rend, tout compris : les ouvriers, et le contremaître s'il y
 * en a un sur place. Un diplômé qui supervise vaut plusieurs bras.
 */
function rendementMetier(state, key) {
  const base = state.base;
  const n = affectes(base, key);
