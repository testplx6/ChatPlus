  if (!g) return { ok: false, motif: 'Aucun groupe.' };
  // On ne commande pas ce qu'on ne peut pas joindre. Un groupe hors de portée
  // n'est pas perdu : il continue son dernier ordre jusqu'à ce qu'on le
  // rattrape, ou qu'on monte l'antenne. C'est ce qui remplace le plafond de
  // quatre groupes — rien n'empêche d'en faire six, il faut pouvoir leur
  // parler.
  const port = joignable(state, g);
  if (!port.ok) return port;
  if (ordre.type === 'voyage') {
    const m = { reductionVoyage: (state.base.recherche.logistique || 0) * 0.06 };
    const route = chemin(state.world, g.regionId, ordre.dest, m);
    if (!route || !route.length) return { ok: false, motif: 'Aucune route.' };
    g.ordre = {
      type: 'voyage', dest: ordre.dest, route, etape: 0, progres: 0,
      // « normale » : on campe la nuit. « forcee » : on marche, et on le paie.
      allure: ordre.allure === 'forcee' ? 'forcee' : 'normale',
    };
    return { ok: true };
  }
  if (!ORDRES[ordre.type]) return { ok: false, motif: 'Ordre inconnu.' };
  if (ordre.type === 'entrainement') {
    const v = verifierExercice(ordre.skill);
    if (!v.ok) return v;
  }
  g.ordre = Object.assign({}, ordre);
  return { ok: true };
}

/** Refus explicite plutôt que retombée silencieuse sur la mêlée. */
function verifierExercice(skill) {
  if (!skill) return { ok: false, motif: 'Quelle compétence ?' };
  if (COMPETENCES_EXERCICE.includes(skill)) return { ok: true };
  const comment = PAR_LA_PRATIQUE[skill];
  return {
    ok: false,
    motif: comment
      ? `${SKILLS[skill]} ne se travaille pas à l’exercice : ça vient ${comment}.`
      : `${SKILLS[skill]} ne se travaille pas à l’exercice.`,
  };
}

// ---------------------------------------------------------------------------
// Récolte
// ---------------------------------------------------------------------------

const FILTRES = {
  fouille: null, // tout ce que le biome donne
  mine: ['minerai', 'ferraille', 'alliage', 'isotope'],
  chasse: ['biomasse'],
};

const SKILL_ORDRE = { fouille: 'ingenierie', mine: 'force', chasse: 'tir' };

/**
 * Ce que rapporte une heure d'entraînement dédié. Chiffré, pas deviné : à 5,5,
 * atteindre 30 en mêlée demandait cent cinquante-neuf jours de jeu à ne faire
 * que ça, et cent heures d'entraînement rendaient un seul point. Le joueur ne
 * voyait rien bouger et l'ordre ne servait à rien qu'à manger des rations.
 */
const XP_ENTRAINEMENT = 24;

/**
 * Ce qui s'exerce à vide, et rien d'autre. On soulève des charges, on court, on
 * répète une frappe, on tire sur une cible — mais on ne s'exerce pas à
 * l'ingénierie, à la médecine ou au commerce : ces métiers-là s'apprennent en
 * démontant, en soignant et en négociant pour de vrai. La furtivité non plus :
 * elle s'acquiert en se déplaçant sans se faire voir.
 *
 * Le reste des compétences monte donc uniquement par la pratique — c'est le
 * pendant de XP_PRATIQUE, et les deux règles se tiennent : le métier forme au
 * métier, l'exercice ne forme qu'au corps et aux armes.
 */
const COMPETENCES_EXERCICE = ['force', 'endurance', 'melee', 'tir'];

/** Comment chaque compétence non exerçable se travaille, pour le dire au joueur. */
const PAR_LA_PRATIQUE = {
  furtivite: 'en explorant et en évitant les mauvaises rencontres',
  ingenierie: 'en fouillant, en fouillant des sites et en bâtissant l’avant-poste',
  medecine: 'en soignant les siens',
  commerce: 'en achetant et en vendant',
};
/**
 * Un vétéran qui corrige les gestes vaut mieux qu'un mannequin de paille. Le
 * meilleur du groupe dans la compétence travaillée accélère les autres —
 * et c'est ce qui donne un rôle à celui qu'on a fait monter.
 */
const BONUS_INSTRUCTEUR = 0.9;

/**
 * Ce qu'on ramasse en marchant, rapporté à ce qu'on ramasserait en fouillant
 * vraiment. On ne traverse pas cinquante kilomètres de ferraille sans rien
 * mettre dans son sac — et sans ça, un quart du temps de jeu ne produit rien.
 *
 * La valeur est mesurée, pas devinée : le banc d'équilibrage a montré que la
 * route prélevait 55 % du revenu, ce qui rendait tout le contenu du jeu —
 * contrats, ordres de mission, sites, commerce — moins rentable que camper sur
 * une bonne case. À 0,35 l'écart restait de 45 % ; à 0,55 il tombe à 30 % et la
 * survie s'égalise ; au-delà, ça ne rapporte plus rien de plus.
 */
const GLANE_EN_MARCHE = 0.55;

/**
 * Jusqu'où une région se laisse épuiser. Le plafond précédent (0,6) laissait
 * 40 % de rendement pour toujours : camper au même endroit restait la
 * meilleure stratégie du jeu, et tout le contenu qui demande de bouger —
 * contrats, ordres de mission, sites, commerce — devenait un luxe. Un secteur
 * ratissé doit finir par ne plus rien donner.
 */
const EPUISEMENT_MAX = 0.88;
/** Ce que la terre reprend chaque heure. Lent : un secteur reste bon des semaines. */
const REPOUSSE = 0.0022;

/** `travailleurs` : ceux qui exécutent *cette* tâche, pas tout le groupe. */
function recolter(state, g, type, travailleurs, log, ctx, facteur = 1) {
  const rng = ctx.rng;
  const r = state.world.regions[g.regionId];
  const biome = BIOMES[r.biome];
  const posture = POSTURES[state.player.posture] || POSTURES.neutre;
  const skill = SKILL_ORDRE[type];
  const filtre = FILTRES[type];
  if (!travailleurs.length) return {};

  // Même un désert nourrit son homme, mal : la chasse a un plancher partout,
  // sinon un ordre parfaitement raisonnable rend zéro sans prévenir.
  const rendements = Object.assign({}, biome.yields);
  if (type === 'chasse') {
    rendements.biomasse = Math.max(rendements.biomasse || 0, r.biome === 'relais' ? 0.05 : 0.18);
  }

  const epuisement = 1 - r.fouille;
  // Ce que vaut une bande soudée, et ce que coûte une foule. C'est ici que la
  // taille d'une escouade se paie : à trente, on se marche dessus.
  const coh = rendementCohesion(g);
  const recolte = {};
  for (const c of travailleurs) {
    const habilete = 0.45 + comp(c, skill) / 115;
    for (const k of Object.keys(rendements)) {
      if (filtre && !filtre.includes(k)) continue;
      const climatMult = ctx.climat ? ctx.climat.rendement(k) : 1;
      let q = rendements[k] * r.richesse * habilete * posture.rendement
        * epuisement * climatMult * facteur * coh * rng.range(0.75, 1.25);
      // La saison amaigrit le gibier, elle ne le fait pas disparaître : sans ce
      // plancher, un hiver de cendre affame l'escouade où qu'elle aille.
      if (type === 'chasse' && k === 'biomasse') {
        q = Math.max(q, 0.16 * habilete * facteur * rng.range(0.8, 1.2));
      }
      recolte[k] = (recolte[k] || 0) + q;
    }
    // Le métier forme au métier. `facteur` vaut aussi ici : glaner en marchant
    // enseigne moins que fouiller pour de bon.
    gagnerXp(c, skill, XP_PRATIQUE * facteur);
    gagnerXp(c, 'endurance', XP_PRATIQUE * 0.35 * facteur);
  }
  // Chasser, c'est manger : l'essentiel part en rations, pas en biomasse brute
  // qu'on ne saurait pas transformer sans avant-poste.
  if (type === 'chasse' && recolte.biomasse) {
    recolte.rations = (recolte.rations || 0) + recolte.biomasse * 0.7;
    recolte.biomasse *= 0.3;
  }

  // Épuisement local : rester camper au même endroit rapporte de moins en
  // moins. Assez lent pour laisser une région exploitable plusieurs semaines.
  r.fouille = Math.min(EPUISEMENT_MAX, r.fouille + 0.0012 * facteur * travailleurs.length);

  // Les rendements horaires sont fractionnaires : sans report d'une heure sur
  // l'autre, tout ce qui rapporte moins d'une unité par heure rapporte zéro.
  const reste = g.reste || (g.reste = {});
  const bilan = g.bilan || (g.bilan = { res: {}, depuis: state.temps });
  let total = 0;
  const detail = [];
  for (const k of Object.keys(recolte)) {
    const cumul = (reste[k] || 0) + recolte[k];
    const q = Math.floor(cumul);
    reste[k] = cumul - q;
    if (q <= 0) continue;
    const pris = ajouterAuSac(state, k, q, g);
    reste[k] += q - pris; // sac plein : on ne jette pas, on garde en attente
    if (pris > 0) {
      total += pris;
      bilan.res[k] = (bilan.res[k] || 0) + pris;
      detail.push(`${pris} ${COMMODITIES[k].nom.toLowerCase()}`);
    }
  }
  if (total > 0) {
    state.stats.recolte += total;
    g.recolteHeure = [g.recolteHeure, detail.join(', ')].filter(Boolean).join(', ');
  }
  return recolte;
}

// ---------------------------------------------------------------------------
// Exploration
// ---------------------------------------------------------------------------

/**
 * Lève la carte de proche en proche et fait apparaître les sites. Sans ça,
 * la carte reste un grand rectangle noir et rien n'invite à bouger.
 */
function explorer(state, g, eclaireurs, log, ctx) {
  const rng = ctx.rng;
  if (!eclaireurs.length) return;

  let portee = 2 + (state.base.recherche.optique || 0);
  const meilleur = Math.max(...eclaireurs.map((c) => comp(c, 'furtivite')));
  if (meilleur > 45) portee += 1;

  // La région du dessous d'abord : on remarque ce qu'on a sous les pieds.
  const ici = state.world.regions[g.regionId];
  if (ici.site && !ici.site.connu) {
    ici.site.connu = true;
    log({
      type: 'site',
      texte: `Site repéré sur place : ${POI[ici.site.type].nom}.`,
      important: true,
      regionId: ici.i,
    });
  }

  // Puis on repousse le noir, une case à la fois.
  const candidates = state.world.regions
    .filter((r) => !r.decouvert && distance(r.i, g.regionId) <= portee)
    .sort((a, b) => distance(a.i, g.regionId) - distance(b.i, g.regionId));

  if (candidates.length) {
    const vue = ctx.climat ? ctx.climat.vue : 1;
    const combien = rng.chance(Math.max(0.08, Math.min(0.9, 0.55 * vue))) ? 1 : 0;
    for (let k = 0; k < combien && k < candidates.length; k++) {
      const r = candidates[k];
      r.decouvert = true;
      if (r.site && rng.chance(0.7)) {
        r.site.connu = true;
        log({
          type: 'site',
          texte: `${POI[r.site.type].nom} repéré en ${nomRegion(state.world, r.i)}.`,
          important: true,
          regionId: r.i,
        });
      }
    }
  } else if (rng.chance(0.02)) {
    log({ type: 'exploration', texte: 'Plus rien à lever dans ce secteur.', regionId: ici.i, discret: true });
  }

  for (const c of eclaireurs) {
    gagnerXp(c, 'furtivite', XP_PRATIQUE);
    gagnerXp(c, 'endurance', XP_PRATIQUE * 0.5);
  }
}

// ---------------------------------------------------------------------------
// Soins
// ---------------------------------------------------------------------------

function qualiteSoin(state, g, auRepos) {
  let medic = 0;
  for (const c of deboutDe(g)) medic = Math.max(medic, comp(c, 'medecine'));
  let q = 0.25 + medic / 90;
  q *= 1 + (state.base.recherche.medecine || 0) * 0.25;
  if (state.base.fonde && g.regionId === state.base.regionId) {
    // Le camp lui-même compte, avant la moindre infirmerie : on recoud à
    // l'abri, sur une table, avec de l'eau propre.
    q *= 1.45 + nivBat(state.base, 'infirmerie') * 0.35;
  } else if (garnison(state, g.regionId)) {
    // Les siens vous soignent chez eux, et sans compter à partir de Capitaine.
    q *= 1.5;
  }
  // Camper sous les murs d'une ville dont le médecin vous apprécie, ce n'est
  // pas camper dans le sable : il passe voir vos gens.
  q *= renfortSoin(state, g.regionId);
  if (!auRepos) q *= 0.35;
  return q;
}

/** Consomme un medkit sur le plus mal en point si ça vaut le coup. */
function utiliserMedkit(state, g, log, ctx) {
  if ((g.inventaire.medkit || 0) < 1) return;
  const blesses = g.membres.filter((c) => estVivant(c) && (pvTotal(c).pct < 0.55 || c.sang > 20));
  if (!blesses.length) return;
  const cible = blesses.reduce((a, b) => (pvTotal(a).pct <= pvTotal(b).pct ? a : b));
  g.inventaire.medkit -= 1;
  cible.sang = 0;
  for (const p of Object.keys(cible.corps)) {
    const part = cible.corps[p];
    part.pv = Math.min(part.max, part.pv + part.max * 0.22);
  }
  const soigneur = deboutDe(g)
    .reduce((a, b) => (!a || comp(b, 'medecine') > comp(a, 'medecine') ? b : a), null);
  if (soigneur) gagnerXp(soigneur, 'medecine', XP_PRATIQUE * 1.4);
  if (cible.etat === 'ko' && pvTotal(cible).pct > 0.45) {
    cible.etat = 'ok';
    cible.koHeures = 0;
  }
  log({ type: 'soin', texte: `Medkit utilisé sur ${cible.nom}.`, discret: true });
}

// ---------------------------------------------------------------------------
// Voyage
// ---------------------------------------------------------------------------

function avancerVoyage(state, g, log, ctx) {
  const o = g.ordre;
  const debout = deboutDe(g);
  if (!debout.length) return;

  // Vitesse dictée par le plus lent, alourdie par le sac et les K.O. portés
  let vitesse = Infinity;
  for (const c of debout) {
    const v = 0.5 + comp(c, 'endurance') / 90;
    vitesse = Math.min(vitesse, v);
  }
  const cap = Math.max(1, capacitePortage(state, g));
  const charge = poidsInventaire(g.inventaire) / cap;
  vitesse *= 1 - Math.min(0.55, Math.max(0, charge - 0.6) * 0.9);
  const portes = g.membres.filter((c) => c.etat === 'ko').length;
  vitesse *= 1 - Math.min(0.5, portes * 0.18);
  // Une bête suit le convoi ; une charrette le retient. C'est le prix du dos
  // qu'on s'est acheté.
  vitesse *= 1 - lenteurAttelage(g);
  // Des hommes qu'on mène de force ne marchent pas au pas de ceux qui suivent
  // de leur plein gré. C'est ce qui rend une capture coûteuse à ramener.
  vitesse *= 1 - lenteurPrisonniers(g);
  vitesse = Math.max(0.15, vitesse);

  o.progres += vitesse;
  const prochaine = o.route[o.etape];
  const m = { reductionVoyage: (state.base.recherche.logistique || 0) * 0.06 };
  // Le climat alourdit la marche, mais à moitié : le coût de base tient déjà
  // compte du terrain, et cumuler les deux pleinement immobilise l'escouade.
  const gene = ctx.climat ? 1 + (ctx.climat.marche - 1) * 0.6 : 1;
  const cout = coutTraversee(state.world, prochaine, m) * gene;

  if (o.progres >= cout) {
    o.progres = 0;
    g.regionId = prochaine;
    o.etape++;
    // On tasse la terre en passant. Un convoi lourd marque plus qu'un homme
    // seul, et c'est ce qui fait qu'un circuit qu'on répète devient une route.
    damer(state.world, prochaine, 1 + (g.membres.length + betesDe(g).length) * 0.12);
    const rayon = 1 + (state.base.recherche.optique || 0);
    decouvrir(state.world, prochaine, rayon);
    for (const c of debout) gagnerXp(c, 'endurance', XP_PRATIQUE);

    const col = colonieDe(state.world, prochaine);
    if (col) {
      log({
        type: 'voyage',
        texte: `${g.nom} : arrivée à ${col.nom} (${col.faction ? state.world.factions[col.faction].nom : 'sans maître'}).`,
        regionId: prochaine,
        groupe: g.id,
      });
    }
    if (o.etape >= o.route.length) {
      g.ordre = { type: 'repos' };
      log({
        type: 'voyage',
        texte: `${g.nom} : destination atteinte, ${nomRegion(state.world, prochaine)}.`,
        regionId: prochaine,
        important: true,
        groupe: g.id,
      });
    }
  }
}

// ---------------------------------------------------------------------------
// Tick d'un groupe
// ---------------------------------------------------------------------------

/** Groupe les gens debout par tâche effective : [[type, {tache, gens}], …] */
function partitionner(g, debout) {
  const par = new Map();
  for (const c of debout) {
    const t = tacheDe(g, c);
    let e = par.get(t.type);
    if (!e) { e = { tache: t, gens: [] }; par.set(t.type, e); }
    e.gens.push(c);
  }
  return par;
}

/** Effort demandé par une tâche, corrigé par la nuit et l'allure. */
function effortDe(type, nuit, forcee) {
  const def = ORDRES[type] || ORDRES.repos;
  if (!nuit) return def.effort;
  if (type === 'voyage' && forcee) return 1.35; // marche de nuit : épuisant
  return 0;
}

function tickGroupe(state, g, log, ctx) {
  const rng = ctx.rng;
  const vivants = vivantsDe(g);
  if (!vivants.length) return;

  const ordre = g.ordre || (g.ordre = { type: 'repos' });
  g.recolteHeure = null;

  // Cycle jour/nuit : on campe la nuit, sauf en marche forcée.
  //
  // Le commentaire disait ça depuis toujours et le code faisait le contraire :
  // *toute* route était une marche forcée, personne n'a jamais dormi une nuit
  // en voyage. Le banc a fini par le montrer par la bande — un ancien du
  // premier jour finit la partie à 60 de fatigue sur 120, ce qui lui retire
  // trente pour cent de toutes ses compétences en permanence. Sa compétence
  // brute monte bien (14 → 18 en quatre mille heures), mais sa compétence utile
  // tombe de 14 à 10. Les vétérans ne se faisaient pas remplacer parce qu'ils
  // mouraient : ils étaient devenus plus faibles que les recrues.
  //
  // On campe donc, et forcer la marche devient un choix qu'on prend en
  // connaissance de cause.
  const heure = state.temps % 24;
  const nuit = heure >= 22 || heure < 6;
  const forcee = ordre.type === 'voyage' && ordre.allure === 'forcee';
  const travaille = !nuit || forcee;
  g.nuit = nuit;

  const debout = deboutDe(g);

  // L'attelage broute, maigrit, et finit parfois par rester sur le bord de la
  // piste. Il mange de la biomasse : celle que personne d'autre ne mange.
  tickBetes(g, rng, log);

  // Les prisonniers mangent sur le sac, et ceux que personne ne regarde s'en
  // vont. C'est ce qui borne leur nombre, à la place d'une règle qui l'interdit.
  tickPrisonniers(state, g, rng, log);

  // --- Cohésion : un groupe au repos et bien nourri se ressoude, un groupe qui
  // enchaîne les défaites se délite. Le moral suit.
  if (g.cohesion === undefined) g.cohesion = 55;
  const affames = vivants.filter((c) => c.faim > 80).length;
  const ko = g.membres.filter((c) => c.etat === 'ko').length;
  let derive = 0.02;
  if (affames) derive -= 0.06 * affames;
  if (ko) derive -= 0.05 * ko;
  if (ordre.type === 'repos' && !affames) derive += 0.05;
  // Un groupe d'une personne ne se « ressoude » pas : il tient ou il craque.
  if (vivants.length === 1) derive *= 0.5;
  // Même amortissement que les liens : une escouade parfaite n'existe pas.
  // Une colonne trop nombreuse ne se ressoude pas : au-delà du noyau qu'on sait
  // tenir, le plafond descend, et la cohésion avec lui.
  const plafond = plafondCohesion(state, g);
  const freinCoh = derive > 0 ? 1 - Math.min(0.95, g.cohesion / plafond) : 1;
  g.cohesion = Math.max(0, Math.min(plafond, g.cohesion + derive * freinCoh));

  // Les liens se tissent en vivant côte à côte, et se distendent quand l'un
  // s'écroule pendant que l'autre tient debout. Séparés, ils s'étiolent.
  if (state.temps % 6 === 0 && vivants.length > 1) {
    for (let i = 0; i < vivants.length; i++) {
      for (let j = i + 1; j < vivants.length; j++) {
        const a = vivants[i];
        const b = vivants[j];
        const ensemble = estDebout(a) && estDebout(b);
        let cible = 40;
        const ta = a.traits || [];
        const tb = b.traits || [];
        if (ta.includes('teigneux') && tb.includes('teigneux')) cible -= 55;
        if (ta.includes('froussard') !== tb.includes('froussard')) cible -= 15;
        if (ta.includes('beau_parleur') || tb.includes('beau_parleur')) cible += 15;
        if (ta.includes('rebouteux') || tb.includes('rebouteux')) cible += 10;
        if (!ensemble) cible -= 20;
        tendreLien(a, b, cible, ordre.type === 'repos' && ensemble ? 0.035 : 0.02);
      }
    }
  }

  for (const c of vivants) {
    // Le moral tient à deux choses : l'état du groupe, et ceux sur qui on peut
    // compter nommément — ceux qui sont là, pas ceux partis à l'autre bout.
    let apport = 0;
    let n = 0;
    for (const autre of vivants) {
      if (autre.id === c.id) continue;
      apport += lien(c, autre);
      n++;
    }
    const social = n ? apport / n : -8; // seul : personne sur qui compter
    const cible = Math.max(0, Math.min(plafondCohesion(state, g), g.cohesion + social * 0.25));
    c.moral = Math.max(0, Math.min(100, c.moral + (cible - c.moral) * 0.012 * (mods(c).moral || 1)));
  }

  // --- Nourriture : on mange dès qu'on a faim et de quoi. Chaque groupe puise
  // dans ce qu'il porte : c'est tout l'enjeu d'un détachement.
  for (const c of vivants) {
    if (c.faim > 42) {
      const dispo = g.inventaire.rations || 0;
      const mange = nourrir(c, dispo);
      if (mange > 0) g.inventaire.rations -= mange;
    }
  }

  // --- Exécution. Le cas courant est que personne n'a de tâche à soi : on ne
  // partitionne alors pas du tout, ce qui évite une Map et deux tableaux par
  // groupe et par heure de jeu.
  let uniforme = true;
  for (const c of debout) if (c.tache) { uniforme = false; break; }

  if (travaille && debout.length) {
    const paquets = uniforme
      ? [[ordre.type, { tache: ordre, gens: debout }]]
      : partitionner(g, debout);
    for (const [type, paquet] of paquets) {
      switch (type) {
        case 'voyage':
          avancerVoyage(state, g, log, ctx);
          // On glane le long de la route. Le rendement est celui de la région
          // qu'on vient de quitter ou d'atteindre — c'est le terrain traversé.
          if (!nuit) recolter(state, g, 'fouille', paquet.gens, log, ctx, GLANE_EN_MARCHE);
          break;
        case 'fouille':
        case 'mine':
        case 'chasse':
          recolter(state, g, type, paquet.gens, log, ctx);
          break;
        case 'entrainement': {
          const skill = COMPETENCES_EXERCICE.includes(paquet.tache.skill)
            ? paquet.tache.skill : 'melee';
          const cout = Math.ceil(paquet.gens.length / 2);
          if ((g.inventaire.rations || 0) >= cout) {
            g.inventaire.rations -= cout;
            // Le meilleur du groupe donne le ton, y compris s'il ne s'entraîne
            // pas lui-même : on regarde tout le monde debout, pas le paquet.
            let maitre = 0;
            for (const c of debout) maitre = Math.max(maitre, comp(c, skill));
            for (const c of paquet.gens) {
              const av = c.skills[skill];
              const ecart = Math.max(0, maitre - comp(c, skill));
              const bonus = 1 + Math.min(BONUS_INSTRUCTEUR, ecart / 40);
              gagnerXp(c, skill, XP_ENTRAINEMENT * bonus);
              if (c.skills[skill] > av) {
                log({
                  type: 'progres',
                  texte: `${c.nom} progresse à l’entraînement : ${SKILLS[skill]} ${c.skills[skill]}.`,
                  discret: true,
                });
              }
            }
          } else {
            // On ne s'entraîne pas le ventre vide : la tâche retombe au repos.
            for (const c of paquet.gens) if (c.tache) delete c.tache;
            if (g.ordre.type === 'entrainement') g.ordre = { type: 'repos' };
            log({
              type: 'ordre',
              texte: `${g.nom} : plus de rations, entraînement interrompu.`,
              regionId: g.regionId,
              groupe: g.id,
            });
          }
          break;
        }
        case 'exploration':
          explorer(state, g, paquet.gens, log, ctx);
          break;
        case 'patrouille': {
          const f = state.world.regions[g.regionId].controle;
          if (f) reputation(state, f, 0.05);
          break;
        }
        default:
          break;
      }
    }
  }

  // --- Aléas et rencontres, pour ce groupe et là où il se trouve
  const exposition = travaille ? 1 : 0.35;
  tenterAlea(state, log, ctx, exposition, g);
  if (!state.fin) {
    let mult = ordre.type === 'patrouille' ? 2.4 : ordre.type === 'repos' ? 0.45 : 1;
    if (!travaille) mult *= 0.5; // camp de nuit, feu éteint
    // Un petit groupe se fait moins remarquer — et se défend moins bien.
    if (vivants.length <= 1) mult *= 0.7;
    tenterRencontre(state, log, ctx, mult, g);
  }

  // --- Soins et besoins, avec l'effort réellement fourni par chacun
  const effortMoyen = debout.length
    ? debout.reduce((s, c) => s + effortDe(tacheDe(g, c).type, nuit, forcee), 0) / debout.length
    : 0;
  const q = qualiteSoin(state, g, effortMoyen <= 0.05);
  utiliserMedkit(state, g, log, ctx);
  for (const c of g.membres) {
    const eff = estDebout(c) ? effortDe(tacheDe(g, c).type, nuit, forcee) : 0;
    const msgs = tickPerso(c, eff, rng,
      { soin: q, premiersSecours: debout.length > 0, abri: abriDe(state, g.regionId) });
    for (const m of msgs) {
      log({ type: m.type, texte: m.texte, important: m.type === 'mort', groupe: g.id });
      if (m.type === 'mort') {
        inscrireAuMemorial(state, c, 'mort en route', nomRegion(state.world, g.regionId));
      }
    }
  }

  // Bilan périodique : sans lui, une nuit de récolte ne laisse aucune trace
  // à l'écran et le jeu paraît ne rien faire.
  const bilan = g.bilan;
  if (bilan && state.temps - (bilan.depuis || 0) >= 6) {
    const lignes = Object.keys(bilan.res)
      .filter((k) => bilan.res[k] > 0)
      .sort((a, b) => bilan.res[b] - bilan.res[a])
      .map((k) => `${bilan.res[k]} ${COMMODITIES[k].nom.toLowerCase()}`);
    if (lignes.length) {
      log({
        type: 'recolte',
        texte: `${g.nom}, six heures de travail : ${lignes.join(', ')}.`,
        regionId: g.regionId,
        groupe: g.id,
      });
    }
    g.bilan = { res: {}, depuis: state.temps };
  }
}

// ---------------------------------------------------------------------------
// Tick de tous les groupes
// ---------------------------------------------------------------------------

/** Quelqu'un, quelque part, est-il encore en vie ? Sans allouer de tableau :
 *  c'est appelé deux fois par heure de jeu. */
function quelquUnDebout(state) {
  const gs = state.player.groupes;
  for (let i = 0; i < gs.length; i++) {
    const m = gs[i].membres;
    for (let j = 0; j < m.length; j++) if (estVivant(m[j])) return true;
  }
  return false;
}

function tickSquad(state, log, ctx) {
  if (!quelquUnDebout(state)) {
    if (!state.fin) {
      state.fin = 'extinction';
      log({ type: 'fin', texte: 'Plus personne. Fin de partie.', important: true });
    }
    return;
  }

  // Les chasseurs de prime cherchent le joueur, pas un groupe : un seul tirage
  // par heure, sinon leur fréquence serait multipliée par le nombre de groupes.
  tenterChasseurs(state, log, ctx);
  if (state.fin) return;

  // Index décroissant : un groupe peut disparaître en cours de tick (anéanti),
  // et parcourir à l'envers évite d'en copier la liste à chaque heure.
  const gs = state.player.groupes;
  for (let i = 0; i < gs.length; i++) {
    if (state.fin) break;
    tickGroupe(state, gs[i], log, ctx);
  }

  // Un groupe dont plus personne n'est vivant cesse d'exister, et ce qu'il
  // portait avec lui. Dire lesquels : perdre trente rations en silence, c'est
  // le genre de chose qu'on découvre trois heures plus tard.
  for (let i = gs.length - 1; i >= 0 && gs.length > 1; i--) {
    const g = gs[i];
    if (g.membres.some(estVivant)) continue;
    log({
      type: 'fin',
      texte: `${g.nom} a cessé d’exister en ${nomRegion(state.world, g.regionId)}. Tout ce que le groupe portait est perdu.`,
      important: true,
      regionId: g.regionId,
    });
    // Les morts sont déjà au mémorial : ils y ont été inscrits en tombant.
    retirerGroupe(state, g);
  }

  // La région se régénère lentement de la fouille
  for (const r of state.world.regions) {
    if (r.fouille > 0) r.fouille = Math.max(0, r.fouille - REPOUSSE);
  }

  // Fin de partie
  if (!quelquUnDebout(state) && !state.fin) {
    state.fin = 'extinction';
    log({ type: 'fin', texte: 'Plus personne. Fin de partie.', important: true });
  }
}

// ===== src/save.js ===================================================
// Sauvegarde locale. L'état est du JSON pur : pas de classes, pas de
// références circulaires, pas de fonctions. C'est ce qui rend possible à la
// fois la persistance navigateur et, plus tard, un envoi au serveur.


const CLE = 'cendres.save.v1';
/**
 * 2 : la carte est passée de 10×8 à 24×18.
 *
 * C'est la seule migration qu'on ne sait pas faire. Le reste du jeu se complète
 * à la volée dans `normaliser` — un système qui s'ajoute ne doit pas coûter sa
 * partie au joueur. Mais la taille de la carte est la clé qui traduit un indice
 * de région en coordonnées : la lire de travers ne dégrade pas une sauvegarde,
 * elle la rend fausse partout à la fois, silencieusement. On refuse donc les
 * parties d'avant, plutôt que de les ouvrir corrompues.
 */
const VERSION = 2;

function serialiser(state) {
  return JSON.stringify(state);
}

/**
 * Complète une sauvegarde plus ancienne que le code courant. Le jeu gagne des
 * systèmes au fil des versions ; effacer la partie du joueur à chaque ajout
 * serait la solution paresseuse.
 */
function normaliser(state) {
  const p = state.player;

  // Avant les groupes, l'escouade était un bloc unique posé sur `player`.
  // On la reconstitue en un premier groupe : une partie en cours ne se jette
  // pas parce que le moteur a appris à en tenir plusieurs.
  if (!p.groupes) {
    const g = groupeVide('g0', 'Convoi', p.regionId || 0, state.temps);
    g.membres = p.squad || [];
    g.ordre = p.ordre || { type: 'repos' };
    g.inventaire = Object.assign(g.inventaire, p.inventaire || {});
    g.objets = p.objets || [];
    g.reste = p.reste || {};
    g.bilan = p.bilan || { res: {}, depuis: state.temps };
    g.cohesion = p.cohesion === undefined ? 55 : p.cohesion;
    p.groupes = [g];
    p.groupeActif = g.id;
    delete p.squad; delete p.ordre; delete p.inventaire; delete p.objets;
    delete p.regionId; delete p.reste; delete p.bilan; delete p.cohesion;
    delete p.recolteHeure; delete p.nuit;
  }
  for (const g of p.groupes) {
    if (!g.reste) g.reste = {};
    if (!g.objets) g.objets = [];
    // Avant les bêtes de somme, on portait tout sur le dos.
    if (!g.betes) g.betes = [];
    if (!g.bilan) g.bilan = { res: {}, depuis: state.temps };
    if (g.cohesion === undefined) g.cohesion = 55;
    if (!g.ordre) g.ordre = { type: 'repos' };
    // Avant l'allure, toute route était une marche forcée — et personne ne
    // dormait jamais en voyage. On rend leurs nuits aux parties en cours.
    if (g.ordre.type === 'voyage' && !g.ordre.allure) g.ordre.allure = 'normale';
    if (!g.membres) g.membres = [];
  }
  if (!p.groupeActif || !p.groupes.some((g) => g.id === p.groupeActif)) {
    p.groupeActif = p.groupes.length ? p.groupes[0].id : null;
  }

  // Avant la connaissance imparfaite, tout était su en permanence. On repart
  // d'une ardoise vide : le premier tick relève ce qu'on a sous les yeux, et le
  // reste de la carte redevient un souvenir à rafraîchir.
  if (!state.connaissance) state.connaissance = creerConnaissance(state.temps);

  // Avant les tactiques, on subissait le combat sans rien en décider.
  if (!p.tactique) p.tactique = 'ligne';
  if (p.politique && p.politique.viserChefs === undefined) p.politique.viserChefs = false;
  if (!p.contrats) p.contrats = [];
  if (!p.primes) p.primes = {};
  // Avant, l'engagement appartenait au joueur : un seul pour toute la partie.
  // Il appartient désormais à la colonne qui l'a signé, ce qui permet d'en
  // envoyer une servir pendant qu'une autre bâtit. On le remet à la première.
  if (p.allegeance) {
    const premier = p.groupes[0];
    if (premier && !premier.allegeance) premier.allegeance = p.allegeance;
    delete p.allegeance;
  }
  for (const g of p.groupes) {
    if (g.allegeance === undefined) g.allegeance = null;
    if (!g.allegeance) continue;
    if (g.allegeance.intendance === undefined) g.allegeance.intendance = state.temps;
    if (g.allegeance.manques === undefined) g.allegeance.manques = 0;
    // Avant les prérogatives, un gradé demandait ; il n'avait donc rien à
    // assumer. Désormais il ordonne, et ce qu'il ordonne s'inscrit.
    if (!g.allegeance.actes) g.allegeance.actes = [];
    if (g.allegeance.fautes === undefined) g.allegeance.fautes = 0;
    // Avant les secteurs, un gradé n'avait rien à tenir entre deux guerres.
    if (g.allegeance.secteur === undefined) g.allegeance.secteur = null;
  }
  if (!state.memorial) state.memorial = [];
  if (!state.stats) state.stats = {};
  for (const k of ['contratsRemplis', 'sitesFouilles', 'caravanesPillees', 'distanceParcourue', 'servicesRendus']) {
    if (state.stats[k] === undefined) state.stats[k] = 0;
  }
  const w = state.world;
  if (!w.caravanes) w.caravanes = [];
  // Avant les dirigeants, les factions décidaient comme des moyennes. Le
  // premier tick leur donne quelqu'un à leur tête.
  for (const k of Object.keys(w.factions || {})) {
    if (w.factions[k].dirigeant === undefined) w.factions[k].dirigeant = null;
    // Avant les lois, une faction n'avait ni justice, ni impôt, ni interdit.
    if (w.factions[k].lois === undefined) w.factions[k].lois = null;
    // Les consignes portées au conseil ont disparu avec les requêtes : un
    // gradé n'oriente plus une décision, il la prend.
    if (w.factions[k].consigne !== undefined) delete w.factions[k].consigne;
  }
  if (!w.meteo) w.meteo = { type: 'couvert', restant: 4 };
  for (const r of w.regions) {
    // Les routes d'avant les secteurs : sûres par défaut, elles se dégraderont
    // toutes seules si personne ne les tient.
    if (r.insecurite === undefined) r.insecurite = 0;
    // Avant les pistes, on traversait une friche vierge à chaque passage.
    if (r.piste === undefined) r.piste = 0;
  }
  for (const c of w.colonies) {
    if (c.declin === undefined) c.declin = 0;
    if (c.prises === undefined) c.prises = 0;
    // Les métiers d'une ville d'avant : le premier tick les répartira.
    if (c.emplois === undefined) c.emplois = null;
    // Les gens qui comptent : le premier tick pourvoit les charges.
    if (!c.notables) c.notables = [];
    // Avant le banc de recrutement, on tirait un inconnu au sort en payant
    // d'avance. Le premier passage en ville en garnit un.
    if (c.banc === undefined) c.banc = null;
    // Avant la justice, une ville n'enfermait personne.
    if (c.geole === undefined) c.geole = null;
    // Avant les services, ces gens n'attendaient rien et ne retenaient rien.
    for (const p2 of c.notables) {
      if (p2.demande === undefined) p2.demande = null;
      if (!p2.memoire) p2.memoire = [];
    }
  }
  for (const g of p.groupes) {
    // Avant la justice, on ne faisait pas de prisonniers.
    if (!g.prisonniers) g.prisonniers = [];
    for (const c of g.membres) {
      if (!c.traits) c.traits = [];
      if (!c.liens) c.liens = {};
      if (!c.diplomes) c.diplomes = [];
      if (c.horsCombat === undefined) c.horsCombat = c.kills || 0;
      if (c.formation === undefined) c.formation = null;
      if (c.enseigne === undefined) delete c.enseigne;
    }
  }
  const b = state.base;
  if (b) {
    if (b.pop === undefined) b.pop = 0;
    if (b.moral === undefined) b.moral = 60;
    // Avant, un entrepôt plein jetait la production sans rien dire.
    if (b.gaspille === undefined) b.gaspille = 0;
    // Avant, personne ne se mettait au travail sans qu'on le lui dise.
    if (b.autoEmploi === undefined) b.autoEmploi = true;
    // Avant, un avant-poste n'existait pas sur la carte du monde.
    if (b.colonieId === undefined) b.colonieId = null;
    // Avant, une ville reconnue n'avait toujours pas de marché.
    if (b.commerce === undefined) b.commerce = true;
    if (b.dernierMarchand === undefined) b.dernierMarchand = -9999;
    if (b.majVitrine === undefined) b.majVitrine = -999;
    if (b.majEmploi === undefined) b.majEmploi = -999;
    if (b.gaspilleJour === undefined) b.gaspilleJour = 0;
    if (b.dernierGaspillage === undefined) b.dernierGaspillage = -999;
    // Avant les métiers, les habitants étaient un multiplicateur anonyme : on
    // les laisse manœuvres, le joueur les affectera s'il le veut.
    if (!b.postes) b.postes = {};
  }
  if (state.stats.ordresRemplis === undefined) state.stats.ordresRemplis = 0;
  return state;
}

function deserialiser(txt) {
  const state = JSON.parse(txt);
  if (!state || state.version !== VERSION) {
    throw new Error('Sauvegarde incompatible.');
  }
  return normaliser(state);
}

/**
 * Y a-t-il une sauvegarde qu'on ne sait plus lire ? L'écran d'accueil doit le
 * dire : proposer « Reprendre » sur un bouton qui ne reprend rien est la pire
 * des réponses.
 */
function sauvegardePerimee() {
  const s = stockage();
  if (!s) return false;
  const txt = s.getItem(CLE);
  if (!txt) return false;
  try {
    const brut = JSON.parse(txt);
    return !!brut && brut.version !== VERSION;
  } catch (e) {
    return true;
  }
}

function stockage() {
  try {
    if (typeof localStorage !== 'undefined') return localStorage;
  } catch (e) {
    // Mode privé, quota, iframe verrouillée…
  }
  return null;
}

function sauvegarder(state) {
  const s = stockage();
  if (!s) return { ok: false, motif: 'Stockage local indisponible.' };
  try {
    s.setItem(CLE, serialiser(state));
    return { ok: true };
  } catch (e) {
    return { ok: false, motif: 'Écriture impossible (quota ?).' };
  }
}

function charger() {
  const s = stockage();
  if (!s) return null;
  const txt = s.getItem(CLE);
  if (!txt) return null;
  try {
    return deserialiser(txt);
  } catch (e) {
    return null;
  }
}

function effacer() {
  const s = stockage();
  if (s) s.removeItem(CLE);
}

function existeSauvegarde() {
  const s = stockage();
  return !!(s && s.getItem(CLE));
}

// ===== src/sim.js ====================================================
// Orchestration : création de partie, tick horaire, rattrapage du temps passé
// hors ligne. `state.world` est la moitié partagée de l'état (celle qui vivrait
// côté serveur en multijoueur), `state.player` / `state.base` la moitié privée.


/** Durée réelle d'une heure de jeu, à vitesse ×1. */
const TICK_MS = 10000;
/** Plafond de rattrapage hors ligne, en heures de jeu (environ deux ans). */
const RATTRAPAGE_MAX = 17000;

const VITESSES = [1, 4, 16, 60];

/**
 * Tranche d'heures traitée d'un coup pour une colonie. Les colonies avancent
 * par tourniquet plutôt que toutes ensemble à chaque heure : le coût du tick
 * chute d'autant, et l'économie d'une ville n'a pas besoin d'être résolue à
 * l'heure près. Les probabilités sont converties en conséquence — voir `surDt`
 * dans economy.js.
 *
 * Trois, pas quatre : le banc a montré qu'à quatre les stocks des villes
 * fluctuent par paliers assez gros pour que le joueur ne trouve plus toujours de
 * quoi se ravitailler, et la survie tombe de 42 à 31 sur soixante parties. Le
 * gain de performance ne valait pas ça.
 *
 * Ça, c'est près du joueur. Loin, c'est autre chose — voir PAS_LOIN.
 */
const PAS_COLONIE = 3;

/**
 * Niveau de détail. La carte compte cinquante-quatre villes ; les traiter toutes
 * au pas fin coûterait trois fois le budget d'un tick entier, pour simuler avec
 * une précision horaire des greniers que le joueur ne verra pas de la partie.
 *
 * Une ville proche garde donc le pas fin — c'est là que le joueur achète, vend
 * et regarde les stocks. Au-delà, elle avance par journées. Rien n'est perdu :
 * chaque ville retient l'heure de son dernier passage et rattrape exactement ce
 * qui lui est dû, de sorte que changer de niveau de détail en cours de route
 * (le joueur s'approche, le joueur s'éloigne) ne fabrique ni ne détruit une
 * seule heure de production. Les probabilités, elles, passent par `surDt` :
 * une sécession reste aussi probable sur vingt-quatre heures d'un bloc que sur
 * vingt-quatre heures découpées.
 *
 * Vingt-quatre et non douze : la valeur est calée pour que le nombre de villes
 * traitées par heure reste celui d'avant l'agrandissement — environ cinq —,
 * quelle que soit la taille de la carte.
 */
const PAS_LOIN = 24;
/** En deçà de cette distance d'un groupe ou de l'avant-poste, on regarde de près. */
const RAYON_DETAIL = 4;
/** On démarre déjà accéléré : à ×1 il ne se passe visiblement rien. */
const VITESSE_DEFAUT = 4;

// ---------------------------------------------------------------------------
// Création
// ---------------------------------------------------------------------------

function nouvellePartie(seed, opts = {}) {
  const rng = new Rng(seed);
  const world = genererMonde(rng);

  // On démarre chez les Communes Libres si elles existent : le moins hostile.
  let depart = null;
  const libres = world.colonies.filter((c) => c.faction === 'libres');
  if (libres.length) depart = rng.pick(libres);
  else depart = rng.pick(world.colonies);

  // On part équipé : sans armure, la première bande de pillards venue
  // liquide l'escouade avant qu'elle ait appris quoi que ce soit.
  const premier = groupeVide(idDepuisRng(rng, 'g'), 'Convoi', depart.regionId, 0);
  const depart2 = [
    { archetype: 'ferrailleur', arme: 'machette', armure: 'cuir' },
    { archetype: 'chasseur', arme: 'clous', armure: 'cuir' },
    { archetype: 'medic', arme: 'barre', armure: 'cuir' },
  ];
  for (const d of depart2) premier.membres.push(makeCharacter(rng, d));
  premier.inventaire.rations = 45;
  premier.inventaire.ferraille = 20;
  premier.inventaire.medkit = 2;
  premier.objets = ['machette', 'cuir'];

  const reputation = {};
  for (const k of DIPLO_FACTIONS) reputation[k] = 0;
  reputation[depart.faction] = 12;

  const state = {
    version: VERSION,
    seed,
    rngState: rng.save(),
    temps: 0,
    vitesse: VITESSE_DEFAUT,
    dernierReel: opts.maintenant ?? 0,
    nom: opts.nom || 'Convoi sans nom',
    world,
    player: {
      credits: 450,
      // Les gens et ce qu'ils portent vivent dans les groupes ; le reste, ici.
      groupes: [premier],
      groupeActif: premier.id,
      reputation,
      posture: 'neutre',
      // Comment on se bat quand ça tombe dessus. Voir TACTIQUES dans combat.js :
      // une tactique n'est pas un bonus, c'est un pari sur le terrain, le
      // nombre et les armes qu'on porte.
      tactique: 'ligne',
      politique: {
        recruter: true,
        commercer: true,
        payerPeage: true,
        achever: false,
        viserChefs: false,
      },
      contrats: [],
      primes: {},
    },
    base: creerBase(),
    journal: [],
    nonLus: 0,
    stats: {
      ticks: 0,
      combats: 0,
      combatsGagnes: 0,
      defaites: 0,
      recolte: 0,
      creditsGagnes: 0,
      contratsRemplis: 0,
      sitesFouilles: 0,
      distanceParcourue: 0,
      caravanesPillees: 0,
      servicesRendus: 0,
      ordresRemplis: 0,
    },
    memorial: [],
    // Ce que le joueur sait du monde, par opposition à ce qui est.
    connaissance: creerConnaissance(0),
    fin: null,
  };
  world.caravanes = [];

  // Les métiers des villes se posent une fois les factions attribuées : la
  // vocation d'un bourg tient à son biome autant qu'à qui le tient. Les charges
  // se pourvoient dans la foulée — une ville a un chef et un armurier dès le
  // premier jour, pas au bout de trois heures de jeu.
  for (const col of world.colonies) {
    col.emplois = emploisInitiaux(world, col, rng);
    pourvoirCharges(col, rng, 0);
  }
  // Et chaque faction a quelqu'un à sa tête dès le premier jour — sauf l'Essaim,
  // qui n'a pas de politique : il déferle. On pose quand même la clé, sinon
  // recharger une partie l'ajoute et l'aller-retour JSON n'est plus exact.
  for (const k of Object.keys(world.factions)) {
    world.factions[k].dirigeant = k === 'essaim' ? null : creerDirigeant(rng, k, 0);
  }

  decouvrir(world, depart.regionId, 2);
  observer(state);
  tickClimat(world, 0, rng);
  rafraichirPanneaux(state, rng, 0);
  for (const col of world.colonies) etalDe(world, col, rng, 0);
  state.rngState = rng.save();
  const log = creerLogger(state);
  log({
    type: 'debut',
    texte: `Le convoi s’arrête à ${depart.nom}. Trois bouches à nourrir, 450 crédits, et un monde qui ne demande rien à personne.`,
    important: true,
    regionId: depart.regionId,
  });
  return state;
}

// ---------------------------------------------------------------------------
// Tick
// ---------------------------------------------------------------------------

/** Les régions depuis lesquelles le joueur regarde : ses groupes et sa base. */
function regardsDuJoueur(state) {
  const out = [];
  for (const g of state.player.groupes) {
    if (g.membres.length) out.push(g.regionId);
  }
  if (state.base && state.base.fonde) out.push(state.base.regionId);
  return out;
}

/**
 * La maille de simulation d'une ville : fine près du joueur, large ailleurs.
 * Le décalage par indice évite que toutes les villes lointaines tombent sur la
 * même heure — sinon le tick ferait un pic toutes les douze heures au lieu d'un
 * coût plat.
 */
function pasColonie(yeux, col, i) {
  for (const rid of yeux) {
    if (distance(rid, col.regionId) <= RAYON_DETAIL) return PAS_COLONIE;
  }
  return PAS_LOIN + (i % 5); // 24 à 28 : de quoi étaler la charge sur l'heure
}

/** Fait passer une heure de jeu. */
function tick(state) {
  const rng = new Rng(state.rngState);
  const ctx = { rng };
  // Tant que le joueur tient la charge de Commandeur quelque part, le conseil
  // de cette faction ne légifère pas : c'est ce que veut dire avoir la charge.
  // Voir `legiferer` dans factions.js.
  for (const g of state.player.groupes) {
    const all = g.allegeance;
    if (all && rangDe(all).index >= 4) { ctx.legislateur = all.faction; break; }
  }
  // Le banc peut geler la législation pour la mesurer par différence.
  if (state.sansLois) ctx.sansLois = true;
  // Ce qu'il faut faire si une colonne prend l'avant-poste du joueur : le
  // monde ne connaît que sa vitrine, il ne saurait pas démonter le camp.
  ctx.perdreAvantPoste = () => perdreAvantPoste(state, log);
  const log = creerLogger(state);

  state.temps += 1;
  state.stats.ticks += 1;

  // Le climat d'abord : tout le reste s'y adosse.
  const changement = tickClimat(state.world, state.temps, rng);
  if (changement) log(changement);
  const climat = conditions(state.world, state.temps);
  ctx.climat = climat;

  // Passage de saison : ça se remarque.
  const sPrec = saison(state.temps - 1);
  if (sPrec.key !== climat.saison.key) {
    log({
      type: 'saison',
      texte: `${climat.saison.def.nom}. ${climat.saison.def.texte}`,
      important: true,
    });
  }

  // Le monde ensuite. Chaque ville rattrape ce qui lui est dû depuis son dernier
  // passage, à la maille que sa distance justifie. C'est 62 % du coût du tick,
  // et rien ne s'en voit en jeu.
  const yeux = regardsDuJoueur(state);
  for (let i = 0; i < state.world.colonies.length; i++) {
    const col = state.world.colonies[i];
    const du = state.temps - (col.vuA || 0);
    // Aucune maille n'est plus fine que PAS_COLONIE : sous ce seuil, inutile
    // d'aller calculer la distance au joueur. C'est ce test-là qui rend la
    // boucle sur cinquante-quatre villes gratuite les trois quarts du temps.
    if (du < PAS_COLONIE) continue;
    // Décalage par indice : sans ça les villes lointaines tomberaient toutes
    // sur la même heure et le tick ferait des pics toutes les douze heures.
    const pas = pasColonie(yeux, col, i);
    if (du < pas) continue;
    col.vuA = state.temps;
    // La réputation locale infléchit ce que les gens d'ici pensent de vous.
    const rep = (col.faction && state.player.reputation[col.faction]) || 0;
    // Être là change ce qu'on entend : une demande qu'on n'a pas entendue ne
    // peut pas se retourner contre nous. Voir tickServices.
    // `yeux` contient aussi la région de l'avant-poste, mais on ne fonde jamais
    // un avant-poste sur une ville : pour une colonie, c'est bien « un groupe
    // est ici ».
    const present = yeux.includes(col.regionId);
    // Le banc de recrutement ne se garnit que là où l'on est. Le tenir à jour
    // dans les quatre-vingt-six villes, ce serait deux cents personnages
    // inventés pour rien dans chaque sauvegarde.
    if (present) bancDe(state, col, rng, state.temps);
    else if (col.banc) col.banc = null;
    // La vitrine d'un avant-poste n'a pas d'économie propre : sa vérité est
    // dans `state.base`, et la simuler ici la ferait vivre deux fois.
    if (col.avantPoste) { col.vuA = state.temps; continue; }
    // La geôle : on nourrit les détenus, on relâche ceux qui ont fait leur
    // temps, et une geôle qui déborde fait gronder la ville.
    tickGeole(state, col, du);
    // Ce que la loi fait à l'humeur : on ne pend pas vite sans que la ville
    // s'en ressente, et on ne relâche pas non plus sans que ça se voie.
    tickOrdrePublic(state, col, du);
    const ev = tickColonie(state.world, col, rng, climat, du, rep, log, state.temps, present);
    if (!ev) continue;
    if (ev.evenement === 'croissance') {
      log({
        type: 'croissance',
        texte: `${col.nom} s’agrandit : la ville passe au rang ${col.taille}.`,
        regionId: col.regionId,
        important: true,
      });
    } else if (ev.evenement === 'revolte') {
      const ancienne = col.faction;
      const r = faireRevolte(state.world, col, rng, state.temps);
      // Une émeute laisse les pistes du coin dans un état déplorable : des
      // gens armés qui n'ont plus rien à perdre, et personne pour les tenir.
      const reg = state.world.regions[col.regionId];
      reg.insecurite = Math.min(1, (reg.insecurite || 0) + 0.25);
      if (r.issue === 'matee') {
        // Une émeute matée à l'autre bout de la carte n'est pas une nouvelle :
        // c'est un fait divers local. On ne l'apprend que si l'on a quelqu'un
        // dans le secteur — même règle que pour tout le reste de la carte.
        if (estSurveillee(state, col.regionId)) {
          log({
            type: 'revolte',
            texte: `${col.nom} se soulève. La garnison tient la place`
              + `${r.liberes ? `, mais la geôle s’est vidée (${r.liberes} évadés)` : ''}.`
              + ` On comptera les morts demain.`,
            regionId: col.regionId,
            important: true,
            factions: [ancienne].filter(Boolean),
          });
        }
      } else if (r.issue === 'secession') {
        crediterDirigeant(state.world, ancienne, 'perte');
        log({
          type: 'revolte',
          texte: `${col.nom} se soulève et chasse ${FACTIONS[ancienne].nom}. `
            + `La ville revient ${FACTIONS[r.rendue].datif}.`,
          regionId: col.regionId,
          important: true,
          factions: [ancienne, r.rendue].filter(Boolean),
        });
      } else {
        crediterDirigeant(state.world, ancienne, 'perte');
        log({
          type: 'revolte',
          texte: `${col.nom} se soulève et se donne à personne. Plus de drapeau, `
            + `plus de loi, et l’on y vendra bientôt n’importe quoi.`,
          regionId: col.regionId,
          important: true,
          factions: [ancienne].filter(Boolean),
        });
      }
    } else if (ev.evenement === 'secession') {
      const r = faireSecession(state.world, col);
      log({
        type: 'secession',
        texte: r.renaissance
          ? `${col.nom} se soulève : ${FACTIONS[r.rendue].nom} renaît de ses cendres.`
          : `${col.nom} chasse ${FACTIONS[r.ancienne].nom} et rejoint ${FACTIONS[r.rendue].nom}.`,
        regionId: col.regionId,
        important: true,
      });
    } else if (ev.evenement === 'effondrement') {
      const ancienne = effondrer(state.world, col);
      log({
        type: 'effondrement',
        texte: `${col.nom} est abandonnée${ancienne ? ` par ${FACTIONS[ancienne].nom}` : ''}. Il n’en reste que des ruines.`,
        regionId: col.regionId,
        important: true,
      });
    }
  }
  tickFactions(state.world, state.temps, log, ctx);
  tickCaravanes(state, log, ctx);

  // Panneaux d'affichage et étals se renouvellent de loin en loin.
  if (state.temps % 40 === 0) {
    rafraichirPanneaux(state, rng, state.temps);
    for (const col of state.world.colonies) {
      if (!col.ruine) etalDe(state.world, col, rng, state.temps, palierBonus(state, col.faction));
    }
  }

  // Puis l'avant-poste et l'escouade.
  tickBase(state, log, ctx);
  if (!state.fin) tickSquad(state, log, ctx);
  if (!state.fin) tickContrats(state, log, ctx);
  if (!state.fin) tickAllegeance(state, log, ctx);
  // Ce dont un gradé répond tous les jours, guerre ou pas : l'état de ses
  // routes. Avant le jugement, qui lit le bilan qu'il vient d'écrire.
  if (!state.fin) tickSecteurs(state, log, ctx);
  // On rend des comptes de ce qu'on a ordonné : d'abord l'issue des actes, puis
  // la charge elle-même, qu'on perd quand le crédit est épuisé.
  if (!state.fin) jugerActes(state, log);
  if (!state.fin) tickCharges(state, log);
  if (!state.fin) tickFormation(state, log);

  // En dernier : on relève ce qu'on a sous les yeux, après que tout a bougé.
  observer(state);

  state.rngState = rng.save();
  return state;
}

/** Enchaîne `n` heures. Retourne le nombre de ticks réellement joués. */
function avancer(state, n) {
  let joues = 0;
  for (let i = 0; i < n; i++) {
    if (state.fin) break;
    tick(state);
    joues++;
  }
  return joues;
}

/**
 * Ce que le temps réel écoulé nous doit, sans rien appliquer.
 * Retourne { ticks, tronque, pas } — `tronque` si on a tapé le plafond.
 */
function rattrapageDu(state, maintenantMs) {
  const pas = TICK_MS / (state.vitesse || 1);
  if (!state.dernierReel) return { ticks: 0, tronque: false, pas };
  const ecoule = Math.max(0, maintenantMs - state.dernierReel);
  let ticks = Math.floor(ecoule / pas);
  const tronque = ticks > RATTRAPAGE_MAX;
  if (tronque) ticks = RATTRAPAGE_MAX;
  return { ticks, tronque, pas };
}

/**
 * Rattrapage : applique le temps réel écoulé depuis la dernière session.
 * Retourne { ticks, tronque }.
 */
function rattraper(state, maintenantMs) {
  if (!state.dernierReel) {
    state.dernierReel = maintenantMs;
    return { ticks: 0, tronque: false };
  }
  const { ticks, tronque, pas } = rattrapageDu(state, maintenantMs);
  const joues = avancer(state, ticks);
  // On garde le reste pour ne pas perdre les fractions d'heure
  state.dernierReel += ticks * pas;
  if (tronque) state.dernierReel = maintenantMs;
  return { ticks: joues, tronque };
}

/**
 * Même rattrapage, mais découpé en tranches que l'appelant fait avancer une par
 * une. Deux ans hors ligne, c'est dix-sept mille heures : les jouer d'un bloc
 * fige l'onglet une seconde ou deux, sur un téléphone bien davantage. Ici
 * l'interface garde la main entre deux tranches et peut afficher où on en est.
 *
 * `state.dernierReel` avance tranche par tranche : si la page est fermée en
 * cours de route, ce qui a déjà été joué n'est pas rejoué au retour.
 */
function rattrapageEtale(state, maintenantMs, tranche = 200) {
  if (!state.dernierReel) {
    state.dernierReel = maintenantMs;
    return { total: 0, tronque: false, faits: () => 0, pas: () => false };
  }
  const plan = rattrapageDu(state, maintenantMs);
  let faits = 0;
  const finir = () => {
    if (plan.tronque) state.dernierReel = maintenantMs;
  };
  if (plan.ticks === 0) {
    return { total: 0, tronque: plan.tronque, faits: () => 0, pas: () => false };
  }
  return {
    total: plan.ticks,
    tronque: plan.tronque,
    faits: () => faits,
    /** Joue la tranche suivante. Retourne true tant qu'il reste du travail. */
    pas(n = tranche) {
      const voulu = Math.min(Math.max(1, n | 0), plan.ticks - faits);
      const joues = avancer(state, voulu);
      faits += joues;
      state.dernierReel += joues * plan.pas;
      // `joues < voulu` : la partie s'est terminée en route, plus rien à jouer.
      if (faits >= plan.ticks || joues < voulu) {
        finir();
        return false;
      }
      return true;
    },
  };
}

// ---------------------------------------------------------------------------
// Lecture du temps
// ---------------------------------------------------------------------------

function horloge(t) {
  const jour = Math.floor(t / 24) + 1;
  const heure = t % 24;
  return { jour, heure, texte: `J${jour} ${String(heure).padStart(2, '0')}:00` };
}

function resumeMonde(state) {
  const w = state.world;
  return {
    guerres: w.guerres.map((g) => ({
      a: FACTIONS[g.a].nom,
      b: FACTIONS[g.b].nom,
      depuis: g.depuis,
      batailles: g.batailles,
    })),
    armees: w.armees.map((a) => ({
      faction: FACTIONS[a.faction].nom,
      couleur: FACTIONS[a.faction].couleur,
      force: a.force,
      etat: a.etat,
      lieu: nomRegion(w, a.regionId),
      cible: a.cible ? (colonieParId(w, a.cible) || {}).nom : null,
    })),
  };
}

// ===== src/ui.js =====================================================
// Interface : rendu HTML + carte pixel sur canvas. C'est le SEUL module qui
// touche au DOM — tout le reste du dossier src/ tourne aussi bien sous Node.


// ---------------------------------------------------------------------------
// État local de l'interface
// ---------------------------------------------------------------------------

let S = null;
let ACTIONS = {};
let onglet = 'carte';
let selection = null;
let ouverts = new Set();
let filtreJournal = 'tout';
let modale = null;
let dernierRendu = -1;
let dernierRenduMs = 0;
let derniereInteraction = 0;
let toastTimer = null;
/** Cases cochées dans le panneau « Détacher » — purement d'interface. */
let detaches = new Set();

/** Cadence minimale entre deux reconstructions complètes de l'écran (ms). */
const RENDU_MIN_MS = 600;
/** Après un geste de l'utilisateur, on laisse le DOM tranquille un instant. */
const REPIT_APRES_CLIC_MS = 400;

const $ = (sel) => document.querySelector(sel);

/**
 * Le groupe que l'écran montre. Presque tout l'affichage est relatif à lui :
 * la carte, le sac, l'étal, l'avant-poste. Changer de groupe change de point
 * de vue, pas de partie.
 */
const G = () => groupeActif(S);

function attacherEtat(state) {
  S = state;
  selection = state ? groupeActif(state).regionId : null;
}

function monterUI(api) {
  ACTIONS = api;
  $('#ecran').addEventListener('click', surClic);
  $('#barre-nav').addEventListener('click', surClic);
  $('#barre-haut').addEventListener('click', surClic);
  $('#modale').addEventListener('click', surClic);
  document.addEventListener('toggle', (ev) => {
    const d = ev.target.closest('details[data-id]');
    if (!d) return;
    if (d.open) ouverts.add(d.dataset.id);
    else ouverts.delete(d.dataset.id);
  }, true);
}

// ---------------------------------------------------------------------------
// Utilitaires
// ---------------------------------------------------------------------------

function e(s) {
  return String(s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function n(v, dec = 0) {
  if (!Number.isFinite(v)) return '—';
  return v.toLocaleString('fr-FR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}

function jauge(pct, cls = '', couleur) {
  const p = Math.max(0, Math.min(100, pct * 100));
  const st = `width:${p.toFixed(0)}%` + (couleur ? `;background:${couleur}` : '');
  return `<div class="jauge ${cls}"><i style="${st}"></i></div>`;
}

function toast(msg, err) {
  const vieux = document.querySelector('.toast');
  if (vieux) vieux.remove();
  const d = document.createElement('div');
  d.className = 'toast' + (err ? ' err' : '');
  d.textContent = msg;
  document.body.appendChild(d);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => d.remove(), 2600);
}

function logger() {
  return creerLogger(S);
}

function coutTexte(cout) {
  return Object.keys(cout)
    .map((k) => `${n(cout[k])} ${k === 'credits' ? 'cr' : COMMODITIES[k].nom.toLowerCase()}`)
    .join(' · ');
}

function dureeTexte(h) {
  if (h < 24) return `${Math.ceil(h)} h`;
  const j = Math.floor(h / 24);
  const r = Math.ceil(h % 24);
  return r ? `${j} j ${r} h` : `${j} j`;
}

function couleurFaction(k) {
  return (FACTIONS[k] && FACTIONS[k].couleur) || '#7b8699';
}

// ---------------------------------------------------------------------------
// Rendu principal
// ---------------------------------------------------------------------------

function rafraichir(force) {
  if (!S) { rendreAccueil(); return; }
  const maintenant = (typeof performance !== 'undefined' ? performance.now() : Date.now());
  if (!force) {
    if (S.temps === dernierRendu) return;
    // On reconstruit tout l'écran d'un bloc : à vitesse ×16 cela arriverait
    // plusieurs fois par seconde et pourrait avaler le geste de l'utilisateur.
    if (maintenant - dernierRenduMs < RENDU_MIN_MS) return;
    if (maintenant - derniereInteraction < REPIT_APRES_CLIC_MS) return;
  }
  dernierRendu = S.temps;
  dernierRenduMs = maintenant;

  const ecran = $('#ecran');
  const scroll = ecran.scrollTop;

  rendreBarreHaut();
  rendreNav();

  switch (onglet) {
    case 'carte': ecran.innerHTML = ecranCarte(); break;
    case 'escouade': ecran.innerHTML = ecranEscouade(); break;
    case 'base': ecran.innerHTML = ecranBase(); break;
    case 'contrats': ecran.innerHTML = ecranContrats(); break;
    case 'monde': ecran.innerHTML = ecranMonde(); break;
    case 'journal': ecran.innerHTML = ecranJournal(); break;
    default: ecran.innerHTML = ecranCarte();
  }
  ecran.scrollTop = scroll;

  const cv = $('#carte');
  if (cv) {
    dessinerCarte(cv);
    if (cv.parentElement) lierGestesCarte(cv.parentElement);
    centrerCarte(cv);
  }
  if (modale) rendreModale();
}
