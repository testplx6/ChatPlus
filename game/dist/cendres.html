  const d = dirigeant(world, key);
  if (!d) return;
  if (quoi === 'prise') { d.prises += n; d.legitimite = Math.min(100, d.legitimite + 9 * n); }
  else if (quoi === 'perte') { d.pertes += n; d.legitimite = Math.max(0, d.legitimite - 13 * n); }
  else if (quoi === 'guerre') { d.guerres += n; }
  else if (quoi === 'paix') { d.legitimite = Math.max(0, d.legitimite - 3 * n); }
  else if (quoi === 'fondation') { d.legitimite = Math.min(100, d.legitimite + 6 * n); }
}

// ---------------------------------------------------------------------------
// Buts de guerre
// ---------------------------------------------------------------------------

/**
 * Une guerre déclarée sans objet ne peut ni être gagnée ni être perdue : elle
 * s'arrête quand elle coûte trop cher, ce qui donne une chronique illisible.
 * On lui donne donc une raison, tirée du tempérament de celui qui la déclare —
 * et cette raison décide de quand elle s'arrête.
 */
function butDeGuerre(world, a, b, rng, cible) {
  const d = dirigeant(world, a);
  const temp = d ? d.temperament : 'methodique';
  if (temp === 'rancunier') {
    return { type: 'punition', texte: 'pour solde de tout compte', batailles: rng.irange(2, 4) };
  }
  if (temp === 'conquerant' || temp === 'rapace') {
    return cible
      ? { type: 'conquete', villeId: cible.id, texte: `pour prendre ${cible.nom}` }
      : { type: 'conquete', texte: 'pour s’étendre' };
  }
  if (temp === 'batisseur' || temp === 'prudent' || temp === 'conciliateur') {
    return { type: 'frontiere', texte: 'pour desserrer l’étau', batailles: rng.irange(1, 3) };
  }
  return { type: 'butin', texte: 'pour ce qu’il y a à prendre', batailles: rng.irange(2, 5) };
}

/**
 * Le but est-il atteint — ou devenu hors d'atteinte ? Retourne 'atteint',
 * 'perdu', ou null si la guerre a encore une raison de durer.
 */
function etatDuBut(world, guerre, key) {
  const but = guerre.but;
  if (!but) return null;
  if (but.type === 'abolition') {
    // Une guerre faite au régime d'en face se gagne le jour où il change, pas
    // quand on a fini de compter les morts.
    const autre = guerre.a === key ? guerre.b : guerre.a;
    if (!loisDe(world, autre).esclavage) return 'atteint';
  }
  if (but.type === 'conquete' && but.villeId) {
    const ville = world.colonies.find((c) => c.id === but.villeId);
    if (!ville || ville.ruine) return 'perdu';
    if (ville.faction === key) return 'atteint';
    return null;
  }
  if (but.batailles && guerre.batailles >= but.batailles) return 'atteint';
  return null;
}

// ---------------------------------------------------------------------------
// Tick
// ---------------------------------------------------------------------------

/**
 * On vieillit, on s'use, et on finit par être remplacé — de vieillesse ou parce
 * qu'on a perdu trop de villes. Le successeur n'a pas forcément le même
 * tempérament : c'est ainsi qu'une faction pacifique se réveille conquérante.
 */
function tickDirigeant(world, key, rng, dt, t, log, grogne = 0) {
  const f = world.factions[key];
  if (!f) return;
  if (!f.dirigeant) { f.dirigeant = creerDirigeant(rng, key, t); return; }
  const d = f.dirigeant;
  // Une année de jeu, c'est quatre saisons de trente jours — pas 360 jours.
  // L'erreur faisait vieillir les chefs trois fois trop lentement, donc aucun
  // ne cédait jamais sa place, donc la politique ne changeait jamais de visage.
  d.age += dt / HEURES_PAR_AN;

  // Gouverner sans catastrophe est déjà une forme de succès, et la légitimité
  // remonte doucement en temps calme. Gouverner un pays qui gronde n'en est pas
  // un : au-delà de quarante pour cent de grogne moyenne, elle se met à
  // descendre, et un chef qui laisse pourrir son pays finit par le payer sans
  // qu'aucune armée n'ait eu à entrer chez lui.
  const usure = Math.max(0, grogne - 0.4) * 0.12;
  d.legitimite = Math.max(0, Math.min(100, d.legitimite + (0.01 - usure) * dt));
  // On garde ce qui l'a fait tomber : le successeur n'est pas tiré au hasard
  // dans le même vivier selon qu'on lui reproche le désordre ou la défaite.
  if (usure > 0) d.grogne = Math.min(1, (d.grogne || 0) + 0.002 * dt);
  else d.grogne = Math.max(0, (d.grogne || 0) - 0.001 * dt);

  const vieux = Math.max(0, d.age - 60) / 25;
  const conteste = d.legitimite < LEGITIMITE_CRITIQUE ? 0.004 : 0;
  const q = 0.00012 + vieux * 0.0009 + conteste;
  if (!rng.chance(dt === 1 ? q : 1 - Math.pow(1 - q, dt))) return;

  const sortant = d;
  const ecarte = sortant.legitimite < LEGITIMITE_CRITIQUE;
  // Renversé par le pays ou par les défaites : ce n'est pas le même reproche,
  // et ce n'est donc pas le même successeur.
  const parLePays = ecarte && (sortant.grogne || 0) > 0.35;
  const cause = parLePays ? 'renversé par son propre conseil'
    : ecarte ? 'écarté' : 'remplacé';
  const neuf = creerDirigeant(rng, key, t,
    ecarte ? (parLePays ? 'grogne' : 'faiblesse') : null);
  f.dirigeant = neuf;
  if (log) {
    log({
      type: 'dirigeant',
      texte: `${FACTIONS[key].nom} : ${sortant.titre} ${sortant.nom} est ${cause}. `
        + `${neuf.titre} ${neuf.nom} prend la suite — ${TEMPERAMENTS[neuf.temperament].nom.toLowerCase()}. `
        + `« ${TEMPERAMENTS[neuf.temperament].mot} »`,
      factions: [key],
      important: true,
    });
  }
}

// ===== src/groupes.js ================================================
// Les groupes : l'escouade n'est plus un bloc unique.
//
// Un groupe a une position, un ordre, des gens et ce qu'ils portent. Chaque
// membre peut recevoir une tâche personnelle qui prime sur l'ordre du groupe :
// pendant que deux ferraillent, le troisième chasse. En marche, tout le monde
// marche — on ne s'entraîne pas en colonne.
//
// Les personnages vivent dans `groupe.membres`, et nulle part ailleurs : un
// personnage appartient à exactement un groupe, ce qui évite d'avoir à
// synchroniser deux listes et garde l'état sérialisable tel quel.


/** Tâches qu'un membre peut prendre seul, en marge de l'ordre du groupe. */
const TACHES_INDIVIDUELLES = ['repos', 'fouille', 'mine', 'chasse', 'exploration', 'entrainement'];

/** Noms proposés aux groupes détachés, dans l'ordre. */
const NOMS = ['Convoi', 'Pointe', 'Arrière-garde', 'Éclaireurs', 'Escorte'];

/** Deux groupes sans rien ; l'antenne en autorise davantage. */
const GROUPES_BASE = 2;
/**
 * Portée de commandement : jusqu'où l'on peut donner un ordre.
 *
 * Il y avait un plafond de quatre groupes. Comme les autres, c'était une limite
 * écrite dans le code plutôt qu'une limite du monde — rien, dans la fiction,
 * n'empêche de séparer son monde en six colonnes.
 *
 * Ce qui l'empêche vraiment, c'est de leur parler. À portée de voix — quelques
 * secteurs — on transmet par coureur. Au-delà, il faut une antenne, et une
 * antenne se bâtit. Un groupe hors de portée n'est pas perdu : il exécute le
 * dernier ordre reçu jusqu'à ce qu'on le rattrape, ce qui est exactement la
 * façon dont on perdait des colonnes avant la radio.
 */
const PORTEE_COUREUR = 4;
const PORTEE_PAR_ANTENNE = 6;

function porteeOrdres(state) {
  // Lecture directe du bâtiment plutôt que `niveau()` de base.js : ce module est
  // en amont de l'avant-poste dans l'ordre des dépendances, et un cycle
  // d'imports casserait l'assemblage en fichier unique.
  const b = state.base;
  const ant = b && b.fonde && b.batiments ? (b.batiments.antenne || 0) : 0;
  return PORTEE_COUREUR + ant * PORTEE_PAR_ANTENNE;
}

/**
 * Peut-on encore commander ce groupe ? On mesure depuis le groupe le plus
 * proche qu'on commande déjà — un ordre se relaie — et depuis l'avant-poste,
 * qui a la radio.
 */
function joignable(state, g) {
  if (!g) return { ok: false, motif: 'Groupe inconnu.' };
  // Le groupe qu'on regarde est celui où l'on est : on se commande toujours
  // soi-même. Sans cette règle, deux colonnes éloignées se retrouvaient toutes
  // les deux injoignables, y compris celle où se tient le joueur — et le banc
  // a montré des escouades plantées à ne rien faire trente pour cent du temps.
  if (g.id === state.player.groupeActif) return { ok: true };
  const portee = porteeOrdres(state);
  const b = state.base;
  if (b && b.fonde && distance(g.regionId, b.regionId) <= portee) return { ok: true };
  // On relaie par le groupe où l'on se tient, et par les autres qu'on joint.
  for (const autre of state.player.groupes) {
    if (autre.id === g.id || !autre.membres.length) continue;
    if (distance(g.regionId, autre.regionId) <= portee) return { ok: true };
  }
  return {
    ok: false,
    motif: `Hors de portée : ${portee} secteurs par coureur, davantage avec une antenne.`,
  };
}

/** Conservé pour l'affichage : ce que la portée permet, en nombre de colonnes. */
function maxGroupes(state) {
  return Infinity;
}

// ---------------------------------------------------------------------------
// Construction et accès
// ---------------------------------------------------------------------------

function groupeVide(id, nom, regionId, t = 0) {
  const inventaire = {};
  for (const k of COMMODITY_KEYS) inventaire[k] = 0;
  return {
    id,
    nom,
    regionId,
    ordre: { type: 'repos' },
    membres: [],
    inventaire,
    objets: [],
    // Ce qui porte à votre place. Voir betes.js.
    betes: [],
    // Ceux qu'on mène de force. Voir justice.js.
    prisonniers: [],
    // Au service de qui, avec quel grade et quels ordres. Voir allegeance.js :
    // c'est par colonne, pas par joueur.
    allegeance: null,
    reste: {},
    bilan: { res: {}, depuis: t },
    recolteHeure: null,
    cohesion: 55,
    nuit: false,
  };
}

function groupes(state) {
  return (state.player && state.player.groupes) || [];
}

function groupeParId(state, id) {
  return groupes(state).find((g) => g.id === id) || null;
}

/** Le groupe que l'interface montre. Toujours un groupe réel, jamais null. */
function groupeActif(state) {
  const gs = groupes(state);
  if (!gs.length) return null;
  return gs.find((g) => g.id === state.player.groupeActif) || gs[0];
}

function choisirGroupe(state, id) {
  if (groupeParId(state, id)) state.player.groupeActif = id;
}

/** Tous les personnages, groupes confondus. L'ordre est stable. */
function tousLesMembres(state) {
  const out = [];
  for (const g of groupes(state)) for (const c of g.membres) out.push(c);
  return out;
}

function groupeDe(state, perso) {
  return groupes(state).find((g) => g.membres.some((c) => c.id === perso.id)) || null;
}

function vivants(g) {
  return g.membres.filter(estVivant);
}

/**
 * Ceux qui peuvent travailler ou se battre. Un élève à l'école n'en est pas :
 * il est en ville, la tête ailleurs. Sans ça, une formation ne coûterait que de
 * l'argent, et envoyer quelqu'un se former serait sans conséquence.
 */
// ---------------------------------------------------------------------------
// Cohésion : ce qui remplace le plafond d'escouade
// ---------------------------------------------------------------------------

/**
 * Combien de gens tiennent ensemble sans effort. Au-delà, ce n'est plus une
 * escouade, c'est une colonne — et une colonne, ça se commande mal.
 *
 * C'était un plafond en dur (`4 + baraquement`) : on ne pouvait simplement pas
 * recruter au-delà. Une limite écrite dans le code n'apprend rien ; celle-ci se
 * sent. Rien n'interdit de mener trente personnes ; ce qui l'en dissuade, c'est
 * qu'à trente on ne se connaît plus, on travaille mal et on se bat mal.
 */
function noyau(state, g) {
  const base = state && state.base;
  const abri = base && base.fonde ? (base.batiments.baraquement || 0) : 0;
  return 4 + abri;
}

/**
 * Le plafond de cohésion qu'un groupe de cette taille peut atteindre. Courbe
 * douce et sans palier : à quatre on peut être soudés, à trente jamais.
 */
function plafondCohesion(state, g) {
  const n = vivants(g).length;
  const cœur = noyau(state, g);
  if (n <= cœur) return 100;
  return Math.max(12, 100 / (1 + (n - cœur) / 7));
}

/**
 * Ce que la cohésion vaut, en travail comme au combat. Une bande soudée rend
 * plus qu'une addition de gens ; une foule rend moins.
 *
 * Jusqu'ici la cohésion ne servait à rien : elle dérivait, elle s'affichait, et
 * aucun calcul ne la lisait. C'est elle qui porte désormais tout le poids de la
 * taille d'une escouade.
 */
function rendementCohesion(g) {
  const c = g && g.cohesion !== undefined ? g.cohesion : 55;
  return 0.7 + (c / 100) * 0.45;
}

function debout(g) {
  return g.membres.filter((c) => estDebout(c)
    && !(c.formation && c.formation.restant > 0)
    && !c.enseigne);
}

/** Ceux que l'école immobilise — élèves et maîtres —, pour l'affichage. */
function eleves(g) {
  return g.membres.filter((c) => (c.formation && c.formation.restant > 0) || c.enseigne);
}

/** Un groupe qui n'a plus personne debout ne fait plus rien de son ordre. */
function groupeActifEnJeu(g) {
  return g.membres.some(estVivant);
}

// ---------------------------------------------------------------------------
// Tâches
// ---------------------------------------------------------------------------

/**
 * La tâche que ce membre exécute réellement. En marche, l'ordre du groupe
 * l'emporte sur tout : on ne mine pas en avançant.
 */
function tacheDe(g, c) {
  const ordre = g.ordre || { type: 'repos' };
  if (ordre.type === 'voyage') return ordre;
  if (!c.tache) return ordre;
  if (!TACHES_INDIVIDUELLES.includes(c.tache.type)) return ordre;
  return c.tache;
}

/** `null` remet le membre sous l'ordre du groupe. */
function assignerTache(state, perso, tache, verifierExercice) {
  if (!tache) { delete perso.tache; return { ok: true }; }
  if (!TACHES_INDIVIDUELLES.includes(tache.type)) {
    return { ok: false, motif: 'Cette tâche ne se prend pas seul.' };
  }
  // `verifierExercice` est passé par l'appelant : squad.js est en aval de ce
  // module dans l'ordre des dépendances, et l'importer ferait un cycle.
  if (tache.type === 'entrainement' && verifierExercice) {
    const v = verifierExercice(tache.skill);
    if (!v.ok) return v;
  }
  perso.tache = Object.assign({}, tache);
  return { ok: true };
}

/** Combien de membres exécutent chaque tâche, pour l'affichage. */
function repartition(g) {
  const out = {};
  for (const c of g.membres) {
    if (!estVivant(c)) continue;
    const t = tacheDe(g, c).type;
    out[t] = (out[t] || 0) + 1;
  }
  return out;
}

// ---------------------------------------------------------------------------
// Scinder et fusionner
// ---------------------------------------------------------------------------

function nomLibre(state) {
  const pris = new Set(groupes(state).map((g) => g.nom));
  for (const n of NOMS) if (!pris.has(n)) return n;
  let i = 2;
  while (pris.has(`Groupe ${i}`)) i++;
  return `Groupe ${i}`;
}

/**
 * Détache des membres dans un nouveau groupe, sur place. Les vivres et le
 * matériel suivent au prorata : c'est ça qui donne son prix à la séparation.
 * Partir à deux avec un tiers des rations, c'est un choix, pas une formalité.
 */
function scinder(state, g, ids, rng, nom) {
  const partants = g.membres.filter((c) => ids.includes(c.id) && estVivant(c));
  if (!partants.length) return { ok: false, motif: 'Personne à détacher.' };
  const restants = g.membres.filter((c) => !ids.includes(c.id) && estVivant(c));
  if (!restants.length) return { ok: false, motif: 'Il faut laisser quelqu’un derrière.' };
  if (partants.some((c) => !estDebout(c))) {
    return { ok: false, motif: 'On ne détache pas quelqu’un qui est à terre.' };
  }

  const neuf = groupeVide(idDepuisRng(rng, 'g'), nom || nomLibre(state), g.regionId, state.temps);
  // Les K.O. restent avec le groupe d'origine : ils sont portés, pas envoyés.
  for (const c of partants) {
    g.membres.splice(g.membres.indexOf(c), 1);
    neuf.membres.push(c);
  }

  const part = partants.length / (partants.length + restants.length);
  for (const k of Object.keys(g.inventaire)) {
    const q = Math.floor((g.inventaire[k] || 0) * part);
    if (q <= 0) continue;
    g.inventaire[k] -= q;
    neuf.inventaire[k] = (neuf.inventaire[k] || 0) + q;
  }

  state.player.groupes.push(neuf);
  state.player.groupeActif = neuf.id;
  return { ok: true, groupe: neuf };
}

/** Fusionne `b` dans `a`. Les deux doivent être au même endroit. */
function fusionner(state, a, b) {
  if (a.id === b.id) return { ok: false, motif: 'Même groupe.' };
  if (a.regionId !== b.regionId) return { ok: false, motif: 'Les deux groupes ne sont pas au même endroit.' };
  for (const c of b.membres) a.membres.push(c);
  for (const k of Object.keys(b.inventaire)) {
    if (!b.inventaire[k]) continue;
    a.inventaire[k] = (a.inventaire[k] || 0) + b.inventaire[k];
  }
  for (const o of b.objets || []) a.objets.push(o);
  // La cohésion d'un groupe recomposé n'est pas la somme des deux : on se
  // réhabitue.
  a.cohesion = Math.round((a.cohesion + b.cohesion) / 2);
  retirerGroupe(state, b);
  if (state.player.groupeActif === b.id) state.player.groupeActif = a.id;
  return { ok: true };
}

function retirerGroupe(state, g) {
  const i = state.player.groupes.indexOf(g);
  if (i >= 0) state.player.groupes.splice(i, 1);
  if (state.player.groupeActif === g.id && state.player.groupes.length) {
    state.player.groupeActif = state.player.groupes[0].id;
  }
}

/** Un groupe rejoint par un autre au même endroit peut être absorbé. */
function fusionnablesAvec(state, g) {
  return groupes(state).filter((o) => o.id !== g.id && o.regionId === g.regionId);
}

// ===== src/betes.js ==================================================
// Ce qui porte à votre place.
//
// Le banc a fini par chiffrer ce que le jeu était devenu : soixante-dix pour
// cent des départs d'un convoi sont de la logistique — le sac se remplit, on
// marche jusqu'en ville, on vend, on repart. Cinquante-neuf pour cent du temps
// de jeu passe sur les pistes. Sur une carte cinq fois plus grande, cette
// boucle coûte cinq fois plus, et elle écrase tout le reste : onze pour cent
// des départs seulement servent un contrat, onze pour cent un ordre de mission.
//
// La réponse n'est pas d'agrandir le sac : ce serait retirer la logistique du
// jeu au lieu de la rendre intéressante. C'est de la déléguer à quelque chose
// qui a son propre état — qui mange, qui s'épuise, qu'on peut perdre. Une bête
// de somme n'est pas un bonus de portage, c'est un membre de plus dont il faut
// s'occuper, et qui vous manque cruellement le jour où on vous la tue.


/**
 * Ce qu'on peut atteler. Deux voies, deux compromis : la bête mange mais ne
 * craint pas le terrain ; la charrette ne mange pas mais peine dans les
 * cassures.
 */
const BETES = {
  brahmine: {
    nom: 'Brahmine',
    desc: 'Deux estomacs, mauvais caractère, et le dos qu’il faut.',
    prix: 900,
    portage: 75,
    // Ce qu'elle avale par heure, en biomasse. Elle broute ce que personne ne
    // mange, ce qui est tout l'intérêt.
    appetit: 0.09,
    lenteur: 0.05,
    robustesse: 1,
  },
  mulet: {
    nom: 'Mulet de fret',
    desc: 'Petit, têtu, increvable. On en croise sur toutes les pistes.',
    prix: 520,
    portage: 42,
    appetit: 0.05,
    lenteur: 0.02,
    robustesse: 1.35,
  },
  charrette: {
    nom: 'Charrette à bras',
    desc: 'Ne mange rien, ne se plaint pas, et déteste les cassures.',
    prix: 340,
    portage: 55,
    appetit: 0,
    // On la tire soi-même : c'est le convoi qui ralentit, et beaucoup.
    lenteur: 0.14,
    robustesse: 2.2,
    // Elle ne meurt pas de faim ; elle casse.
    objet: true,
  },
};

const BETE_KEYS = Object.keys(BETES);

/**
 * Combien de bêtes une paire de bras sait mener.
 *
 * Il n'y a pas de plafond en dur, et c'est délibéré : une limite écrite dans le
 * code n'apprend rien au joueur, alors qu'une limite qui se sent lui apprend
 * comment le monde fonctionne. Rien n'interdit d'acheter une dixième bête ; ce
 * qui l'en dissuadera, c'est qu'il n'aura personne pour la mener, qu'elle
 * mangera quand même, qu'elle traînera le convoi, qu'elle dépérira faute
 * d'attention, et qu'elle rendra la colonne visible à des lieues.
 */
const BETES_PAR_HOMME = 2;

/** Combien l'escouade sait en mener, d'après ceux qui tiennent debout. */
function conduite(g) {
  if (!g) return 0;
  let bras = 0;
  for (const c of g.membres || []) {
    if (c.etat === 'mort' || c.etat === 'ko') continue;
    if ((c.formation && c.formation.restant > 0) || c.enseigne) continue;
    bras++;
  }
  return bras * BETES_PAR_HOMME;
}

/**
 * Ce qui dépasse ce qu'on sait mener. Une bête non tenue n'est pas perdue : elle
 * est mal tenue, ce qui n'est pas la même chose et se paie autrement.
 */
function surnombre(g) {
  return Math.max(0, betesDe(g).length - conduite(g));
}

/** Part de l'attelage réellement tenue en main, entre 0 et 1. */
function tenue(g) {
  const n = betesDe(g).length;
  if (!n) return 1;
  return Math.min(1, conduite(g) / n);
}

const NOMS_BETES = [
  'Cendre', 'Bourrique', 'Suif', 'Vieille', 'Caillou', 'Poussière', 'Trogne',
  'Bosse', 'Rouille', 'Tempête', 'Fer-Blanc', 'Chignole', 'Sabot', 'Bréhaigne',
];

function creerBete(rng, key) {
  const def = BETES[key];
  return {
    id: idDepuisRng(rng, 'b'),
    key,
    nom: def.objet ? def.nom : rng.pick(NOMS_BETES),
    // 0 à 100. Une bête mal nourrie maigrit et porte moins ; à zéro, elle reste
    // sur le bord de la piste.
    sante: 100,
    faim: 0,
  };
}

function betesDe(g) {
  return (g && g.betes) || [];
}

/**
 * Ce que l'attelage ajoute au portage. Une bête affamée ou blessée porte moins :
 * c'est ce qui rend la négligence coûteuse plutôt que gratuite.
 */
function portageAttelage(g) {
  let t = 0;
  for (const b of betesDe(g)) {
    const def = BETES[b.key];
    if (!def) continue;
    t += def.portage * (0.35 + 0.65 * (b.sante / 100));
  }
  // Ce qu'on ne tient pas en main s'égaille, balke et se décharge mal. On garde
  // un tiers du dos d'une bête livrée à elle-même : elle suit, elle ne sert pas.
  const part = tenue(g);
  return part >= 1 ? t : t * (0.35 + 0.65 * part);
}

/**
 * Ce que l'attelage retire à la vitesse du convoi.
 *
 * Pas de plafond arbitraire : la somme des lenteurs passe par une courbe qui
 * tend vers l'immobilité sans jamais l'atteindre. Vingt bêtes ne vous figent
 * pas sur place, elles vous réduisent à un pas d'escargot — ce qui revient au
 * même en jeu, mais s'explique tout seul. Ce qu'on ne sait pas mener compte
 * double : une bête qui s'égaille, il faut aller la rechercher.
 */
function lenteurAttelage(g) {
  let l = 0;
  for (const b of betesDe(g)) l += (BETES[b.key] || {}).lenteur || 0;
  l += surnombre(g) * 0.09;
  return 1 - 1 / (1 + l);
}

/**
 * Ce qu'une colonne d'animaux ajoute au risque de mauvaise rencontre. Un convoi
 * chargé se voit de loin, et se convoite.
 */
function visibiliteAttelage(g) {
  const n = betesDe(g).length;
  if (!n) return 1;
  return 1 + n * 0.08 + surnombre(g) * 0.12;
}

/** Ce que l'attelage mange par heure, en biomasse. */
function appetitAttelage(g) {
  let a = 0;
  for (const b of betesDe(g)) a += (BETES[b.key] || {}).appetit || 0;
  return a;
}

// ---------------------------------------------------------------------------
// Achat, cession
// ---------------------------------------------------------------------------

function prixBete(col, key) {
  const def = BETES[key];
  if (!def) return 0;
  // Une ville prospère et paisible vend moins cher ce dont elle a moins besoin.
  const tension = 1 + (col ? col.unrest * 0.5 : 0);
  return Math.round(def.prix * tension);
}

function acheterBete(state, col, key, rng, log, groupe) {
  const g = groupe || (state.player.groupes || [])[0];
  const def = BETES[key];
  if (!def) return { ok: false, motif: 'On ne vend pas ça.' };
  if (!g) return { ok: false, motif: 'Aucun groupe.' };
  if (!col || col.ruine || g.regionId !== col.regionId) {
    return { ok: false, motif: 'Il faut être en ville.' };
  }
  const prix = prixBete(col, key);
  if (state.player.credits < prix) {
    return { ok: false, motif: `Il manque ${prix - state.player.credits} cr.` };
  }
  state.player.credits -= prix;
  if (!g.betes) g.betes = [];
  const b = creerBete(rng, key);
  g.betes.push(b);
  if (log) {
    log({
      type: 'bete',
      texte: `${def.nom} ${def.objet ? 'achetée' : `— ${b.nom} — achetée`} à ${col.nom} pour ${prix} cr.`,
      important: true,
      regionId: col.regionId,
      groupe: g.id,
    });
  }
  return { ok: true, bete: b, prix };
}

function vendreBete(state, col, beteId, log, groupe) {
  const g = groupe || (state.player.groupes || [])[0];
  const i = betesDe(g).findIndex((b) => b.id === beteId);
  if (i < 0) return { ok: false, motif: 'Pas à vous.' };
  if (!col || col.ruine || g.regionId !== col.regionId) {
    return { ok: false, motif: 'Il faut être en ville.' };
  }
  const b = g.betes[i];
  // On récupère la moitié, au prorata de l'état : personne n'achète une carne.
  const prix = Math.round(prixBete(col, b.key) * 0.5 * (0.4 + 0.6 * (b.sante / 100)));
  state.player.credits += prix;
  g.betes.splice(i, 1);
  if (log) log({ type: 'bete', texte: `${b.nom} cédée à ${col.nom} pour ${prix} cr.`, regionId: col.regionId });
  return { ok: true, prix };
}

// ---------------------------------------------------------------------------
// Tick
// ---------------------------------------------------------------------------

/**
 * Une heure de vie de l'attelage. Elles broutent la biomasse du sac — celle que
 * personne d'autre ne mange —, maigrissent quand il n'y en a pas, et finissent
 * par rester sur le bord de la piste.
 */
function tickBetes(g, rng, log) {
  const betes = betesDe(g);
  if (!betes.length) return;
  // Combien de bêtes par bête : au-delà de ce qu'on sait mener, tout le monde
  // est un peu négligé, pas seulement les dernières arrivées.
  const neglige = betes.length ? surnombre(g) / betes.length : 0;
  const restantes = [];
  for (const b of betes) {
    const def = BETES[b.key];
    if (!def) continue;
    if (def.appetit > 0) {
      const dispo = g.inventaire.biomasse || 0;
      const veut = def.appetit;
      const servi = Math.min(dispo, veut);
      g.inventaire.biomasse = dispo - servi;
      if (servi >= veut * 0.9) {
        b.faim = Math.max(0, b.faim - 1.2);
        b.sante = Math.min(100, b.sante + 0.25);
      } else {
        b.faim = Math.min(120, b.faim + 0.8);
        if (b.faim > 45) b.sante = Math.max(0, b.sante - 0.35);
      }
    } else {
      // Une charrette ne mange pas : elle s'use sur la piste.
      b.sante = Math.max(0, b.sante - 0.015);
    }
    // Ce qu'on ne tient pas se néglige : pas de pansement, pas de sabot curé,
    // pas de charge rééquilibrée. C'est ce qui rend un trop grand attelage
    // coûteux sans qu'aucune règle ne l'interdise.
    if (neglige > 0) b.sante = Math.max(0, b.sante - 0.05 * neglige);
    if (b.sante <= 0) {
      if (log) {
        log({
          type: 'bete',
          texte: def.objet
            ? `${b.nom} rend l’âme sur la piste. On répartit la charge.`
            : `${b.nom} n’ira pas plus loin. On la laisse là.`,
          important: true,
          groupe: g.id,
        });
      }
      continue;
    }
    restantes.push(b);
  }
  g.betes = restantes;
}

/**
 * Une défaite peut coûter une bête : c'est ce qui fait qu'on y tient. Le
 * pillard prend d'abord ce qui se revend et se mène tout seul.
 */
function perdreBete(g, rng, log) {
  const betes = betesDe(g);
  if (!betes.length) return null;
  const i = rng.int(betes.length);
  const b = betes[i];
  const def = BETES[b.key] || {};
  if (!rng.chance(0.55 / (def.robustesse || 1))) return null;
  g.betes.splice(i, 1);
  if (log) {
    log({
      type: 'bete',
      texte: def.objet
        ? `${b.nom} est emportée dans la déroute.`
        : `On a emmené ${b.nom} avec le reste.`,
      important: true,
      groupe: g.id,
    });
  }
  return b;
}

/** Ce qu'un attelage vaut, pour l'affichage et pour un bilan. */
function valeurAttelage(g) {
  let v = 0;
  for (const b of betesDe(g)) v += (BETES[b.key] || {}).prix * 0.5 * (b.sante / 100);
  return Math.round(v);
}

// ===== src/recrues.js ================================================
// Qui accepte de partir avec vous, et pour combien.
//
// La prime d'engagement montait de quatre-vingt-dix crédits par membre déjà
// présent. C'était de l'équilibrage déguisé en économie : un ferrailleur au
// chômage dans un bourg de la steppe n'a aucune idée du nombre de gens que vous
// menez déjà, et si vous en menez vingt, il devrait plutôt être *rassuré*.
//
// Ce qui décide vraiment d'une prime, c'est trois choses :
//
//   ce que vaut la personne — un médic diplômé ne part pas au tarif d'un bras ;
//   ce que vaut sa place ici — on quitte pour rien une ville affamée et agitée,
//     on se fait payer cher pour quitter une ville prospère ;
//   ce que vous valez, vous — on suit moins cher un nom qu'on connaît.
//
// Et surtout : on voit qui l'on engage. Un banc de bourg propose deux ou trois
// personnes, avec leur nom, leur métier et leur prix, renouvelées de loin en
// loin. On ne tire plus un inconnu au sort en payant d'avance.


/** Durée de vie d'un banc de recrutement avant que les gens se placent ailleurs. */
const DUREE_BANC = 260;

/**
 * Ce que quelqu'un vaut sur le marché du travail : ses compétences, son
 * équipement, et le fait d'avoir un vrai métier plutôt que deux bras.
 */
function valeurRecrue(c) {
  let somme = 0;
  for (const k of SKILL_KEYS) somme += c.skills[k] || 0;
  const meilleur = SKILL_KEYS.reduce((m, k) => Math.max(m, c.skills[k] || 0), 0);
  const brevets = (c.diplomes || []).length;
  // La somme dit l'expérience générale, le meilleur dit la spécialité, les
  // diplômes disent qu'on a payé pour l'apprendre.
  return 90 + somme * 3.2 + meilleur * 6 + brevets * 220;
}

/**
 * Ce que la ville fait au prix. Une ville qui a faim et qui gronde laisse
 * partir les siens pour presque rien ; une ville prospère les garde.
 */
function tensionRecrutement(col) {
  if (!col) return 1;
  const vivres = (col.stock.rations || 0) / Math.max(1, col.pop);
  const aise = Math.max(0, Math.min(1, vivres / 0.9));
  // 0,55 dans un bourg affamé et révolté, 1,35 dans une ville qui va bien.
  return Math.max(0.55, Math.min(1.35, 0.7 + aise * 0.65 - (col.unrest || 0) * 0.5));
}

/** La prime demandée par cette personne, dans cette ville, à ce joueur. */
function primeDe(state, col, c) {
  const repu = (col && state.player.reputation[col.faction]) || 0;
  // On suit moins cher quelqu'un dont on a entendu du bien. Et beaucoup plus
  // cher quelqu'un dont on a entendu du mal.
  const nom = repu >= 0 ? 1 - Math.min(0.25, repu / 320) : 1 + Math.min(0.6, -repu / 160);
  return Math.max(60, Math.round(valeurRecrue(c) * tensionRecrutement(col) * nom));
}

/**
 * Le banc d'une ville : qui s'y trouve, en ce moment, prêt à partir. Une grande
 * ville en propose plus ; une ville qui gronde en propose beaucoup plus, parce
 * que tout le monde veut s'en aller.
 */
function genererBanc(state, col, rng, t) {
  const combien = Math.max(1, Math.min(5,
    Math.round(1 + col.taille * 0.8 + (col.unrest || 0) * 4)));
  const gens = [];
  for (let i = 0; i < combien; i++) {
    // Le niveau suit la ville : on ne trouve pas de vétéran dans un hameau.
    const niveau = rng.weighted([[0, 4], [1, 3], [2, 1.5 + col.taille], [3, col.taille * 0.6]]);
    const c = makeCharacter(rng, { archetype: rng.pick(ARCHETYPE_KEYS), niveau });
    gens.push(c);
  }
  col.banc = { gens, expire: t + DUREE_BANC };
  return col.banc;
}

function bancDe(state, col, rng, t) {
  if (!col || col.ruine) return null;
  if (!col.banc || t >= col.banc.expire) genererBanc(state, col, rng, t);
  return col.banc;
}

/**
 * Engager quelqu'un du banc. Aucun plafond d'effectif : ce qui dissuade
 * d'entasser du monde, c'est la cohésion qui se délite (voir groupes.js), pas
 * une règle qui interdit.
 */
function engager(state, col, index, log, groupe) {
  const g = groupe || (state.player.groupes || [])[0];
  if (!g) return { ok: false, motif: 'Aucun groupe.' };
  if (!col || col.ruine || g.regionId !== col.regionId) {
    return { ok: false, motif: 'Il faut être en ville.' };
  }
  const banc = col.banc;
  if (!banc || !banc.gens[index]) return { ok: false, motif: 'Cette personne s’est placée ailleurs.' };
  const c = banc.gens[index];
  const prix = primeDe(state, col, c);
  if (state.player.credits < prix) {
    return { ok: false, motif: `Il manque ${prix - state.player.credits} cr.` };
  }
  state.player.credits -= prix;
  banc.gens.splice(index, 1);
  g.membres.push(c);
  if (log) {
    log({
      type: 'recrue',
      texte: `${c.nom} (${c.archetypeNom}) s’engage dans ${g.nom} pour ${prix} cr.`,
      important: true,
      regionId: col.regionId,
      groupe: g.id,
    });
  }
  return { ok: true, perso: c, prix };
}

/** Ce qu'on peut dire d'une recrue avant de signer, en une ligne. */
function apercu(c) {
  let meilleur = SKILL_KEYS[0];
  for (const k of SKILL_KEYS) if ((c.skills[k] || 0) > (c.skills[meilleur] || 0)) meilleur = k;
  return { skill: meilleur, niveau: Math.round(c.skills[meilleur] || 0), comp: comp(c, meilleur) };
}

// ===== src/services.js ===============================================
// Ce que les gens vous demandent, en personne.
//
// Le panneau d'affichage d'une ville est anonyme : il paie en crédits, il bouge
// la réputation d'une faction, et personne ne se souvient de vous. C'est un
// distributeur. Ici c'est autre chose : quelqu'un a un problème, il vous le dit
// en face, et il s'en souvient — bien ou mal.
//
// Le prix est volontairement médiocre. Ce qu'on achète en rendant un service,
// c'est l'opinion d'une personne précise, et cette opinion a des effets qu'on
// ne peut acheter autrement : un armurier qui fait ses prix, un médecin qui
// recoud vos gens, un chef qui vous ouvre son panneau, un contremaître qui
// laisse ses registres ouverts même quand vous êtes à l'autre bout de la carte.


/**
 * Ce que chaque charge peut réclamer. `seuil` est le stock par habitant en
 * dessous duquel la personne commence à s'inquiéter — c'est un vrai manque de
 * la ville, pas un prétexte, sinon les demandes tournent à la corvée.
 */
const BESOINS = {
  medecin: {
    res: 'medkit', seuil: 0.012, lot: [6, 20],
    texte: (q) => `Il me faut ${q} medkits. Je recouds avec ce que je trouve, et je trouve mal.`,
  },
  contremaitre: {
    res: 'composant', seuil: 0.02, lot: [10, 30],
    texte: (q) => `${q} composants et l'atelier repart. Sans ça je fais tourner à vide.`,
  },
  chef: {
    res: 'rations', seuil: 0.5, lot: [40, 140],
    texte: (q) => `${q} rations. Je ne demande pas pour moi.`,
  },
  armurier: {
    res: 'alliage', seuil: 0.05, lot: [12, 40],
    texte: (q) => `${q} d'alliage. J'ai des commandes et rien à forger.`,
  },
};

/** Une demande non honorée finit par ne plus être une demande. */
const DUREE_DEMANDE = [260, 620];

/** Ce qu'un service rapporte, et ce qu'un oubli coûte. */
const GAIN_OPINION = 24;
const GAIN_TEMOINS = 6;
const PERTE_OUBLI = 14;

/** Combien d'actes on garde en tête. Au-delà, on ne retient que l'impression. */
const MEMOIRE_MAX = 4;

// ---------------------------------------------------------------------------
// Mémoire
// ---------------------------------------------------------------------------

/**
 * On garde la clé de marchandise dans le souvenir, pas la phrase : c'est plus
 * petit dans la sauvegarde, et ça permet d'écrire un français correct au moment
 * de l'affichage plutôt que de recoller « apporté medkit ».
 */
const DIT = {
  medkit: ['des medkits', 'les medkits'],
  composant: ['des composants', 'les composants'],
  rations: ['des rations', 'les rations'],
  alliage: ['de l’alliage', 'l’alliage'],
};

const ACTES = {
  service: (r) => `Vous lui avez apporté ${(DIT[r] || [r])[0]} quand il en manquait.`,
  oubli: (r) => `Vous avez laissé passer ${(DIT[r] || [null, r])[1]} qu’il attendait.`,
  defense: () => 'Vous étiez là quand la ville a été attaquée.',
  pillage: () => 'Vous avez pillé une caravane des siens.',
};

/** On retient un acte, et on oublie le plus vieux. */
function retenir(p, quoi, detail, t) {
  if (!p) return;
  if (!p.memoire) p.memoire = [];
  p.memoire.push({ quoi, detail: detail || null, t });
  if (p.memoire.length > MEMOIRE_MAX) p.memoire.shift();
}

/** La mémoire d'une personne, en français. */
function souvenirs(p) {
  if (!p || !p.memoire) return [];
  return p.memoire.map((m) => (ACTES[m.quoi] ? ACTES[m.quoi](m.detail) : '')).filter(Boolean);
}

/** Un fait qui concerne toute la ville se retient par tout le monde. */
function retenirEnVille(col, quoi, t, delta) {
  if (!col || !col.notables) return;
  for (const p of col.notables) {
    retenir(p, quoi, null, t);
    if (delta) p.opinion = Math.max(-100, Math.min(100, (p.opinion || 0) + delta));
  }
}

// ---------------------------------------------------------------------------
// Naissance et mort d'une demande
// ---------------------------------------------------------------------------

/** Le manque réel de la ville, entre 0 (rien ne manque) et 1 (rien n'est là). */
function manque(col, besoin) {
  const attendu = Math.max(1, col.pop * besoin.seuil);
  return Math.max(0, Math.min(1, 1 - (col.stock[besoin.res] || 0) / attendu));
}

/**
 * Une tranche de vie des demandes. Appelée depuis le tick des notables, donc au
 * rythme des colonies : on ne parle pas de quelques dizaines d'objets par heure
 * mais de quelques-uns par jour de jeu sur la carte entière.
 */
function tickServices(col, rng, dt, t, present = false) {
  if (!col.notables || !col.notables.length) return;
  const surDt = (p) => (dt === 1 ? p : 1 - Math.pow(1 - p, dt));

  for (const p of col.notables) {
    if (p.demande) {
      // Une demande ne devient la vôtre qu'une fois que vous l'avez entendue.
      if (present) p.demande.vu = true;
      // On n'attend pas éternellement. Une demande qui s'éteint laisse une
      // trace — mais seulement si vous étiez passé l'entendre. On ne tient
      // rigueur à personne d'un besoin qu'il ignorait, sinon un joueur qui ne
      // s'occupe pas de ce système se fait détester par une carte entière sans
      // avoir jamais rien vu venir.
      if (t >= p.demande.echeance) {
        if (p.demande.vu) {
          retenir(p, 'oubli', p.demande.res, t);
          p.opinion = Math.max(-100, (p.opinion || 0) - PERTE_OUBLI);
        }
        p.demande = null;
      }
      continue;
    }
    const besoin = BESOINS[p.charge];
    if (!besoin) continue;
    const m = manque(col, besoin);
    if (m < 0.35) continue;
    // On demande d'autant plus volontiers qu'on manque et qu'on ne vous déteste
    // pas : on ne va pas mendier auprès de quelqu'un qu'on méprise.
    const disposition = (p.opinion || 0) < -40 ? 0.25 : 1;
    if (!rng.chance(surDt(0.0016 * m * disposition))) continue;

    const q = Math.round(rng.irange(besoin.lot[0], besoin.lot[1]) * (0.6 + m * 0.8));
    p.demande = {
      res: besoin.res,
      quantite: Math.max(4, q),
      echeance: t + rng.irange(DUREE_DEMANDE[0], DUREE_DEMANDE[1]),
      texte: besoin.texte(Math.max(4, q)),
      // Vrai dès qu'on est passé l'entendre. Voir plus haut.
      vu: present,
      // On rembourse la marchandise sans plus : le reste se paie en estime.
      prime: Math.round(COMMODITIES[besoin.res].prix * Math.max(4, q) * rng.range(0.9, 1.3)),
    };
  }
}

// ---------------------------------------------------------------------------
// Honorer
// ---------------------------------------------------------------------------

/** Le premier groupe présent ici qui porte assez de quoi. */
function porteur(state, regionId, res, quantite) {
  return groupes(state).find(
    (g) => g.regionId === regionId && (g.inventaire[res] || 0) >= quantite
  ) || null;
}

/** Les demandes qu'on peut entendre d'ici : celles des gens qu'on a en face. */
function demandesIci(state, col) {
  if (!col || !col.notables) return [];
  const out = [];
  for (const p of col.notables) {
    if (!p.demande) continue;
    const g = porteur(state, col.regionId, p.demande.res, p.demande.quantite);
    out.push({ notable: p, demande: p.demande, pret: !!g });
  }
  return out;
}

function honorer(state, colId, notableId, log) {
  const col = state.world.colonies.find((c) => c.id === colId);
  if (!col) return { ok: false, motif: 'Cette ville n’existe plus.' };
  const p = (col.notables || []).find((x) => x.id === notableId);
  if (!p || !p.demande) return { ok: false, motif: 'Il n’attend plus rien de vous.' };
  const d = p.demande;
  const g = porteur(state, col.regionId, d.res, d.quantite);
  if (!g) return { ok: false, motif: `Il faut être ici avec ${d.quantite} ${COMMODITIES[d.res].nom.toLowerCase()}.` };

  g.inventaire[d.res] -= d.quantite;
  col.stock[d.res] = (col.stock[d.res] || 0) + d.quantite;
  state.player.credits += d.prime;

  p.opinion = Math.min(100, (p.opinion || 0) + GAIN_OPINION);
  retenir(p, 'service', d.res, state.temps);
  // Ça se sait : les autres en tiennent compte, sans en faire une affaire
  // personnelle.
  for (const autre of col.notables) {
    if (autre === p) continue;
    autre.opinion = Math.min(100, (autre.opinion || 0) + GAIN_TEMOINS);
  }
  if (col.faction) {
    state.player.reputation[col.faction] = Math.min(100, (state.player.reputation[col.faction] || 0) + 2);
  }
  state.stats.servicesRendus = (state.stats.servicesRendus || 0) + 1;
  p.demande = null;

  log({
    type: 'service',
    texte: `${CHARGES[p.charge].nom} de ${col.nom} : ${p.nom} a eu ses `
      + `${COMMODITIES[d.res].nom.toLowerCase()}. ${d.prime} cr, et il s’en souviendra.`,
    important: true,
    regionId: col.regionId,
  });
  return { ok: true };
}

// ---------------------------------------------------------------------------
// Ce que l'estime change
// ---------------------------------------------------------------------------

/** L'opinion d'une charge, ou 0 si la charge n'est pas pourvue. */
function estime(col, charge) {
  const p = notable(col, charge);
  return p ? (p.opinion || 0) : 0;
}

/** Sous ce seuil, le chef ne veut pas de vos services. */
const PANNEAU_FERME = -40;
/** Au-dessus, il vous garde les bons contrats. */
const PANNEAU_OUVERT = 45;

/** Ce que le chef fait de vous : { ouvert, prime } — prime multiplie la paie. */
function faveurChef(col) {
  const o = estime(col, 'chef');
  if (o <= PANNEAU_FERME) return { ouvert: false, prime: 1 };
  return { ouvert: true, prime: o >= PANNEAU_OUVERT ? 1.2 : 1 };
}

/** Seuil à partir duquel le médecin de la ville s'occupe aussi des vôtres. */
const SOINS_SEUIL = 40;

/**
 * Le renfort de soin qu'on trouve dans cette région, s'il y a une ville et si
 * son médecin vous apprécie. Un groupe qui campe sous les murs d'une ville amie
 * se remet debout nettement plus vite qu'un groupe qui campe dans le sable.
 */
function renfortSoin(state, regionId) {
  const col = colonieDe(state.world, regionId);
  if (!col || col.ruine) return 1;
  const p = notable(col, 'medecin');
  if (!p || (p.opinion || 0) < SOINS_SEUIL) return 1;
  return 1 + 0.35 + Math.min(0.4, p.comp / 250);
}

/** Seuil à partir duquel le contremaître laisse ses registres ouverts. */
const REGISTRES_SEUIL = 35;

/** Les villes dont on a les chiffres même sans y être. */
function villesOuvertes(state) {
  const out = [];
  for (const col of state.world.colonies) {
    if (col.ruine) continue;
    const p = notable(col, 'contremaitre');
    if (p && (p.opinion || 0) >= REGISTRES_SEUIL) out.push(col);
  }
  return out;
}

// ===== src/allegeance.js =============================================
// Allégeance. Jusqu'ici les factions étaient un décor avec lequel on
// commerçait ; on peut désormais entrer à leur service, monter en grade, en
// recevoir des ordres et en tirer des avantages concrets.
//
// C'est la progression longue du jeu : la réputation était un chiffre, le grade
// est une position dans le monde.


const RANGS = [
  {
    nom: 'Affilié', points: 0, remise: 0.05, solde: 10, ration: 3,
    desc: 'On vous laisse entrer par la porte de service, et on vous nourrit.',
  },
  {
    nom: 'Agent', points: 130, remise: 0.10, solde: 30, ration: 6,
    desc: 'On vous connaît. Les péages ne vous concernent plus.',
  },
  {
    nom: 'Lieutenant', points: 380, remise: 0.16, solde: 75, ration: 10,
    desc: 'Les armuriers vous sortent ce qu’ils gardent derrière, et leurs villes vous logent.',
  },
  {
    nom: 'Capitaine', points: 850, remise: 0.22, solde: 160, ration: 15,
    desc: 'On vous soigne sans compter, et on vient parfois à votre secours.',
  },
  {
    nom: 'Commandeur', points: 1700, remise: 0.30, solde: 300, ration: 22,
    desc: 'Votre nom vaut un ordre écrit.',
  },
];

/**
 * Réputation minimale pour être seulement reçu.
 *
 * Vingt, c'était deux ou trois contrats honorés pour la même faction avant
 * qu'on vous parle — et remplir un contrat est l'une des choses les plus dures
 * du jeu sur une grande carte. Le banc était formel : sur quarante-huit
 * parties, le bot entrait au service de quelqu'un dans zéro à deux d'entre
 * elles. La troisième voie n'existait pas.
 *
 * Dix : on démarre à douze auprès de la faction qui vous accueille, donc
 * s'engager chez elle est une décision d'ouverture, pas une récompense de
 * milieu de partie. Les autres demandent un minimum de bonne volonté. Ce qui
 * se mérite, ce sont les grades — et là, rien n'a bougé.
 */
const REPUTATION_MINIMALE = 10;

/** Le premier groupe en `regionId` qui porte assez de `key`. */
function porteurA(state, regionId, key, quantite) {
  return groupes(state).find(
    (g) => g.regionId === regionId && (g.inventaire[key] || 0) >= quantite
  ) || null;
}

function rangDe(all) {
  if (!all) return null;
  let i = 0;
  for (let k = 0; k < RANGS.length; k++) {
    if (all.points >= RANGS[k].points) i = k;
  }
  return { index: i, def: RANGS[i], suivant: RANGS[i + 1] || null };
}

/**
 * L'engagement d'un groupe. C'était `state.player.allegeance` — un seul pour
 * toute la partie —, ce qui rendait les trois voies exclusives : on ne pouvait
 * pas envoyer une colonne au service des Corpos pendant qu'une autre bâtit un
 * camp. C'est pourtant exactement comme ça qu'une compagnie de mercenaires
 * travaille, et c'est ce qui rend les voies complémentaires plutôt que
 * concurrentes.
 *
 * La réputation, elle, reste au joueur : une faction sait qui vous êtes, pas
 * quelle colonne se tient devant elle.
 */
function allegeanceDe(g) {
  return (g && g.allegeance) || null;
}

/** Les groupes actuellement au service de quelqu'un. */
function groupesEngages(state, faction) {
  return (state.player.groupes || []).filter(
    (g) => g.allegeance && (!faction || g.allegeance.faction === faction)
  );
}

/** Le meilleur grade obtenu auprès de cette faction, tous groupes confondus. */
function meilleurGrade(state, faction) {
  let best = null;
  for (const g of groupesEngages(state, faction)) {
    const r = rangDe(g.allegeance);
    if (!best || r.index > best.index) best = r;
  }
  return best;
}

function estAuService(state, faction, groupe) {
  if (groupe) return !!(groupe.allegeance && groupe.allegeance.faction === faction);
  return groupesEngages(state, faction).length > 0;
}

/** Remise consentie par sa propre faction, 0 ailleurs. */
function remiseDe(state, faction) {
  if (!estAuService(state, faction)) return 0;
  const r = meilleurGrade(state, faction);
  return r ? r.def.remise : 0;
}

/** Palier d'équipement supplémentaire débloqué chez les siens. */
function palierBonus(state, faction) {
  const r = meilleurGrade(state, faction);
  return r && r.index >= 2 ? 1 : 0;
}

// ---------------------------------------------------------------------------
// Entrer et sortir
// ---------------------------------------------------------------------------

function peutSEngager(state, faction, groupe) {
  const g = groupe || groupeActif(state);
  if (!FACTIONS[faction] || faction === 'essaim') {
    return { ok: false, motif: 'Cette faction n’enrôle personne.' };
  }
  if (g && g.allegeance) {
    return { ok: false, motif: `${g.nom} sert déjà ${FACTIONS[g.allegeance.faction].genitif}.` };
  }
  // On ne sert pas deux camps en guerre l'un contre l'autre, même avec deux
  // colonnes différentes : ça se sait.
  for (const autre of groupesEngages(state)) {
    const enGuerre = state.world.guerres.some(
      (w) => (w.a === faction && w.b === autre.allegeance.faction)
        || (w.b === faction && w.a === autre.allegeance.faction)
    );
    if (enGuerre) {
      return {
        ok: false,
        motif: `${autre.nom} sert ${FACTIONS[autre.allegeance.faction].genitif}, en guerre contre eux.`,
      };
    }
  }
  const rep = state.player.reputation[faction] || 0;
  if (rep < REPUTATION_MINIMALE) {
    return { ok: false, motif: `Réputation insuffisante : ${Math.round(rep)} / ${REPUTATION_MINIMALE}.` };
  }
  return { ok: true };
}

function sEngager(state, faction, log, groupe) {
  const g = groupe || groupeActif(state);
  if (!g) return { ok: false, motif: 'Aucun groupe.' };
  const v = peutSEngager(state, faction, g);
  if (!v.ok) return v;

  g.allegeance = {
    faction,
    points: 0,
    depuis: state.temps,
    ordre: null,
    prochainOrdre: state.temps + 60,
    // Dernière fois qu'on est passé à l'intendance.
    intendance: state.temps,
    manques: 0,
    derniereSolde: state.temps,
    // Ce dont on répond : les actes ordonnés qui attendent leur issue, et ce
    // qu'on a déjà mis à votre charge.
    actes: [],
    fautes: 0,
    // Le morceau de carte dont on répondra à partir de Lieutenant.
    secteur: null,
  };

  // On ne choisit pas un camp sans que l'autre le remarque.
  for (const w of state.world.guerres) {
    const autre = w.a === faction ? w.b : w.b === faction ? w.a : null;
    if (!autre) continue;
    state.player.reputation[autre] = Math.max(-100, (state.player.reputation[autre] || 0) - 20);
  }

  log({
    type: 'allegeance',
    texte: `${g.nom} entre au service ${FACTIONS[faction].genitif}. Rang : ${RANGS[0].nom}.`,
    important: true,
    groupe: g.id,
  });
  return { ok: true };
}

function quitter(state, log, groupe) {
  const g = groupe || groupeActif(state);
  const all = allegeanceDe(g);
  if (!all) return { ok: false, motif: 'Cette colonne ne sert personne.' };
  const f = all.faction;
  g.allegeance = null;
  state.player.reputation[f] = Math.max(-100, (state.player.reputation[f] || 0) - 30);
  log({
    type: 'allegeance',
    texte: `Vous rompez avec ${FACTIONS[f].nom}. On n’oublie pas ce genre de départ.`,
    important: true,
  });
  return { ok: true };
}

/** Points de service gagnés. Retourne le nombre de grades franchis. */
// ---------------------------------------------------------------------------
// Garnison
// ---------------------------------------------------------------------------

/** Grade à partir duquel les villes des siens vous logent. */
const RANG_GARNISON = 2; // Lieutenant

/**
 * Ce qu'une ville de votre faction vous offre quand vous y avez un grade.
 *
 * C'est le pendant de l'avant-poste, et le lien entre la deuxième voie et la
 * troisième plutôt que leur concurrence : le colon se bâtit une maison,
 * l'engagé se la fait prêter. On y dort à l'abri et on y est soigné — ce que
 * coûterait sinon un baraquement et une infirmerie.
 */
function garnison(state, regionId, groupe) {
  const g = groupe || (state.player.groupes || []).find((x) => x.regionId === regionId);
  const all = allegeanceDe(g);
  if (!all) return null;
  if (rangDe(all).index < RANG_GARNISON) return null;
  const r = state.world.regions[regionId];
  if (!r || !r.colonie) return null;
  const col = state.world.colonies.find((c) => c.id === r.colonie);
  if (!col || col.ruine || col.faction !== all.faction) return null;
  return col;
}

// ---------------------------------------------------------------------------
// Intendance
// ---------------------------------------------------------------------------

/** Au-delà, on ne cumule plus : une intendance n'est pas un compte en banque. */
const JOURS_INTENDANCE = 5;

/**
 * Ce qui distingue vraiment cette voie des deux autres : on ne vous paie pas
 * pour que vous achetiez à manger, on vous nourrit. Le colon produit ses
 * vivres, le nomade les achète, l'engagé les touche.
 *
 * Il faut passer les prendre : une escouade partie dix jours sur les routes ne
 * touche rien pendant dix jours, et ne rattrape que cinq jours d'arriéré. C'est
 * ce qui empêche l'intendance d'être un robinet et en fait une raison de
 * repasser chez soi.
 */
function droitIntendance(state, col, groupe) {
  const g = groupe || groupeActif(state);
  const all = allegeanceDe(g);
  if (!all) return { ok: false, motif: 'Cette colonne ne sert personne.' };
  if (!col || col.ruine || col.faction !== all.faction) {
    return { ok: false, motif: 'Ce n’est pas une ville des vôtres.' };
  }
  const rep = state.player.reputation[all.faction] || 0;
  if (rep < REPUTATION_MINIMALE) {
    return { ok: false, motif: `On ne vous sert plus : réputation ${Math.round(rep)}.` };
  }
  const rang = rangDe(all);
  const jours = Math.min(
    JOURS_INTENDANCE,
    (state.temps - (all.intendance ?? all.depuis ?? 0)) / 24
  );
  const du = Math.floor(jours * (rang.def.ration || 0));
  if (du < 1) return { ok: false, motif: 'Rien à toucher pour l’instant.' };
  // On ne puise pas dans le grenier du village : une faction nourrit ses gens
  // sur ses propres deniers. C'est la différence entre une réquisition et une
  // intendance — et c'est aussi ce qui rend la chose possible, les villes ne
  // gardant quasiment aucune réserve (vingt-quatre sur quatre-vingt-deux en
  // avaient une, mesuré à deux mille heures).
  const f = state.world.factions[all.faction];
  const cout = Math.round(du * COMMODITIES.rations.prix * 0.6);
  if (!f || f.tresor < cout) {
    return { ok: false, motif: `${FACTIONS[all.faction].nom} n’a pas de quoi vous ravitailler.` };
  }
  return { ok: true, quantite: du, cout, rang };
}

function toucherRations(state, col, log, groupe) {
  const g = groupe || groupeActif(state);
  const d = droitIntendance(state, col, g);
  if (!d.ok) return d;
  if (!g || g.regionId !== col.regionId) {
    return { ok: false, motif: 'Il faut être sur place.' };
  }
  const f = state.world.factions[g.allegeance.faction];
  f.tresor = Math.max(0, f.tresor - d.cout);
  g.inventaire.rations = (g.inventaire.rations || 0) + d.quantite;
  g.allegeance.intendance = state.temps;
  if (log) {
    log({
      type: 'allegeance',
      texte: `Intendance de ${col.nom} : ${d.quantite} rations touchées.`,
      regionId: col.regionId,
    });
  }
  return { ok: true, quantite: d.quantite };
}

// ---------------------------------------------------------------------------

function crediter(state, points, log, motif, groupe) {
  const all = allegeanceDe(groupe || groupeActif(state));
  if (!all || points <= 0) return 0;
  const avant = rangDe(all).index;
  all.points += points;
  const apres = rangDe(all).index;
  if (apres > avant) {
    log({
      type: 'allegeance',
      texte: `${FACTIONS[all.faction].nom} vous élève au rang de ${RANGS[apres].nom}. ${RANGS[apres].desc}`,
      important: true,
    });
  } else if (motif) {
    log({ type: 'allegeance', texte: `${motif} (+${Math.round(points)} au service).`, discret: true });
  }
  return apres - avant;
}

// ---------------------------------------------------------------------------
// Ordres de mission
// ---------------------------------------------------------------------------
// Un contrat que la faction vous impose plutôt que de vous proposer. Mieux
// payé, et le refuser se paie.

function villesDe(state, faction) {
  return state.world.colonies.filter((c) => !c.ruine && c.faction === faction);
}

/** Où se trouve celui à qui on donne l'ordre. */
function positionJoueur(state) {
  const g = state.player.groupes.find((x) => x.membres.length);
  return g ? g.regionId : 0;
}

/**
 * Le délai d'un ordre doit suivre la distance, pas une fourchette fixe.
 *
 * Sur la carte de 10×8, deux cent quarante heures suffisaient pour aller
 * n'importe où et revenir. Sur 24×18 elles ne suffisent parfois même pas à
 * l'aller, et le banc l'a chiffré : un ordre et demi honoré par partie sur une
 * vingtaine reçus. Comme les points de service ne viennent que de là, personne
 * ne dépassait jamais le premier grade.
 */
function delai(d, rng, base = 200) {
  return Math.round((base + d * 26) * rng.range(0.95, 1.35));
}

function fabriquerOrdre(state, rng, g) {
  const all = allegeanceDe(g);
  const miennes = villesDe(state, all.faction);
  if (!miennes.length) return null;
  const rang = rangDe(all);
  // On envoie la colonne depuis où elle est, pas depuis où est le joueur.
  const ici = g.regionId;

  // On vise ce qui sert vraiment la faction : ravitailler une ville en manque,
  // frapper un ennemi déclaré, ou reconnaître un secteur convoité.
  const guerres = state.world.guerres.filter((g) => g.a === all.faction || g.b === all.faction);
  const ennemis = guerres.map((g) => (g.a === all.faction ? g.b : g.a));

  const choix = [];
  choix.push(['ravitaillement', 3]);
  if (ennemis.length) choix.push(['frappe', 3]);
  choix.push(['reconnaissance', 1.5]);
  const type = rng.weighted(choix);

  if (type === 'frappe') {
    const cible = rng.pick(ennemis);
    const victoires = 1 + rng.int(1 + rang.index);
    return {
      id: idDepuisRng(rng, 'o'),
      type: 'frappe',
      cibleFaction: cible,
      victoires,
      progres: 0,
      titre: `${victoires} victoire${victoires > 1 ? 's' : ''} contre ${FACTIONS[cible].nom}`,
      recompense: Math.round(victoires * rng.irange(300, 560) * (1 + rang.index * 0.25)),
      service: Math.round(victoires * 45 * (1 + rang.index * 0.2)),
      // Une frappe ne demande pas d'aller quelque part de précis, mais de
      // croiser l'ennemi : on laisse le temps que ça prend.
      duree: rng.irange(420, 700),
    };
  }

  if (type === 'reconnaissance') {
    // Un secteur à portée, pas un point tiré au hasard sur quatre cent
    // trente-deux : on n'envoie pas quelqu'un à trente régions de là avec deux
    // cents heures pour y être.
    let inconnues = state.world.regions.filter(
      (r) => !r.decouvert && distance(r.i, ici) <= 8
    );
    if (!inconnues.length) {
      const toutes = state.world.regions.filter((r) => !r.decouvert);
      if (!toutes.length) return null;
      // Rien de proche : on prend le plus proche de ce qui reste.
      inconnues = [toutes.reduce(
        (a, b) => (distance(b.i, ici) < distance(a.i, ici) ? b : a)
      )];
    }
    const r = rng.pick(inconnues);
    const d = distance(r.i, ici);
    return {
      id: idDepuisRng(rng, 'o'),
      type: 'reconnaissance',
      regionId: r.i,
      titre: `Reconnaître le secteur ${String.fromCharCode(65 + r.x)}${r.y + 1}`,
      recompense: Math.round((160 + d * 40) * rng.range(0.9, 1.3) * (1 + rang.index * 0.2)),
      service: Math.round((30 + d * 6) * (1 + rang.index * 0.2)),
      duree: delai(d, rng, 150),
    };
  }

  // Ravitaillement : la ville la plus en peine — pondérée par la distance.
  // Viser la plus en peine où qu'elle soit revenait à envoyer le convoi à
  // l'autre bout du monde à chaque fois.
  let pire = null;
  let pireScore = 0;
  let pireManque = 0;
  let ressource = 'rations';
  for (const col of miennes) {
    const d = distance(col.regionId, ici);
    for (const k of ['rations', 'composant', 'alliage', 'medkit', 'carburant']) {
      const manque = Math.max(0, col.pop * 0.25 - (col.stock[k] || 0));
      const score = manque / (1 + d * 0.55);
      if (score > pireScore) {
        pireScore = score; pireManque = manque; pire = col; ressource = k;
      }
    }
  }
  if (!pire) pire = rng.pick(miennes);
  const quantite = Math.max(15, Math.min(120, Math.round(pireManque * rng.range(0.3, 0.6)) || 30));
  return {
    id: idDepuisRng(rng, 'o'),
    type: 'ravitaillement',
    colonieId: pire.id,
    ressource,
    quantite,
    titre: `Ravitailler ${pire.nom} : ${quantite} ${COMMODITIES[ressource].nom.toLowerCase()}`,
    recompense: Math.round(COMMODITIES[ressource].prix * quantite * rng.range(1.8, 2.6)),
    service: Math.round(quantite * 1.5 + 30),
    duree: delai(distance(pire.regionId, ici), rng, 220),
  };
}

function avancementOrdre(state, o, groupe) {
  if (!o) return null;
  switch (o.type) {
    case 'frappe':
      return { fait: o.progres, total: o.victoires, pret: o.progres >= o.victoires,
        texte: `${o.progres} / ${o.victoires}` };
    case 'reconnaissance': {
      const vu = state.world.regions[o.regionId].decouvert;
      return { fait: vu ? 1 : 0, total: 1, pret: vu, texte: vu ? 'secteur vu' : 'non exploré' };
    }
    case 'ravitaillement': {
      // Le groupe qui livre n'a pas d'importance : ce qui compte, c'est qu'un
      // groupe soit sur place avec la marchandise.
      const col = colonieParId(state.world, o.colonieId);
      const porteur = col ? porteurA(state, col.regionId, o.ressource, o.quantite) : null;
      const q = Math.max(
        porteur ? Math.floor(porteur.inventaire[o.ressource] || 0) : 0,
        Math.max(0, ...groupes(state).map((g) => Math.floor(g.inventaire[o.ressource] || 0)))
      );
      const surPlace = !!porteur;
      return {
        fait: Math.min(q, o.quantite),
        total: o.quantite,
        pret: q >= o.quantite && surPlace,
        texte: `${Math.min(q, o.quantite)} / ${o.quantite}${col ? ` · ${col.nom}` : ''}`,
      };
    }
    default:
      return null;
  }
}

/** Une victoire compte pour l'ordre en cours, comme pour les primes. */
function compterVictoireOrdre(state, factionBande, groupe) {
  // Toute colonne engagée qui a une frappe en cours en profite : c'est le même
  // ennemi qui tombe, et la nouvelle remonte.
  for (const g of groupesEngages(state)) {
    if (groupe && g.id !== groupe.id) continue;
    const all = g.allegeance;
    if (!all.ordre || all.ordre.type !== 'frappe') continue;
    if (all.ordre.cibleFaction === factionBande) {
      all.ordre.progres = Math.min(all.ordre.victoires, all.ordre.progres + 1);
    }
  }
}

// ---------------------------------------------------------------------------
// Tick
// ---------------------------------------------------------------------------

function tickAllegeance(state, log, ctx) {
  // Chaque colonne a son engagement, son grade et ses ordres : c'est ce qui
  // permet d'en envoyer une servir les Corpos pendant qu'une autre bâtit.
  for (const g of state.player.groupes) {
    if (g.allegeance) tickEngagement(state, g, log, ctx);
  }
}

function tickEngagement(state, g, log, ctx) {
  const all = g.allegeance;
  const rng = ctx.rng;
  const f = state.world.factions[all.faction];

  // Une faction éteinte ne commande plus personne.
  if (!f || !f.colonies.length) {
    log({
      type: 'allegeance',
      texte: `${FACTIONS[all.faction].nom} n’existe plus. L’engagement de ${g.nom} tombe avec elle.`,
      important: true,
      groupe: g.id,
    });
    g.allegeance = null;
    return;
  }

  const rang = rangDe(all);

  // Solde versée tous les jours, à partir du grade d'Agent.
  if (rang.def.solde > 0 && state.temps - all.derniereSolde >= 24) {
    all.derniereSolde = state.temps;
    state.player.credits += rang.def.solde;
    log({
      type: 'solde',
      texte: `Solde ${FACTIONS[all.faction].genitif} : ${rang.def.solde} cr.`,
      discret: true,
    });
  }

  // Ordre en cours : validation, échéance.
  if (all.ordre) {
    const p = avancementOrdre(state, all.ordre, g);
    if (p && p.pret) {
      const o = all.ordre;
      if (o.type === 'ravitaillement') {
        const col = colonieParId(state.world, o.colonieId);
        const porteur = col ? porteurA(state, col.regionId, o.ressource, o.quantite) : null;
        if (porteur) porteur.inventaire[o.ressource] -= o.quantite;
        if (col) col.stock[o.ressource] = (col.stock[o.ressource] || 0) + o.quantite;
      }
      state.player.credits += o.recompense;
      state.player.reputation[all.faction] = Math.min(100, (state.player.reputation[all.faction] || 0) + 5);
      all.ordre = null;
      all.prochainOrdre = state.temps + rng.irange(120, 260);
      state.stats.ordresRemplis = (state.stats.ordresRemplis || 0) + 1;
      crediter(state, o.service, log, null, g);
      log({
        type: 'allegeance',
        texte: `Ordre exécuté : ${o.titre}. ${o.recompense} cr.`,
        important: true,
      });
    } else if (state.temps > all.ordre.echeance) {
      const o = all.ordre;
      all.ordre = null;
      all.prochainOrdre = state.temps + rng.irange(180, 320);
      // Rater est neutre, réussir paie. On ne retire plus les points acquis :
      // à −80 % du service par ordre manqué, on avançait de trois pas et on en
      // reculait de deux, et le banc l'a chiffré — quarante-quatre escouades sur
      // quarante-huit ne quittaient jamais le premier grade. Ce qu'on perd,
      // c'est l'estime, et elle finit par fermer l'intendance.
      state.player.reputation[all.faction] = Math.max(-100, (state.player.reputation[all.faction] || 0) - 3);
      all.manques = (all.manques || 0) + 1;
      log({
        type: 'allegeance',
        texte: `Ordre non exécuté : ${o.titre}. On le note.`,
        important: true,
      });
    }
  } else if (state.temps >= all.prochainOrdre) {
    const o = fabriquerOrdre(state, rng, g);
    if (o) {
      o.echeance = state.temps + o.duree;
      all.ordre = o;
      log({
        type: 'allegeance',
        texte: `Ordre de mission ${FACTIONS[all.faction].genitif} : ${o.titre} (${o.recompense} cr).`,
        important: true,
      });
    } else {
      all.prochainOrdre = state.temps + 120;
    }
  }

  // Au grade de Capitaine, les siens viennent parfois prêter main-forte.
  if (rang.index >= 3 && state.player.secours === undefined) state.player.secours = 0;
}

/**
 * Renfort : à partir de Capitaine, une escouade amie peut arriver au milieu
 * d'un combat livré en territoire ami. Retourne le nombre de renforts.
 */
function renfortsDisponibles(state, groupe) {
  const g = groupe || groupeActif(state);
  if (!g) return 0;
  const all = allegeanceDe(g);
  if (!all) return 0;
  const rang = rangDe(all);
  if (rang.index < 3) return 0;
  const r = state.world.regions[g.regionId];
  if (r.controle !== all.faction) return 0;
  return rang.index - 2;
}

// ===== src/connaissance.js ===========================================
// Ce que le joueur sait, par opposition à ce qui est.
//
// Règle unique, et volontairement simple : là où on a quelqu'un, on voit en
// temps réel ; partout ailleurs on lit le dernier relevé, avec sa date. Une
// ville qu'on a quittée il y a trois mois affiche la population, les stocks et
// le drapeau d'il y a trois mois — et le drapeau a peut-être changé.
//
// C'est ce qui donne une valeur à envoyer quelqu'un quelque part : une paire
// d'yeux postée dans une ville rapporte du renseignement frais, et le
// renseignement frais est ce qui permet de décider. Sans ce module, explorer ne
// rapportait rien qui se monnaye et détacher un éclaireur était une perte
// sèche — le banc d'équilibrage l'a chiffré.


/** Au-delà, l'information est trop vieille pour valoir mieux que rien. */
const PEREMPTION = 24 * 120; // quatre saisons

function creerConnaissance(t = 0) {
  return { colonies: {}, regions: {}, maj: t };
}

// ---------------------------------------------------------------------------
// Ce qu'on voit
// ---------------------------------------------------------------------------

/**
 * Les régions sous surveillance à cet instant : celles où l'on a quelqu'un de
 * vivant, l'avant-poste, et ce que la portée optique ajoute autour.
 */
function regionsVues(state) {
  const vues = new Set();
  const portee = state.base.recherche.optique || 0;
  const ajouter = (rid) => {
    vues.add(rid);
    if (!portee) return;
    for (const r of state.world.regions) {
      if (distance(r.i, rid) <= portee) vues.add(r.i);
    }
  };
  for (const g of groupes(state)) {
    if (g.membres.some(estVivant)) ajouter(g.regionId);
  }
  if (state.base.fonde) ajouter(state.base.regionId);

  // Servir une faction, c'est recevoir ses rapports. À partir d'Agent, ses
  // villes ne sont plus jamais une surprise : c'est la contrepartie concrète
  // d'un grade, et ça vaut mieux qu'une remise de deux pour cent.
  // Chaque colonne engagée rapporte ce que sa faction lui transmet.
  for (const g of groupes(state)) {
    const all = g.allegeance;
    if (!all || rangDe(all).index < 1) continue;
    for (const col of state.world.colonies) {
      if (!col.ruine && col.faction === all.faction) vues.add(col.regionId);
    }
  }
  return vues;
}

// ---------------------------------------------------------------------------
// Relevés
// ---------------------------------------------------------------------------

function releverColonie(col, t) {
  const stock = {};
  for (const k of COMMODITY_KEYS) stock[k] = Math.round(col.stock[k] || 0);
  return {
    t,
    nom: col.nom,
    regionId: col.regionId,
    faction: col.faction,
    taille: col.taille,
    pop: Math.round(col.pop),
    defense: Math.round(col.defense),
    defenseMax: Math.round(col.defenseMax),
    unrest: Number((col.unrest || 0).toFixed(2)),
    ruine: !!col.ruine,
    stock,
  };
}

function releverRegion(r, t) {
  return { t, controle: r.controle, colonie: r.colonie };
}

/**
 * Met à jour les relevés des lieux sous surveillance. Appelé à chaque heure de
 * jeu : c'est deux ou trois régions en pratique, pas la carte entière.
 */
function observer(state) {
  const c = state.connaissance || (state.connaissance = creerConnaissance(state.temps));
  const t = state.temps;
  for (const rid of regionsVues(state)) {
    const r = state.world.regions[rid];
    if (!r) continue;
    c.regions[rid] = releverRegion(r, t);
    const col = state.world.colonies.find((x) => x.regionId === rid);
    if (col) c.colonies[col.id] = releverColonie(col, t);
  }
  // Un contremaître qui vous apprécie assez laisse ses registres ouverts : ses
  // chiffres restent frais même à l'autre bout de la carte. C'est le seul moyen
  // de savoir sans être là, et il s'achète en rendant des services, pas en
  // payant.
  //
  // Toutes les trois heures et pas toutes les heures : une ville n'avance elle
  // -même que par tranches de trois (voir PAS_COLONIE), donc relever plus
  // souvent ne relève rien de neuf — et balayer la carte à chaque tick coûtait
  // un cinquième du budget pour ça.
  if (t % 3 === 0) {
    for (const col of state.world.colonies) {
      if (col.ruine) continue;
      const cm = notable(col, 'contremaitre');
      if (cm && (cm.opinion || 0) >= REGISTRES_SEUIL) c.colonies[col.id] = releverColonie(col, t);
    }
  }
  c.maj = t;
}

// ---------------------------------------------------------------------------
// Lecture
// ---------------------------------------------------------------------------

/**
 * Ce que le joueur sait d'une colonie. Retourne toujours un objet lisible :
 * `frais` dit si c'est de première main, `depuis` l'âge du relevé en heures,
 * `inconnu` si on n'y a jamais mis les pieds.
 *
 * L'interface ne doit jamais lire `col` directement pour un lieu où l'escouade
 * n'est pas — c'est tout l'intérêt de passer par ici.
 */
function vueColonie(state, col) {
  if (!col) return null;
  const c = state.connaissance;
  const surPlace = c && estSurveillee(state, col.regionId);
  if (surPlace) {
    return Object.assign(releverColonie(col, state.temps), { frais: true, depuis: 0, inconnu: false });
  }
  const releve = c && c.colonies[col.id];
  if (!releve) {
    return {
      t: null, nom: col.nom, regionId: col.regionId, faction: null, taille: null,
      pop: null, defense: null, defenseMax: null, unrest: null, ruine: false,
      stock: {}, frais: false, depuis: null, inconnu: true,
    };
  }
  return Object.assign({}, releve, {
    frais: false,
    depuis: state.temps - releve.t,
    inconnu: false,
    perime: state.temps - releve.t > PEREMPTION,
  });
}

/** Idem pour une région : qui la tenait la dernière fois qu'on a regardé. */
function vueRegion(state, regionId) {
  const r = state.world.regions[regionId];
  if (!r) return null;
  if (estSurveillee(state, regionId)) {
    return { controle: r.controle, colonie: r.colonie, frais: true, depuis: 0, inconnu: false };
  }
  const releve = state.connaissance && state.connaissance.regions[regionId];
  if (!releve) return { controle: null, colonie: r.colonie, frais: false, depuis: null, inconnu: true };
  return {
    controle: releve.controle,
    colonie: releve.colonie,
    frais: false,
    depuis: state.temps - releve.t,
    inconnu: false,
  };
}

/**
 * Y a-t-il un œil ici, maintenant ? Recalculé à chaque appel plutôt que mis en
 * cache : un cache de module survivrait au groupe qui bouge en cours de tick et
 * mentirait d'une heure, pour économiser quelques dizaines d'itérations.
 */
function estSurveillee(state, regionId) {
  const portee = state.base.recherche.optique || 0;
  for (const g of groupes(state)) {
    if (!g.membres.some(estVivant)) continue;
    if (g.regionId === regionId) return true;
    if (portee && distance(g.regionId, regionId) <= portee) return true;
  }
  if (state.base.fonde) {
    if (state.base.regionId === regionId) return true;
    if (portee && distance(state.base.regionId, regionId) <= portee) return true;
  }
  const col = state.world.colonies.find((c) => c.regionId === regionId);
  if (col && !col.ruine) {
    for (const g of groupes(state)) {
      const all = g.allegeance;
      if (all && rangDe(all).index >= 1 && col.faction === all.faction) return true;
    }
  }
  return false;
}

/** « il y a 3 j » — la date compte autant que le chiffre qu'elle accompagne. */
function ageTexte(depuis) {
  if (depuis == null) return 'jamais vu';
  if (depuis <= 0) return 'à l’instant';
  if (depuis < 24) return `il y a ${Math.round(depuis)} h`;
  const j = Math.round(depuis / 24);
  return `il y a ${j} j`;
}

// ---------------------------------------------------------------------------
// Les nouvelles voyagent
// ---------------------------------------------------------------------------

/**
 * Heures qu'une nouvelle met à parvenir, selon son type. Une guerre se
 * proclame — hérauts, émissaires, tout le monde le sait vite. Une ville qui
 * tombe se sait plus lentement, et une ville qui grossit n'intéresse personne
 * avant longtemps.
 *
 * Sans ce délai, la chronique du monde annonçait en direct des villes prises
 * que personne n'avait vues tomber, ce qui vidait de son sens tout le reste du
 * module : la carte devenait un souvenir pendant que le journal restait
 * omniscient.
 */
const DELAI_NOUVELLE = {
  guerre: 12,
  paix: 18,
  capture: 48,
  effondrement: 72,
  secession: 60,
  fondation: 96,
  croissance: 120,
  saison: 0,     // on regarde le ciel soi-même
};

/**
 * Ce que le joueur a pu apprendre du monde, avec la mention de la source.
 * Un événement dont il a été témoin est immédiat et sûr ; les autres arrivent
 * avec leur délai et sont donnés pour ce qu'ils sont : des rapports.
 */
function nouvellesConnues(state, entrees) {
  const out = [];
  for (const x of entrees) {
    const temoin = x.regionId != null && x.vu === true;
    if (temoin) { out.push(Object.assign({}, x, { rapporte: false })); continue; }
    const delai = DELAI_NOUVELLE[x.type] ?? 36;
    if (state.temps - x.t < delai) continue;
    out.push(Object.assign({}, x, { rapporte: delai > 0 }));
  }
  return out;
}

// ===== src/formation.js ==============================================
// Les écoles : ce qui s'apprend ailleurs qu'à l'usage.
//
// Un diplôme n'accélère pas la partie, il la réoriente. Il coûte de l'argent,
// et surtout du temps passé sur place — l'élève ne travaille pas, ne se bat pas
// et ne porte rien pendant sa formation, et celle-ci ne progresse que tant qu'il
// est dans la ville qui l'enseigne. Envoyer quelqu'un à l'école, c'est donc se
// priver d'un bras pendant plusieurs semaines, ou détacher un groupe d'une
// personne et le laisser là.
//
// C'est le pendant de l'exercice : l'exercice ne forme qu'au corps et aux
// armes, l'école forme aux métiers.


/** Ce qu'une ville enseigne, d'après qui la tient et ce qu'elle pèse. */
function ecolesDe(world, col) {
  if (!col || col.ruine || !col.faction) return [];
  const style = FACTIONS[col.faction] && FACTIONS[col.faction].style;
  if (!style) return [];
  return DIPLOME_KEYS.filter((k) => {
    const d = DIPLOMES[k];
    return d.styles.includes(style) && col.taille >= d.tailleMin;
  });
}

/** Le prix demandé ici : une grande ville se paie plus cher qu'un poste. */
function prixFormation(col, key, remise = 0) {
  const d = DIPLOMES[key];
  if (!d) return 0;
  return Math.round(d.cout * (0.85 + col.taille * 0.09) * (1 - remise));
}

function peutSInscrire(state, col, perso, key) {
  const d = DIPLOMES[key];
  if (!d) return { ok: false, motif: 'Formation inconnue.' };
  if (!ecolesDe(state.world, col).includes(key)) {
    return { ok: false, motif: 'On n’enseigne pas ça ici.' };
  }
  if (!estVivant(perso)) return { ok: false, motif: 'Pas en état.' };
  if (perso.formation) return { ok: false, motif: `${perso.nom} est déjà en formation.` };
  if ((perso.diplomes || []).includes(key)) {
    return { ok: false, motif: `${perso.nom} a déjà ce diplôme.` };
  }
  // Une école ne reprend pas depuis le début quelqu'un qui la dépasse déjà.
  if (perso.skills[d.skill] >= d.plancher + 25) {
    return { ok: false, motif: `${perso.nom} en sait déjà plus que l’école.` };
  }
  return { ok: true };
}

function inscrire(state, col, perso, key, log) {
  const v = peutSInscrire(state, col, perso, key);
  if (!v.ok) return v;
  // La remise d'une école va à qui sert la maison : n'importe laquelle de vos
  // colonnes engagée chez eux suffit à vous ouvrir le tarif.
  const remise = estAuService(state, col.faction) ? 0.15 : 0;
  const prix = prixFormation(col, key, remise);
  if (state.player.credits < prix) {
    return { ok: false, motif: `Il manque ${prix - state.player.credits} cr.` };
  }
  state.player.credits -= prix;
  perso.formation = {
    key,
    colonieId: col.id,
    restant: DIPLOMES[key].heures,
    total: DIPLOMES[key].heures,
  };
  if (log) {
    log({
      type: 'formation',
      texte: `${perso.nom} entre à l’école : ${DIPLOMES[key].nom} (${prix} cr).`,
      important: true,
      regionId: col.regionId,
    });
  }
  return { ok: true, prix };
}

function abandonnerFormation(perso, state) {
  if (!perso.formation) return { ok: false, motif: 'Aucune formation en cours.' };
  if (state) libererInstructeur(state, perso);
  perso.formation = null;
  return { ok: true };
}

/** En formation, on n'est pas disponible : ni au travail, ni au combat. */
function enFormation(perso) {
  return !!(perso.formation && perso.formation.restant > 0);
}

/**
 * Une heure d'école, pour ceux qui sont au bon endroit. Ailleurs, la formation
 * ne progresse pas — elle attend, et l'élève peut y revenir.
 */
function tickFormation(state, log) {
  const base = state.base;
  for (const g of groupes(state)) {
    const col = state.world.colonies.find((c) => c.regionId === g.regionId && !c.ruine);
    const aLaBase = base && base.fonde && g.regionId === base.regionId;
    for (const c of g.membres) {
      if (!c.formation || !estVivant(c)) continue;

      if (c.formation.maison) {
        // Chez soi : il faut l'avant-poste, le maître à côté, et de quoi manger.
        if (!aLaBase) continue;
        const maitre = presentsBase(state).find((x) => x.id === c.formation.instructeurId);
        if (!maitre || !estVivant(maitre)) continue;
        if ((base.stock.rations || 0) < RATIONS_COURS) continue;
        base.stock.rations -= RATIONS_COURS;
        // Enseigner fait aussi réviser : le maître y gagne, un peu.
        gagnerXp(maitre, DIPLOMES[c.formation.key].skill, XP_PRATIQUE * 0.25);
      } else if (!col || col.id !== c.formation.colonieId) {
