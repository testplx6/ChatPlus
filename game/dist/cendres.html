<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0a0c10">
<meta name="color-scheme" content="dark">
<meta name="description" content="Cendres &amp; Protocole — simulation textuelle post-cyberpunk. Une escouade, un monde qui tourne sans vous.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cendres">
<title>Cendres &amp; Protocole</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0c10'/%3E%3Crect x='3' y='3' width='4' height='4' fill='%234fd0e3'/%3E%3Crect x='9' y='9' width='4' height='4' fill='%23d9a03a'/%3E%3C/svg%3E">
<style>
/* Cendres & Protocole — feuille de style unique.
   Mobile first : tout est pensé pour un pouce sur un écran de 360 px,
   l'affichage large n'est qu'un centrage. */

:root {
  --fond: #0a0c10;
  --fond-2: #11141b;
  --panneau: #151922;
  --panneau-2: #1b2029;
  --bord: #262d3a;
  --bord-vif: #38445a;
  --texte: #c6cedb;
  --texte-2: #7b8699;
  --texte-3: #545e70;
  --cyan: #4fd0e3;
  --ambre: #d9a03a;
  --rouge: #e05b5b;
  --vert: #6be08a;
  --violet: #b06be0;
  --nav-h: 54px;
  --haut-h: 46px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--fond);
  color: var(--texte);
  font-family: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  font-size: 14px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}

body {
  /* Grain léger : le fond ne doit jamais être un aplat mort. */
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px);
}

#racine {
  display: flex;
  flex-direction: column;
  /* On ne dépend pas de la chaîne html/body en 100 % : elle casse en iframe.
     dvh suit la barre d'adresse mobile qui se rétracte au défilement. */
  height: 100vh;
  height: 100dvh;
  max-width: 620px;
  margin: 0 auto;
  border-left: 1px solid var(--bord);
  border-right: 1px solid var(--bord);
}

/* ------------------------------------------------------------------ Barre haute */

#barre-haut {
  flex: 0 0 auto;
  min-height: var(--haut-h);
  padding: 5px 8px;
  padding-top: max(5px, env(safe-area-inset-top));
  background: var(--fond-2);
  border-bottom: 1px solid var(--bord);
  display: flex;
  align-items: center;
  gap: 6px;
  /* Une seule ligne, toujours : l'en-tête ne doit jamais voler de la hauteur
     à la carte sur un petit écran. */
  flex-wrap: nowrap;
  overflow: hidden;
}

/* Les indicateurs rognent par la droite plutôt que de se comprimer : un bloc
   comprimé laisse son libellé déborder sur le voisin, ce qui rend l'en-tête
   illisible dès qu'on y ajoute une information. */
.hd-metriques {
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
  overflow: hidden;
}
.hd-bloc { display: flex; align-items: baseline; gap: 4px; flex: 0 0 auto; }
.hd-eti, .hd-val { flex: 0 0 auto; }
/* La saison tient en un losange coloré : écrire « GRANDES PLUIES » dans une
   barre de 390 px coûte deux autres indicateurs. Le nom complet est dans
   l'infobulle, et l'écran Monde le donne en toutes lettres. */
.hd-saison { font-size: 13px; line-height: 1; }
.hd-cycle { font-size: 11px; color: var(--texte-3); }
.hd-eti { font-size: 8px; letter-spacing: .1em; color: var(--texte-3); text-transform: uppercase; }
.hd-val { font-size: 12px; color: var(--texte); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hd-val.cyan { color: var(--cyan); }
.hd-val.ambre { color: var(--ambre); }
.hd-val.rouge { color: var(--rouge); }
.hd-pousse { margin-left: auto; }

.vitesse { display: flex; border: 1px solid var(--bord); }
.vitesse { flex: 0 0 auto; }
.vitesse button {
  background: transparent;
  border: 0;
  border-right: 1px solid var(--bord);
  color: var(--texte-2);
  font: inherit;
  font-size: 10px;
  padding: 3px 6px;
  min-height: 30px; /* cible tactile : jamais moins */
  cursor: pointer;
}
.vitesse button:last-child { border-right: 0; }
.vitesse button[aria-pressed="true"] { background: var(--cyan); color: #06222a; }

/* ------------------------------------------------------------------ Écran */

#ecran {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 10px 10px 16px;
}

/* ------------------------------------------------------------------ Navigation */

#barre-nav {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  background: var(--fond-2);
  border-top: 1px solid var(--bord);
  padding-bottom: env(safe-area-inset-bottom);
}

#barre-nav button {
  background: transparent;
  border: 0;
  border-top: 2px solid transparent;
  color: var(--texte-3);
  font: inherit;
  font-size: 9px;
  letter-spacing: .04em;
  padding: 9px 1px;
  min-height: var(--nav-h);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  position: relative;
}
#barre-nav button .glyphe { font-size: 15px; line-height: 1; }
#barre-nav button[aria-current="page"] { color: var(--cyan); border-top-color: var(--cyan); }
#barre-nav .pastille {
  position: absolute;
  top: 5px;
  right: 50%;
  transform: translateX(20px);
  min-width: 15px;
  height: 15px;
  padding: 0 3px;
  background: var(--rouge);
  color: #120606;
  font-size: 9px;
  line-height: 15px;
  text-align: center;
}

/* ------------------------------------------------------------------ Briques */

.panneau {
  background: var(--panneau);
  border: 1px solid var(--bord);
  padding: 9px 10px;
  margin-bottom: 9px;
}

.titre {
  font-size: 10px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--texte-3);
  margin: 0 0 7px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.titre .droite { color: var(--texte-2); letter-spacing: .04em; }

.ligne { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; align-items: baseline; }
/* La clé ne se coupe jamais en deux ; c'est la valeur qui cède du terrain. */
.ligne .k { color: var(--texte-2); flex: 0 0 auto; white-space: nowrap; }
.ligne .v { font-variant-numeric: tabular-nums; text-align: right; flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }

/* Deux colonnes de couples clé/valeur : sans séparateur elles se lisent comme
   une seule phrase à rallonge. */
.grille2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 18px; }
.grille2 > .ligne { border-bottom: 1px solid #1b2029; }
.grille3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }

button.act, .act {
  background: var(--panneau-2);
  border: 1px solid var(--bord-vif);
  color: var(--texte);
  font: inherit;
  font-size: 12px;
  padding: 8px 9px;
  cursor: pointer;
  text-align: left;
  width: 100%;
  min-height: 38px;
  display: block;
}
button.act:active { background: var(--bord); }
button.act[disabled] { opacity: .38; cursor: not-allowed; }
button.act[aria-pressed="true"] { border-color: var(--cyan); color: var(--cyan); }
button.act.mini { min-height: 30px; padding: 4px 7px; font-size: 11px; text-align: center; }
button.act.primaire { border-color: var(--cyan); color: var(--cyan); }
button.act.danger { border-color: var(--rouge); color: var(--rouge); }

.pile { display: flex; flex-direction: column; gap: 5px; }
.rangee { display: flex; gap: 5px; flex-wrap: wrap; }
/* `button.act` est plus spécifique que `.rangee > *` : sans reprendre le
   sélecteur complet, sa largeur de 100 % l'emporte et les boutons s'empilent
   au lieu de se ranger sur une ligne. */
.rangee > *, .rangee > button.act { flex: 1 1 auto; width: auto; display: inline-flex;
  align-items: center; justify-content: center; }

.puce {
  display: inline-block;
  font-size: 10px;
  letter-spacing: .08em;
  padding: 1px 5px;
  border: 1px solid var(--bord-vif);
  color: var(--texte-2);
  text-transform: uppercase;
}
.puce.ok { border-color: #2b5c3a; color: var(--vert); }
.puce.att { border-color: #6b5320; color: var(--ambre); }
.puce.mal { border-color: #6b2b2b; color: var(--rouge); }

.jauge { height: 5px; background: #0b0e13; border: 1px solid var(--bord); position: relative; }
.jauge > i { display: block; height: 100%; background: var(--cyan); }
.jauge.rouge > i { background: var(--rouge); }
.jauge.ambre > i { background: var(--ambre); }
.jauge.vert > i { background: var(--vert); }

.aide { font-size: 11px; color: var(--texte-3); line-height: 1.4; }
.mono-num { font-variant-numeric: tabular-nums; }
.sep { height: 1px; background: var(--bord); margin: 8px 0; }

/* ------------------------------------------------------------------ Carte */

/* Repère sous la carte : où l'on est, et comment on la manœuvre. */
.carte-pied {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 5px;
  font-size: 10px;
  color: var(--texte-3);
}
#carte-pos { color: var(--texte-2); white-space: nowrap; }
.carte-pied .aide { text-align: right; }

/* La carte ne tient plus dans un écran de téléphone, et c'est voulu : un monde
   de vingt-quatre sur dix-huit qu'on verrait d'un coup d'œil ne serait pas un
   monde à explorer. On garde donc les pixels gros et on fait défiler, en
   recentrant sur le groupe affiché à chaque rendu. */
#carte-boite {
  border: 1px solid var(--bord);
  background: #05070a;
  line-height: 0;
  overflow: hidden;          /* on gère nous-mêmes le défilement */
  max-height: 52vh;
  height: 52vh;
  /* Sans ça, un glissement vertical sur la carte fait défiler la page et on
     n'atteint jamais le sud du monde. */
  touch-action: none;
  cursor: grab;
  overscroll-behavior: contain;
}
#carte-boite:active { cursor: grabbing; }
#carte {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  pointer-events: none;      /* les gestes sont écoutés sur la boîte */
}

.legende { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 7px; }
.legende span { font-size: 10px; color: var(--texte-3); display: flex; align-items: center; gap: 4px; }
.legende i { width: 8px; height: 8px; display: inline-block; }

/* ------------------------------------------------------------------ Escouade */

.perso { border: 1px solid var(--bord); background: var(--panneau); margin-bottom: 7px; }
.perso > summary {
  padding: 8px 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  list-style: none;
}
.perso > summary::-webkit-details-marker { display: none; }
.perso[open] > summary { border-bottom: 1px solid var(--bord); }
.perso .corps-detail { padding: 9px 10px; }
.perso .nom { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.perso .arch { font-size: 10px; color: var(--texte-3); }

.membres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.membre { border: 1px solid var(--bord); padding: 4px 5px; }
.membre .n { font-size: 9px; color: var(--texte-3); letter-spacing: .06em; }
.membre.perdu { border-color: #6b2b2b; }

.comps { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px 10px; }
.comp-l { display: flex; align-items: center; gap: 6px; font-size: 11px; }
.comp-l .n { color: var(--texte-2); flex: 0 0 68px; }
.comp-l .j { flex: 1 1 auto; }
.comp-l .v { flex: 0 0 26px; text-align: right; font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------------ Journal */

.entree { border-left: 2px solid var(--bord); padding: 4px 0 4px 8px; margin-bottom: 4px; }
.entree .t { font-size: 10px; color: var(--texte-3); }
.entree.danger { border-left-color: var(--rouge); }
.entree.guerre { border-left-color: var(--violet); }
.entree.gain { border-left-color: var(--vert); }
.entree.base { border-left-color: var(--cyan); }
.entree .detail { font-size: 11px; color: var(--texte-3); margin-top: 3px; }

/* ------------------------------------------------------------------ Marché */

.marche-l {
  display: grid;
  grid-template-columns: 1fr auto auto auto;
  gap: 5px;
  align-items: center;
  padding: 3px 0;
  border-bottom: 1px solid #1b2029;
}
.marche-l .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.marche-l .px { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--texte-2); text-align: right; }
.marche-l button { min-height: 28px; padding: 2px 8px; font-size: 11px; width: auto; }

/* ------------------------------------------------------------------ Modale */

#modale[hidden] { display: none; }
#modale {
  position: fixed;
  inset: 0;
  background: rgba(4, 6, 9, .82);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 50;
}
#modale .boite {
  background: var(--panneau);
  border: 1px solid var(--bord-vif);
  width: 100%;
  max-width: 620px;
  max-height: 82vh;
  overflow-y: auto;
  padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
}

/* ------------------------------------------------------------------ Accueil */

.accueil { padding: 18px 4px; }
.accueil h1 {
  font-size: 22px;
  letter-spacing: .16em;
  margin: 0 0 2px;
  color: var(--cyan);
  text-transform: uppercase;
}
.accueil .sous { color: var(--texte-3); font-size: 12px; margin-bottom: 18px; }
.accueil input {
  background: #0b0e13;
  border: 1px solid var(--bord-vif);
  color: var(--texte);
  font: inherit;
  padding: 8px;
  width: 100%;
}

.toast {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom));
  background: var(--panneau-2);
  border: 1px solid var(--bord-vif);
  padding: 7px 12px;
  font-size: 12px;
  z-index: 60;
  max-width: 90%;
  text-align: center;
}
.toast.err { border-color: var(--rouge); color: var(--rouge); }

/* ------------------------------------------------------------------ Groupes */
/* Une ligne de vignettes : où est chacun, ce qu'il fait. Ça défile
   horizontalement plutôt que de se comprimer — à quatre groupes sur 360 px,
   trois mots par vignette ne tiennent pas. */

.groupes {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 3px;
  scrollbar-width: thin;
}
.grp {
  flex: 0 0 auto;
  min-width: 118px;
  min-height: 44px;
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 6px 9px;
  text-align: left;
  background: var(--panneau-2);
  border: 1px solid var(--bord);
  color: var(--texte-2);
  font: inherit;
  font-size: 11px;
  cursor: pointer;
}
.grp.on { border-color: var(--cyan); color: var(--texte); }
.grp-n { font-size: 12px; color: var(--texte); }
.grp.on .grp-n { color: var(--cyan); }
.grp-d { color: var(--texte-3); }
.grp-o { color: var(--texte-2); }

/* Grille de petits boutons : tâches d'un membre, cases de détachement. */
.taches {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin: 6px 0;
}
.taches .act.mini, .taches button.act.mini {
  flex: 0 1 auto;
  width: auto;              /* .act est en pleine largeur : ici on veut une ligne */
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 32px;
}

/* ------------------------------------------------------------------ Rattrapage */
/* Deux ans hors ligne, ça se rejoue : autant le montrer plutôt que de laisser
   croire que la page a planté. */

.rattrapage {
  position: fixed;
  inset: 0;
  z-index: 90;
  background: rgba(10, 12, 16, .93);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.rattrapage-b { width: 100%; max-width: 320px; text-align: center; }
.rattrapage-t { color: var(--cyan); font-size: 13px; letter-spacing: .06em; }
.rattrapage-j { color: var(--texte-2); font-size: 12px; margin: 6px 0 10px; }
.rattrapage-p {
  height: 6px;
  background: var(--panneau);
  border: 1px solid var(--bord);
  overflow: hidden;
}
.rattrapage-p i { display: block; height: 100%; width: 0; background: var(--cyan); }

@media (prefers-reduced-motion: no-preference) {
  .toast { animation: apparait .16s ease-out; }
  @keyframes apparait { from { opacity: 0; transform: translate(-50%, 6px); } }
}

/* ------------------------------------------------------------------ Fil d'actualité */
/* Le retour immédiat : ce qui vient d'arriver, sous les yeux, sans aller
   le chercher dans le journal. */

.fil { display: flex; flex-direction: column; gap: 3px; }
.fil-l {
  display: flex;
  gap: 7px;
  align-items: baseline;
  border-left: 2px solid var(--bord);
  padding-left: 7px;
  font-size: 12px;
  line-height: 1.35;
}
.fil-t { color: var(--texte-3); font-size: 10px; flex: 0 0 auto; font-variant-numeric: tabular-nums; }
.fil-x { flex: 1 1 auto; min-width: 0; }
.fil-l.danger { border-left-color: var(--rouge); }
.fil-l.guerre { border-left-color: var(--violet); }
.fil-l.gain { border-left-color: var(--vert); }
.fil-l.base { border-left-color: var(--cyan); }

/* ------------------------------------------------------------------ Ordres */
/* Chaque bouton annonce ce qu'il rapporte ici : un ordre qui ne rend rien
   doit le dire avant le clic, pas après six heures de travail. */

.grille-ordres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
button.act.ordre {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  min-height: 46px;
  padding: 6px 7px;
}
.o-n { font-size: 12px; }
.o-r { font-size: 10px; color: var(--texte-3); font-variant-numeric: tabular-nums; }
button.act.ordre[aria-pressed="true"] .o-r { color: var(--cyan); }

.alerte { color: var(--rouge); }

/* ------------------------------------------------------------------ Sites, contrats, étal */

.panneau.site { border-color: var(--ambre); }

.traits { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 5px; }

.contrat { border-bottom: 1px solid #1b2029; padding: 7px 0; }
.contrat:last-child { border-bottom: 0; }
.contrat-t { font-size: 13px; margin: 2px 0 5px; }
.contrat button { margin-top: 5px; }

.article { border-bottom: 1px solid #1b2029; padding: 7px 0; }
.article:last-child { border-bottom: 0; }
.article button { margin-top: 5px; }

.hd-val.ambre, .v.ambre { color: var(--ambre); }

#barre-nav .pastille.calme { background: var(--bord-vif); color: var(--texte); }

/* ------------------------------------------------------------------ Mémorial */
/* Une stèle, pas une ligne de log : les morts d'une escouade qu'on a fait
   progresser pendant des semaines méritent une fiche. */

.stele {
  border-left: 2px solid var(--bord-vif);
  padding: 4px 0 4px 8px;
  margin-bottom: 5px;
}
.stele .k { color: var(--texte); }
</style>
</head>
<body>
  <div id="racine">
    <header id="barre-haut"></header>
    <main id="ecran"></main>
    <nav id="barre-nav"></nav>
  </div>
  <div id="modale" hidden></div>
  <noscript>Ce jeu a besoin de JavaScript : toute la simulation tourne dans votre navigateur.</noscript>
<script type="module">
// ===== src/rng.js ====================================================
// Générateur pseudo-aléatoire déterministe (mulberry32).
// L'état tient dans un seul entier 32 bits : la sauvegarde est donc exacte,
// et rejouer la même partie depuis la même graine donne le même monde.

class Rng {
  constructor(seed = 1) {
    this.s = seed >>> 0;
  }

  u32() {
    this.s = (this.s + 0x6d2b79f5) >>> 0;
    let t = this.s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return (t ^ (t >>> 14)) >>> 0;
  }

  /** Flottant dans [0, 1) */
  f() {
    return this.u32() / 4294967296;
  }

  /** Entier dans [0, n) */
  int(n) {
    return Math.floor(this.f() * n);
  }

  /** Entier dans [a, b] inclus */
  irange(a, b) {
    if (b < a) return a;
    return a + this.int(b - a + 1);
  }

  /** Flottant dans [a, b) */
  range(a, b) {
    return a + this.f() * (b - a);
  }

  chance(p) {
    return this.f() < p;
  }

  pick(arr) {
    return arr[this.int(arr.length)];
  }

  /** Tirage pondéré : [[valeur, poids], ...] */
  weighted(entries) {
    let total = 0;
    for (const e of entries) total += e[1];
    if (total <= 0) return entries.length ? entries[0][0] : null;
    let r = this.f() * total;
    for (const e of entries) {
      r -= e[1];
      if (r <= 0) return e[0];
    }
    return entries[entries.length - 1][0];
  }

  shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = this.int(i + 1);
      const t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  }

  /** Loi normale approchée (somme de 3 uniformes), bornée à ±3 écarts-types */
  gauss(mean = 0, sd = 1) {
    const u = (this.f() + this.f() + this.f()) / 3;
    return mean + (u - 0.5) * 3.464 * sd;
  }

  save() {
    return this.s >>> 0;
  }
}

/** Graine à partir d'une chaîne (pour les graines saisies par le joueur). */
function seedFromString(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}

    mineral: 0.95,
    marche: 1.3,
    aleas: 1.4,
    rencontres: 0.8,
    faim: 1.15,
  },
};

const ORDRE_SAISONS = ['accalmie', 'seche', 'pluies', 'cendres'];

/** Une année de jeu : quatre saisons de trente jours. Tout ce qui vieillit s'y
 *  rapporte — sans ça, on fait vieillir les gens trois fois trop lentement. */
const HEURES_PAR_AN = HEURES_PAR_SAISON * ORDRE_SAISONS.length;

/** Saison courante, déduite de l'horloge : rien à stocker, rien à désynchroniser. */
function saison(t) {
  const index = Math.floor(t / HEURES_PAR_SAISON) % ORDRE_SAISONS.length;
  const key = ORDRE_SAISONS[index];
  const jour = Math.floor((t % HEURES_PAR_SAISON) / 24) + 1;
  const annee = Math.floor(t / (HEURES_PAR_SAISON * ORDRE_SAISONS.length)) + 1;
  return { key, index, jour, annee, def: SAISONS[key] };
}

// ---------------------------------------------------------------------------
// Météo
// ---------------------------------------------------------------------------
// Elle change toutes les quelques heures et vaut pour toute la carte : une
// tempête est un événement du monde, pas une propriété de case.

const METEO = {
  clair: {
    nom: 'Ciel dégagé',
    texte: 'Visibilité franche jusqu’à l’horizon.',
    couleur: '#c6cedb',
    rendement: 1.0, marche: 1.0, aleas: 1.0, rencontres: 1.0, vue: 1.3,
  },
  couvert: {
    nom: 'Couvert',
    texte: 'Un plafond bas, sans caractère.',
    couleur: '#7b8699',
    rendement: 1.0, marche: 1.0, aleas: 1.0, rencontres: 1.0, vue: 1.0,
  },
  vent_cendre: {
    nom: 'Vent de cendre',
    texte: 'La cendre rentre dans les yeux, les filtres, les plaies.',
    couleur: '#8a8f9a',
    rendement: 0.75, marche: 1.25, aleas: 1.4, rencontres: 0.7, vue: 0.4,
  },
  pluie_acide: {
    nom: 'Pluie acide',
    texte: 'Ça grésille sur les armures. Rester dehors coûte.',
    couleur: '#b06be0',
    rendement: 0.65, marche: 1.15, aleas: 1.8, rencontres: 0.6, vue: 0.7,
  },
  brouillard: {
    nom: 'Brouillard statique',
    texte: 'Le brouillard porte du signal. Personne ne voit personne.',
    couleur: '#4fd0e3',
    rendement: 0.85, marche: 1.3, aleas: 1.1, rencontres: 0.45, vue: 0.2,
  },
  orage_sec: {
    nom: 'Orage sec',
    texte: 'Des éclairs sans une goutte d’eau. Le métal chante.',
    couleur: '#e0d36b',
    rendement: 0.9, marche: 1.1, aleas: 1.5, rencontres: 0.9, vue: 0.9,
  },
  canicule: {
    nom: 'Canicule',
    texte: 'L’air tremble au ras du sol. On travaille moins, on boit plus.',
    couleur: '#e05b5b',
    rendement: 0.8, marche: 1.2, aleas: 1.3, rencontres: 1.0, vue: 1.1,
  },
};

const METEO_KEYS = Object.keys(METEO);

/** Probabilités de météo selon la saison : chaque saison a son répertoire. */
const REPERTOIRE = {
  accalmie: [['clair', 5], ['couvert', 3], ['vent_cendre', 1], ['orage_sec', 1], ['brouillard', 0.8]],
  seche: [['clair', 4], ['canicule', 4], ['orage_sec', 2], ['vent_cendre', 2], ['couvert', 1.5]],
  pluies: [['pluie_acide', 5], ['couvert', 3], ['brouillard', 2.5], ['orage_sec', 1.5], ['clair', 1]],
  cendres: [['vent_cendre', 5], ['couvert', 4], ['brouillard', 2], ['clair', 1.2], ['orage_sec', 1]],
};

function creerMeteo(rng, t) {
  const s = saison(t);
  return {
    type: rng.weighted(REPERTOIRE[s.key]),
    restant: rng.irange(5, 22),
  };
}

/**
 * Une heure de climat. Retourne une entrée de journal si le temps a tourné,
 * sinon null — un changement de météo mérite d'être dit.
 */
function tickClimat(world, t, rng) {
  if (!world.meteo) {
    world.meteo = creerMeteo(rng, t);
    return null;
  }
  world.meteo.restant -= 1;
  if (world.meteo.restant > 0) return null;

  const avant = world.meteo.type;
  const suivant = creerMeteo(rng, t);
  world.meteo = suivant;
  if (suivant.type === avant) return null;
  return {
    type: 'meteo',
    texte: `${METEO[suivant.type].nom}. ${METEO[suivant.type].texte}`,
  };
}

// ---------------------------------------------------------------------------
// Effets combinés
// ---------------------------------------------------------------------------

const MINERAUX = new Set(['minerai', 'ferraille', 'alliage', 'isotope', 'composant']);

/** Multiplicateurs applicables ici et maintenant. */
function conditions(world, t) {
  const s = saison(t);
  const m = METEO[world.meteo ? world.meteo.type : 'couvert'];
  return {
    saison: s,
    meteo: m,
    meteoKey: world.meteo ? world.meteo.type : 'couvert',
    marche: s.def.marche * m.marche,
    aleas: s.def.aleas * m.aleas,
    rencontres: s.def.rencontres * m.rencontres,
    faim: s.def.faim,
    vue: m.vue,
    /** Rendement d'une ressource donnée, saison et météo comprises. */
    rendement(k) {
      const famille = MINERAUX.has(k) ? s.def.mineral : s.def.vivant;
      return famille * m.rendement;
    },
  };
}

/** Résumé court pour l'en-tête. */
function resumeClimat(world, t) {
  const c = conditions(world, t);
  return {
    saison: c.saison.def.court,
    couleurSaison: c.saison.def.couleur,
    jour: c.saison.jour,
    annee: c.saison.annee,
    meteo: c.meteo.nom,
    couleurMeteo: c.meteo.couleur,
  };
}

// ===== src/lois.js ===================================================
// Ce qu'une faction s'autorise, et ce que ça lui coûte.
//
// Module feuille, volontairement : les lois sont lues par le conseil
// (factions.js) autant que par la justice (justice.js), et si elles vivaient
// dans l'un des deux, l'autre créerait un cycle d'import. Elles ne dépendent
// donc de rien — ce sont des chiffres et trois fonctions pures.
//
// Aucune loi n'est gratuite : chacune achète quelque chose et se paie ailleurs.
// C'est tout l'intérêt d'avoir le grade qui les fixe.

/**
 * Ce qu'un Commandeur peut décider, et ce que ça fait. Aucune loi n'est
 * gratuite : chacune achète quelque chose et se paie ailleurs. C'est tout
 * l'intérêt d'avoir le grade qui les fixe.
 */
const PEINES = {
  legere: {
    nom: 'Clémente',
    desc: 'On enferme peu et on relâche vite. Les geôles restent vides.',
    prime: 0.6,
    duree: 120,
    // Ce que la sévérité fait à l'ordre public et aux pistes.
    ordre: -0.02,
    routes: 0.6,
  },
  ferme: {
    nom: 'Ferme',
    desc: 'On enferme, on juge, on garde. La règle par défaut.',
    prime: 1,
    duree: 400,
    ordre: 0,
    routes: 1,
  },
  expeditive: {
    nom: 'Expéditive',
    desc: 'On juge vite et on pend. Les routes sont sûres, la ville a peur.',
    prime: 1.35,
    duree: 60,
    ordre: 0.05,
    routes: 1.5,
  },
};

const PEINE_KEYS = Object.keys(PEINES);

/**
 * Ce qu'on prélève. Le trésor d'une faction paie les colonnes, les murs et les
 * greniers : le taux décide donc directement de ce qu'un officier pourra
 * ordonner. Et il se paie en désordre, ce qui décide de ce qu'il aura à tenir.
 */
const IMPOTS = [
  { key: 'leger', nom: 'Léger', taux: 0.03, desc: 'On prélève peu. Les villes respirent, le trésor maigrit.' },
  { key: 'ordinaire', nom: 'Ordinaire', taux: 0.05, desc: 'Ce que tout le monde fait, et que personne n’aime.' },
  { key: 'lourd', nom: 'Lourd', taux: 0.09, desc: 'Le trésor gonfle. Les villes s’en souviennent.' },
  { key: 'confiscatoire', nom: 'Confiscatoire', taux: 0.15, desc: 'On prend tout. On tiendra ce qu’on pourra.' },
];

/** Le désordre qu'un taux d'impôt ajoute par heure à une ville. */
function pressionFiscale(world, faction) {
  const t = loisDe(world, faction).impot;
  // En dessous d'ordinaire, l'impôt calme ; au-dessus, il pèse, et de plus en
  // plus vite : doubler le taux fait bien plus que doubler la grogne.
  return ((t - 0.05) ** 3) * 900;
}

/** Les lois d'une faction, avec leurs valeurs par défaut. */
function loisDe(world, faction) {
  const f = world.factions[faction];
  if (!f) return { peine: 'ferme', esclavage: false, impot: 0.05 };
  if (!f.lois) {
    f.lois = {
      peine: 'ferme',
      // Aucune faction ne commence esclavagiste : c'est une décision qu'on
      // prend, pas un état de fait qu'on subit.
      esclavage: false,
      impot: 0.05,
    };
  }
  return f.lois;
}

/** Ce que la loi permet ici, sur la case où l'on se trouve. */
function loiIci(state, col) {
  if (!col || !col.faction) {
    // Une ville sans drapeau ne connaît que la loi du plus fort. On y vend ce
    // qu'on veut, et personne ne délivre de prime.
    return { peine: PEINES.expeditive, esclavage: true, sansLoi: true, faction: null };
  }
  const l = loisDe(state.world, col.faction);
  return {
    peine: PEINES[l.peine] || PEINES.ferme,
    esclavage: !!l.esclavage,
    sansLoi: false,
    faction: col.faction,
  };
}

// ===== src/world.js ==================================================
// Génération du monde et navigation.
// Tout ce qui est ici appartient à `state.world` : c'est la moitié « partagée »
// de l'état, celle qui vivrait côté serveur dans une future version multijoueur.


// Une carte de 10×8 se traversait de bout en bout en deux jours de jeu : au
// bout d'une saison le joueur avait tout vu, et « explorer » n'était plus qu'un
// mot. 24×18, c'est 432 régions et cinq fois plus de monde — assez pour qu'un
// convoi passe une partie entière sans atteindre le bord opposé.
//
// Ce que ça coûte est réel et traité ailleurs : le tick des colonies passe en
// niveau de détail (voir `pasColonie` dans sim.js), sans quoi cinquante-quatre
// villes tiendraient trois fois le budget d'un tick à elles seules.
const LARGEUR = 24;
const HAUTEUR = 18;

/**
 * Combien de villes pour cette surface. La densité ne change pas : une ville
 * pour cinq régions, comme sur l'ancienne carte.
 *
 * Le banc a tranché ce point. À cinquante-quatre villes — une pour huit
 * régions — le monde était non seulement plus grand mais plus vide : chaque
 * ravitaillement devenait une expédition, la part du temps passée en marche
 * montait de 26 à 42 %, et la survie tombait de 22 à 13 sur trente parties.
 * Agrandir la carte ne doit pas vouloir dire écarter ce qu'il y a dessus.
 */
const NB_COLONIES = 86;

function idx(x, y) {
  return y * LARGEUR + x;
}

function coord(i) {
  return { x: i % LARGEUR, y: (i / LARGEUR) | 0 };
}

function voisins(i) {
  const { x, y } = coord(i);
  const out = [];
  if (x > 0) out.push(idx(x - 1, y));
  if (x < LARGEUR - 1) out.push(idx(x + 1, y));
  if (y > 0) out.push(idx(x, y - 1));
  if (y < HAUTEUR - 1) out.push(idx(x, y + 1));
  return out;
}

/**
 * Distance de Manhattan. Écrite sans passer par `coord` : cette fonction est
 * appelée des centaines de fois par tick (niveau de détail des colonies, choix
 * de destinations, portée des armées), et deux objets alloués à chaque appel
 * faisaient à eux seuls travailler le ramasse-miettes.
 */
function distance(a, b) {
  const ax = a % LARGEUR;
  const ay = (a / LARGEUR) | 0;
  const bx = b % LARGEUR;
  const by = (b / LARGEUR) | 0;
  return Math.abs(ax - bx) + Math.abs(ay - by);
}

// ---------------------------------------------------------------------------
// Génération
// ---------------------------------------------------------------------------

function genererBiomes(rng) {
  // Voronoï bruité : quelques noyaux par biome, chaque case prend le plus proche.
  const noyaux = [];
  const pool = BIOME_KEYS.filter((b) => b !== 'relais');
  // Le nombre de noyaux suit la surface : sinon un biome couvrirait un quart de
  // la carte d'un bloc, et traverser cent régions de steppe n'apprend rien.
  const echelle = (LARGEUR * HAUTEUR) / 80;
  for (const b of pool) {
    const n = Math.round((b === 'steppe' ? 3 : rng.irange(1, 2)) * echelle);
    for (let k = 0; k < n; k++) {
      noyaux.push({ b, x: rng.range(0, LARGEUR), y: rng.range(0, HAUTEUR) });
    }
  }
  const regions = [];
  for (let y = 0; y < HAUTEUR; y++) {
    for (let x = 0; x < LARGEUR; x++) {
      let best = null;
      let bestD = Infinity;
      for (const n of noyaux) {
        const d = (n.x - x - 0.5) ** 2 + (n.y - y - 0.5) ** 2 + rng.range(0, 2.2);
        if (d < bestD) { bestD = d; best = n.b; }
      }
      regions.push({
        i: idx(x, y),
        x,
        y,
        biome: best,
        richesse: Number(rng.range(0.65, 1.45).toFixed(2)),
        danger: Number((BIOMES[best].danger * rng.range(0.7, 1.35)).toFixed(3)),
        colonie: null,
        controle: null,
        decouvert: false,
        fouille: 0, // épuisement local par la fouille répétée
        // Ce que les routes sont devenues faute d'être tenues. Voir secteur.js.
        insecurite: 0,
        // Ce que les passages ont tassé. Voir coutTraversee.
        piste: 0,
      });
    }
  }
  // Les Relais Orbitaux : les points chauds du monde, en marge. Un seul sur une
  // carte de cette taille serait un lieu que la plupart des parties ne
  // verraient jamais.
  const candidats = rng.shuffle(regions.filter(
    (r) => r.x <= 2 || r.x >= LARGEUR - 3 || r.y <= 1 || r.y >= HAUTEUR - 2
  ));
  for (let k = 0; k < 3 && k < candidats.length; k++) {
    const relais = candidats[k];
    relais.biome = 'relais';
    relais.richesse = 1.6;
    relais.danger = BIOMES.relais.danger;
  }
  return regions;
}

function nomVille(rng, pris) {
  for (let essai = 0; essai < 60; essai++) {
    const n = `${rng.pick(VILLE_A)}-${rng.pick(VILLE_B)}`;
    if (!pris.has(n)) { pris.add(n); return n; }
  }
  return `Poste-${pris.size + 1}`;
}

function stockInitial(rng, taille) {
  const s = {};
  for (const k of COMMODITY_KEYS) s[k] = 0;
  s.ferraille = rng.irange(60, 200) * taille;
  s.minerai = rng.irange(30, 120) * taille;
  s.polymere = rng.irange(30, 110) * taille;
  s.biomasse = rng.irange(40, 140) * taille;
  s.rations = rng.irange(50, 160) * taille;
  s.alliage = rng.irange(10, 45) * taille;
  s.carburant = rng.irange(15, 60) * taille;
  s.isotope = rng.irange(4, 25) * taille;
  s.composant = rng.irange(5, 30) * taille;
  s.medkit = rng.irange(2, 12) * taille;
  return s;
}

function genererColonies(rng, regions) {
  const colonies = [];
  const pris = new Set();
  const occupees = new Set();
  const cases = rng.shuffle(regions.map((r) => r.i));

  const cible = NB_COLONIES;
  for (const i of cases) {
    if (colonies.length >= cible) break;
    // Espacement minimal pour que la carte respire
    let tropProche = false;
    for (const c of colonies) {
      if (distance(c.regionId, i) < 2) { tropProche = true; break; }
    }
    if (tropProche || occupees.has(i)) continue;
    const r = regions[i];
    if (r.biome === 'relais') continue;

    const taille = rng.weighted([[1, 5], [2, 3], [3, 1.4]]);
    const col = {
      id: `s${colonies.length + 1}`,
      nom: nomVille(rng, pris),
      regionId: i,
      faction: null,
      taille,
      pop: taille * rng.irange(120, 260),
      defense: 0,
      defenseMax: 0,
      murs: taille * rng.irange(2, 5),
      stock: stockInitial(rng, taille),
      unrest: Number(rng.range(0, 0.2).toFixed(2)),
      // Qui travaille à quoi. Rempli une fois la faction attribuée.
      emplois: null,
      // Qui cherche à partir d'ici. Ne se garnit que quand le joueur y est :
      // voir recrues.js. La clé existe dès la création, sinon `normaliser`
      // l'ajoute au rechargement et l'aller-retour JSON n'est plus exact.
      banc: null,
      // Qui la ville tient enfermé. Voir justice.js.
      geole: null,
      marche: 1 + taille * 0.35,
      prises: 0,
    };
    col.defenseMax = Math.round(col.pop * 0.09 + col.murs * 12);
    col.defense = Math.round(col.defenseMax * rng.range(0.6, 1));
    colonies.push(col);
    occupees.add(i);
    r.colonie = col.id;
    // Les abords d'une ville sont tassés depuis longtemps : personne n'a
    // attendu le joueur pour aller et venir. Sans ce socle, le monde commence
    // sans la moindre route et il faut trois cents heures pour en voir une.
    r.piste = 0.55;
    for (const v of voisins(i)) regions[v].piste = Math.max(regions[v].piste, 0.3);
  }
  return colonies;
}

function attribuerFactions(rng, regions, colonies) {
  const factions = {};
  for (const k of DIPLO_FACTIONS) {
    factions[k] = {
      key: k,
      nom: FACTIONS[k].nom,
      tresor: rng.irange(1200, 4200),
      agression: Number((FACTIONS[k].agression * rng.range(0.85, 1.15)).toFixed(2)),
      relations: {},
      colonies: [],
      capitale: null,
      humeur: 0,
      prochainConseil: rng.irange(6, 40),
      // Peine, esclavage, impôt : ce qu'un Commandeur peut fixer. Voir justice.js.
      lois: null,
    };
  }
  factions.essaim = {
    key: 'essaim',
    nom: FACTIONS.essaim.nom,
    tresor: 0,
    agression: 0.95,
    relations: {},
    colonies: [],
    capitale: null,
    humeur: 0,
    prochainConseil: rng.irange(12, 60),
    lois: null,
  };

  // Relations initiales, symétriques (−100 guerre ouverte, +100 alliance)
  for (const a of DIPLO_FACTIONS) {
    for (const b of DIPLO_FACTIONS) {
      if (a === b) continue;
      if (factions[a].relations[b] !== undefined) continue;
      const v = Math.round(rng.gauss(5, 26));
      factions[a].relations[b] = v;
      factions[b].relations[a] = v;
    }
    factions[a].relations.essaim = -100;
    factions.essaim.relations[a] = -100;
  }

  // Chaque colonie va à la faction dont le biome de prédilection correspond
  const libres = rng.shuffle(colonies.slice());
  for (const col of libres) {
    const biome = regions[col.regionId].biome;
    const scores = DIPLO_FACTIONS.map((k) => {
      const aff = FACTIONS[k].biomes.includes(biome) ? 3 : 0.6;
      const charge = factions[k].colonies.length;
      return [k, Math.max(0.15, aff / (1 + charge * 0.55))];
    });
    const k = rng.weighted(scores);
    col.faction = k;
    // Une ville se souvient de sa maison mère : c'est ce qui rend possible une
    // sécession, et donc le retour d'une faction qu'on croyait éteinte.
    col.factionOrigine = k;
    factions[k].colonies.push(col.id);
    regions[col.regionId].controle = k;
  }

  // Capitale = plus grande colonie de la faction
  for (const k of DIPLO_FACTIONS) {
    const f = factions[k];
    if (!f.colonies.length) continue;
    let best = null;
    for (const cid of f.colonies) {
      const c = colonies.find((x) => x.id === cid);
      if (!best || c.taille > best.taille) best = c;
    }
    f.capitale = best.id;
    best.taille = Math.max(best.taille, 2);
    best.murs += 4;
    best.defenseMax = Math.round(best.pop * 0.09 + best.murs * 12);
    best.defense = best.defenseMax;
  }

  // Zones de contrôle : le territoire rayonne autour des colonies
  for (const col of colonies) {
    for (const v of voisins(col.regionId)) {
      if (regions[v].controle == null && rng.chance(0.7)) regions[v].controle = col.faction;
    }
  }
  return factions;
}

/**
 * Sème des sites à fouiller sur les régions vides. C'est ce qui donne une
 * raison d'aller voir ailleurs plutôt que de camper sur une seule case.
 */
function semerSites(rng, regions) {
  const vides = rng.shuffle(regions.filter((r) => !r.colonie));
  // Un site tous les trois ou quatre secteurs vides : assez pour qu'un détour
  // se justifie, pas assez pour qu'on trébuche dessus.
  const combien = Math.min(vides.length, Math.round(vides.length * 0.28));
  for (let i = 0; i < combien; i++) {
    const r = vides[i];
    // Les biomes riches attirent les sites intéressants.
    const type = rng.weighted(POI_KEYS.map((k) => {
      const def = POI[k];
      const affinite = r.biome === 'dalles' && k === 'ruine' ? 3
        : r.biome === 'relais' && k === 'station' ? 4
          : r.biome === 'friche' && k === 'bunker' ? 3
            : r.biome === 'plastique' && k === 'convoi' ? 2.5 : 1;
      return [k, affinite * (1 + (1 - def.danger))];
    }));
    r.site = { type, connu: false, fouille: false };
  }
}

function genererMonde(rng) {
  const regions = genererBiomes(rng);
  const colonies = genererColonies(rng, regions);
  semerSites(rng, regions);
  const factions = attribuerFactions(rng, regions, colonies);
  return {
    largeur: LARGEUR,
    hauteur: HAUTEUR,
    regions,
    colonies,
    factions,
    armees: [],
    guerres: [],
    prochainArmeeId: 1,
  };
}

// Accès
// ---------------------------------------------------------------------------

function region(world, i) {
  return world.regions[i];
}

// Index id → colonie. Il ne vit pas dans l'état (qui doit rester du JSON pur) :
// il se reconstruit tout seul dès que le tableau des colonies change d'identité
// ou de longueur, c'est-à-dire au chargement d'une partie et à chaque fondation.
// Avec cinquante-quatre villes, la recherche linéaire coûtait à elle seule un
// dixième du tick.
let indexSource = null;
let indexTaille = -1;
let indexParId = null;

function index(world) {
  if (indexSource !== world.colonies || indexTaille !== world.colonies.length) {
    indexSource = world.colonies;
    indexTaille = world.colonies.length;
    indexParId = new Map();
    for (const c of world.colonies) indexParId.set(c.id, c);
  }
  return indexParId;
}

function colonieDe(world, regionId) {
  const r = world.regions[regionId];
  if (!r || !r.colonie) return null;
  return index(world).get(r.colonie) || null;
}

function colonieParId(world, id) {
  return index(world).get(id) || null;
}

// Le coût d'un secteur n'a pas bougé avec l'agrandissement de la carte, et le
// banc a montré que ce n'était pas là qu'était le problème : le diviser par
// deux ne fait passer le temps de marche que de 39 à 35 %, sans rien changer au
// revenu. Voir le rapport dans README.
/**
 * Ce qu'une piste damée retire au coût d'un passage.
 *
 * Cinquante-deux pour cent du temps de jeu se passe en marche, et sur les
 * quarante-cinq départs d'une partie, trente sont de la logistique : rentrer au
 * camp, chercher à manger, aller vendre. Agrandir le sac ou raccourcir la carte
 * reviendrait à retirer le voyage du jeu ; ce qu'il faut, c'est que le voyage
 * *s'améliore*. Un monde où l'on passe finit par avoir des routes, et une route
 * n'est pas un raccourci : c'est de la terre tassée par ceux qui sont passés
 * avant, la vôtre comprise.
 */
const PISTE_GAIN = 0.34;

function coutTraversee(world, i, mods = {}) {
  const r = world.regions[i];
  const base = BIOMES[r.biome].cout;
  // Témoin du banc : on annule le gain des pistes pour mesurer par différence
  // ce qu'elles rapportent. Voir test/equilibre.js, SANS=pistes.
  const piste = world.sansPistes ? 1 : 1 - (r.piste || 0) * PISTE_GAIN;
  return Math.max(1, base * piste * (1 - (mods.reductionVoyage || 0)));
}

/** On tasse la terre en passant. Le gain est lent à venir et lent à s'en aller. */
function damer(world, i, force = 1) {
  const r = world.regions[i];
  if (!r) return;
  r.piste = Math.min(1, (r.piste || 0) + 0.02 * force);
}

/**
 * Dijkstra sur la grille, avec un tas binaire. Retourne la liste des régions de
 * `from` (exclu) à `to`.
 *
 * La version à balayage linéaire coûtait n² : acceptable sur quatre-vingts
 * régions, plus du tout sur quatre cent trente-deux, où elle était devenue le
 * deuxième poste du profil derrière le tick des colonies — pour un calcul qui
 * n'a lieu qu'au moment de donner un ordre de route.
 */
function chemin(world, from, to, mods = {}) {
  if (from === to) return [];
  const n = world.regions.length;
  const dist = new Array(n).fill(Infinity);
  const prev = new Array(n).fill(-1);
  const vus = new Array(n).fill(false);
  dist[from] = 0;

  // Tas binaire minimal : deux tableaux plats, pas d'objets alloués par nœud.
  const tasN = new Int32Array(n + 1);
  const tasD = new Float64Array(n + 1);
  let taille = 0;
  const pousser = (node, d) => {
    let i = ++taille;
    tasN[i] = node; tasD[i] = d;
    while (i > 1) {
      const p = i >> 1;
      if (tasD[p] <= tasD[i]) break;
      const tn = tasN[p]; const td = tasD[p];
      tasN[p] = tasN[i]; tasD[p] = tasD[i];
      tasN[i] = tn; tasD[i] = td;
      i = p;
    }
  };
  const tirer = () => {
    const top = tasN[1];
    tasN[1] = tasN[taille]; tasD[1] = tasD[taille];
    taille--;
    let i = 1;
    for (;;) {
      const g = i * 2;
      const d = g + 1;
      let m = i;
      if (g <= taille && tasD[g] < tasD[m]) m = g;
      if (d <= taille && tasD[d] < tasD[m]) m = d;
      if (m === i) break;
      const tn = tasN[m]; const td = tasD[m];
      tasN[m] = tasN[i]; tasD[m] = tasD[i];
      tasN[i] = tn; tasD[i] = td;
      i = m;
    }
    return top;
  };

  pousser(from, 0);
  while (taille > 0) {
    const u = tirer();
    if (vus[u]) continue; // doublon laissé par une amélioration ultérieure
    if (u === to) break;
    vus[u] = true;
    for (const v of voisins(u)) {
      if (vus[v]) continue;
      const nd = dist[u] + coutTraversee(world, v, mods);
      if (nd < dist[v]) { dist[v] = nd; prev[v] = u; pousser(v, nd); }
    }
  }
  if (dist[to] === Infinity) return null;
  const path = [];
  let cur = to;
  while (cur !== from && cur !== -1) {
    path.push(cur);
    cur = prev[cur];
  }
  return path.reverse();
}

/** Révèle une région et ses alentours. */
function decouvrir(world, i, rayon = 1) {
  const { x, y } = coord(i);
  for (let dy = -rayon; dy <= rayon; dy++) {
    for (let dx = -rayon; dx <= rayon; dx++) {
      if (Math.abs(dx) + Math.abs(dy) > rayon) continue;
      const nx = x + dx;
      const ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= LARGEUR || ny >= HAUTEUR) continue;
      world.regions[idx(nx, ny)].decouvert = true;
    }
  }
}

/** Le site d'une région, s'il est connu du joueur. */
function siteConnu(world, i) {
  const r = world.regions[i];
  return r && r.site && r.site.connu && !r.site.fouille ? r.site : null;
}

function nomRegion(world, i) {
  const r = world.regions[i];
  const col = colonieDe(world, i);
  if (col) return col.nom;
  return `${BIOMES[r.biome].court} ${String.fromCharCode(65 + r.x)}${r.y + 1}`;
}

// ===== src/characters.js =============================================
// Personnages : génération, compétences qui montent à l'usage, blessures
// localisées, besoins. Aucune notion d'UI ici.


// Les identifiants sont tirés du RNG de la partie, pas d'un compteur global :
// deux parties lancées sur la même graine produisent exactement les mêmes ids,
// et une sauvegarde rechargée reprend la suite sans collision.
function idDepuisRng(rng, prefix = 'c') {
  return prefix + rng.u32().toString(36);
}

// ---------------------------------------------------------------------------
// Création
// ---------------------------------------------------------------------------

const ARCHETYPES = {
  ferrailleur: { nom: 'Ferrailleur', bonus: { ingenierie: 14, endurance: 8, force: 6 }, arme: 'barre' },
  chasseur: { nom: 'Chasseur', bonus: { tir: 16, furtivite: 10 }, arme: 'clous' },
  brute: { nom: 'Brute', bonus: { force: 18, melee: 14, endurance: 6 }, arme: 'machette' },
  medic: { nom: 'Médic', bonus: { medecine: 20, ingenierie: 6 }, arme: 'barre' },
  courtier: { nom: 'Courtier', bonus: { commerce: 20, furtivite: 8 }, arme: 'clous' },
  eclaireur: { nom: 'Éclaireur', bonus: { furtivite: 16, endurance: 12, tir: 6 }, arme: 'machette' },
};

const ARCHETYPE_KEYS = Object.keys(ARCHETYPES);

function makeCharacter(rng, opts = {}) {
  const arch = opts.archetype || rng.pick(ARCHETYPE_KEYS);
  const def = ARCHETYPES[arch];
  const niveau = opts.niveau ?? 0; // 0 = débutant, monte les stats de base
  const c = {
    id: idDepuisRng(rng, 'c'),
    nom: opts.nom || genNom(rng),
    archetype: arch,
    archetypeNom: def.nom,
    age: rng.irange(19, 47),
    skills: {},
    xp: {},
    corps: {},
    faim: rng.irange(5, 25),
    fatigue: rng.irange(0, 20),
    moral: rng.irange(55, 80),
    sang: 0,
    etat: 'ok',
    koHeures: 0,
    equip: { arme: opts.arme || def.arme, armure: opts.armure || null, greffes: {} },
    kills: 0,
    horsCombat: 0,
    joursSurvecus: 0,
    traits: tirerTraits(rng, opts.traits),
    // Ce que celui-ci pense des autres. Se remplit en vivant ensemble.
    liens: {},
    // Ce qu'il a appris ailleurs qu'à l'usage.
    diplomes: [],
    formation: null,
  };
  for (const k of SKILL_KEYS) {
    const base = rng.irange(4, 14) + (def.bonus[k] || 0) + niveau * rng.irange(2, 6);
    c.skills[k] = Math.max(1, Math.min(100, Math.round(base)));
    c.xp[k] = 0;
  }
  // Un professionnel qui a de la bouteille a souvent été formé quelque part :
  // c'est ce qui distingue un médic recruté d'un ferrailleur qu'on a mis à
  // recoudre. Les débutants, eux, n'ont que leurs mains.
  const dipl = opts.diplome === undefined ? DIPLOME_ARCHETYPE[arch] : opts.diplome;
  if (dipl && DIPLOMES[dipl] && (opts.diplome || (niveau >= 1 && rng.chance(0.25 + niveau * 0.2)))) {
    accorderDiplome(c, dipl);
  }

  for (const p of BODY_KEYS) {
    const max = Math.round(BODY_PARTS[p].pv * (0.85 + c.skills.endurance / 220));
    c.corps[p] = { pv: max, max, perdu: false };
  }
  return c;
}

/**
 * Remet le diplôme et ce qui va avec : un plancher de compétence — jamais
 * rabaissé, on n'oublie pas ce qu'on savait — et l'aptitude à progresser plus
 * vite ensuite, qui est le vrai apport d'une formation.
 */
function accorderDiplome(c, key) {
  const d = DIPLOMES[key];
  if (!d) return false;
  if (!c.diplomes) c.diplomes = [];
  if (c.diplomes.includes(key)) return false;
  c.diplomes.push(key);
  c.skills[d.skill] = Math.max(c.skills[d.skill] || 0, d.plancher);
  return true;
}

/** Ce que les diplômes font gagner en vitesse d'apprentissage, par compétence. */
function apprentissage(c, skill) {
  if (!c.diplomes || !c.diplomes.length) return 1;
  let m = 1;
  for (const k of c.diplomes) {
    const d = DIPLOMES[k];
    if (d && d.skill === skill) m *= d.apprentissage;
  }
  return m;
}

/** Un à trois traits, dont au plus un défaut : de quoi rendre les gens distincts. */
function tirerTraits(rng, imposes) {
  if (imposes) return imposes.slice();
  const atouts = TRAIT_KEYS.filter((k) => !TRAITS[k].malus);
  const defauts = TRAIT_KEYS.filter((k) => TRAITS[k].malus);
  const out = [];
  const combien = rng.weighted([[1, 4], [2, 3], [3, 1]]);
  const pioche = rng.shuffle(atouts);
  for (let i = 0; i < combien && i < pioche.length; i++) out.push(pioche[i]);
  if (rng.chance(0.4)) out.push(rng.pick(defauts));
  return out;
}

/** Multiplicateurs cumulés des traits. Recalculé à la volée : deux traits, c'est gratuit. */
function mods(c) {
  const m = {
    faim: 1, fatigue: 1, portage: 1, vitesse: 1,
    degatsSubis: 1, evitement: 1, saignement: 1, soin: 1, moral: 1,
  };
  for (const t of c.traits || []) {
    const def = TRAITS[t];
    if (!def || !def.mult) continue;
    for (const k of Object.keys(def.mult)) m[k] = (m[k] ?? 1) * def.mult[k];
  }
  return m;
}

function genNom(rng) {
  const n = rng.pick(NOMS_PERSO);
  return rng.chance(0.45) ? `${n} ${rng.pick(SURNOMS)}` : n;
}

// ---------------------------------------------------------------------------
// État corporel
// ---------------------------------------------------------------------------

function ratio(c, part) {
  const p = c.corps[part];
  if (!p || p.max <= 0) return 0;
  return Math.max(0, p.pv / p.max);
}

function pvTotal(c) {
  let pv = 0;
  let max = 0;
  for (const p of BODY_KEYS) {
    pv += c.corps[p].pv;
    max += c.corps[p].max;
  }
  return { pv, max, pct: max > 0 ? pv / max : 0 };
}

function estDebout(c) {
  return c.etat === 'ok';
}

function estVivant(c) {
  return c.etat !== 'mort';
}

/** Bonus d'équipement et de traits sur une compétence. */
function bonusEquip(c, skill) {
  let b = 0;
  for (const t of c.traits || []) {
    const def = TRAITS[t];
    if (def && def.bonus && def.bonus[skill]) b += def.bonus[skill];
  }
  const arm = c.equip.armure && ITEMS[c.equip.armure];
  if (arm && arm.bonus && arm.bonus[skill]) b += arm.bonus[skill];
  for (const membre of Object.keys(c.equip.greffes)) {
    const g = ITEMS[c.equip.greffes[membre]];
    if (g && g.bonus && g.bonus[skill]) b += g.bonus[skill];
  }
  return b;
}

/**
 * Valeur effective d'une compétence : base + équipement, dégradée par les
 * blessures pertinentes, la fatigue et la faim.
 */
/**
 * Ce qu'un corps aguerri retire à la chance d'un coup fatal.
 *
 * Jusqu'ici la létalité était un dé fixe : vingt pour cent par coup encaissé,
 * qu'on soit un bleu ou le meilleur de l'escouade. Une compétence élevée faisait
 * toucher plus souvent et esquiver mieux, mais ne changeait rien à ce dé-là — et
 * le banc l'a chiffré : on meurt vers 28 de compétence, les survivants finissent
 * à 9, c'est-à-dire sous leur niveau de départ. Il n'existait aucun palier où
 * l'on devienne dur à tuer, donc les vétérans ne s'endurcissaient pas, ils se
 * faisaient remplacer.
 *
 * L'endurance, et elle seule : encaisser n'est pas savoir se battre. Un
 * bagarreur qui n'a pas de coffre meurt comme les autres.
 */
function resistanceLetale(c) {
  return 1 - Math.min(0.45, comp(c, 'endurance') / 160);
}

function comp(c, skill) {
  const base = (c.skills[skill] || 0) + bonusEquip(c, skill);
  const tete = 0.5 + 0.5 * ratio(c, 'tete');
  const torse = 0.6 + 0.4 * ratio(c, 'torse');
  const bras = 0.45 + 0.55 * ((ratio(c, 'brasG') + ratio(c, 'brasD')) / 2);
  const jambes = 0.45 + 0.55 * ((ratio(c, 'jambeG') + ratio(c, 'jambeD')) / 2);

  let m;
  switch (skill) {
    case 'melee': m = tete * torse * bras; break;
    case 'tir': m = tete * torse * (0.6 + 0.4 * bras); break;
    case 'force': m = torse * bras; break;
    case 'endurance': m = torse * jambes; break;
    case 'furtivite': m = tete * jambes * (0.7 + 0.3 * torse); break;
    default: m = tete * torse; break;
  }
  const fat = 1 - Math.min(0.55, c.fatigue / 200);
  const faim = 1 - Math.min(0.45, c.faim / 240);
  const mor = 0.8 + (c.moral / 100) * 0.3;
  return Math.max(1, base * m * fat * faim * mor);
}

// ---------------------------------------------------------------------------
// Progression : l'usage fait la compétence
// ---------------------------------------------------------------------------

const XP_BASE = 18;

function seuilXp(niveau) {
  return Math.round(XP_BASE * Math.pow(niveau + 1, 1.25));
}

/** Retourne le nombre de niveaux gagnés (0 la plupart du temps). */
/**
 * Ce que rapporte une heure passée à faire son métier, pour la compétence que
 * ce métier exerce. Fouiller monte l'ingénierie, extraire la force, chasser le
 * tir, explorer la furtivité, marcher l'endurance, soigner la médecine,
 * négocier le commerce.
 *
 * Valeur mesurée : à l'ancien taux (1,1), passer de 10 à 30 en travaillant
 * demandait mille cent quinze jours de travail — autant dire que le métier ne
 * formait personne, et que seul l'exercice comptait. À 10, une saison de
 * travail à plein temps fait passer de 10 à 20, et trois ou quatre saisons
 * mènent à 30. Le travail forme, l'exercice va deux fois plus vite mais ne
 * produit rien et se paie en vivres.
 */
const XP_PRATIQUE = 10;

function gagnerXp(c, skill, montant) {
  if (!(skill in c.skills) || montant <= 0) return 0;
  const niv = c.skills[skill];
  if (niv >= 100) return 0;
  // Plus on est bon, plus ça vient lentement. Un diplôme ne dispense pas de
  // pratiquer, il apprend à tirer parti de la pratique.
  const facteur = Math.max(0.12, 1 - niv / 115);
  c.xp[skill] += montant * facteur * apprentissage(c, skill);
  let gagnes = 0;
  while (c.skills[skill] < 100 && c.xp[skill] >= seuilXp(c.skills[skill])) {
    c.xp[skill] -= seuilXp(c.skills[skill]);
    c.skills[skill]++;
    gagnes++;
  }
  return gagnes;
}

// ---------------------------------------------------------------------------
// Dégâts et soins
// ---------------------------------------------------------------------------

function armureTotale(c, bonusPct = 0) {
  const a = c.equip.armure && ITEMS[c.equip.armure];
  const base = a ? a.armure : 0;
  return base * (1 + bonusPct);
}

function tirerMembre(rng) {
  const entries = BODY_KEYS.map((k) => [k, BODY_PARTS[k].poids]);
  return rng.weighted(entries);
}

/**
 * Applique des dégâts. Retourne { degats, membre, ko, mort, membrePerdu }.
 * Personne ne meurt d'un seul coup debout : on tombe KO d'abord.
 */
function blesser(c, montant, membre, rng, opts = {}) {
  if (c.etat === 'mort') return { degats: 0, membre, ko: false, mort: false, membrePerdu: false };
  const m = mods(c);
  const part = c.corps[membre];
  const d = Math.max(1, Math.round(montant * m.degatsSubis));
  part.pv = Math.max(0, part.pv - d);

  let ko = false;
  let mort = false;
  let membrePerdu = false;

  // opts.letal : true = coup de grâce, false = jamais mortel, absent = 35 %
  const vital = BODY_PARTS[membre].vital;
  if (part.pv <= 0) {
    if (vital) {
      const peutTuer = opts.letal === true
        || (opts.letal !== false && rng.chance(0.35));
      if (c.etat === 'ko' && peutTuer) mort = true;
      else ko = true;
    } else if (!part.perdu && rng.chance(0.22)) {
      part.perdu = true;
      membrePerdu = true;
      ko = true;
    }
  }
  // On s'écroule bien avant d'être détruit : un bras cassé, le souffle coupé,
  // et l'on ne tient plus debout. Le seuil était à 32 % des points de vie, ce
  // qui voulait dire encaisser les deux tiers de son corps avant de tomber —
  // d'où des combats de dix-huit tours où personne n'allait au sol. On tombe
  // désormais autour de 40 à 50 % de dégâts, et d'autant plus vite qu'on est
  // amoché : le combat se décide en cinq ou six échanges, comme un vrai.
  if (!mort && c.etat === 'ok') {
    const t = pvTotal(c);
    if (t.pct < 0.6 && rng.chance((0.6 - t.pct) / 0.6 * 0.55)) ko = true;
  }
  if (mort) {
    c.etat = 'mort';
  } else if (ko && c.etat === 'ok') {
    c.etat = 'ko';
    c.koHeures = rng.irange(3, 10);
  }
  // Saignement
  c.sang = Math.min(100, c.sang + d * (vital ? 0.55 : 0.35) * m.saignement);
  return { degats: d, membre, ko, mort, membrePerdu };
}

/** Soin sur une heure. `qualite` ~ [0.5, 3] selon médic / infirmerie / medkits. */
function soigner(c, qualite, rng) {
  if (c.etat === 'mort') return;
  // Arrêt du saignement d'abord
  if (c.sang > 0) c.sang = Math.max(0, c.sang - 3 * qualite);
  const parts = BODY_KEYS.filter((p) => c.corps[p].pv < c.corps[p].max);
  if (!parts.length) return;
  const cible = rng.pick(parts);
  const p = c.corps[cible];
  const gain = 0.9 * qualite * (p.perdu ? 0.4 : 1);
  p.pv = Math.min(p.max, p.pv + gain);
  if (c.etat === 'ko') {
    c.koHeures -= 1;
    const t = pvTotal(c);
    if (c.koHeures <= 0 && t.pct > 0.42) c.etat = 'ok';
  }
}

/** Capacité de portage en kg. */
function portage(c, bonusPct = 0) {
  if (!estVivant(c)) return 0;
  const base = 30 + comp(c, 'force') * 0.7 + comp(c, 'endurance') * 0.25;
  const equip = poidsEquip(c);
  return Math.max(0, base * (1 + bonusPct) * mods(c).portage - equip);
}

function poidsEquip(c) {
  let w = 0;
  if (c.equip.arme && ITEMS[c.equip.arme]) w += ITEMS[c.equip.arme].poids;
  if (c.equip.armure && ITEMS[c.equip.armure]) w += ITEMS[c.equip.armure].poids;
  return w;
}

/** Peut-il porter cette arme ? (les grosses armes demandent de la force) */
function peutEquiper(c, itemKey) {
  const it = ITEMS[itemKey];
  if (!it) return false;
  if (it.reqForce && comp(c, 'force') < it.reqForce) return false;
  if (it.type === 'greffe') {
    const p = c.corps[it.membre];
    return !!p;
  }
  return true;
}

// ---------------------------------------------------------------------------
// Besoins horaires
// ---------------------------------------------------------------------------

/**
 * Fait passer une heure sur un personnage.
 * `effort` : 0 repos, 1 marche/travail normal, 1.6 combat ou marche forcée.
 * Retourne un tableau de messages notables (mort, membre perdu…).
 */
function tickPerso(c, effort, rng, ctx = {}) {
  const msgs = [];
  if (c.etat === 'mort') return msgs;

  const m = mods(c);
  c.faim = Math.min(120, c.faim + (0.55 + 0.25 * effort) * m.faim);
  if (effort <= 0.05) {
    // Dormir chez soi n'est pas dormir dans le sable. `abri` vaut 1 en plein
    // désert, davantage sous un toit qu'on a monté soi-même : c'est le premier
    // service que rend un campement, avant qu'on y ait bâti quoi que ce soit.
    c.fatigue = Math.max(0, c.fatigue - 6 * (ctx.abri || 1) / m.fatigue);
  } else {
    const end = comp(c, 'endurance');
    c.fatigue = Math.min(120, c.fatigue + (1.6 * effort) * (1 - Math.min(0.5, end / 200)) * m.fatigue);
  }

  // Saignement : une plaie légère se referme seule ; une hémorragie tue.
  //
  // C'est de ça qu'on mourait le plus souvent — vingt-quatre morts « en route »
  // contre dix-neuf au combat, mesuré au banc. Le combat casse, la route achève.
  // Une hémorragie franche gardait trois chances sur dix par heure d'emporter
  // son homme, quoi qu'on fasse pour lui : un blessé grave était condamné, pas
  // soigné. La qualité des soins entre maintenant dans les deux termes — ce
  // qu'on risque, et à quelle vitesse ça se referme.
  if (c.sang > 0) {
    const soin = Math.max(0.25, ctx.soin || 0.25);
    if (c.sang > 12) {
      const perte = (c.sang - 12) / 26;
      const risque = c.sang > 40 ? Math.max(0.06, 0.3 / (1 + soin)) : 0;
      const r = blesser(c, perte, 'torse', rng, {
        letal: risque > 0 && rng.chance(risque * resistanceLetale(c)),
      });
      if (r.mort) msgs.push({ type: 'mort', texte: `${c.nom} s’est vidé de son sang.` });
    }
    // Coagulation, accélérée par ceux qui restent debout pour comprimer — et
    // par ce qu'ils valent en médecine.
    const compression = ctx.premiersSecours ? 2.5 * (1 + soin) : 0;
    c.sang = Math.max(0, c.sang - 2.2 - compression);
  }

  // Famine
  if (c.faim >= 100) {
    const r = blesser(c, 1.6, 'torse', rng);
    if (r.mort) msgs.push({ type: 'mort', texte: `${c.nom} est mort de faim.` });
    c.moral = Math.max(0, c.moral - 1.2);
  } else if (c.faim < 40) {
    c.moral = Math.min(100, c.moral + 0.25);
  }

  // Épuisement
  if (c.fatigue >= 110) {
    c.moral = Math.max(0, c.moral - 0.8);
    if (c.etat === 'ok' && rng.chance(0.05)) {
      c.etat = 'ko';
      c.koHeures = rng.irange(2, 5);
      msgs.push({ type: 'ko', texte: `${c.nom} s’effondre d’épuisement.` });
    }
  }

  // Récupération naturelle légère hors combat
  const q = (ctx.soin ?? 0) * m.soin;
  if (q > 0) soigner(c, q, rng);
  else if (effort <= 0.05) soigner(c, 0.35 * m.soin, rng);

  if (c.etat === 'ko') {
    c.koHeures = Math.max(0, c.koHeures - 1);
    const t = pvTotal(c);
    if (c.koHeures <= 0 && t.pct > 0.42) {
      c.etat = 'ok';
      msgs.push({ type: 'reveil', texte: `${c.nom} se remet debout.` });
    }
  }
  return msgs;
}

/** Nourrit un personnage. Retourne la quantité de rations consommée. */
function nourrir(c, dispo) {
  if (c.etat === 'mort' || dispo <= 0) return 0;
  if (c.faim < 25) return 0;
  const besoin = Math.min(dispo, Math.ceil(c.faim / 45));
  c.faim = Math.max(0, c.faim - besoin * 45);
  c.moral = Math.min(100, c.moral + besoin * 1.5);
  return besoin;
}

/** Le lien mutuel entre deux membres, borné à ±100. */
function lien(a, b) {
  if (!a.liens) a.liens = {};
  return a.liens[b.id] ?? 0;
}

function ajusterLien(a, b, delta) {
  if (!a.liens) a.liens = {};
  if (!b.liens) b.liens = {};
  const v0 = a.liens[b.id] ?? 0;
  // Amortissement aux extrêmes : sans lui, tout le monde atteint 100 en deux
  // semaines et la notion de relation ne veut plus rien dire.
  const frein = 1 - Math.min(0.95, Math.abs(v0) / 100);
  const v = Math.max(-100, Math.min(100, v0 + delta * frein));
  a.liens[b.id] = v;
  b.liens[a.id] = v;
}

/**
 * Tire un lien vers une valeur d'équilibre. Un ajout constant finit toujours
 * par saturer à 100 ; une cible produit des relations qui se distinguent.
 */
function tendreLien(a, b, cible, taux) {
  if (!a.liens) a.liens = {};
  if (!b.liens) b.liens = {};
  const v0 = a.liens[b.id] ?? 0;
  const v = Math.max(-100, Math.min(100, v0 + (cible - v0) * taux));
  a.liens[b.id] = v;
  b.liens[a.id] = v;
}

/** Le meilleur et le pire, pour l'affichage. */
function relationsNotables(c, squad) {
  let ami = null;
  let rival = null;
  for (const autre of squad) {
    if (autre.id === c.id || autre.etat === 'mort') continue;
    const v = lien(c, autre);
    if (v >= 25 && (!ami || v > lien(c, ami))) ami = autre;
    if (v <= -25 && (!rival || v < lien(c, rival))) rival = autre;
  }
  return { ami, rival };
}

/** Résumé court pour l'UI. */
function etatCourt(c) {
  if (c.etat === 'mort') return 'MORT';
  if (c.etat === 'ko') return 'K.O.';
  const t = pvTotal(c);
  if (c.sang > 25) return 'SAIGNE';
  if (t.pct < 0.5) return 'BLESSÉ';
  if (c.faim > 85) return 'AFFAMÉ';
  if (c.fatigue > 90) return 'ÉPUISÉ';
  return 'OK';
}

// ===== src/notables.js ===============================================
// Les gens qui comptent dans une ville.
//
// Cinq mille cinq cents habitants nommés, c'est quatre mégaoctets de sauvegarde
// et six cents fois le budget du tick : la population reste donc un effectif,
// réparti par métiers. Mais un effectif ne se rencontre pas. Ceux que le joueur
// peut toucher — celui qui commande, celui qui vend, celui qui recoud, celui qui
// fait tourner l'atelier — ont un nom, un âge, une humeur, une compétence, et
// une opinion sur vous.
//
// Ils vieillissent, se lassent, meurent, sont remplacés. Un armurier retors vend
// cher ; un chef dur tient sa ville mais l'aigrit ; un contremaître qui vous
// aime bien vous laisse voir les stocks. C'est là que la granularité se paie
// vraiment, parce qu'on la voit.


/** Les charges qu'une ville pourvoit, selon ce qu'elle est. */
const CHARGES = {
  chef: {
    nom: 'Chef de ville', skill: 'commerce',
    desc: 'Décide, arbitre, et porte ce qui va mal.',
  },
  armurier: {
    nom: 'Armurier', skill: 'commerce',
    desc: 'Tient l’étal. Ses prix sont les siens.',
  },
  medecin: {
    nom: 'Médecin', skill: 'medecine', requiert: 'medecin',
    desc: 'Le seul dont l’absence se remarque tout de suite.',
  },
  contremaitre: {
    nom: 'Contremaître', skill: 'ingenierie',
    desc: 'Fait tenir la production, et sait où sont les pièces.',
  },
};

const CHARGE_KEYS = Object.keys(CHARGES);

/** Ce qui distingue une personne d'une fonction. */
const CARACTERES = {
  droit: { nom: 'Droit', marge: -0.06, ordre: 0.04, humeur: 6 },
  retors: { nom: 'Retors', marge: 0.1, ordre: -0.02, humeur: -4 },
  dur: { nom: 'Dur', marge: 0.03, ordre: 0.08, humeur: -10 },
  bonhomme: { nom: 'Bonhomme', marge: -0.03, ordre: -0.03, humeur: 12 },
  avare: { nom: 'Avare', marge: 0.13, ordre: 0.01, humeur: -6 },
  meticuleux: { nom: 'Méticuleux', marge: 0, ordre: 0.05, humeur: 2, rendement: 0.1 },
  fatigue: { nom: 'Fatigué', marge: 0.02, ordre: -0.05, humeur: -8, rendement: -0.08 },
  ambitieux: { nom: 'Ambitieux', marge: 0.05, ordre: 0.03, humeur: 0, rendement: 0.06 },
};

const CARACTERE_KEYS = Object.keys(CARACTERES);

// ---------------------------------------------------------------------------
// Naissance et mort d'une charge
// ---------------------------------------------------------------------------

function nommer(rng) {
  const base = rng.pick(NOMS_PERSO);
  return rng.chance(0.35) ? `${base} ${rng.pick(SURNOMS)}` : base;
}

function creerNotable(rng, charge, col, t) {
  const def = CHARGES[charge];
  return {
    id: idDepuisRng(rng, 'n'),
    charge,
    nom: nommer(rng),
    age: rng.irange(26, 62),
    // Compétence dans sa partie : c'est elle qui décide de son effet.
    comp: rng.irange(18, 55) + (col.taille - 1) * rng.irange(2, 8),
    caractere: rng.pick(CARACTERE_KEYS),
    humeur: rng.irange(40, 70),
    // Ce qu'il pense de vous. On part de rien : il ne vous connaît pas.
    opinion: 0,
    // Ce qu'il attend de vous, et ce qu'il retient de vous. Voir services.js.
    demande: null,
    memoire: [],
    depuis: t,
    skill: def.skill,
  };
}

/** Les charges qu'une ville doit pourvoir, d'après ce qu'elle est. */
function chargesDe(col) {
  const out = ['chef', 'armurier'];
  if (col.taille >= 2) out.push('contremaitre');
  if ((col.emplois && col.emplois.medecin) > 0) out.push('medecin');
  return out;
}

/**
 * Pourvoit ce qui manque, retire ce qui n'a plus lieu d'être. Chemin rapide en
 * tête : les charges d'une ville ne changent qu'à un changement de rang ou à la
 * disparition de ses médecins, c'est-à-dire presque jamais — et cette fonction
 * est appelée à chaque tranche de colonie.
 */
function pourvoirCharges(col, rng, t) {
  if (!col.notables) col.notables = [];
  const attendues = 2 + (col.taille >= 2 ? 1 : 0)
    + ((col.emplois && col.emplois.medecin) > 0 ? 1 : 0);
  if (col.notables.length === attendues) return;

  const voulues = chargesDe(col);
  col.notables = col.notables.filter((p) => voulues.includes(p.charge));
  for (const charge of voulues) {
    if (col.notables.some((p) => p.charge === charge)) continue;
    col.notables.push(creerNotable(rng, charge, col, t));
  }
}

function notable(col, charge) {
  if (!col || !col.notables) return null;
  return col.notables.find((p) => p.charge === charge) || null;
}

// ---------------------------------------------------------------------------
// Effets
// ---------------------------------------------------------------------------

function trait(p) {
  return CARACTERES[p && p.caractere] || CARACTERES.droit;
}

/**
 * Ce que l'armurier ajoute à sa marge, ou en retire. Un bon commerçant se
 * défend mieux ; un retors prend davantage ; et il vous fait un prix s'il vous
 * apprécie. Entre le pire et le meilleur cas, ça fait un tiers de différence.
 */
function margeMarchand(col) {
  const p = notable(col, 'armurier');
  if (!p) return 0;
  const t = trait(p);
  return t.marge + Math.min(0.12, p.comp / 700) - (p.opinion / 100) * 0.12;
}

/** Ce que le contremaître ajoute à la production de la ville. */
function rendementNotables(col) {
  const p = notable(col, 'contremaitre');
  if (!p) return 1;
  const t = trait(p);
  return 1 + Math.min(0.25, p.comp / 320) + (t.rendement || 0);
}

/** Ce que le chef retire à l'agitation — ou lui ajoute. */
function ordreDe(col) {
  const p = notable(col, 'chef');
  if (!p) return 0;
  const t = trait(p);
  return t.ordre + Math.min(0.06, p.comp / 900) + (p.humeur - 50) / 2000;
}

/** Comment ces gens vous voient, en moyenne. Sert à l'affichage. */
function opinionMoyenne(col) {
  if (!col.notables || !col.notables.length) return 0;
  let s = 0;
  for (const p of col.notables) s += p.opinion || 0;
  return s / col.notables.length;
}

/** Un geste marquant se sait : on ajuste ce que les gens d'ici pensent de vous. */
function ajusterOpinion(col, delta) {
  if (!col.notables) return;
  for (const p of col.notables) {
    p.opinion = Math.max(-100, Math.min(100, (p.opinion || 0) + delta));
  }
}

// ---------------------------------------------------------------------------
// Tick
// ---------------------------------------------------------------------------

/**
 * Une tranche de vie pour les gens d'une ville. Appelé au rythme des colonies,
 * donc quelques dizaines de fois par jour de jeu au total : ils vieillissent
 * lentement, leur humeur suit l'état de la ville, et leur opinion se cale sur
 * votre réputation auprès de leur faction — plus lentement qu'elle, parce qu'on
 * juge quelqu'un sur ce qu'il fait ici, pas sur ce qu'on dit de lui ailleurs.
 */
function tickNotables(col, rng, dt, reputation, log, t = 0) {
  if (!col.notables || !col.notables.length) return;
  const aise = Math.max(0, Math.min(1, (col.stock.rations || 0) / Math.max(1, col.pop * 0.8)));
  const vers = (reputation || 0) * 0.7;
  const socle = 30 + aise * 45 - (col.unrest || 0) * 40;

  for (const p of col.notables) {
    p.age += dt / HEURES_PAR_AN; // quatre saisons de trente jours, pas 360 jours
    // L'humeur suit ce que vaut la vie ici, amortie par le caractère.
    const t = trait(p);
    const cible = socle + t.humeur;
    p.humeur += (Math.max(0, Math.min(100, cible)) - p.humeur) * 0.01 * dt;
    // On s'améliore dans son métier, lentement, jusqu'à un plafond honnête.
    if (p.comp < 90) p.comp += 0.0016 * dt;
    // L'opinion tend vers votre réputation locale, sans jamais l'atteindre —
    // mais pas à la même vitesse dans les deux sens. Ce qu'on gagne en personne
    // ne s'efface pas au rythme d'une rumeur : à vitesse symétrique, un service
    // rendu était intégralement effacé en une semaine de jeu et tout le système
    // devenait décoratif. Le banc l'a chiffré : zéro personne acquise en fin de
    // partie sur trente parties.
    const ecart = vers - (p.opinion || 0);
    p.opinion = (p.opinion || 0) + ecart * (ecart > 0 ? 0.004 : 0.0008) * dt;

    // On finit par se retirer, ou pire.
    const vieux = Math.max(0, p.age - 58) / 30;
    const q = 0.00006 + vieux * 0.0006;
    if (rng.chance(dt === 1 ? q : 1 - Math.pow(1 - q, dt))) {
      const partant = p.nom;
      const neuf = creerNotable(rng, p.charge, col, 0);
      Object.assign(p, neuf, { depuis: 0 });
      if (log) {
        log({
          type: 'notable',
          texte: `${CHARGES[p.charge].nom} de ${col.nom} : ${partant} laisse la place à ${p.nom}.`,
          regionId: col.regionId,
        });
      }
    }
  }
}

/** Le métier dominant d'une ville, pour la décrire d'un mot. */
function vocation(col) {
  if (!col.emplois) return null;
  let best = null;
  for (const k of METIER_VILLE_KEYS) {
    if (!best || (col.emplois[k] || 0) > (col.emplois[best] || 0)) best = k;
  }
  return best ? { key: best, def: METIERS_VILLE[best], n: col.emplois[best] || 0 } : null;
}

// ===== src/dirigeants.js =============================================
// Qui décide, dans une faction.
//
// Jusqu'ici une faction délibérait comme une moyenne : une agression fixe, une
// cupidité fixe, tirées à la génération et jamais revues. Elle a maintenant
// quelqu'un à sa tête, avec un nom, un âge, un tempérament et une légitimité.
//
// Ce que ça change tient en une phrase : les guerres ont une raison et une fin.
// Un conquérant déclare des guerres qu'un prudent n'aurait pas déclarées ; un
// rancunier ne signe pas la trêve qu'un conciliateur aurait signée ; un
// bâtisseur pousse des postes pendant que les autres se battent. Et comme il
// perd sa place quand il perd ses villes, la politique d'une faction change au
// cours d'une partie sans que rien d'autre n'ait bougé.


/** Le titre qu'on porte, selon ce qu'on dirige. */
const TITRES = {
  corpo: 'Directeur',
  nomade: 'Chef de convoi',
  fanatique: 'Voix du Signal',
  criminel: 'Parrain',
  militaire: 'Commandant',
  commune: 'Porte-parole',
  essaim: 'Rien',
};

/**
 * Les tempéraments. Chaque coefficient multiplie une décision du conseil, et
 * seulement celle-là : c'est ce qui rend l'effet lisible en jeu plutôt que
 * dilué dans une moyenne.
 */
/**
 * Un tempérament ne dit pas seulement comment on fait la guerre : il dit aussi
 * ce qu'on prélève, ce qu'on punit et ce qu'on s'autorise. Les trois derniers
 * champs sont la politique intérieure — `fisc` la main sur la bourse d'autrui,
 * `severite` celle sur la corde, `humain` ce qui retient d'ouvrir un marché
 * d'hommes. Ils valent 1 pour un chef sans caractère particulier.
 */
const TEMPERAMENTS = {
  conquerant: {
    nom: 'Conquérant', guerre: 1.6, treve: 0.55, expansion: 0.8, colonne: 1.25,
    fisc: 1.3, severite: 1.3, humain: 0.8,
    mot: 'Une carte, ça se redessine.',
  },
  prudent: {
    nom: 'Prudent', guerre: 0.45, treve: 1.6, expansion: 1.1, colonne: 0.85,
    fisc: 0.9, severite: 1.05, humain: 1.05,
    mot: 'On ne meurt pas d’avoir attendu.',
  },
  batisseur: {
    nom: 'Bâtisseur', guerre: 0.6, treve: 1.35, expansion: 1.9, colonne: 0.9,
    fisc: 1.15, severite: 0.95, humain: 1.1,
    mot: 'Ce qu’on pose reste. Ce qu’on prend se reprend.',
  },
  rancunier: {
    nom: 'Rancunier', guerre: 1.3, treve: 0.35, expansion: 0.9, colonne: 1.1,
    fisc: 1.0, severite: 1.6, humain: 0.75,
    mot: 'Je n’oublie rien. C’est tout mon travail.',
  },
  conciliateur: {
    nom: 'Conciliateur', guerre: 0.5, treve: 1.9, expansion: 1.2, colonne: 0.8,
    fisc: 0.75, severite: 0.6, humain: 1.35,
    mot: 'Tout se négocie, même ce qui ne se négocie pas.',
  },
  rapace: {
    nom: 'Rapace', guerre: 1.2, treve: 0.9, expansion: 1.4, colonne: 1.15,
    fisc: 1.55, severite: 1.1, humain: 0.5,
    mot: 'Ce qui n’est à personne est à moi.',
  },
  methodique: {
    nom: 'Méthodique', guerre: 0.9, treve: 1.0, expansion: 1.15, colonne: 1.3,
    fisc: 1.05, severite: 1.0, humain: 1.0,
    mot: 'On ne lève pas une colonne sans savoir ce qu’elle rapporte.',
  },
};

const TEMPERAMENT_KEYS = Object.keys(TEMPERAMENTS);

/** Ce vers quoi chaque tempérament de faction penche au moment de choisir. */
const PENCHANT = {
  corpo: ['methodique', 'rapace', 'conciliateur'],
  nomade: ['rapace', 'prudent', 'batisseur'],
  fanatique: ['conquerant', 'rancunier', 'conquerant'],
  criminel: ['rapace', 'rancunier', 'methodique'],
  militaire: ['conquerant', 'methodique', 'rancunier'],
  commune: ['batisseur', 'conciliateur', 'prudent'],
};

/** En dessous, on ne tient plus : quelqu'un prend la place. */
const LEGITIMITE_CRITIQUE = 25;

/**
 * Ce vers quoi une maison se tourne après un échec, selon lequel. On ne succède
 * pas de la même façon à quelqu'un qui a fait gronder le pays et à quelqu'un
 * qui a perdu des villes : le premier appelle une main plus douce, le second
 * une main plus dure. C'est ce qui fait qu'une faction oscille au lieu de
 * dériver toujours dans le même sens.
 */
const APRES = {
  grogne: ['conciliateur', 'prudent', 'batisseur', 'methodique'],
  faiblesse: ['conquerant', 'rancunier', 'rapace', 'methodique'],
};

function creerDirigeant(rng, key, t, apres) {
  const style = FACTIONS[key] ? FACTIONS[key].style : null;
  const penchant = APRES[apres] || PENCHANT[style] || TEMPERAMENT_KEYS;
  // Deux fois sur trois on prend quelqu'un dans la ligne de la maison ; sinon
  // n'importe qui, et c'est là que les factions se surprennent elles-mêmes.
  const temperament = rng.chance(0.68) ? rng.pick(penchant) : rng.pick(TEMPERAMENT_KEYS);
  return {
    id: idDepuisRng(rng, 'd'),
    nom: rng.pick(NOMS_PERSO),
    titre: TITRES[style] || 'Chef',
    temperament,
    age: rng.irange(34, 64),
    depuis: t,
    legitimite: rng.irange(48, 72),
    // Ce qu'on lui reproche : le désordre plutôt que la défaite. Sert à choisir
    // dans quel vivier on prendra son successeur.
    grogne: 0,
    guerres: 0,
    prises: 0,
    pertes: 0,
  };
}

function dirigeant(world, key) {
  const f = world.factions[key];
  return (f && f.dirigeant) || null;
}

/** Le coefficient d'une décision, ou 1 si personne ne dirige. */
function penchant(world, key, quoi) {
  const d = dirigeant(world, key);
  if (!d) return 1;
  const t = TEMPERAMENTS[d.temperament];
  if (!t) return 1;
  const base = t[quoi] ?? 1;
  // Un chef contesté décide moins bien : ni guerre franche, ni paix nette.
  const assise = 0.7 + Math.min(1, d.legitimite / 100) * 0.45;
  return 1 + (base - 1) * assise;
}

/** Une victoire assoit, une perte ronge. C'est ce qui fait tomber les chefs. */
function crediterDirigeant(world, key, quoi, n = 1) {
