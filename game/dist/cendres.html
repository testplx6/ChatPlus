<style>
/* Cendres & Protocole — feuille de style unique.
   Mobile first : tout est pensé pour un pouce sur un écran de 360 px,
   l'affichage large n'est qu'un centrage. */

:root {
  --fond: #0a0c10;
  --fond-2: #11141b;
  --panneau: #151922;
  --panneau-2: #1b2029;
  --bord: #262d3a;
  --bord-vif: #38445a;
  --texte: #c6cedb;
  --texte-2: #7b8699;
  --texte-3: #545e70;
  --cyan: #4fd0e3;
  --ambre: #d9a03a;
  --rouge: #e05b5b;
  --vert: #6be08a;
  --violet: #b06be0;
  --nav-h: 54px;
  --haut-h: 46px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--fond);
  color: var(--texte);
  font-family: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  font-size: 14px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}

body {
  /* Grain léger : le fond ne doit jamais être un aplat mort. */
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px);
}

#racine {
  display: flex;
  flex-direction: column;
  /* On ne dépend pas de la chaîne html/body en 100 % : elle casse en iframe.
     dvh suit la barre d'adresse mobile qui se rétracte au défilement. */
  height: 100vh;
  height: 100dvh;
  max-width: 620px;
  margin: 0 auto;
  border-left: 1px solid var(--bord);
  border-right: 1px solid var(--bord);
}

/* ------------------------------------------------------------------ Barre haute */

#barre-haut {
  flex: 0 0 auto;
  min-height: var(--haut-h);
  padding: 5px 8px;
  padding-top: max(5px, env(safe-area-inset-top));
  background: var(--fond-2);
  border-bottom: 1px solid var(--bord);
  display: flex;
  align-items: center;
  gap: 7px;
  /* Une seule ligne, toujours : l'en-tête ne doit jamais voler de la hauteur
     à la carte sur un petit écran. */
  flex-wrap: nowrap;
  overflow: hidden;
}

.hd-bloc { display: flex; align-items: baseline; gap: 4px; min-width: 0; }
.hd-eti { font-size: 8px; letter-spacing: .1em; color: var(--texte-3); text-transform: uppercase; }
.hd-val { font-size: 12px; color: var(--texte); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hd-val.cyan { color: var(--cyan); }
.hd-val.ambre { color: var(--ambre); }
.hd-val.rouge { color: var(--rouge); }
.hd-pousse { margin-left: auto; }

.vitesse { display: flex; border: 1px solid var(--bord); }
.vitesse { flex: 0 0 auto; }
.vitesse button {
  background: transparent;
  border: 0;
  border-right: 1px solid var(--bord);
  color: var(--texte-2);
  font: inherit;
  font-size: 10px;
  padding: 3px 7px;
  min-height: 30px; /* cible tactile : jamais moins */
  cursor: pointer;
}
.vitesse button:last-child { border-right: 0; }
.vitesse button[aria-pressed="true"] { background: var(--cyan); color: #06222a; }

/* ------------------------------------------------------------------ Écran */

#ecran {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 10px 10px 16px;
}

/* ------------------------------------------------------------------ Navigation */

#barre-nav {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  background: var(--fond-2);
  border-top: 1px solid var(--bord);
  padding-bottom: env(safe-area-inset-bottom);
}

#barre-nav button {
  background: transparent;
  border: 0;
  border-top: 2px solid transparent;
  color: var(--texte-3);
  font: inherit;
  font-size: 10px;
  letter-spacing: .1em;
  padding: 9px 2px;
  min-height: var(--nav-h);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  position: relative;
}
#barre-nav button .glyphe { font-size: 15px; line-height: 1; }
#barre-nav button[aria-current="page"] { color: var(--cyan); border-top-color: var(--cyan); }
#barre-nav .pastille {
  position: absolute;
  top: 5px;
  right: 50%;
  transform: translateX(20px);
  min-width: 15px;
  height: 15px;
  padding: 0 3px;
  background: var(--rouge);
  color: #120606;
  font-size: 9px;
  line-height: 15px;
  text-align: center;
}

/* ------------------------------------------------------------------ Briques */

.panneau {
  background: var(--panneau);
  border: 1px solid var(--bord);
  padding: 9px 10px;
  margin-bottom: 9px;
}

.titre {
  font-size: 10px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--texte-3);
  margin: 0 0 7px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.titre .droite { color: var(--texte-2); letter-spacing: .04em; }

.ligne { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; align-items: baseline; }

.ligne .k { color: var(--texte-2); flex: 0 0 auto; white-space: nowrap; }
.ligne .v { font-variant-numeric: tabular-nums; text-align: right; flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }

   une seule phrase à rallonge. */
.grille2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 18px; }
.grille2 > .ligne { border-bottom: 1px solid #1b2029; }
.grille3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }

button.act, .act {
  background: var(--panneau-2);
  border: 1px solid var(--bord-vif);
  color: var(--texte);
  font: inherit;
  font-size: 12px;
  padding: 8px 9px;
  cursor: pointer;
  text-align: left;
  width: 100%;
  min-height: 38px;
  display: block;
}
button.act:active { background: var(--bord); }
button.act[disabled] { opacity: .38; cursor: not-allowed; }
button.act[aria-pressed="true"] { border-color: var(--cyan); color: var(--cyan); }
button.act.mini { min-height: 30px; padding: 4px 7px; font-size: 11px; text-align: center; }
button.act.primaire { border-color: var(--cyan); color: var(--cyan); }
button.act.danger { border-color: var(--rouge); color: var(--rouge); }

.pile { display: flex; flex-direction: column; gap: 5px; }
.rangee { display: flex; gap: 5px; flex-wrap: wrap; }
.rangee > * { flex: 1 1 auto; width: auto; }

.puce {
  display: inline-block;
  font-size: 10px;
  letter-spacing: .08em;
  padding: 1px 5px;
  border: 1px solid var(--bord-vif);
  color: var(--texte-2);
  text-transform: uppercase;

.puce.ok { border-color: #2b5c3a; color: var(--vert); }
.puce.att { border-color: #6b5320; color: var(--ambre); }
.puce.mal { border-color: #6b2b2b; color: var(--rouge); }

.jauge.rouge > i { background: var(--rouge); }
.jauge.ambre > i { background: var(--ambre); }
.jauge.vert > i { background: var(--vert); }

.aide { font-size: 11px; color: var(--texte-3); line-height: 1.4; }
.mono-num { font-variant-numeric: tabular-nums; }
.sep { height: 1px; background: var(--bord); margin: 8px 0; }

/* ------------------------------------------------------------------ Carte */

#carte-boite {
  border: 1px solid var(--bord);
  background: #05070a;
  line-height: 0;
  overflow: hidden;

#carte {
  width: 100%;
  height: auto;
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: manipulation;
}

.legende { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 7px; }
.legende span { font-size: 10px; color: var(--texte-3); display: flex; align-items: center; gap: 4px; }
.legende i { width: 8px; height: 8px; display: inline-block; }

/* ------------------------------------------------------------------ Escouade */

.perso { border: 1px solid var(--bord); background: var(--panneau); margin-bottom: 7px; }
.perso > summary {
  padding: 8px 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  list-style: none;

.perso > summary::-webkit-details-marker { display: none; }
.perso[open] > summary { border-bottom: 1px solid var(--bord); }
.perso .corps-detail { padding: 9px 10px; }
.perso .nom { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.perso .arch { font-size: 10px; color: var(--texte-3); }

.membres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.membre { border: 1px solid var(--bord); padding: 4px 5px; }
.membre .n { font-size: 9px; color: var(--texte-3); letter-spacing: .06em; }
.membre.perdu { border-color: #6b2b2b; }

.comps { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px 10px; }
.comp-l { display: flex; align-items: center; gap: 6px; font-size: 11px; }
.comp-l .n { color: var(--texte-2); flex: 0 0 68px; }
.comp-l .j { flex: 1 1 auto; }
.comp-l .v { flex: 0 0 26px; text-align: right; font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------------ Journal */

.entree { border-left: 2px solid var(--bord); padding: 4px 0 4px 8px; margin-bottom: 4px; }
.entree .t { font-size: 10px; color: var(--texte-3); }
.entree.danger { border-left-color: var(--rouge); }
.entree.guerre { border-left-color: var(--violet); }
.entree.gain { border-left-color: var(--vert); }
.entree.base { border-left-color: var(--cyan); }
.entree .detail { font-size: 11px; color: var(--texte-3); margin-top: 3px; }

/* ------------------------------------------------------------------ Marché */

.marche-l {
  display: grid;
  grid-template-columns: 1fr auto auto auto;
  gap: 5px;
  align-items: center;
  padding: 3px 0;
  border-bottom: 1px solid #1b2029;
}
.marche-l .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.marche-l .px { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--texte-2); text-align: right; }
.marche-l button { min-height: 28px; padding: 2px 8px; font-size: 11px; width: auto; }

/* ------------------------------------------------------------------ Modale */

#modale[hidden] { display: none; }
#modale {
  position: fixed;
  inset: 0;
  background: rgba(4, 6, 9, .82);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 50;
}
#modale .boite {
  background: var(--panneau);
  border: 1px solid var(--bord-vif);
  width: 100%;
  max-width: 620px;
  max-height: 82vh;
  overflow-y: auto;
  padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
}

/* ------------------------------------------------------------------ Accueil */

.accueil { padding: 18px 4px; }
.accueil h1 {
  font-size: 22px;
  letter-spacing: .16em;
  margin: 0 0 2px;
  color: var(--cyan);
  text-transform: uppercase;
}
.accueil .sous { color: var(--texte-3); font-size: 12px; margin-bottom: 18px; }
.accueil input {
  background: #0b0e13;
  border: 1px solid var(--bord-vif);
  color: var(--texte);
  font: inherit;
  padding: 8px;
  width: 100%;
}

.toast {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom));
  background: var(--panneau-2);
  border: 1px solid var(--bord-vif);
  padding: 7px 12px;
  font-size: 12px;
  z-index: 60;
  max-width: 90%;
  text-align: center;
}
.toast.err { border-color: var(--rouge); color: var(--rouge); }

@media (prefers-reduced-motion: no-preference) {
  .toast { animation: apparait .16s ease-out; }
  @keyframes apparait { from { opacity: 0; transform: translate(-50%, 6px); } }
}
</style>

<script type="module">
// ===== src/rng.js ====================================================
// Générateur pseudo-aléatoire déterministe (mulberry32).
// L'état tient dans un seul entier 32 bits : la sauvegarde est donc exacte,
// et rejouer la même partie depuis la même graine donne le même monde.

class Rng {
  constructor(seed = 1) {
    this.s = seed >>> 0;
  }

  u32() {
    this.s = (this.s + 0x6d2b79f5) >>> 0;
    let t = this.s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return (t ^ (t >>> 14)) >>> 0;
  }

  /** Flottant dans [0, 1) */
  f() {
    return this.u32() / 4294967296;
  }

  /** Entier dans [0, n) */
  int(n) {
    return Math.floor(this.f() * n);
  }

  /** Entier dans [a, b] inclus */
  irange(a, b) {
    if (b < a) return a;
    return a + this.int(b - a + 1);
  }

  /** Flottant dans [a, b) */
  range(a, b) {
    return a + this.f() * (b - a);
  }

  chance(p) {
    return this.f() < p;
  }

  pick(arr) {
    return arr[this.int(arr.length)];
  }

  /** Tirage pondéré : [[valeur, poids], ...] */
  weighted(entries) {
    let total = 0;
    for (const e of entries) total += e[1];
    if (total <= 0) return entries.length ? entries[0][0] : null;
    let r = this.f() * total;
    for (const e of entries) {
      r -= e[1];
      if (r <= 0) return e[0];
    }
    return entries[entries.length - 1][0];
  }

  shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = this.int(i + 1);
      const t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  }

  /** Loi normale approchée (somme de 3 uniformes), bornée à ±3 écarts-types */
  gauss(mean = 0, sd = 1) {
    const u = (this.f() + this.f() + this.f()) / 3;
    return mean + (u - 0.5) * 3.464 * sd;
  }

  save() {
    return this.s >>> 0;
  }
}

/** Graine à partir d'une chaîne (pour les graines saisies par le joueur). */
function seedFromString(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}

// Génération du monde et navigation.
// Tout ce qui est ici appartient à `state.world` : c'est la moitié « partagée »
// de l'état, celle qui vivrait côté serveur dans une future version multijoueur.


const LARGEUR = 10;
const HAUTEUR = 8;

function idx(x, y) {
  return y * LARGEUR + x;
}

function coord(i) {
  return { x: i % LARGEUR, y: Math.floor(i / LARGEUR) };
}

function voisins(i) {
  const { x, y } = coord(i);
  const out = [];
  if (x > 0) out.push(idx(x - 1, y));
  if (x < LARGEUR - 1) out.push(idx(x + 1, y));
  if (y > 0) out.push(idx(x, y - 1));
  if (y < HAUTEUR - 1) out.push(idx(x, y + 1));
  return out;
}

function distance(a, b) {
  const ca = coord(a);
  const cb = coord(b);
  return Math.abs(ca.x - cb.x) + Math.abs(ca.y - cb.y);
}

// ---------------------------------------------------------------------------
// Génération
// ---------------------------------------------------------------------------

function genererBiomes(rng) {
  // Voronoï bruité : quelques noyaux par biome, chaque case prend le plus proche.
  const noyaux = [];
  const pool = BIOME_KEYS.filter((b) => b !== 'relais');
  for (const b of pool) {
    const n = b === 'steppe' ? 3 : rng.irange(1, 2);
    for (let k = 0; k < n; k++) {
      noyaux.push({ b, x: rng.range(0, LARGEUR), y: rng.range(0, HAUTEUR) });
    }
  }
  const regions = [];
  for (let y = 0; y < HAUTEUR; y++) {
    for (let x = 0; x < LARGEUR; x++) {
      let best = null;
      let bestD = Infinity;
      for (const n of noyaux) {
        const d = (n.x - x - 0.5) ** 2 + (n.y - y - 0.5) ** 2 + rng.range(0, 2.2);
        if (d < bestD) { bestD = d; best = n.b; }
      }
      regions.push({
        i: idx(x, y),
        x,
        y,
        biome: best,
        richesse: Number(rng.range(0.65, 1.45).toFixed(2)),
        danger: Number((BIOMES[best].danger * rng.range(0.7, 1.35)).toFixed(3)),
        colonie: null,
        controle: null,
        decouvert: false,
        fouille: 0, // épuisement local par la fouille répétée
      });
    }
  }
  // Un unique Relais Orbital, loin du centre : le point chaud du monde.
  const candidats = regions.filter((r) => r.x <= 1 || r.x >= LARGEUR - 2 || r.y === 0 || r.y === HAUTEUR - 1);
  const relais = rng.pick(candidats);
  relais.biome = 'relais';
  relais.richesse = 1.6;
  relais.danger = BIOMES.relais.danger;
  return regions;
}

function nomVille(rng, pris) {
  for (let essai = 0; essai < 60; essai++) {
    const n = `${rng.pick(VILLE_A)}-${rng.pick(VILLE_B)}`;
    if (!pris.has(n)) { pris.add(n); return n; }
  }
  return `Poste-${pris.size + 1}`;
}

function stockInitial(rng, taille) {
  const s = {};
  for (const k of COMMODITY_KEYS) s[k] = 0;
  s.ferraille = rng.irange(60, 200) * taille;
  s.minerai = rng.irange(30, 120) * taille;
  s.polymere = rng.irange(30, 110) * taille;
  s.biomasse = rng.irange(40, 140) * taille;
  s.rations = rng.irange(50, 160) * taille;
  s.alliage = rng.irange(10, 45) * taille;
  s.carburant = rng.irange(15, 60) * taille;
  s.isotope = rng.irange(4, 25) * taille;
  s.composant = rng.irange(5, 30) * taille;
  s.medkit = rng.irange(2, 12) * taille;
  return s;
}

function genererColonies(rng, regions) {
  const colonies = [];
  const pris = new Set();
  const occupees = new Set();
  const cases = rng.shuffle(regions.map((r) => r.i));

  const cible = 16;
  for (const i of cases) {
    if (colonies.length >= cible) break;
    // Espacement minimal pour que la carte respire
    let tropProche = false;
    for (const c of colonies) {
      if (distance(c.regionId, i) < 2) { tropProche = true; break; }
    }
    if (tropProche || occupees.has(i)) continue;
    const r = regions[i];
    if (r.biome === 'relais') continue;

    const taille = rng.weighted([[1, 5], [2, 3], [3, 1.4]]);
    const col = {
      id: `s${colonies.length + 1}`,
      nom: nomVille(rng, pris),
      regionId: i,
      faction: null,
      taille,
      pop: taille * rng.irange(120, 260),
      defense: 0,
      defenseMax: 0,
      murs: taille * rng.irange(2, 5),
      stock: stockInitial(rng, taille),
      unrest: Number(rng.range(0, 0.2).toFixed(2)),
      marche: 1 + taille * 0.35,
      prises: 0,
    };
    col.defenseMax = Math.round(col.pop * 0.09 + col.murs * 12);
    col.defense = Math.round(col.defenseMax * rng.range(0.6, 1));
    colonies.push(col);
    occupees.add(i);
    r.colonie = col.id;
  }
  return colonies;
}

function attribuerFactions(rng, regions, colonies) {
  const factions = {};
  for (const k of DIPLO_FACTIONS) {
    factions[k] = {
      key: k,
      nom: FACTIONS[k].nom,
      tresor: rng.irange(1200, 4200),
      agression: Number((FACTIONS[k].agression * rng.range(0.85, 1.15)).toFixed(2)),
      relations: {},
      colonies: [],
      capitale: null,
      humeur: 0,
      prochainConseil: rng.irange(6, 40),
    };
  }
  factions.essaim = {
    key: 'essaim',
    nom: FACTIONS.essaim.nom,
    tresor: 0,
    agression: 0.95,
    relations: {},
    colonies: [],
    capitale: null,
    humeur: 0,
    prochainConseil: rng.irange(12, 60),
  };

  // Relations initiales, symétriques (−100 guerre ouverte, +100 alliance)
  for (const a of DIPLO_FACTIONS) {
    for (const b of DIPLO_FACTIONS) {
      if (a === b) continue;
      if (factions[a].relations[b] !== undefined) continue;
      const v = Math.round(rng.gauss(5, 26));
      factions[a].relations[b] = v;
      factions[b].relations[a] = v;
    }
    factions[a].relations.essaim = -100;
    factions.essaim.relations[a] = -100;
  }

  // Chaque colonie va à la faction dont le biome de prédilection correspond
  const libres = rng.shuffle(colonies.slice());
  for (const col of libres) {
    const biome = regions[col.regionId].biome;
    const scores = DIPLO_FACTIONS.map((k) => {
      const aff = FACTIONS[k].biomes.includes(biome) ? 3 : 0.6;
      const charge = factions[k].colonies.length;
      return [k, Math.max(0.15, aff / (1 + charge * 0.55))];
    });
    const k = rng.weighted(scores);
    col.faction = k;
    factions[k].colonies.push(col.id);
    regions[col.regionId].controle = k;
  }

  // Capitale = plus grande colonie de la faction
  for (const k of DIPLO_FACTIONS) {
    const f = factions[k];
    if (!f.colonies.length) continue;
    let best = null;
    for (const cid of f.colonies) {
      const c = colonies.find((x) => x.id === cid);
      if (!best || c.taille > best.taille) best = c;
    }
    f.capitale = best.id;
    best.taille = Math.max(best.taille, 2);
    best.murs += 4;
    best.defenseMax = Math.round(best.pop * 0.09 + best.murs * 12);
    best.defense = best.defenseMax;
  }

  // Zones de contrôle : le territoire rayonne autour des colonies
  for (const col of colonies) {
    for (const v of voisins(col.regionId)) {
      if (regions[v].controle == null && rng.chance(0.7)) regions[v].controle = col.faction;
    }
  }
  return factions;
}

function genererMonde(rng) {
  const regions = genererBiomes(rng);
  const colonies = genererColonies(rng, regions);
  const factions = attribuerFactions(rng, regions, colonies);
  return {
    largeur: LARGEUR,
    hauteur: HAUTEUR,
    regions,
    colonies,
    factions,
    armees: [],
    guerres: [],
    prochainArmeeId: 1,
  };
}

// Accès
// ---------------------------------------------------------------------------

function region(world, i) {
  return world.regions[i];
}

function colonieDe(world, regionId) {
  const r = world.regions[regionId];
  if (!r || !r.colonie) return null;
  return world.colonies.find((c) => c.id === r.colonie) || null;
}

function colonieParId(world, id) {
  return world.colonies.find((c) => c.id === id) || null;
}

function coutTraversee(world, i, mods = {}) {
  const r = world.regions[i];
  const base = BIOMES[r.biome].cout;
  return Math.max(1, base * (1 - (mods.reductionVoyage || 0)));
}

/** Dijkstra sur la grille. Retourne la liste des régions de `from` (exclu) à `to`. */
function chemin(world, from, to, mods = {}) {
  if (from === to) return [];
  const n = world.regions.length;
  const dist = new Array(n).fill(Infinity);
  const prev = new Array(n).fill(-1);
  const vus = new Array(n).fill(false);
  dist[from] = 0;
  for (let iter = 0; iter < n; iter++) {
    let u = -1;
    let best = Infinity;
    for (let i = 0; i < n; i++) {
      if (!vus[i] && dist[i] < best) { best = dist[i]; u = i; }
    }
    if (u === -1) break;
    if (u === to) break;
    vus[u] = true;
    for (const v of voisins(u)) {
      if (vus[v]) continue;
      const nd = dist[u] + coutTraversee(world, v, mods);
      if (nd < dist[v]) { dist[v] = nd; prev[v] = u; }
    }
  }
  if (dist[to] === Infinity) return null;
  const path = [];
  let cur = to;
  while (cur !== from && cur !== -1) {
    path.push(cur);
    cur = prev[cur];
  }
  return path.reverse();
}

/** Révèle une région et ses alentours. */
function decouvrir(world, i, rayon = 1) {
  const { x, y } = coord(i);
  for (let dy = -rayon; dy <= rayon; dy++) {
    for (let dx = -rayon; dx <= rayon; dx++) {
      if (Math.abs(dx) + Math.abs(dy) > rayon) continue;
      const nx = x + dx;
      const ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= LARGEUR || ny >= HAUTEUR) continue;
      world.regions[idx(nx, ny)].decouvert = true;
    }
  }
}

function nomRegion(world, i) {
  const r = world.regions[i];
  const col = colonieDe(world, i);
  if (col) return col.nom;
  return `${BIOMES[r.biome].court} ${String.fromCharCode(65 + r.x)}${r.y + 1}`;
}

// ===== src/characters.js =============================================
// Personnages : génération, compétences qui montent à l'usage, blessures
// localisées, besoins. Aucune notion d'UI ici.


// Les identifiants sont tirés du RNG de la partie, pas d'un compteur global :
// deux parties lancées sur la même graine produisent exactement les mêmes ids,
// et une sauvegarde rechargée reprend la suite sans collision.
function idDepuisRng(rng, prefix = 'c') {
  return prefix + rng.u32().toString(36);
}

// ---------------------------------------------------------------------------
// Création
// ---------------------------------------------------------------------------

const ARCHETYPES = {
  ferrailleur: { nom: 'Ferrailleur', bonus: { ingenierie: 14, endurance: 8, force: 6 }, arme: 'barre' },
  chasseur: { nom: 'Chasseur', bonus: { tir: 16, furtivite: 10 }, arme: 'clous' },
  brute: { nom: 'Brute', bonus: { force: 18, melee: 14, endurance: 6 }, arme: 'machette' },
  medic: { nom: 'Médic', bonus: { medecine: 20, ingenierie: 6 }, arme: 'barre' },
  courtier: { nom: 'Courtier', bonus: { commerce: 20, furtivite: 8 }, arme: 'clous' },
  eclaireur: { nom: 'Éclaireur', bonus: { furtivite: 16, endurance: 12, tir: 6 }, arme: 'machette' },
};

const ARCHETYPE_KEYS = Object.keys(ARCHETYPES);

function makeCharacter(rng, opts = {}) {
  const arch = opts.archetype || rng.pick(ARCHETYPE_KEYS);
  const def = ARCHETYPES[arch];
  const niveau = opts.niveau ?? 0; // 0 = débutant, monte les stats de base
  const c = {
    id: idDepuisRng(rng, 'c'),
    nom: opts.nom || genNom(rng),
    archetype: arch,
    archetypeNom: def.nom,
    age: rng.irange(19, 47),
    skills: {},
    xp: {},
    corps: {},
    faim: rng.irange(5, 25),
    fatigue: rng.irange(0, 20),
    moral: rng.irange(55, 80),
    sang: 0,
    etat: 'ok',
    koHeures: 0,
    equip: { arme: opts.arme || def.arme, armure: opts.armure || null, greffes: {} },
    kills: 0,
    joursSurvecus: 0,
  };
  for (const k of SKILL_KEYS) {
    const base = rng.irange(4, 14) + (def.bonus[k] || 0) + niveau * rng.irange(2, 6);
    c.skills[k] = Math.max(1, Math.min(100, Math.round(base)));
    c.xp[k] = 0;
  }
  for (const p of BODY_KEYS) {
    const max = Math.round(BODY_PARTS[p].pv * (0.85 + c.skills.endurance / 220));
    c.corps[p] = { pv: max, max, perdu: false };
  }
  return c;
}

function genNom(rng) {
  const n = rng.pick(NOMS_PERSO);
  return rng.chance(0.45) ? `${n} ${rng.pick(SURNOMS)}` : n;
}

// ---------------------------------------------------------------------------
// État corporel
// ---------------------------------------------------------------------------

function ratio(c, part) {
  const p = c.corps[part];
  if (!p || p.max <= 0) return 0;
  return Math.max(0, p.pv / p.max);
}

function pvTotal(c) {
  let pv = 0;
  let max = 0;
  for (const p of BODY_KEYS) {
    pv += c.corps[p].pv;
    max += c.corps[p].max;
  }
  return { pv, max, pct: max > 0 ? pv / max : 0 };
}

function estDebout(c) {
  return c.etat === 'ok';
}

function estVivant(c) {
  return c.etat !== 'mort';
}

/** Bonus d'équipement (armure, greffes) sur une compétence. */
function bonusEquip(c, skill) {
  let b = 0;
  const arm = c.equip.armure && ITEMS[c.equip.armure];
  if (arm && arm.bonus && arm.bonus[skill]) b += arm.bonus[skill];
  for (const membre of Object.keys(c.equip.greffes)) {
    const g = ITEMS[c.equip.greffes[membre]];
    if (g && g.bonus && g.bonus[skill]) b += g.bonus[skill];
  }
  return b;
}

/**
 * Valeur effective d'une compétence : base + équipement, dégradée par les
 * blessures pertinentes, la fatigue et la faim.
 */
function comp(c, skill) {
  const base = (c.skills[skill] || 0) + bonusEquip(c, skill);
  const tete = 0.5 + 0.5 * ratio(c, 'tete');
  const torse = 0.6 + 0.4 * ratio(c, 'torse');
  const bras = 0.45 + 0.55 * ((ratio(c, 'brasG') + ratio(c, 'brasD')) / 2);
  const jambes = 0.45 + 0.55 * ((ratio(c, 'jambeG') + ratio(c, 'jambeD')) / 2);

  let m;
  switch (skill) {
    case 'melee': m = tete * torse * bras; break;
    case 'tir': m = tete * torse * (0.6 + 0.4 * bras); break;
    case 'force': m = torse * bras; break;
    case 'endurance': m = torse * jambes; break;
    case 'furtivite': m = tete * jambes * (0.7 + 0.3 * torse); break;
    default: m = tete * torse; break;
  }
  const fat = 1 - Math.min(0.55, c.fatigue / 200);
  const faim = 1 - Math.min(0.45, c.faim / 240);
  const mor = 0.8 + (c.moral / 100) * 0.3;
  return Math.max(1, base * m * fat * faim * mor);
}

// ---------------------------------------------------------------------------
// Progression : l'usage fait la compétence
// ---------------------------------------------------------------------------

const XP_BASE = 18;

function seuilXp(niveau) {
  return Math.round(XP_BASE * Math.pow(niveau + 1, 1.25));
}

/** Retourne le nombre de niveaux gagnés (0 la plupart du temps). */
function gagnerXp(c, skill, montant) {
  if (!(skill in c.skills) || montant <= 0) return 0;
  const niv = c.skills[skill];
  if (niv >= 100) return 0;
  // Plus on est bon, plus ça vient lentement.
  const facteur = Math.max(0.12, 1 - niv / 115);
  c.xp[skill] += montant * facteur;
  let gagnes = 0;
  while (c.skills[skill] < 100 && c.xp[skill] >= seuilXp(c.skills[skill])) {
    c.xp[skill] -= seuilXp(c.skills[skill]);
    c.skills[skill]++;
    gagnes++;
  }
  return gagnes;
}

// ---------------------------------------------------------------------------
// Dégâts et soins
// ---------------------------------------------------------------------------

function armureTotale(c, bonusPct = 0) {
  const a = c.equip.armure && ITEMS[c.equip.armure];
  const base = a ? a.armure : 0;
  return base * (1 + bonusPct);
}

function tirerMembre(rng) {
  const entries = BODY_KEYS.map((k) => [k, BODY_PARTS[k].poids]);
  return rng.weighted(entries);
}

/**
 * Applique des dégâts. Retourne { degats, membre, ko, mort, membrePerdu }.
 * Personne ne meurt d'un seul coup debout : on tombe KO d'abord.
 */
function blesser(c, montant, membre, rng, opts = {}) {
  if (c.etat === 'mort') return { degats: 0, membre, ko: false, mort: false, membrePerdu: false };
  const part = c.corps[membre];
  const d = Math.max(1, Math.round(montant));
  part.pv = Math.max(0, part.pv - d);

  let ko = false;
  let mort = false;
  let membrePerdu = false;

  // opts.letal : true = coup de grâce, false = jamais mortel, absent = 35 %
  const vital = BODY_PARTS[membre].vital;
  if (part.pv <= 0) {
    if (vital) {
      const peutTuer = opts.letal === true
        || (opts.letal !== false && rng.chance(0.35));
      if (c.etat === 'ko' && peutTuer) mort = true;
      else ko = true;
    } else if (!part.perdu && rng.chance(0.22)) {
      part.perdu = true;
      membrePerdu = true;
      ko = true;
    }
  }
  // Un torse ou une tête très amochés font tomber
  if (!mort && c.etat === 'ok') {
    const t = pvTotal(c);
    if (t.pct < 0.32 && rng.chance(0.5)) ko = true;
  }
  if (mort) {
    c.etat = 'mort';
  } else if (ko && c.etat === 'ok') {
    c.etat = 'ko';
    c.koHeures = rng.irange(3, 10);
  }
  // Saignement
  c.sang = Math.min(100, c.sang + d * (vital ? 0.55 : 0.35));
  return { degats: d, membre, ko, mort, membrePerdu };
}

/** Soin sur une heure. `qualite` ~ [0.5, 3] selon médic / infirmerie / medkits. */
function soigner(c, qualite, rng) {
  if (c.etat === 'mort') return;
  // Arrêt du saignement d'abord
  if (c.sang > 0) c.sang = Math.max(0, c.sang - 3 * qualite);
  const parts = BODY_KEYS.filter((p) => c.corps[p].pv < c.corps[p].max);
  if (!parts.length) return;
  const cible = rng.pick(parts);
  const p = c.corps[cible];
  const gain = 0.9 * qualite * (p.perdu ? 0.4 : 1);
  p.pv = Math.min(p.max, p.pv + gain);
  if (c.etat === 'ko') {
    c.koHeures -= 1;
    const t = pvTotal(c);
    if (c.koHeures <= 0 && t.pct > 0.42) c.etat = 'ok';
  }
}

/** Capacité de portage en kg. */
function portage(c, bonusPct = 0) {
  if (!estVivant(c)) return 0;
  const base = 30 + comp(c, 'force') * 0.7 + comp(c, 'endurance') * 0.25;
  const equip = poidsEquip(c);
  return Math.max(0, base * (1 + bonusPct) - equip);
}

function poidsEquip(c) {
  let w = 0;
  if (c.equip.arme && ITEMS[c.equip.arme]) w += ITEMS[c.equip.arme].poids;
  if (c.equip.armure && ITEMS[c.equip.armure]) w += ITEMS[c.equip.armure].poids;
  return w;
}

/** Peut-il porter cette arme ? (les grosses armes demandent de la force) */
function peutEquiper(c, itemKey) {
  const it = ITEMS[itemKey];
  if (!it) return false;
  if (it.reqForce && comp(c, 'force') < it.reqForce) return false;
  if (it.type === 'greffe') {
    const p = c.corps[it.membre];
    return !!p;
  }
  return true;
}

// ---------------------------------------------------------------------------
// Besoins horaires
// ---------------------------------------------------------------------------

/**
 * Fait passer une heure sur un personnage.
 * `effort` : 0 repos, 1 marche/travail normal, 1.6 combat ou marche forcée.
 * Retourne un tableau de messages notables (mort, membre perdu…).
 */
function tickPerso(c, effort, rng, ctx = {}) {
  const msgs = [];
  if (c.etat === 'mort') return msgs;

  c.faim = Math.min(120, c.faim + 0.55 + 0.25 * effort);
  if (effort <= 0.05) {
    c.fatigue = Math.max(0, c.fatigue - 6);
  } else {
    const end = comp(c, 'endurance');
    c.fatigue = Math.min(120, c.fatigue + (1.6 * effort) * (1 - Math.min(0.5, end / 200)));
  }

  // Saignement : une plaie légère se referme seule ; une hémorragie tue.
  if (c.sang > 0) {
    if (c.sang > 12) {
      const perte = (c.sang - 12) / 26;
      const r = blesser(c, perte, 'torse', rng, { letal: c.sang > 40 ? rng.chance(0.3) : false });
      if (r.mort) msgs.push({ type: 'mort', texte: `${c.nom} s’est vidé de son sang.` });
    }
    // Coagulation, accélérée si quelqu'un est encore debout pour comprimer
    c.sang = Math.max(0, c.sang - 2.2 - (ctx.premiersSecours ? 2.5 : 0));
  }

  // Famine
  if (c.faim >= 100) {
    const r = blesser(c, 1.6, 'torse', rng);
    if (r.mort) msgs.push({ type: 'mort', texte: `${c.nom} est mort de faim.` });
    c.moral = Math.max(0, c.moral - 1.2);
  } else if (c.faim < 40) {
    c.moral = Math.min(100, c.moral + 0.25);
  }

  // Épuisement
  if (c.fatigue >= 110) {
    c.moral = Math.max(0, c.moral - 0.8);
    if (c.etat === 'ok' && rng.chance(0.05)) {
      c.etat = 'ko';
      c.koHeures = rng.irange(2, 5);
      msgs.push({ type: 'ko', texte: `${c.nom} s’effondre d’épuisement.` });
    }
  }

  // Récupération naturelle légère hors combat
  const q = ctx.soin ?? 0;
  if (q > 0) soigner(c, q, rng);
  else if (effort <= 0.05) soigner(c, 0.35, rng);

  if (c.etat === 'ko') {
    c.koHeures = Math.max(0, c.koHeures - 1);
    const t = pvTotal(c);
    if (c.koHeures <= 0 && t.pct > 0.42) {
      c.etat = 'ok';
      msgs.push({ type: 'reveil', texte: `${c.nom} se remet debout.` });
    }
  }
  return msgs;
}

/** Nourrit un personnage. Retourne la quantité de rations consommée. */
function nourrir(c, dispo) {
  if (c.etat === 'mort' || dispo <= 0) return 0;
  if (c.faim < 25) return 0;
  const besoin = Math.min(dispo, Math.ceil(c.faim / 45));
  c.faim = Math.max(0, c.faim - besoin * 45);
  c.moral = Math.min(100, c.moral + besoin * 1.5);
  return besoin;
}

/** Résumé court pour l'UI. */
function etatCourt(c) {
  if (c.etat === 'mort') return 'MORT';
  if (c.etat === 'ko') return 'K.O.';
  const t = pvTotal(c);
  if (c.sang > 25) return 'SAIGNE';
  if (t.pct < 0.5) return 'BLESSÉ';
  if (c.faim > 85) return 'AFFAMÉ';
  if (c.fatigue > 90) return 'ÉPUISÉ';
  return 'OK';
}

// ===== src/combat.js =================================================
// Résolution de combat au tour par tour, déterministe.
// Personne ne meurt d'un coup : on tombe K.O., puis on peut être achevé,
// capturé, ou laissé pour mort — la nuance Kenshi.


// ---------------------------------------------------------------------------
// Génération d'opposants
// ---------------------------------------------------------------------------

const BANDES = {
  essaim: { nom: 'Meute de l’Essaim', archetypes: ['brute', 'chasseur'], niveau: 1, letal: 0.55 },
  ombrelle: { nom: 'Racketteurs Ombrelle', archetypes: ['courtier', 'chasseur', 'brute'], niveau: 0, letal: 0.15 },
  cendre: { nom: 'Patrouille de Cendre', archetypes: ['brute', 'chasseur'], niveau: 1, letal: 0.3 },
  hexa: { nom: 'Sécurité Hexa', archetypes: ['chasseur', 'brute'], niveau: 1, letal: 0.2 },
  signal: { nom: 'Prêcheurs du Signal', archetypes: ['brute', 'medic'], niveau: 0, letal: 0.4 },
  rouilleurs: { nom: 'Bande de Rouilleurs', archetypes: ['ferrailleur', 'brute'], niveau: 0, letal: 0.2 },
  libres: { nom: 'Milice de commune', archetypes: ['chasseur', 'ferrailleur'], niveau: 0, letal: 0.1 },
  bandits: { nom: 'Pillards', archetypes: ['brute', 'chasseur', 'eclaireur'], niveau: 0, letal: 0.25 },
};

const ARMES_PAR_NIVEAU = [
  ['barre', 'clous'],
  ['machette', 'clous', 'verrou'],
  ['katana', 'verrou', 'smg'],
  ['katana', 'smg', 'rail', 'masse'],
];

const ARMURES_PAR_NIVEAU = [
  [null, null, 'cuir'],
  [null, 'cuir', 'plaque'],
  ['cuir', 'plaque', 'kevlar'],
  ['plaque', 'kevlar', 'exo'],
];

function genererBande(rng, factionKey, taille, niveauMonde = 0) {
  const def = BANDES[factionKey] || BANDES.bandits;
  const niv = Math.max(0, Math.min(3, def.niveau + niveauMonde));
  const membres = [];
  for (let i = 0; i < taille; i++) {
    const c = makeCharacter(rng, {
      archetype: rng.pick(def.archetypes),
      niveau: niv,
    });
    c.equip.arme = rng.pick(ARMES_PAR_NIVEAU[niv]);
    c.equip.armure = rng.pick(ARMURES_PAR_NIVEAU[niv]);
    c.faction = factionKey;
    membres.push(c);
  }
  return { nom: def.nom, faction: factionKey, membres, letal: def.letal };
}

// ---------------------------------------------------------------------------
// Combat
// ---------------------------------------------------------------------------

function armeDe(c) {
  return (c.equip.arme && ITEMS[c.equip.arme]) || { degats: 4, pen: 0, portee: 'melee', comp: 'melee' };
}

function scoreAttaque(c, arme, bonus) {
  const skill = arme.comp === 'tir' ? 'tir' : 'melee';
  const base = comp(c, skill);
  const dex = comp(c, 'endurance') * 0.15;
  return base + dex + (bonus || 0);
}

function scoreDefense(c) {
  return comp(c, 'melee') * 0.35 + comp(c, 'endurance') * 0.35 + comp(c, 'furtivite') * 0.2 + 8;
}

function ciblesValides(camp) {
  return camp.filter((c) => estDebout(c));
}

function forceCamp(camp) {
  let f = 0;
  for (const c of camp) {
    if (!estDebout(c)) continue;
    const a = armeDe(c);
    f += (comp(c, a.comp === 'tir' ? 'tir' : 'melee') + a.degats * 2 + armureTotale(c)) * pvTotal(c).pct;
  }
  return f;
}

/**
 * Résout un affrontement entre deux camps de personnages.
 *
 * ctx : {
 *   rng, biome, posture, bonusDegats, bonusArmure,
 *   letalA, letalB   (probabilité d'achever un K.O. adverse)
 * }
 *
 * Retourne { vainqueur:'A'|'B'|'nul', tours, journal:[], morts:[], koA, koB, fuite }
 */
function resoudreCombat(campA, campB, ctx) {
  const rng = ctx.rng;
  const journal = [];
  const posture = ctx.posture || { degats: 1, fuite: 0.3 };
  const biome = BIOMES[ctx.biome];
  const couvert = biome ? (biome.cout > 5 ? 0.12 : 0.04) : 0.06;

  let tours = 0;
  let fuite = null;
  const maxTours = 24;

  const f0A = forceCamp(campA);
  const f0B = forceCamp(campB);

  while (tours < maxTours) {
    tours++;
    const vivA = ciblesValides(campA);
    const vivB = ciblesValides(campB);
    if (!vivA.length || !vivB.length) break;

    // Repli : le camp du joueur décroche s'il prend trop cher
    const ratioA = forceCamp(campA) / Math.max(1, f0A);
    const ratioB = forceCamp(campB) / Math.max(1, f0B);
    if (tours > 2 && ratioA < 0.45 && rng.chance(posture.fuite)) { fuite = 'A'; break; }
    if (tours > 2 && ratioB < 0.4 && rng.chance(0.35)) { fuite = 'B'; break; }

    const ordre = rng.shuffle(
      vivA.map((c) => ({ c, camp: 'A' })).concat(vivB.map((c) => ({ c, camp: 'B' })))
    );

    for (const acteur of ordre) {
      const c = acteur.c;
      if (!estDebout(c)) continue;
      const adverses = ciblesValides(acteur.camp === 'A' ? campB : campA);
      if (!adverses.length) break;

      const arme = armeDe(c);
      const bonusD = acteur.camp === 'A' ? (ctx.bonusDegats || 0) : 0;
      const bonusArm = acteur.camp === 'A' ? (ctx.bonusArmure || 0) : 0;
      const coups = arme.rafale || 1;

      for (let k = 0; k < coups; k++) {
        const cibles2 = ciblesValides(acteur.camp === 'A' ? campB : campA);
        if (!cibles2.length) break;
        // On vise de préférence le plus amoché : la simulation est cruelle.
        const cible = rng.chance(0.55)
          ? cibles2.reduce((a, b) => (pvTotal(a).pct <= pvTotal(b).pct ? a : b))
          : rng.pick(cibles2);

        const att = scoreAttaque(c, arme, acteur.camp === 'A' ? bonusD * 20 : 0);
        const def = scoreDefense(cible) * (1 + couvert);
        const p = Math.max(0.08, Math.min(0.94, 0.5 + (att - def) / (att + def + 30)));
        if (!rng.chance(p)) {
          if (rng.chance(0.25)) {
            journal.push({ t: 'rate', txt: `${c.nom} manque ${cible.nom}.` });
          }
          continue;
        }

        const membre = tirerMembre(rng);
        const arm = armureTotale(cible, acteur.camp === 'B' ? bonusArm : 0);
        const brut = arme.degats
          * rng.range(0.75, 1.3)
          * (1 + comp(c, 'force') / 260)
          * (acteur.camp === 'A' ? posture.degats * (1 + bonusD) : 1);
        // L'armure réduit fortement mais ne rend jamais invulnérable : sinon un
        // groupe blindé devient impossible à entamer avec de l'équipement de départ.
        const absorbe = arm * (1 - arme.pen) * 0.6;
        const net = Math.max(1.5, brut - absorbe * rng.range(0.5, 1.0));

        const letal = acteur.camp === 'A' ? (ctx.letalA || 0.08) : (ctx.letalB || 0.2);
        const res = blesser(cible, net, membre, rng, { letal: rng.chance(letal) });

        gagnerXp(c, arme.comp === 'tir' ? 'tir' : 'melee', 1.4 + net * 0.06);
        gagnerXp(cible, 'endurance', 0.7 + net * 0.03);

        if (res.mort) {
          c.kills++;
          journal.push({ t: 'mort', txt: `${c.nom} abat ${cible.nom}.` });
        } else if (res.membrePerdu) {
          journal.push({ t: 'membre', txt: `${cible.nom} perd un membre (${membre}).` });
        } else if (res.ko) {
          journal.push({ t: 'ko', txt: `${cible.nom} s’écroule sous les coups de ${c.nom}.` });
        } else if (journal.length < 40) {
          journal.push({ t: 'coup', txt: `${c.nom} touche ${cible.nom} (${Math.round(net)}).` });
        }
      }
    }
  }

  const deboutA = ciblesValides(campA).length;
  const deboutB = ciblesValides(campB).length;
  let vainqueur = 'nul';
  if (fuite === 'A') vainqueur = 'B';
  else if (fuite === 'B') vainqueur = 'A';
  else if (deboutA && !deboutB) vainqueur = 'A';
  else if (deboutB && !deboutA) vainqueur = 'B';

  return {
    vainqueur,
    tours,
    fuite,
    journal,
    koA: campA.filter((c) => c.etat === 'ko').length,
    koB: campB.filter((c) => c.etat === 'ko').length,
    mortsA: campA.filter((c) => c.etat === 'mort').length,
    mortsB: campB.filter((c) => c.etat === 'mort').length,
    survivantsB: campB.filter((c) => estVivant(c)).length,
  };
}

/** Butin ramassé sur une bande vaincue. */
function butin(bande, rng) {
  const loot = {};
  const objets = [];
  let credits = 0;
  for (const m of bande.membres) {
    if (estDebout(m)) continue; // on ne dépouille pas ceux qui tiennent debout
    credits += rng.irange(4, 40);
    const add = (k, n) => { loot[k] = (loot[k] || 0) + n; };
    add('ferraille', rng.irange(1, 5));
    if (rng.chance(0.35)) add('rations', rng.irange(1, 3));
    if (rng.chance(0.2)) add('composant', rng.irange(1, 2));
    if (rng.chance(0.12)) add('medkit', 1);
    if (m.equip.arme && rng.chance(0.4)) objets.push(m.equip.arme);
    if (m.equip.armure && rng.chance(0.3)) objets.push(m.equip.armure);
  }
  return { loot, objets, credits };
}

// ===== src/economy.js ================================================
// Économie locale : chaque colonie produit, consomme, et fixe ses prix à partir
// de son propre stock. Une ville affamée paie les rations au prix fort ; une
// ville assise sur une mine brade son minerai.


/** Stock « confortable » visé par une colonie pour une marchandise. */
function cibleStock(col, key) {
  const p = col.pop;
  switch (key) {
    case 'rations': return p * 0.9;
    case 'biomasse': return p * 0.5;
    case 'ferraille': return p * 0.7;
    case 'minerai': return p * 0.4;
    case 'polymere': return p * 0.35;
    case 'carburant': return p * 0.2;
    case 'alliage': return p * 0.15;
    case 'isotope': return p * 0.06;
    case 'composant': return p * 0.08;
    case 'medkit': return p * 0.03;
    default: return p * 0.3;
  }
}

/** Prix unitaire courant, tiré de la tension offre/demande. */
function prixUnitaire(col, key) {
  const base = COMMODITIES[key].prix;
  const cible = Math.max(1, cibleStock(col, key));
  const stock = Math.max(0, col.stock[key] || 0);
  // Rapport stock/cible → facteur borné [0.45, 3.2]
  const tension = cible / (stock + cible * 0.35);
  const f = Math.max(0.45, Math.min(3.2, Math.pow(tension, 0.85)));
  return base * f * (1 + col.unrest * 0.35);
}

/**
 * Prix effectifs pour le joueur.
 * `habilete` : compétence de commerce du meilleur négociateur (0-100).
 * `repu`     : réputation avec la faction propriétaire (−100..100).
 */
function prixJoueur(col, key, habilete = 0, repu = 0) {
  const p = prixUnitaire(col, key);
  const marge = Math.max(0.06, 0.18 - habilete / 900 - Math.max(0, repu) / 1400);
  const majorationHostile = repu < -20 ? 0.15 + Math.min(0.4, -repu / 220) : 0;
  // Non arrondi volontairement : arrondir à l'unité écraserait la marge sur les
  // marchandises bon marché et rendrait l'aller-retour achat/revente gratuit.
  return {
    achat: Math.max(0.5, p * (1 + marge + majorationHostile)),
    vente: Math.max(0.25, p * (1 - marge - majorationHostile * 0.5)),
  };
}

/** Production horaire d'une colonie, dérivée de son biome et de sa taille. */
function productionColonie(world, col) {
  const biome = BIOMES[world.regions[col.regionId].biome];
  const ech = col.pop * 0.012 * world.regions[col.regionId].richesse;
  const prod = {};
  for (const k of Object.keys(biome.yields)) {
    prod[k] = biome.yields[k] * ech;
  }
  // Transformation locale : un peu de biomasse devient rations, du minerai devient alliage
  prod.rations = (prod.rations || 0) + Math.min(prod.biomasse || 0, col.pop * 0.006) * 0.8;
  if (col.taille >= 2) {
    prod.alliage = (prod.alliage || 0) + (prod.minerai || 0) * 0.12;
    prod.composant = (prod.composant || 0) + col.pop * 0.00035 * col.taille;
  }
  if (col.taille >= 3) {
    prod.medkit = (prod.medkit || 0) + col.pop * 0.00012;
  }
  return prod;
}

function consommationColonie(col) {
  return {
    rations: col.pop * 0.014,
    biomasse: col.pop * 0.006,
    carburant: col.pop * 0.0022 * col.taille,
    ferraille: col.pop * 0.004,
    composant: col.pop * 0.00018 * col.taille,
    medkit: col.pop * 0.00006,
  };
}

/** Une heure de vie économique et sociale pour une colonie. */
function tickColonie(world, col, rng) {
  const prod = productionColonie(world, col);
  const cons = consommationColonie(col);

  for (const k of COMMODITY_KEYS) {
    const p = prod[k] || 0;
    const c = cons[k] || 0;
    col.stock[k] = Math.max(0, (col.stock[k] || 0) + p - c);
  }

  // Pénurie de rations → agitation, puis exode
  const manque = (col.stock.rations || 0) < col.pop * 0.05;
  if (manque) {
    col.unrest = Math.min(1, col.unrest + 0.006);
    if (rng.chance(0.05)) col.pop = Math.max(30, col.pop - rng.irange(1, 4));
  } else {
    col.unrest = Math.max(0, col.unrest - 0.0025);
    if (rng.chance(0.02)) col.pop += rng.irange(0, 2);
  }
  col.pop = Math.min(col.taille * 900, col.pop);

  // Reconstruction de la défense
  if (col.defense < col.defenseMax) {
    col.defense = Math.min(col.defenseMax, col.defense + col.defenseMax * 0.004 * (1 - col.unrest));
  }
  col.defenseMax = Math.round(col.pop * 0.09 + col.murs * 12);

  // Plafond de stock : on ne stocke pas l'infini
  for (const k of COMMODITY_KEYS) {
    const plafond = cibleStock(col, k) * 4;
    if (col.stock[k] > plafond) col.stock[k] = plafond;
  }
}

// ---------------------------------------------------------------------------
// Transactions du joueur
// ---------------------------------------------------------------------------

function meilleurCommercant(squad) {
  let best = null;
  for (const c of squad) {
    if (c.etat === 'mort') continue;
    if (!best || comp(c, 'commerce') > comp(best, 'commerce')) best = c;
  }
  return best;
}

function poidsInventaire(inv) {
  let w = 0;
  for (const k of Object.keys(inv)) {
    if (!COMMODITIES[k]) continue;
    w += inv[k] * COMMODITIES[k].poids;
  }
  return w;
}

/**
 * Achat par le joueur. Retourne { ok, motif, qte, cout }.
 * Le prix bouge au fur et à mesure de la transaction : acheter tout le stock
 * d'une petite ville coûte cher.
 */
function acheter(state, col, key, qte) {
  const negoc = meilleurCommercant(state.player.squad);
  const hab = negoc ? comp(negoc, 'commerce') : 0;
  const repu = state.player.reputation[col.faction] || 0;
  let restant = Math.floor(qte);
  let cout = 0;
  let achetes = 0;

  const capacite = capacitePortage(state);
  const libre = capacite - poidsInventaire(state.player.inventaire);
  const poidsU = COMMODITIES[key].poids;
  const maxPoids = poidsU > 0 ? Math.floor(libre / poidsU) : restant;
  if (maxPoids <= 0) return { ok: false, motif: 'Sac plein.', qte: 0, cout: 0 };
  restant = Math.min(restant, maxPoids);

  while (restant > 0) {
    if ((col.stock[key] || 0) < 1) break;
    const p = prixJoueur(col, key, hab, repu).achat;
    if (state.player.credits - cout < p) break;
    cout += p;
    col.stock[key] -= 1;
    achetes += 1;
    restant -= 1;
  }
  if (achetes === 0) return { ok: false, motif: 'Rien à acheter à ce prix.', qte: 0, cout: 0 };
  cout = Math.round(cout);
  state.player.credits -= cout;
  state.player.inventaire[key] = (state.player.inventaire[key] || 0) + achetes;
  if (negoc) gagnerXp(negoc, 'commerce', 0.6 + achetes * 0.06);
  return { ok: true, qte: achetes, cout };
}

function vendre(state, col, key, qte) {
  const negoc = meilleurCommercant(state.player.squad);
  const hab = negoc ? comp(negoc, 'commerce') : 0;
  const repu = state.player.reputation[col.faction] || 0;
  let restant = Math.min(Math.floor(qte), state.player.inventaire[key] || 0);
  let gain = 0;
  let vendus = 0;
  while (restant > 0) {
    const p = prixJoueur(col, key, hab, repu).vente;
    gain += p;
    col.stock[key] = (col.stock[key] || 0) + 1;
    vendus += 1;
    restant -= 1;
  }
  if (vendus === 0) return { ok: false, motif: 'Rien à vendre.', qte: 0, gain: 0 };
  gain = Math.round(gain);
  state.player.inventaire[key] -= vendus;
  state.player.credits += gain;
  if (negoc) gagnerXp(negoc, 'commerce', 0.6 + vendus * 0.06);
  return { ok: true, qte: vendus, gain };
}

/** Capacité de portage totale de l'escouade. */
function capacitePortage(state) {
  let cap = 0;
  const bonus = (state.base.recherche.logistique || 0) * 0.15;
  for (const c of state.player.squad) {
    // Un mort ne porte plus rien, et un K.O. est lui-même porté par les autres.
    if (c.etat === 'mort' || c.etat === 'ko') continue;
    cap += portage(c, bonus);
  }
  return Math.round(cap);
}

/** Valeur marchande approximative d'un lot, pour l'UI. */
function valeurLot(lot) {
  let v = 0;
  for (const k of Object.keys(lot)) {
    if (COMMODITIES[k]) v += lot[k] * COMMODITIES[k].prix;
  }
  return Math.round(v);
}

// ===== src/factions.js ===============================================
// Le monde tourne sans le joueur : les factions lèvent des armées, assiègent,
// prennent des colonies, signent des paix. C'est le cœur « vivant » de la sim.


// ---------------------------------------------------------------------------
// Mesures
// ---------------------------------------------------------------------------

function puissance(world, key) {
  const f = world.factions[key];
  if (!f) return 0;
  let p = f.tresor / 60;
  for (const cid of f.colonies) {
    const c = colonieParId(world, cid);
    if (!c) continue;
    p += c.pop * 0.06 + c.defense * 0.5 + c.murs * 4;
  }
  for (const a of world.armees) {
    if (a.faction === key) p += a.force * 0.6;
  }
  return Math.round(p);
}

function enGuerre(world, a, b) {
  if (a === 'essaim' || b === 'essaim') return a !== b;
  return world.guerres.some(
    (g) => (g.a === a && g.b === b) || (g.a === b && g.b === a)
  );
}

function guerresDe(world, key) {
  return world.guerres.filter((g) => g.a === key || g.b === key);
}

function relation(world, a, b) {
  const f = world.factions[a];
  if (!f) return 0;
  return f.relations[b] ?? 0;
}

function majRelation(world, a, b, delta) {
  const fa = world.factions[a];
  const fb = world.factions[b];
  if (!fa || !fb || a === b) return;
  if (a === 'essaim' || b === 'essaim') return;
  const v = Math.max(-100, Math.min(100, (fa.relations[b] ?? 0) + delta));
  fa.relations[b] = v;
  fb.relations[a] = v;
}

function declarerGuerre(world, a, b, t, log) {
  if (enGuerre(world, a, b)) return;
  world.guerres.push({ a, b, depuis: t, batailles: 0 });
  majRelation(world, a, b, -60);
  log({
    type: 'guerre',
    texte: `${FACTIONS[a].nom} déclare${FACTIONS[a].pluriel ? 'nt' : ''} la guerre ${FACTIONS[b].datif}.`,
    factions: [a, b],
  });
}

function signerPaix(world, a, b, t, log) {
  const i = world.guerres.findIndex(
    (g) => (g.a === a && g.b === b) || (g.a === b && g.b === a)
  );
  if (i < 0) return;
  world.guerres.splice(i, 1);
  majRelation(world, a, b, 45);
  log({
    type: 'paix',
    texte: `${FACTIONS[a].nom} et ${FACTIONS[b].nom} signent une trêve.`,
    factions: [a, b],
  });
}

// ---------------------------------------------------------------------------
// Armées
// ---------------------------------------------------------------------------

function coutArmee(force) {
  return Math.round(force * 3.2);
}

function leverArmee(world, key, force, depuis, cibleId, log) {
  const f = world.factions[key];
  const col = colonieParId(world, cibleId);
  if (!col) return null;
  const route = chemin(world, depuis, col.regionId) || [];
  const a = {
    id: `a${world.prochainArmeeId++}`,
    faction: key,
    regionId: depuis,
    force,
    forceMax: force,
    cible: cibleId,
    route,
    etape: 0,
    progres: 0,
    etat: 'marche',
    ravitaillement: 60 + Math.round(force / 4),
  };
  world.armees.push(a);
  f.tresor -= coutArmee(force);
  log({
    type: 'armee',
    texte: `${FACTIONS[key].nom} lève${FACTIONS[key].pluriel ? 'nt' : ''} une colonne (${force}) en direction de ${col.nom}.`,
    factions: [key],
    regionId: depuis,
  });
  return a;
}

function dissoudre(world, armee) {
  const i = world.armees.indexOf(armee);
  if (i >= 0) world.armees.splice(i, 1);
}

function capturer(world, armee, col, t, log, ctx) {
  const ancien = col.faction;
  const nouveau = armee.faction;
  if (ancien && world.factions[ancien]) {
    const fa = world.factions[ancien];
    fa.colonies = fa.colonies.filter((c) => c !== col.id);
    if (fa.capitale === col.id) fa.capitale = fa.colonies[0] || null;
  }

  if (nouveau === 'essaim') {
    // L'Essaim ne gouverne pas : il saigne la ville et repart.
    col.pop = Math.max(40, Math.round(col.pop * 0.55));
    col.unrest = Math.min(1, col.unrest + 0.4);
    for (const k of COMMODITY_KEYS) col.stock[k] = Math.round((col.stock[k] || 0) * 0.35);
    col.defense = 0;
    col.faction = ancien;
    if (ancien && world.factions[ancien] && !world.factions[ancien].colonies.includes(col.id)) {
      world.factions[ancien].colonies.push(col.id);
    }
    log({
      type: 'raid',
      texte: `L’Essaim saccage ${col.nom}. La ville tient, à peine.`,
      regionId: col.regionId,
      factions: [ancien].filter(Boolean),
    });
  } else {
    col.faction = nouveau;
    world.factions[nouveau].colonies.push(col.id);
    world.regions[col.regionId].controle = nouveau;
    for (const v of voisins(col.regionId)) {
      if (world.regions[v].controle === ancien) world.regions[v].controle = nouveau;
    }
    col.pop = Math.max(50, Math.round(col.pop * 0.82));
    col.unrest = Math.min(1, col.unrest + 0.35);
    col.prises = (col.prises || 0) + 1;
    // Pillage : une partie du stock file dans le trésor du vainqueur
    let butin = 0;
    for (const k of COMMODITY_KEYS) {
      const pris = Math.round((col.stock[k] || 0) * 0.3);
      col.stock[k] -= pris;
      butin += pris;
    }
    world.factions[nouveau].tresor += Math.round(butin * 1.6);
    col.defense = Math.round(col.defenseMax * 0.25);
    log({
      type: 'capture',
      texte: `${FACTIONS[nouveau].nom} s’empare${FACTIONS[nouveau].pluriel ? 'nt' : ''} de ${col.nom}${ancien ? ` (${FACTIONS[ancien].nom})` : ''}.`,
      regionId: col.regionId,
      factions: [nouveau, ancien].filter(Boolean),
    });
    if (ancien) majRelation(world, nouveau, ancien, -25);
  }

  // La colonne fond après la prise : elle devient garnison
  armee.force = Math.round(armee.force * 0.5);
  if (armee.force < 12 || nouveau === 'essaim') dissoudre(world, armee);
  else {
    armee.etat = 'garnison';
    armee.attente = ctx.rng.irange(20, 90);
  }
}

function batailleArmees(world, a, b, t, log, ctx) {
  const rng = ctx.rng;
  const fa = a.force * rng.range(0.75, 1.3);
  const fb = b.force * rng.range(0.75, 1.3);
  const total = fa + fb;
  const pertesA = Math.round(a.force * (fb / total) * rng.range(0.55, 1.05));
  const pertesB = Math.round(b.force * (fa / total) * rng.range(0.55, 1.05));
  a.force = Math.max(0, a.force - pertesA);
  b.force = Math.max(0, b.force - pertesB);
  const g = world.guerres.find(
    (w) => (w.a === a.faction && w.b === b.faction) || (w.a === b.faction && w.b === a.faction)
  );
  if (g) g.batailles++;
  log({
    type: 'bataille',
    texte: `Choc de colonnes : ${FACTIONS[a.faction].nom} (−${pertesA}) contre ${FACTIONS[b.faction].nom} (−${pertesB}).`,
    regionId: a.regionId,
    factions: [a.faction, b.faction],
  });
  for (const armee of [a, b]) {
    if (armee.force <= 8) {
      log({
        type: 'armee',
        texte: `La colonne ${FACTIONS[armee.faction].genitif} est anéantie.`,
        regionId: armee.regionId,
        factions: [armee.faction],
      });
      dissoudre(world, armee);
    }
  }
}

function tickArmee(world, armee, t, log, ctx) {
  const rng = ctx.rng;

  // Ravitaillement : une colonne loin de chez elle finit par se déliter
  armee.ravitaillement -= 1;
  if (armee.ravitaillement <= 0) {
    armee.force -= Math.max(1, Math.round(armee.force * 0.02));
    if (armee.force <= 8) {
      log({
        type: 'armee',
        texte: `La colonne ${FACTIONS[armee.faction].genitif} se disperse, faute de vivres.`,
        regionId: armee.regionId,
        factions: [armee.faction],
      });
      dissoudre(world, armee);
      return;
    }
  }

  if (armee.etat === 'garnison') {
    armee.attente -= 1;
    const col = colonieParId(world, armee.cible);
    if (col) col.defense = Math.min(col.defenseMax, col.defense + armee.force * 0.05);
    if (armee.attente <= 0) dissoudre(world, armee);
    return;
  }

  if (armee.etat === 'marche') {
    const cible = colonieParId(world, armee.cible);
    if (!cible) { dissoudre(world, armee); return; }
    // La cible a changé de mains entre-temps : on rentre
    if (cible.faction === armee.faction) {
      log({
        type: 'armee',
        texte: `La colonne ${FACTIONS[armee.faction].genitif} rebrousse chemin : ${cible.nom} est déjà tombée.`,
        regionId: armee.regionId,
        factions: [armee.faction],
      });
      dissoudre(world, armee);
      return;
    }
    if (!armee.route.length || armee.etape >= armee.route.length) {
      armee.etat = 'siege';
      armee.regionId = cible.regionId;
      log({
        type: 'siege',
        texte: `${FACTIONS[armee.faction].nom} met${FACTIONS[armee.faction].pluriel ? 'tent' : ''} le siège devant ${cible.nom}.`,
        regionId: cible.regionId,
        factions: [armee.faction, cible.faction].filter(Boolean),
      });
      return;
    }
    const prochaine = armee.route[armee.etape];
    armee.progres += 1;
    const cout = Math.max(2, Math.round(2 + (world.regions[prochaine] ? 1 : 0)));
    if (armee.progres >= cout) {
      armee.progres = 0;
      armee.regionId = prochaine;
      armee.etape++;
      // Rencontre avec une colonne ennemie sur la même case
      const autre = world.armees.find(
        (o) => o !== armee && o.regionId === armee.regionId && o.faction !== armee.faction
          && enGuerre(world, o.faction, armee.faction)
      );
      if (autre) batailleArmees(world, armee, autre, t, log, ctx);
    }
    return;
  }

  if (armee.etat === 'siege') {
    const col = colonieParId(world, armee.cible);
    if (!col) { dissoudre(world, armee); return; }
    if (col.faction === armee.faction) { dissoudre(world, armee); return; }

    const assaut = armee.force * rng.range(0.5, 1.1);
    const tenue = col.defense * rng.range(0.6, 1.15) + col.murs * 2;
    if (assaut > tenue) {
      col.defense = Math.max(0, col.defense - assaut * 0.12);
      armee.force -= Math.max(0, Math.round(tenue * 0.02));
    } else {
      col.defense = Math.max(0, col.defense - assaut * 0.05);
      armee.force -= Math.max(1, Math.round(tenue * 0.035));
    }
    col.unrest = Math.min(1, col.unrest + 0.004);

    if (armee.force <= 8) {
      log({
        type: 'siege',
        texte: `Le siège de ${col.nom} est brisé : ${FACTIONS[armee.faction].nom} recule${FACTIONS[armee.faction].pluriel ? 'nt' : ''}.`,
        regionId: col.regionId,
        factions: [armee.faction, col.faction].filter(Boolean),
      });
      if (col.faction && armee.faction !== 'essaim') majRelation(world, armee.faction, col.faction, -8);
      dissoudre(world, armee);
      return;
    }
    if (col.defense <= 1) {
      capturer(world, armee, col, t, log, ctx);
    }
  }
}

// ---------------------------------------------------------------------------
// Conseil : décisions périodiques d'une faction
// ---------------------------------------------------------------------------

function coloniesDe(world, key) {
  return world.factions[key].colonies.map((id) => colonieParId(world, id)).filter(Boolean);
}

function cibleLaPlusProche(world, key, ennemi) {
  const miennes = coloniesDe(world, key);
  const leurs = coloniesDe(world, ennemi);
  let best = null;
  let bestD = Infinity;
  let depuis = null;
  for (const m of miennes) {
    for (const l of leurs) {
      const d = distance(m.regionId, l.regionId);
      if (d < bestD) { bestD = d; best = l; depuis = m; }
    }
  }
  return best ? { cible: best, depuis, dist: bestD } : null;
}

function conseil(world, key, t, log, ctx) {
  const rng = ctx.rng;
  const f = world.factions[key];
  const mesColonies = coloniesDe(world, key);

  if (key === 'essaim') {
    // L'Essaim n'a pas de politique : il déferle.
    f.prochainConseil = rng.irange(40, 130);
    const toutes = world.colonies.filter((c) => c.faction && c.faction !== 'essaim');
    if (!toutes.length) return;
    const cible = rng.pick(toutes);
    const sauvages = world.regions.filter((r) => !r.colonie && !r.controle);
    const depuis = sauvages.length ? rng.pick(sauvages).i : rng.pick(world.regions).i;
    const force = rng.irange(30, 70) + Math.floor(t / 400);
    const a = leverArmee(world, 'essaim', force, depuis, cible.id, log);
    if (a) f.tresor = 0;
    return;
  }

  if (!mesColonies.length) {
    // Faction éteinte : elle ne délibère plus.
    f.prochainConseil = 400;
    return;
  }

  f.prochainConseil = rng.irange(30, 90);

  // Revenus : impôt sur les colonies
  const revenu = mesColonies.reduce((s, c) => s + c.pop * 0.05 * (1 - c.unrest), 0);
  f.tresor += Math.round(revenu);

  const maPuissance = puissance(world, key);
  const mesGuerres = guerresDe(world, key);

  // 1) Faire la paix si la guerre coûte trop cher
  for (const g of mesGuerres) {
    const autre = g.a === key ? g.b : g.a;
    const duree = t - g.depuis;
    const leur = puissance(world, autre);
    const fatigue = duree / 900 + g.batailles * 0.08;
    if (duree > 220 && rng.chance(Math.min(0.7, fatigue * 0.35 + (leur > maPuissance * 1.4 ? 0.25 : 0)))) {
      signerPaix(world, key, autre, t, log);
    }
  }

  // 2) Déclarer une guerre si une cible est faible et mal aimée
  const enGuerreAvec = new Set(guerresDe(world, key).map((g) => (g.a === key ? g.b : g.a)));
  if (enGuerreAvec.size < 2 && rng.chance(f.agression * 0.5)) {
    const candidats = DIPLO_FACTIONS.filter(
      (k) => k !== key && !enGuerreAvec.has(k) && coloniesDe(world, k).length > 0
    ).map((k) => {
      const rel = relation(world, key, k);
      const rapport = maPuissance / Math.max(1, puissance(world, k));
      const prox = cibleLaPlusProche(world, key, k);
      if (!prox) return [k, 0];
      const poids = Math.max(0, (40 - rel) / 40) * Math.max(0, rapport - 0.85) * (1 / (1 + prox.dist * 0.25));
      return [k, poids];
    }).filter((e) => e[1] > 0.02);
    if (candidats.length) {
      const victime = rng.weighted(candidats);
      declarerGuerre(world, key, victime, t, log);
    }
  }

  // 3) Lever des colonnes sur les fronts ouverts
  for (const g of guerresDe(world, key)) {
    const ennemi = g.a === key ? g.b : g.a;
    const dejaEnRoute = world.armees.filter((a) => a.faction === key).length;
    if (dejaEnRoute >= 2) break;
    const prox = cibleLaPlusProche(world, key, ennemi);
    if (!prox) continue;
    const force = Math.min(
      Math.floor(f.tresor / 3.2),
      Math.round(prox.cible.defense * rng.range(1.1, 2.0) + 25)
    );
    if (force >= 25 && f.tresor >= coutArmee(force)) {
      leverArmee(world, key, force, prox.depuis.regionId, prox.cible.id, log);
    }
  }

  // 4) Sinon, investir : murs et défense
  if (!guerresDe(world, key).length && f.tresor > 900 && rng.chance(0.6)) {
    const col = rng.pick(mesColonies);
    col.murs += 1;
    f.tresor -= 400;
    log({
      type: 'chantier',
      texte: `${FACTIONS[key].nom} renforce${FACTIONS[key].pluriel ? 'nt' : ''} les défenses de ${col.nom}.`,
      regionId: col.regionId,
      factions: [key],
      discret: true,
    });
  }
}

// ---------------------------------------------------------------------------
// Tick global
// ---------------------------------------------------------------------------

function tickFactions(world, t, log, ctx) {
  for (const key of Object.keys(world.factions)) {
    const f = world.factions[key];
    f.prochainConseil -= 1;
    if (f.prochainConseil <= 0) conseil(world, key, t, log, ctx);
  }

  for (const armee of world.armees.slice()) {
    if (!world.armees.includes(armee)) continue;
    tickArmee(world, armee, t, log, ctx);
  }

  // Dérive lente des relations vers la neutralité, sauf en guerre
  if (t % 24 === 0) {
    for (const a of DIPLO_FACTIONS) {
      for (const b of DIPLO_FACTIONS) {
        if (a >= b) continue;
        const v = relation(world, a, b);
        if (enGuerre(world, a, b)) {
          if (v > -100) majRelation(world, a, b, -1);
        } else if (v !== 0) {
          majRelation(world, a, b, v > 0 ? -0.5 : 0.5);
        }
      }
    }
  }
}

/** Faction qui domine réellement le monde, pour l'écran MONDE. */
function classement(world) {
  return Object.keys(world.factions)
    .filter((k) => k !== 'essaim')
    .map((k) => ({
      key: k,
      nom: FACTIONS[k].nom,
      couleur: FACTIONS[k].couleur,
      puissance: puissance(world, k),
      colonies: world.factions[k].colonies.length,
      tresor: Math.round(world.factions[k].tresor),
    }))
    .sort((a, b) => b.puissance - a.puissance);
}

// ===== src/base.js ===================================================
// L'avant-poste : files de construction et de recherche à la OGame, chaîne de
// production contrainte par l'énergie, stockage plafonné, raids à encaisser.


function creerBase() {
  const stock = {};
  for (const k of COMMODITY_KEYS) stock[k] = 0;
  return {
    fonde: false,
    regionId: null,
    nom: 'Avant-poste',
    batiments: {},
    file: [],
    recherche: {},
    fileRech: [],
    stock,
    defense: 0,
    derniereAttaque: -999,
  };
}

const COUT_FONDATION = { ferraille: 120, polymere: 40, composant: 5 };

function niveau(base, key) {
  return base.batiments[key] || 0;
}

function niveauRech(base, key) {
  return base.recherche[key] || 0;
}

function scale(cout, mul, n) {
  const out = {};
  for (const k of Object.keys(cout)) {
    out[k] = Math.round(cout[k] * Math.pow(mul, n));
  }
  return out;
}

function coutBatiment(base, key) {
  const b = BUILDINGS[key];
  return scale(b.cout, b.coutMul, niveau(base, key));
}

function tempsBatiment(base, key) {
  const b = BUILDINGS[key];
  const brut = b.heures * Math.pow(b.tempsMul, niveau(base, key));
  const reduction = 1 - Math.min(0.6, niveauRech(base, 'ingenierie') * 0.1);
  return Math.max(1, Math.round(brut * reduction));
}

function coutRecherche(base, key) {
  const r = RESEARCH[key];
  return scale(r.cout, r.coutMul, niveauRech(base, key));
}

function tempsRecherche(base, key) {
  const r = RESEARCH[key];
  const brut = r.heures * Math.pow(r.tempsMul, niveauRech(base, key));
  const antenne = niveau(base, 'antenne');
  return Math.max(1, Math.round(brut / (1 + antenne * 0.25)));
}

function capaciteStock(base) {
  return 800 + niveau(base, 'entrepot') * 800;
}

function totalStock(base) {
  let t = 0;
  for (const k of COMMODITY_KEYS) t += base.stock[k] || 0;
  return Math.round(t);
}

function tailleEscouadeMax(base) {
  return 4 + niveau(base, 'baraquement');
}

/** Bilan énergétique : { prod, conso, ratio } */
function energie(base) {
  let prod = 0;
  let conso = 0;
  for (const key of Object.keys(base.batiments)) {
    const n = base.batiments[key];
    if (!n) continue;
    const e = BUILDINGS[key].energie * n;
    if (e > 0) prod += e;
    else conso -= e;
  }
  // Un générateur sans carburant ne produit rien
  if ((base.stock.carburant || 0) <= 0) prod = 0;
  return { prod, conso, ratio: conso > 0 ? Math.min(1, prod / conso) : 1 };
}

// ---------------------------------------------------------------------------
// Files
// ---------------------------------------------------------------------------

function peutPayer(stock, cout) {
  for (const k of Object.keys(cout)) {
    if ((stock[k] || 0) < cout[k]) return false;
  }
  return true;
}

function payer(stock, cout) {
  for (const k of Object.keys(cout)) stock[k] -= cout[k];
}

function lancerConstruction(state, key) {
  const base = state.base;
  if (!base.fonde) return { ok: false, motif: 'Aucun avant-poste.' };
  const b = BUILDINGS[key];
  if (!b) return { ok: false, motif: 'Bâtiment inconnu.' };
  const enFile = base.file.filter((x) => x.key === key).length;
  if (niveau(base, key) + enFile >= b.max) return { ok: false, motif: 'Niveau maximum atteint.' };
  if (base.file.length >= 5) return { ok: false, motif: 'File pleine (5).' };
  const cout = coutBatiment(base, key);
  if (!peutPayer(base.stock, cout)) return { ok: false, motif: 'Ressources insuffisantes.' };
  payer(base.stock, cout);
  const total = tempsBatiment(base, key);
  base.file.push({ key, niveau: niveau(base, key) + 1 + enFile, restant: total, total });
  return { ok: true };
}

function annulerConstruction(state, index) {
  const base = state.base;
  const item = base.file[index];
  if (!item) return { ok: false, motif: 'Rien à annuler.' };
  base.file.splice(index, 1);
  // Remboursement partiel : 70 %
  const cout = coutBatiment(base, item.key);
  for (const k of Object.keys(cout)) {
    base.stock[k] = (base.stock[k] || 0) + Math.round(cout[k] * 0.7);
  }
  return { ok: true };
}

function lancerRecherche(state, key) {
  const base = state.base;
  if (!base.fonde) return { ok: false, motif: 'Aucun avant-poste.' };
  if (niveau(base, 'antenne') < 1) return { ok: false, motif: 'Antenne requise.' };
  const r = RESEARCH[key];
  if (!r) return { ok: false, motif: 'Recherche inconnue.' };
  const enFile = base.fileRech.filter((x) => x.key === key).length;
  if (niveauRech(base, key) + enFile >= r.max) return { ok: false, motif: 'Niveau maximum atteint.' };
  if (base.fileRech.length >= 3) return { ok: false, motif: 'File pleine (3).' };
  const cout = coutRecherche(base, key);
  const stockEtCredits = Object.assign({}, base.stock, { credits: state.player.credits });
  if (!peutPayer(stockEtCredits, cout)) return { ok: false, motif: 'Ressources insuffisantes.' };
  for (const k of Object.keys(cout)) {
    if (k === 'credits') state.player.credits -= cout[k];
    else base.stock[k] -= cout[k];
  }
  const total = tempsRecherche(base, key);
  base.fileRech.push({ key, niveau: niveauRech(base, key) + 1 + enFile, restant: total, total });
  return { ok: true };
}

function fonderBase(state, log) {
  const base = state.base;
  if (base.fonde) return { ok: false, motif: 'Avant-poste déjà fondé.' };
  const inv = state.player.inventaire;
  if (!peutPayer(inv, COUT_FONDATION)) {
    return { ok: false, motif: 'Il faut 120 ferraille, 40 polymère, 5 composants dans le sac.' };
  }
  const r = state.world.regions[state.player.regionId];
  if (r.colonie) return { ok: false, motif: 'Impossible de bâtir dans une ville existante.' };
  payer(inv, COUT_FONDATION);
  base.fonde = true;
  base.regionId = state.player.regionId;
  base.batiments = {};
  base.defense = 10;
  log({ type: 'base', texte: `Avant-poste fondé. Ici, au moins, c’est chez nous.`, regionId: base.regionId });
  return { ok: true };
}

// ---------------------------------------------------------------------------
// Production horaire
// ---------------------------------------------------------------------------

function ajouter(base, key, qte) {
  if (qte <= 0) return 0;
  const libre = capaciteStock(base) - totalStock(base);
  const reel = Math.max(0, Math.min(qte, libre));
  base.stock[key] = (base.stock[key] || 0) + reel;
  return reel;
}

function consommer(base, key, qte) {
  const dispo = base.stock[key] || 0;
  const pris = Math.min(dispo, qte);
  base.stock[key] = dispo - pris;
  return pris;
}

/** Une heure de vie de l'avant-poste. Retourne un résumé pour l'UI. */
function tickBase(state, log, ctx) {
  const base = state.base;
  if (!base.fonde) return null;
  const rng = ctx.rng;
  const rech = base.recherche;
  const surPlace = state.player.regionId === base.regionId;

  // --- Énergie
  const gen = niveau(base, 'generateur');
  if (gen > 0) consommer(base, 'carburant', 0.55 * gen);
  const e = energie(base);
  const r = e.ratio;

  // --- Chaînes de production
  const hyd = niveau(base, 'hydroponie');
  if (hyd > 0) {
    const bio = consommer(base, 'biomasse', 1.25 * hyd * r);
    ajouter(base, 'rations', bio * 0.9 * (1 + (rech.hydroponie_av || 0) * 0.15));
  }
  const fond = niveau(base, 'fonderie');
  if (fond > 0) {
    const min = consommer(base, 'minerai', 1.2 * fond * r);
    ajouter(base, 'alliage', min * 0.42 * (1 + (rech.metallurgie || 0) * 0.12));
  }
  const raf = niveau(base, 'raffinerie');
  if (raf > 0) {
    const pol = consommer(base, 'polymere', 0.9 * raf * r);
    ajouter(base, 'carburant', pol * 0.55);
  }
  const atl = niveau(base, 'atelier');
  if (atl > 0) {
    const all = consommer(base, 'alliage', 0.35 * atl * r);
    const pol = consommer(base, 'polymere', 0.5 * atl * r);
    ajouter(base, 'composant', Math.min(all / 0.35, pol / 0.5) * 0.14 * atl * r);
  }
  const inf = niveau(base, 'infirmerie');
  if (inf > 0) {
    const bio = consommer(base, 'biomasse', 0.4 * inf * r);
    ajouter(base, 'medkit', bio * 0.09);
  }

  base.defense = niveau(base, 'mur') * 22 + 10;

  // --- File de construction
  if (base.file.length) {
    const item = base.file[0];
    let vitesse = 1;
    if (surPlace) {
      // L'escouade met la main à la pâte
      let ing = 0;
      for (const c of state.player.squad) {
        if (!estDebout(c)) continue;
        ing += comp(c, 'ingenierie');
        gagnerXp(c, 'ingenierie', 0.25);
      }
      vitesse += Math.min(1.2, ing / 160);
    }
    item.restant -= vitesse;
    if (item.restant <= 0) {
      base.batiments[item.key] = (base.batiments[item.key] || 0) + 1;
      base.file.shift();
      log({
        type: 'base',
        texte: `${BUILDINGS[item.key].nom} niveau ${base.batiments[item.key]} opérationnel.`,
        regionId: base.regionId,
      });
    }
  }

  // --- File de recherche
  if (base.fileRech.length) {
    const item = base.fileRech[0];
    item.restant -= 1;
    if (item.restant <= 0) {
      base.recherche[item.key] = (base.recherche[item.key] || 0) + 1;
      base.fileRech.shift();
      log({
        type: 'recherche',
        texte: `Recherche achevée : ${RESEARCH[item.key].nom} ${base.recherche[item.key]}.`,
      });
    }
  }

  // --- Raid sur l'avant-poste
  const reg = state.world.regions[base.regionId];
  const t = state.temps;
  if (t - base.derniereAttaque > 72 && rng.chance(0.0016 * (1 + reg.danger * 4))) {
    base.derniereAttaque = t;
    const force = rng.irange(20, 45) + Math.floor(t / 600);
    const defense = base.defense + (surPlace ? forceEscouade(state) : 0);
    if (defense > force) {
      base.defense = Math.max(0, base.defense - force * 0.3);
      log({
        type: 'raid',
        texte: `Raid repoussé sur l’avant-poste (${force} assaillants).`,
        regionId: base.regionId,
        important: true,
      });
    } else {
      let vole = 0;
      for (const k of COMMODITY_KEYS) {
        const pris = Math.round((base.stock[k] || 0) * rng.range(0.15, 0.4));
        base.stock[k] -= pris;
        vole += pris;
      }
      base.defense = 0;
      if (niveau(base, 'mur') > 0 && rng.chance(0.4)) {
        base.batiments.mur = Math.max(0, base.batiments.mur - 1);
      }
      log({
        type: 'raid',
        texte: `L’avant-poste est pillé : ${vole} unités emportées.`,
        regionId: base.regionId,
        important: true,
      });
    }
  }

  return { energie: e };
}

function forceEscouade(state) {
  let f = 0;
  for (const c of state.player.squad) {
    if (!estDebout(c)) continue;
    f += comp(c, 'melee') * 0.4 + comp(c, 'tir') * 0.4 + comp(c, 'endurance') * 0.2;
  }
  return Math.round(f);
}

// ---------------------------------------------------------------------------
// Transferts sac ↔ avant-poste
// ---------------------------------------------------------------------------

function deposer(state, key, qte) {
  const base = state.base;
  if (!base.fonde || state.player.regionId !== base.regionId) {
    return { ok: false, motif: 'Il faut être à l’avant-poste.' };
  }
  const dispo = state.player.inventaire[key] || 0;
  const libre = capaciteStock(base) - totalStock(base);
  const n = Math.max(0, Math.min(Math.floor(qte), dispo, Math.floor(libre)));
  if (n <= 0) return { ok: false, motif: 'Rien à déposer, ou entrepôt plein.' };
  state.player.inventaire[key] -= n;
  base.stock[key] = (base.stock[key] || 0) + n;
  return { ok: true, qte: n };
}

function retirer(state, key, qte, capaciteLibre) {
  const base = state.base;
  if (!base.fonde || state.player.regionId !== base.regionId) {
    return { ok: false, motif: 'Il faut être à l’avant-poste.' };
  }
  const dispo = base.stock[key] || 0;
  const n = Math.max(0, Math.min(Math.floor(qte), dispo, Math.floor(capaciteLibre)));
  if (n <= 0) return { ok: false, motif: 'Rien à prendre, ou sac plein.' };
  base.stock[key] -= n;
  state.player.inventaire[key] = (state.player.inventaire[key] || 0) + n;
  return { ok: true, qte: n };
}

// ===== src/events.js =================================================
// Journal de bord et rencontres. Tout se résout automatiquement selon la
// posture et les consignes de l'escouade : c'est ce qui permet à la simulation
// de tourner pendant que le joueur est hors ligne.


const LOG_MAX = 400;

function creerLogger(state) {
  return (entree) => {
    const e = Object.assign({ t: state.temps }, entree);
    state.journal.push(e);
    if (state.journal.length > LOG_MAX) state.journal.splice(0, state.journal.length - LOG_MAX);
    if (e.important) state.nonLus = (state.nonLus || 0) + 1;
    return e;
  };
}

// ---------------------------------------------------------------------------
// Utilitaires d'inventaire
// ---------------------------------------------------------------------------

function ajouterAuSac(state, key, qte) {
  if (qte <= 0) return 0;
  const cap = capacitePortage(state);
  const libre = cap - poidsInventaire(state.player.inventaire);
  const poidsU = COMMODITIES[key] ? COMMODITIES[key].poids : 1;
  const max = poidsU > 0 ? Math.floor(libre / poidsU) : qte;
  const reel = Math.max(0, Math.min(Math.floor(qte), max));
  if (reel > 0) state.player.inventaire[key] = (state.player.inventaire[key] || 0) + reel;
  return reel;
}

function reputation(state, faction, delta) {
  if (!faction || faction === 'essaim') return;
  const r = state.player.reputation;
  r[faction] = Math.max(-100, Math.min(100, (r[faction] || 0) + delta));
}

function factionDominante(state, regionId) {
  const r = state.world.regions[regionId];
  if (r.controle) return r.controle;
