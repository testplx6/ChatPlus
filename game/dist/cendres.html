  if (!n) return { ouvriers: 0, mult: 1, contremaitre: null };
  const m = METIERS[key];
  const chef = contremaitre(state, key);
  const bonusChef = chef ? 1 + Math.min(0.6, comp(chef, m.skill) / 100) : 1;
  return { ouvriers: n, mult: 1 + n * m.apport * bonusChef, contremaitre: chef };
}

/** Le meilleur des vôtres présent à l'avant-poste dans la compétence du métier. */
function contremaitre(state, key) {
  const base = state.base;
  const m = METIERS[key];
  if (!base.fonde || !m) return null;
  let best = null;
  for (const g of state.player.groupes) {
    if (g.regionId !== base.regionId) continue;
    for (const c of g.membres) {
      if (!estDebout(c)) continue;
      if (!best || comp(c, m.skill) > comp(best, m.skill)) best = c;
    }
  }
  // Un quidam qui passe n'est pas un contremaître : il faut en savoir un peu.
  return best && comp(best, m.skill) >= 20 ? best : null;
}

/** Affecte `n` habitants à un poste. Retourne ce qui a réellement été fait. */
function affecter(state, key, n) {
  const base = state.base;
  if (!METIERS[key]) return { ok: false, motif: 'Métier inconnu.' };
  if (!base.postes) base.postes = {};
  const places = placesMetier(base, key);
  if (places <= 0) return { ok: false, motif: `Il faut bâtir ${BUILDINGS[METIERS[key].batiment].nom.toLowerCase()}.` };
  const actuel = affectes(base, key);
  const libre = manoeuvres(base);
  const vise = Math.max(0, Math.min(n, places, actuel + libre));
  base.postes[key] = vise;
  return { ok: true, affectes: vise };
}

/**
 * Ce dont un avant-poste a besoin, dans l'ordre où il en a besoin.
 *
 * Manger d'abord — un cuisinier fait durer les vivres, un cultivateur en
 * produit. Puis de quoi bâtir : le récoltant ramasse la région, le bâtisseur
 * monte les chantiers. Puis se défendre. Puis transformer, ce qui suppose
 * d'avoir déjà le reste.
 */
const ORDRE_EMBAUCHE = [
  'cultivateur', 'cuisinier', 'recoltant', 'batisseur', 'magasinier',
  'milicien', 'garde', 'mecanicien', 'fondeur', 'raffineur', 'machiniste',
  'infirmier', 'operateur',
];

/**
 * Les gens se placent eux-mêmes.
 *
 * Un avant-poste de trente-neuf habitants tournait avec `postes: {}` — personne
 * affecté à rien, jamais, sauf si le joueur cliquait treize fois. Ce n'est pas
 * une simulation de colonie, c'est un tableur : des gens qui vivent quelque
 * part trouvent du travail sans qu'on le leur dise. Le joueur garde la main —
 * l'interrupteur se coupe — mais par défaut la vie s'organise toute seule.
 *
 * L'ordre de priorité fait le reste : on ne met personne à la fonderie tant
 * qu'il manque un cultivateur, parce qu'on ne mange pas de l'alliage.
 */
function embaucher(base) {
  if (base.autoEmploi === false) return;
  const postes = {};
  let reste = Math.floor(base.pop || 0);
  for (const k of ORDRE_EMBAUCHE) {
    if (reste <= 0) break;
    const places = placesMetier(base, k);
    if (places <= 0) continue;
    // On ne remplit pas un métier à fond avant de pourvoir le suivant : une
    // colonie qui met tout le monde aux cultures ne bâtit plus rien. On y va
    // par tiers, et l'on repasse.
    const pris = Math.min(places, Math.max(1, Math.ceil(places / 2)), reste);
    postes[k] = pris;
    reste -= pris;
  }
  // Second passage : ce qui reste complète ce qui est ouvert, dans le même ordre.
  for (const k of ORDRE_EMBAUCHE) {
    if (reste <= 0) break;
    const places = placesMetier(base, k);
    const encore = Math.min(places - (postes[k] || 0), reste);
    if (encore > 0) { postes[k] = (postes[k] || 0) + encore; reste -= encore; }
  }
  base.postes = postes;
}

/** Après une famine ou une démolition, les postes se réajustent tout seuls. */
function reajusterPostes(base) {
  if (!base.postes) { base.postes = {}; return; }
  for (const k of METIER_KEYS) {
    const max = placesMetier(base, k);
    if ((base.postes[k] || 0) > max) base.postes[k] = max;
  }
  let total = 0;
  for (const k of METIER_KEYS) total += base.postes[k] || 0;
  // Trop de postes pour trop peu de monde : on dégarnit du dernier au premier.
  for (let i = METIER_KEYS.length - 1; i >= 0 && total > (base.pop || 0); i--) {
    const k = METIER_KEYS[i];
    const retire = Math.min(base.postes[k] || 0, total - (base.pop || 0));
    base.postes[k] = (base.postes[k] || 0) - retire;
    total -= retire;
  }
}

/**
 * Ce qu'il faut pour planter le premier piquet.
 *
 * Il y avait cinq composants là-dedans, et c'est ce détail qui rendait tout le
 * jeu bancal : les composants ne se ramassent presque nulle part, il faut donc
 * les acheter, donc avoir des crédits, donc en gagner — alors que les trois
 * quarts des recettes d'une escouade itinérante partent en nourriture, et que
 * la seule façon de produire sa nourriture est justement d'avoir un
 * avant-poste. On ne pouvait pas s'offrir la chose qui réglait le problème
 * qu'on avait, et le banc l'a chiffré : zéro avant-poste fondé sur vingt-quatre
 * parties de quatre mille heures.
 *
 * Le premier campement se paie donc en ferraille, et en ferraille seulement :
 * c'est ce qu'une escouade de fouilleurs a toujours dans le dos. Le polymère et
 * les composants restent indispensables à tout ce qui vient après — hydroponie,
 * atelier, antenne, infirmerie — et c'est là qu'ils ont un sens : ils gardent le
 * développement, pas la survie.
 */
const COUT_FONDATION = { ferraille: 110 };

function niveau(base, key) {
  return base.batiments[key] || 0;
}

function niveauRech(base, key) {
  return base.recherche[key] || 0;
}

function scale(cout, mul, n) {
  const out = {};
  for (const k of Object.keys(cout)) {
    out[k] = Math.round(cout[k] * Math.pow(mul, n));
  }
  return out;
}

function coutBatiment(base, key) {
  const b = BUILDINGS[key];
  return scale(b.cout, b.coutMul, niveau(base, key));
}

function tempsBatiment(base, key) {
  const b = BUILDINGS[key];
  const brut = b.heures * Math.pow(b.tempsMul, niveau(base, key));
  const reduction = 1 - Math.min(0.6, niveauRech(base, 'ingenierie') * 0.1);
  return Math.max(1, Math.round(brut * reduction));
}

function coutRecherche(base, key) {
  const r = RESEARCH[key];
  return scale(r.cout, r.coutMul, niveauRech(base, key));
}

function tempsRecherche(base, key) {
  const r = RESEARCH[key];
  const brut = r.heures * Math.pow(r.tempsMul, niveauRech(base, key));
  const antenne = niveau(base, 'antenne');
  return Math.max(1, Math.round(brut / (1 + antenne * 0.25)));
}

function capaciteStock(base) {
  // Un magasinier gagne de la place : ranger, c'est du volume.
  const m = 1 + affectes(base, 'magasinier') * METIERS.magasinier.apport;
  return Math.round((800 + niveau(base, 'entrepot') * 800) * m);
}

function totalStock(base) {
  let t = 0;
  for (const k of COMMODITY_KEYS) t += base.stock[k] || 0;
  return Math.round(t);
}

/**
 * Le noyau qu'on tient sans effort — plus un baraquement où les loger.
 *
 * Ce n'est plus un plafond : rien n'interdit de mener trente personnes. C'est
 * le nombre au-delà duquel la cohésion commence à se déliter, et avec elle le
 * rendement du travail et la force au combat. Voir `plafondCohesion` dans
 * groupes.js. Le baraquement ne débloque plus des places : il élargit ce qu'on
 * arrive à tenir ensemble.
 */
function tailleEscouadeMax(base) {
  return 4 + niveau(base, 'baraquement');
}

/** Bilan énergétique : { prod, conso, ratio } */
function energie(base) {
  let prod = 0;
  let conso = 0;
  for (const key of Object.keys(base.batiments)) {
    const n = base.batiments[key];
    if (!n) continue;
    const e = BUILDINGS[key].energie * n;
    if (e > 0) prod += e;
    else conso -= e;
  }
  // Un générateur sans carburant ne produit rien
  if ((base.stock.carburant || 0) <= 0) prod = 0;
  return { prod, conso, ratio: conso > 0 ? Math.min(1, prod / conso) : 1 };
}

// ---------------------------------------------------------------------------
// Files
// ---------------------------------------------------------------------------

function peutPayer(stock, cout) {
  for (const k of Object.keys(cout)) {
    if ((stock[k] || 0) < cout[k]) return false;
  }
  return true;
}

function payer(stock, cout) {
  for (const k of Object.keys(cout)) stock[k] -= cout[k];
}

function lancerConstruction(state, key) {
  const base = state.base;
  if (!base.fonde) return { ok: false, motif: 'Aucun avant-poste.' };
  const b = BUILDINGS[key];
  if (!b) return { ok: false, motif: 'Bâtiment inconnu.' };
  const enFile = base.file.filter((x) => x.key === key).length;
  if (niveau(base, key) + enFile >= b.max) return { ok: false, motif: 'Niveau maximum atteint.' };
  if (base.file.length >= 5) return { ok: false, motif: 'File pleine (5).' };
  const cout = coutBatiment(base, key);
  if (!peutPayer(base.stock, cout)) return { ok: false, motif: 'Ressources insuffisantes.' };
  payer(base.stock, cout);
  const total = tempsBatiment(base, key);
  base.file.push({ key, niveau: niveau(base, key) + 1 + enFile, restant: total, total });
  return { ok: true };
}

function annulerConstruction(state, index) {
  const base = state.base;
  const item = base.file[index];
  if (!item) return { ok: false, motif: 'Rien à annuler.' };
  base.file.splice(index, 1);
  // Remboursement partiel : 70 %
  const cout = coutBatiment(base, item.key);
  for (const k of Object.keys(cout)) {
    base.stock[k] = (base.stock[k] || 0) + Math.round(cout[k] * 0.7);
  }
  return { ok: true };
}

function lancerRecherche(state, key) {
  const base = state.base;
  if (!base.fonde) return { ok: false, motif: 'Aucun avant-poste.' };
  if (niveau(base, 'antenne') < 1) return { ok: false, motif: 'Antenne requise.' };
  const r = RESEARCH[key];
  if (!r) return { ok: false, motif: 'Recherche inconnue.' };
  const enFile = base.fileRech.filter((x) => x.key === key).length;
  if (niveauRech(base, key) + enFile >= r.max) return { ok: false, motif: 'Niveau maximum atteint.' };
  if (base.fileRech.length >= 3) return { ok: false, motif: 'File pleine (3).' };
  const cout = coutRecherche(base, key);
  const stockEtCredits = Object.assign({}, base.stock, { credits: state.player.credits });
  if (!peutPayer(stockEtCredits, cout)) return { ok: false, motif: 'Ressources insuffisantes.' };
  for (const k of Object.keys(cout)) {
    if (k === 'credits') state.player.credits -= cout[k];
    else base.stock[k] -= cout[k];
  }
  const total = tempsRecherche(base, key);
  base.fileRech.push({ key, niveau: niveauRech(base, key) + 1 + enFile, restant: total, total });
  return { ok: true };
}

function fonderBase(state, log, groupe) {
  const g = groupe || groupeActif(state);
  const base = state.base;
  if (base.fonde) return { ok: false, motif: 'Avant-poste déjà fondé.' };
  const inv = g.inventaire;
  if (!peutPayer(inv, COUT_FONDATION)) {
    return { ok: false, motif: 'Il faut 120 ferraille, 40 polymère, 5 composants dans le sac.' };
  }
  const r = state.world.regions[g.regionId];
  if (r.colonie) return { ok: false, motif: 'Impossible de bâtir dans une ville existante.' };
  payer(inv, COUT_FONDATION);
  base.fonde = true;
  base.regionId = g.regionId;
  base.batiments = {};
  base.defense = 10;
  log({ type: 'base', texte: `Avant-poste fondé. Ici, au moins, c’est chez nous.`, regionId: base.regionId });
  return { ok: true };
}

// ---------------------------------------------------------------------------
// Production horaire
// ---------------------------------------------------------------------------

/**
 * Ranger une production dans l'entrepôt, et retenir ce qui n'y tient pas.
 *
 * L'écrêtage était silencieux : un entrepôt plein jetait la production de
 * l'hydroponie, de la fonderie et de la raffinerie sans que rien ne l'indique
 * nulle part. On l'a découvert en cherchant pourquoi un test échouait, pas en
 * jouant — et un joueur, lui, aurait simplement vu ses cultures ne rien rendre
 * sans jamais comprendre pourquoi. Ce qui se perd doit se dire.
 */
function ajouter(base, key, qte) {
  if (qte <= 0) return 0;
  const libre = capaciteStock(base) - totalStock(base);
  const reel = Math.max(0, Math.min(qte, libre));
  base.stock[key] = (base.stock[key] || 0) + reel;
  if (qte - reel > 0.001) base.gaspille = (base.gaspille || 0) + (qte - reel);
  return reel;
}

function consommer(base, key, qte) {
  const dispo = base.stock[key] || 0;
  const pris = Math.min(dispo, qte);
  base.stock[key] = dispo - pris;
  return pris;
}

/** Une heure de vie de l'avant-poste. Retourne un résumé pour l'UI. */
function tickBase(state, log, ctx) {
  const base = state.base;
  if (!base.fonde) return null;
  const gaspilleAvant = base.gaspille || 0;
  const t0 = state.temps;
  const rng = ctx.rng;
  const rech = base.recherche;
  // N'importe quel groupe présent fait avancer les chantiers. Test direct
  // plutôt que `filter` : c'est du travail par heure de jeu, pas par clic.
  let surPlace = false;
  for (const g of state.player.groupes) if (g.regionId === base.regionId) { surPlace = true; break; }

  // Les gens se placent eux-mêmes, une fois par jour de jeu : plus souvent
  // serait du travail pour rien, et l'on ne change pas de métier toutes les
  // heures.
  if (base.autoEmploi !== false && t0 - (base.majEmploi || -999) >= 24) {
    base.majEmploi = t0;
    embaucher(base);
  }
  // Postes tenus, contremaîtres compris. Calculé une fois pour tout le tick.
  reajusterPostes(base);
  const M = {};
  for (const k of METIER_KEYS) M[k] = rendementMetier(state, k).mult;

  // --- Énergie. Un mécanicien règle les générateurs : ils brûlent moins.
  const gen = niveau(base, 'generateur');
  if (gen > 0) consommer(base, 'carburant', (0.55 * gen) / M.mecanicien);
  const e = energie(base);
  const r = e.ratio;

  // --- Population : elle s'installe si on peut la loger et la nourrir, elle
  // s'en va si l'un des deux manque. Sa main-d'œuvre fait tourner les ateliers.
  const maxPop = populationMax(base);
  const rationsDispo = base.stock.rations || 0;
  // La cantine : manger assis, à heure fixe, avec quelqu'un qui compte les
  // portions. Jusqu'à un tiers de vivres en moins pour les mêmes bouches — et
  // c'est le seul bâtiment dont l'effet se voit sur le moral autant que sur le
  // stock.
  const cant = niveau(base, 'cantine');
  const economie = cant > 0
    ? 1 - Math.min(0.33, cant * 0.055 * M.cuisinier)
    : 1;
  const besoinPop = (base.pop || 0) * 0.014 * economie;
  if (base.pop > 0) {
    const servi = Math.min(besoinPop, rationsDispo);
    base.stock.rations = Math.max(0, rationsDispo - servi);
    const satiete = besoinPop > 0 ? servi / besoinPop : 1;
    if (satiete < 0.75) {
      base.moral = Math.max(0, base.moral - 0.15);
      // On s'en va avant de mourir de faim : un habitant qui part est un
      // habitant qui reviendra peut-être, et un camp vidé par la disette n'est
      // pas un charnier.
      if (rng.chance(0.012)) base.pop = Math.max(0, base.pop - 1);
    } else {
      base.moral = Math.min(100, base.moral + 0.05 + (cant > 0 ? 0.03 * M.cuisinier : 0));
    }
  }
  // Ce qui attire du monde : de quoi manger *en réserve*, un toit, et la paix.
  //
  // C'était un dé plat de 0,012 par heure, conditionné par un seuil de vivres
  // franchi ou non. Un camp qui vivait au jour le jour ratait donc tous ses
  // tirages, et le banc l'a chiffré : sur soixante parties, quarante
  // avant-postes fondés, quatorze niveaux de bâtiment en moyenne — et deux
  // habitants et demi. La voie du colon plafonnait à un hangar gardé par
  // personne.
  //
  // Le taux suit maintenant l'abondance, parce que c'est elle qui se sait sur
  // les pistes : une réserve de six jours par tête, un moral tenu, des lits.
  // Douze jours de réserve par tête, pas six : mesuré à six, le camp attirait
  // du monde sur une aisance de passage, puis les affamait au premier creux —
  // cinq habitants, puis zéro, et le moral à trente-trois. On ne s'installe pas
  // quelque part parce qu'on y a mangé une fois.
  const reserve = Math.min(1, rationsDispo / Math.max(1, (base.pop + 1) * 12));
  const attrait = reserve * (0.4 + 0.6 * (base.moral / 100))
    * (1 + niveau(base, 'baraquement') * 0.2);
  if (base.pop < maxPop && rng.chance(0.022 * attrait)) {
    base.pop += 1;
    if (base.pop === 1) {
      log({ type: 'base', texte: 'Quelqu’un s’installe à l’avant-poste. Ça commence comme ça.', regionId: base.regionId, important: true });
    } else if (base.pop % 5 === 0) {
      log({ type: 'base', texte: `L’avant-poste compte ${base.pop} habitants.`, regionId: base.regionId, important: true });
    }
  }
  if (base.pop > maxPop) base.pop = maxPop;
  const mo = mainDoeuvre(base);

  // --- Chaînes de production
  // Chaque chaîne tourne au rythme de ceux qui la tiennent : les manœuvres
  // aident partout un peu, les ouvriers affectés beaucoup, et seulement ici.
  // Ce qui se fait à la main, et ce qui ne se fait pas.
  //
  // Fondre du minerai, assembler un composant, raffiner du polymère : sans
  // courant, rien. Faire pousser et ramasser, en revanche, se fait avec des
  // bras. Tant que ces deux chaînes-là s'arrêtaient net faute de carburant, la
  // seule façon de produire sa nourriture passait par un générateur, donc par
  // du carburant acheté en ville, donc par des crédits qu'on n'avait pas parce
  // qu'on achetait à manger. L'énergie les rend rapides ; elle ne les rend plus
  // possibles.
  const aLaMain = Math.max(SOCLE_MANUEL, r);

  const hyd = niveau(base, 'hydroponie');
  if (hyd > 0) {
    const bio = consommer(base, 'biomasse', 1.25 * hyd * aLaMain * mo * M.cultivateur);
    ajouter(base, 'rations', bio * 0.9 * (1 + (rech.hydroponie_av || 0) * 0.15));
  }
  const fond = niveau(base, 'fonderie');
  if (fond > 0) {
    const min = consommer(base, 'minerai', 1.2 * fond * r * mo * M.fondeur);
    ajouter(base, 'alliage', min * 0.42 * (1 + (rech.metallurgie || 0) * 0.12));
  }
  const raf = niveau(base, 'raffinerie');
  if (raf > 0) {
    const pol = consommer(base, 'polymere', 0.9 * raf * r * mo * M.raffineur);
    ajouter(base, 'carburant', pol * 0.55);
  }
  const atl = niveau(base, 'atelier');
  if (atl > 0) {
    const all = consommer(base, 'alliage', 0.35 * atl * r * mo * M.machiniste);
    const pol = consommer(base, 'polymere', 0.5 * atl * r * mo * M.machiniste);
    ajouter(base, 'composant', Math.min(all / 0.35, pol / 0.5) * 0.14 * atl * r);
  }
  // La halle : jusqu'ici l'avant-poste ne savait que transformer ce qu'on lui
  // apportait. Il ramasse maintenant sa propre région, au rendement du biome et
  // sans épuiser la case — c'est une exploitation, pas une fouille.
  const halle = niveau(base, 'halle');
  if (halle > 0) {
    const regHalle = state.world.regions[base.regionId];
    const y = BIOMES[regHalle.biome].yields || {};
    // Ramasser se fait avec des bras, et la halle en était pourtant punie :
    // elle passait par `aLaMain`, qui vaut 0,4 sans courant. Un camp qui n'a
    // pas encore de générateur — c'est-à-dire tout camp de moins de mille
    // heures — récoltait donc à quarante pour cent, soit 0,07 ferraille par
    // heure. Le banc a chiffré ce que ça donne : soixante parties, quarante
    // avant-postes fondés, **aucun** assez développé pour que le monde le
    // remarque. Un avant-poste ne peut pas dépendre de ce que l'escouade lui
    // rapporte à dos d'homme ; sinon la voie du colon n'est qu'un dépôt.
    //
    // Le courant aide encore — un treuil vaut mieux qu'un dos — mais il ne
    // conditionne plus la récolte.
    const bras = 0.75 + 0.45 * r;
    const taux = 1.1 * halle * bras * mo * M.recoltant * regHalle.richesse
      * (ctx.climat ? 1 + (ctx.climat.rendement('ferraille') - 1) * 0.6 : 1);
    for (const k of Object.keys(y)) ajouter(base, k, y[k] * taux);
  }

  const inf = niveau(base, 'infirmerie');
  if (inf > 0) {
    const bio = consommer(base, 'biomasse', 0.4 * inf * r * M.infirmier);
    ajouter(base, 'medkit', bio * 0.09);
  }

  // Les habitants ne regardent pas un raid les bras croisés — et ceux qui sont
  // affectés au mur y sont pour de bon.
  base.defense = niveau(base, 'mur') * 22 * M.milicien + 10 + (base.pop || 0) * 2.5;

  // --- File de construction
  if (base.file.length) {
    const item = base.file[0];
    let vitesse = (1 + Math.min(1, manoeuvres(base) / 30)) * M.batisseur;
    if (surPlace) {
      // Ceux qui sont là mettent la main à la pâte
      let ing = 0;
      for (const g of state.player.groupes) {
        if (g.regionId !== base.regionId) continue;
        for (const c of g.membres) {
          if (!estDebout(c)) continue;
          ing += comp(c, 'ingenierie');
          // Un chantier forme moins vite qu'une fouille : on tient la clé,
          // on ne cherche pas.
          gagnerXp(c, 'ingenierie', XP_PRATIQUE * 0.5);
        }
      }
      vitesse += Math.min(1.2, ing / 160);
    }
    item.restant -= vitesse;
    if (item.restant <= 0) {
      base.batiments[item.key] = (base.batiments[item.key] || 0) + 1;
      base.file.shift();
      log({
        type: 'base',
        texte: `${BUILDINGS[item.key].nom} niveau ${base.batiments[item.key]} opérationnel.`,
        regionId: base.regionId,
      });
    }
  }

  // --- File de recherche. Les opérateurs de l'antenne y sont pour beaucoup.
  if (base.fileRech.length) {
    const item = base.fileRech[0];
    item.restant -= M.operateur;
    if (item.restant <= 0) {
      base.recherche[item.key] = (base.recherche[item.key] || 0) + 1;
      base.fileRech.shift();
      log({
        type: 'recherche',
        texte: `Recherche achevée : ${RESEARCH[item.key].nom} ${base.recherche[item.key]}.`,
      });
    }
  }

  // --- Raid sur l'avant-poste
  const reg = state.world.regions[base.regionId];
  const t = state.temps;
  // Le poste de garde ne fait pas gagner les combats — c'est le mur et les
  // miliciens qui s'en chargent. Il fait voir venir : moins de raids aboutissent
  // par surprise, et ceux qui passent trouvent les stocks déjà rentrés.
  const guet = niveau(base, 'poste') * M.garde;
  const vigilance = 1 / (1 + guet * 0.22);
  if (t - base.derniereAttaque > 72 && rng.chance(0.0016 * (1 + reg.danger * 4) * vigilance)) {
    base.derniereAttaque = t;
    const force = rng.irange(20, 45) + Math.floor(t / 600) + Math.round((base.pop || 0) * 1.5);
    // `forceEscouade` ne compte déjà que les gens présents : laisser
    // l'avant-poste sans personne, c'est le laisser à sa garnison.
    const defense = base.defense + forceEscouade(state);
    if (defense > force) {
      base.defense = Math.max(0, base.defense - force * 0.3);
      log({
        type: 'raid',
        texte: `Raid repoussé sur l’avant-poste (${force} assaillants).`,
        regionId: base.regionId,
        important: true,
      });
    } else {
      let vole = 0;
      const sauve = Math.min(0.7, guet * 0.13);
      for (const k of COMMODITY_KEYS) {
        const pris = Math.round((base.stock[k] || 0) * rng.range(0.15, 0.4) * (1 - sauve));
        base.stock[k] -= pris;
        vole += pris;
      }
      base.defense = 0;
      if (niveau(base, 'mur') > 0 && rng.chance(0.4)) {
        base.batiments.mur = Math.max(0, base.batiments.mur - 1);
      }
      log({
        type: 'raid',
        texte: `L’avant-poste est pillé : ${vole} unités emportées.`,
        regionId: base.regionId,
        important: true,
      });
    }
  }

  // Ce que l'entrepôt n'a pas pu prendre. On ne le dit pas à chaque heure — ce
  // serait insupportable — mais dès que la perte devient une vraie perte, et
  // pas plus d'une fois par jour de jeu.
  const perdu = (base.gaspille || 0) - gaspilleAvant;
  if (perdu > 0.001) {
    base.gaspilleJour = (base.gaspilleJour || 0) + perdu;
    if (t - (base.dernierGaspillage || -999) >= 24 && base.gaspilleJour >= 8) {
      base.dernierGaspillage = t;
      log({
        type: 'entrepot',
        texte: `L’entrepôt déborde : ${Math.round(base.gaspilleJour)} unités produites `
          + `n’ont nulle part où aller. Agrandissez, ou consommez.`,
        regionId: base.regionId,
        important: true,
      });
      base.gaspilleJour = 0;
    }
  }

  // Un camp qui compte finit par exister pour les autres, et sa vitrine se
  // recopie une fois par jour.
  reconnaitreAvantPoste(state, log);
  if (base.colonieId && t - (base.majVitrine || -999) >= 24) {
    base.majVitrine = t;
    synchroniserVitrine(state);
  }
  // Les colporteurs s'arrêtent, d'autant plus souvent que la route est faite.
  // C'est ce qui détache la voie du colon des jambes de quatre personnes.
  if (t % 12 === 0) visiteMarchand(state, rng, log);

  return { energie: e, gaspille: perdu };
}

// ---------------------------------------------------------------------------
// Quand un camp devient un lieu
// ---------------------------------------------------------------------------

/**
 * À partir de combien d'habitants le reste du monde cesse de vous ignorer.
 *
 * Vingt-cinq d'abord, et le banc a dit non : deux avant-postes sur soixante
 * l'atteignaient en quatre mille heures. Un seuil que presque personne ne
 * franchit n'est pas un palier, c'est un mur. Dix-huit, c'est déjà un vrai
 * hameau — les bourgs de cette carte en comptent quatre-vingt-dix au plus bas
 * — et c'est atteignable par une partie qui s'en donne la peine.
 */
const POP_RECONNUE = 18;

/**
 * Un avant-poste qui compte finit par exister pour les autres.
 *
 * Jusqu'ici la voie du colon n'avait pas de haut : on fondait un camp, on le
 * développait, et il restait un camp — invisible sur la carte du monde, sans
 * marché, sans place dans la politique, que personne ne convoitait jamais. On
 * pouvait bâtir quarante habitants et douze niveaux de bâtiment sans que le
 * monde s'en aperçoive.
 *
 * Au-delà de vingt-cinq habitants et d'une halle, il entre dans `world.colonies`
 * comme n'importe quel bourg. **Sa fiche est une vitrine, pas une seconde
 * source de vérité** : `state.base` reste le seul endroit où l'avant-poste
 * existe vraiment, et la vitrine en est recopiée une fois par jour. Le tick des
 * colonies la saute — elle n'a ni économie propre, ni notables, ni grenier.
 *
 * Ce que ça change : il se voit sur la carte, il tient ses abords comme une
 * ville, les cases voisines cessent d'être libres à la fondation — et surtout,
 * les conseils voisins le voient comme une place à prendre.
 */
function reconnaitreAvantPoste(state, log) {
  const base = state.base;
  if (!base.fonde || base.colonieId) return null;
  if ((base.pop || 0) < POP_RECONNUE || niveau(base, 'halle') < 1) return null;
  const w = state.world;
  const r = w.regions[base.regionId];
  if (r.colonie) return null;
  w.prochaineColonieId = (w.prochaineColonieId || w.colonies.length) + 1;
  const stock = {};
  for (const k of COMMODITY_KEYS) stock[k] = 0;
  const col = {
    id: `s${w.prochaineColonieId}`,
    nom: base.nom,
    regionId: base.regionId,
    faction: null,
    factionOrigine: null,
    taille: 1,
    pop: Math.round(base.pop),
    defense: Math.round(base.defense),
    defenseMax: Math.round(base.defense),
    murs: niveau(base, 'mur') * 3,
    stock,
    unrest: 0,
    marche: 1,
    prises: 0,
    banc: null,
    geole: null,
    emplois: null,
    notables: [],
    declin: 0,
    // Ce qui la distingue de toutes les autres : elle est à vous, et sa vérité
    // est ailleurs.
    avantPoste: true,
  };
  w.colonies.push(col);
  r.colonie = col.id;
  base.colonieId = col.id;
  if (log) {
    log({
      type: 'base',
      texte: `${base.nom} n’est plus un camp : on l’écrit sur les cartes. `
        + `Ce qui veut dire aussi qu’on la convoitera.`,
      regionId: base.regionId,
      important: true,
    });
  }
  return col;
}

/** Recopier l'avant-poste dans sa vitrine. Sens unique, une fois par jour. */
function synchroniserVitrine(state) {
  const base = state.base;
  if (!base.colonieId) return;
  const col = state.world.colonies.find((c) => c.id === base.colonieId);
  if (!col) { base.colonieId = null; return; }
  if (col.faction || col.ruine) return; // elle n'est plus à nous
  col.pop = Math.round(base.pop || 0);
  col.defense = Math.round(base.defense || 0);
  col.defenseMax = Math.max(col.defense, Math.round(base.defense || 0));
  col.murs = niveau(base, 'mur') * 3;
  col.taille = col.pop >= 90 ? 3 : col.pop >= 45 ? 2 : 1;
  col.nom = base.nom;
}

// ---------------------------------------------------------------------------
// Les marchands de passage
// ---------------------------------------------------------------------------

/** Ce qu'on garde toujours : des jours de vivres par tête, et de quoi bâtir. */
const RESERVE_JOURS = 25;
const GARDE_MATERIAUX = 250;

/** Ce que le camp achète quand il en manque, et jusqu'où. */
const ACHATS = { polymere: 150, composant: 50, carburant: 200 };

/**
 * Un marchand s'arrête.
 *
 * Une ville reconnue n'avait toujours pas de marché : elle achetait par
 * l'escouade, comme un camp, et la voie du colon restait attachée aux jambes de
 * quatre personnes. C'est le couplage que le banc avait mis au jour à cent
 * vingt parties — marcher est ce qui rend riche, donc bâtir loin des routes
 * appauvrit.
 *
 * On ne lui donne pas un étal, ce qui supposerait un second stock et une
 * seconde vérité. On lui donne **des visiteurs** : des colporteurs qui traitent
 * avec l'intendance, prennent le surplus au prix du gros et laissent ce qui
 * manque au prix du détail. C'est moins avantageux que d'aller vendre soi-même
 * en ville — et c'est bien le propos : on paie la commodité.
 *
 * Ils viennent d'autant plus souvent que la piste est faite. Une ville qu'on
 * atteint par une route damée voit passer du monde ; une ville au bout d'une
 * friche n'en voit aucun.
 */
function visiteMarchand(state, rng, log) {
  const base = state.base;
  if (!base.fonde || base.commerce === false) return null;
  const r = state.world.regions[base.regionId];
  // Un colporteur tous les huit jours sur une bonne route, tous les vingt sur
  // une piste à peine marquée. Réservé aux villes reconnues, ce mécanisme ne
  // servait à rien : c'est le camp *avant* le seuil qui a besoin d'écouler son
  // surplus, puisque c'est comme ça qu'il devient une ville. Un hameau voit
  // passer un ferrailleur de temps en temps ; une ville en voit trois fois plus.
  const cadence = 480 / (0.4 + (r.piste || 0) * 1.6) * (base.colonieId ? 1 : 2.4);
  if (state.temps - (base.dernierMarchand || -9999) < cadence) return null;
  base.dernierMarchand = state.temps;

  let vendu = 0;
  let achete = 0;
  let credits = 0;
  const pop = Math.max(1, base.pop || 0);
  for (const k of COMMODITY_KEYS) {
    const garde = k === 'rations' ? pop * RESERVE_JOURS : GARDE_MATERIAUX;
    const surplus = (base.stock[k] || 0) - garde;
    if (surplus < 10) continue;
    // Au prix du gros : un colporteur qui se déplace prend sa part.
    const prix = COMMODITIES[k].prix * 0.55 * rng.range(0.9, 1.15);
    const qte = Math.round(surplus * rng.range(0.5, 0.85));
    base.stock[k] -= qte;
    credits += Math.round(qte * prix);
    vendu += qte;
  }
  state.player.credits += credits;

  for (const k of Object.keys(ACHATS)) {
    const manque = ACHATS[k] - (base.stock[k] || 0);
    if (manque < 10) continue;
    const prix = COMMODITIES[k].prix * 1.35 * rng.range(0.9, 1.15);
    const peut = Math.floor(state.player.credits / prix);
    const qte = Math.min(manque, peut, Math.round(manque * rng.range(0.4, 0.9)));
    if (qte < 5) continue;
    state.player.credits -= Math.round(qte * prix);
    ajouter(base, k, qte);
    achete += qte;
  }

  if (log && (vendu || achete)) {
    log({
      type: 'marchand',
      texte: `Un colporteur s’arrête à ${base.nom}`
        + `${vendu ? ` : il prend ${vendu} unités pour ${credits} cr` : ''}`
        + `${achete ? `${vendu ? ' et laisse' : ' : il laisse'} ${achete} unités` : ''}.`,
      regionId: base.regionId,
      discret: true,
    });
  }
  return { vendu, achete, credits };
}

/**
 * Quelqu'un a pris votre ville. On ne garnit pas un camp des friches : ils
 * prennent ce qu'il y a et s'installent. Il vous reste votre escouade, et de
 * quoi recommencer ailleurs — c'est très exactement ce que ce jeu raconte.
 */
function perdreAvantPoste(state, log) {
  const base = state.base;
  if (!base.fonde) return;
  const nom = base.nom;
  const reg = base.regionId;
  base.fonde = false;
  base.colonieId = null;
  base.regionId = null;
  base.batiments = {};
  base.file = [];
  base.postes = {};
  base.pop = 0;
  for (const k of COMMODITY_KEYS) base.stock[k] = 0;
  if (log) {
    log({
      type: 'base',
      texte: `${nom} est tombée. Ce qu’on y avait bâti est à eux, désormais. `
        + `Il reste l’escouade, et de la place ailleurs.`,
      regionId: reg,
      important: true,
    });
  }
}

/** Ce que valent, l'arme à la main, les gens présents à l'avant-poste. */
function forceEscouade(state) {
  const base = state.base;
  let f = 0;
  const presents = base.fonde
    ? groupes(state).filter((g) => g.regionId === base.regionId).flatMap((g) => g.membres)
    : [];
  for (const c of presents) {
    if (!estDebout(c)) continue;
    f += comp(c, 'melee') * 0.4 + comp(c, 'tir') * 0.4 + comp(c, 'endurance') * 0.2;
  }
  return Math.round(f);
}

// ---------------------------------------------------------------------------
// Transferts sac ↔ avant-poste
// ---------------------------------------------------------------------------

function deposer(state, key, qte, groupe) {
  const g = groupe || groupeActif(state);
  const base = state.base;
  if (!base.fonde || !g || g.regionId !== base.regionId) {
    return { ok: false, motif: 'Il faut être à l’avant-poste.' };
  }
  const dispo = g.inventaire[key] || 0;
  const libre = capaciteStock(base) - totalStock(base);
  const n = Math.max(0, Math.min(Math.floor(qte), dispo, Math.floor(libre)));
  if (n <= 0) return { ok: false, motif: 'Rien à déposer, ou entrepôt plein.' };
  g.inventaire[key] -= n;
  base.stock[key] = (base.stock[key] || 0) + n;
  return { ok: true, qte: n };
}

function retirer(state, key, qte, capaciteLibre, groupe) {
  const g = groupe || groupeActif(state);
  const base = state.base;
  if (!base.fonde || !g || g.regionId !== base.regionId) {
    return { ok: false, motif: 'Il faut être à l’avant-poste.' };
  }
  const dispo = base.stock[key] || 0;
  const n = Math.max(0, Math.min(Math.floor(qte), dispo, Math.floor(capaciteLibre)));
  if (n <= 0) return { ok: false, motif: 'Rien à prendre, ou sac plein.' };
  base.stock[key] -= n;
  g.inventaire[key] = (g.inventaire[key] || 0) + n;
  return { ok: true, qte: n };
}

// ===== src/contrats.js ===============================================
// Contrats : ce que les villes vous demandent de faire. C'est ce qui donne un
// but à court terme entre deux ordres de récolte, et une raison de traverser la
// carte plutôt que de camper.
//
// Tout se résout automatiquement (livrer, ramener, compter les victoires), donc
// un contrat continue d'avancer pendant que le joueur est hors ligne.


/** Durée de vie d'un panneau d'affichage avant renouvellement. */
const DUREE_PANNEAU = 220;

const RESSOURCES_DEMANDEES = ['ferraille', 'minerai', 'polymere', 'biomasse', 'alliage', 'carburant', 'composant', 'isotope'];

// ---------------------------------------------------------------------------
// Génération
// ---------------------------------------------------------------------------

function contratCollecte(rng, state, col, t) {
  // Une ville demande ce qui lui manque vraiment.
  const manques = RESSOURCES_DEMANDEES
    .map((k) => [k, Math.max(0.1, 1 - (col.stock[k] || 0) / Math.max(1, col.pop * 0.4))])
    .filter((e) => e[1] > 0.15);
  const ressource = rng.weighted(manques.length ? manques : RESSOURCES_DEMANDEES.map((k) => [k, 1]));
  // On raisonne en valeur, pas en nombre : sinon une ville réclame quarante
  // isotopes comme elle réclamerait quarante ferrailles.
  const cible = rng.range(160, 520) * (1 + col.taille * 0.35);
  const quantite = Math.max(8, Math.min(140, Math.round(cible / COMMODITIES[ressource].prix)));
  const valeur = COMMODITIES[ressource].prix * quantite;
  // On remet la marchandise en même temps qu'on encaisse : à 1,5× la valeur
  // marchande, le contrat ne rapportait qu'une demi-vente de plus que d'aller
  // vendre le même lot — pour le prix d'un voyage dédié jusqu'au
  // commanditaire. Le gain net doit valoir le détour, sinon le panneau
  // d'affichage n'est qu'un piège à joueur consciencieux.
  return {
    type: 'collecte',
    ressource,
    quantite,
    recompense: Math.round(valeur * rng.range(2.6, 3.6)),
    reputation: rng.irange(3, 7),
    duree: rng.irange(180, 400),
    titre: `Rassembler ${quantite} ${COMMODITIES[ressource].nom.toLowerCase()}`,
  };
}

function contratLivraison(rng, state, col, t) {
  const autres = state.world.colonies.filter(
    (c) => !c.ruine && c.id !== col.id && distance(c.regionId, col.regionId) >= 2
  );
  if (!autres.length) return null;
  const dest = rng.pick(autres);
  const d = distance(col.regionId, dest.regionId);
  const ressource = rng.pick(['composant', 'medkit', 'alliage', 'rations', 'isotope']);
  const quantite = rng.irange(8, 25);
  const poids = COMMODITIES[ressource].poids * quantite;
  return {
    type: 'livraison',
    destId: dest.id,
    ressource,
    quantite,
    poids: Number(poids.toFixed(1)),
    recompense: Math.round((80 + d * 55 + poids * 6) * rng.range(0.9, 1.4)),
    reputation: rng.irange(4, 9),
    duree: Math.round(d * rng.range(14, 24)),
    titre: `Porter ${quantite} ${COMMODITIES[ressource].nom.toLowerCase()} à ${dest.nom}`,
  };
}

function contratPrime(rng, state, col, t) {
  // On paie pour taper sur un ennemi, ou sur les pillards par défaut.
  const ennemis = DIPLO_FACTIONS.filter((k) => {
    if (k === col.faction) return false;
    const f = state.world.factions[col.faction];
    return f && (f.relations[k] ?? 0) < 15;
  });
  // Les pillards courent les routes ; une faction précise se croise beaucoup
  // moins. On penche vers ce qui est réellement trouvable, sinon la prime est
  // un contrat qu'on ne peut pas honorer.
  const cible = ennemis.length && rng.chance(0.3) ? rng.pick(ennemis) : 'bandits';
  const victoires = rng.irange(1, 3);
  return {
    type: 'prime',
    cibleFaction: cible,
    victoires,
    progres: 0,
    recompense: Math.round(victoires * rng.irange(220, 460)),
    reputation: rng.irange(4, 10),
    duree: rng.irange(240, 500),
    titre: `${victoires} victoire${victoires > 1 ? 's' : ''} contre ${cible === 'bandits' ? 'les pillards' : FACTIONS[cible].nom}`,
  };
}

function contratReconnaissance(rng, state, col, t) {
  const inconnues = state.world.regions.filter(
    (r) => !r.decouvert && distance(r.i, col.regionId) >= 2
  );
  if (!inconnues.length) return null;
  const r = rng.pick(inconnues);
  const d = distance(col.regionId, r.i);
  return {
    type: 'reconnaissance',
    regionId: r.i,
    recompense: Math.round((70 + d * 45) * rng.range(0.9, 1.3)),
    reputation: rng.irange(2, 6),
    duree: Math.round(d * rng.range(16, 28)),
    titre: `Reconnaître le secteur ${String.fromCharCode(65 + r.x)}${r.y + 1}`,
  };
}

const FABRIQUES = {
  collecte: contratCollecte,
  livraison: contratLivraison,
  prime: contratPrime,
  reconnaissance: contratReconnaissance,
};

/** (Re)garnit le panneau d'affichage d'une ville. */
function genererContrats(state, col, rng, t) {
  const combien = 1 + col.taille;
  const liste = [];
  const types = Object.keys(FABRIQUES);
  for (let i = 0; i < combien; i++) {
    const type = rng.weighted([
      ['collecte', 3], ['livraison', 2.2], ['prime', 2], ['reconnaissance', 1.4],
    ]);
    const c = FABRIQUES[type](rng, state, col, t);
    if (!c) continue;
    c.id = idDepuisRng(rng, 'k');
    c.colonieId = col.id;
    c.faction = col.faction;
    // Une ville agitée paie mal, une ville prospère paie bien.
    c.recompense = Math.max(50, Math.round(c.recompense * (1 - col.unrest * 0.3)));
    liste.push(c);
  }
  col.contrats = liste;
  col.contratsExpire = t + DUREE_PANNEAU;
  return liste;
}

/** Renouvelle les panneaux périmés. Appelé de loin en loin, pas à chaque heure. */
function rafraichirPanneaux(state, rng, t) {
  for (const col of state.world.colonies) {
    if (col.ruine) { col.contrats = []; continue; }
    if (!col.contrats || t >= (col.contratsExpire || 0)) {
      genererContrats(state, col, rng, t);
    }
  }
}

// ---------------------------------------------------------------------------
// Acceptation
// ---------------------------------------------------------------------------

const MAX_CONTRATS = 4;

function accepter(state, col, id, log, groupe) {
  const g = groupe || groupeActif(state);
  if (!col.contrats) return { ok: false, motif: 'Aucun panneau ici.' };
  const i = col.contrats.findIndex((c) => c.id === id);
  if (i < 0) return { ok: false, motif: 'Ce contrat n’est plus affiché.' };
  if (state.player.contrats.length >= MAX_CONTRATS) {
    return { ok: false, motif: `Déjà ${MAX_CONTRATS} contrats en cours.` };
  }
  const c = col.contrats[i];

  // Le panneau appartient à quelqu'un. Un chef qui vous a en horreur ne vous
  // confie pas les affaires de sa ville ; un chef qui vous doit quelque chose
  // vous garde ce qui paie.
  const faveur = faveurChef(col);
  if (!faveur.ouvert) {
    return { ok: false, motif: `Le chef de ${col.nom} ne veut pas de vos services.` };
  }
  if (faveur.prime !== 1) c.recompense = Math.round(c.recompense * faveur.prime);

  // Une livraison, ça se charge : il faut la place dans le sac.
  if (c.type === 'livraison') {
    g.inventaire[c.ressource] = (g.inventaire[c.ressource] || 0) + c.quantite;
    c.charge = true;
    c.porteur = g.id;
  }

  col.contrats.splice(i, 1);
  c.accepteA = state.temps;
  c.echeance = state.temps + c.duree;
  state.player.contrats.push(c);
  log({
    type: 'contrat',
    texte: `Contrat accepté : ${c.titre} (${c.recompense} cr).`,
    important: true,
    regionId: col.regionId,
  });
  return { ok: true };
}

function abandonner(state, id, log) {
  const i = state.player.contrats.findIndex((c) => c.id === id);
  if (i < 0) return { ok: false, motif: 'Contrat introuvable.' };
  const c = state.player.contrats[i];
  state.player.contrats.splice(i, 1);
  if (c.type === 'livraison' && c.charge) {
    // On garde la marchandise : ça s'appelle du vol, et ça se paie.
    state.player.reputation[c.faction] = Math.max(-100, (state.player.reputation[c.faction] || 0) - 12);
  } else {
    state.player.reputation[c.faction] = Math.max(-100, (state.player.reputation[c.faction] || 0) - 4);
  }
  log({ type: 'contrat', texte: `Contrat abandonné : ${c.titre}.`, important: true });
  return { ok: true };
}

// ---------------------------------------------------------------------------
// Suivi
// ---------------------------------------------------------------------------

/** Le premier groupe présent en `regionId` qui porte assez de `key`. */
function auLieu(state, regionId, key, quantite) {
  return groupes(state).find(
    (g) => g.regionId === regionId && (g.inventaire[key] || 0) >= quantite
  ) || null;
}

/** Avancement lisible d'un contrat : { fait, total, texte, pret }. */
function progres(state, c) {
  switch (c.type) {
    case 'collecte': {
      // Le meilleur groupe, pas la somme : c'est un groupe qui apporte la
      // marchandise au commanditaire, et il l'apporte entière. Additionner ce
      // que portent des gens séparés par la moitié de la carte annoncerait un
      // contrat livrable qui ne le serait jamais.
      let q = 0;
      for (const g of groupes(state)) q = Math.max(q, Math.floor(g.inventaire[c.ressource] || 0));
      return { fait: Math.min(q, c.quantite), total: c.quantite, pret: q >= c.quantite,
        texte: `${Math.min(q, c.quantite)} / ${c.quantite}` };
    }
    case 'livraison': {
      // Être là ne suffit pas : il faut y être avec le colis. Le groupe qui a
      // signé n'est pas forcément celui qui arrive, et le colis ne se
      // téléporte pas d'un groupe à l'autre.
      const dest = colonieParId(state.world, c.destId);
      const porteur = dest && auLieu(state, dest.regionId, c.ressource, c.quantite);
      const surPlace = dest && groupes(state).some((g) => g.regionId === dest.regionId);
      return {
        fait: porteur ? 1 : 0,
        total: 1,
        pret: !!porteur,
        texte: !dest ? '→ ville disparue'
          : surPlace && !porteur ? `→ ${dest.nom} · colis ailleurs`
            : `→ ${dest.nom}`,
      };
    }
    case 'prime':
      return { fait: c.progres, total: c.victoires, pret: c.progres >= c.victoires,
        texte: `${c.progres} / ${c.victoires}` };
    case 'reconnaissance': {
      const vu = state.world.regions[c.regionId].decouvert;
      return { fait: vu ? 1 : 0, total: 1, pret: vu, texte: vu ? 'secteur vu' : 'non exploré' };
    }
    default:
      return { fait: 0, total: 1, pret: false, texte: '' };
  }
}

/** Incrémenté depuis le combat : une victoire compte pour les primes en cours. */
function compterVictoire(state, factionBande) {
  for (const c of state.player.contrats) {
    if (c.type !== 'prime') continue;
    const vise = c.cibleFaction === 'bandits' ? 'bandits' : c.cibleFaction;
    if (factionBande === vise) c.progres = Math.min(c.victoires, c.progres + 1);
  }
}

function recompenser(state, c, log) {
  state.player.credits += c.recompense;
  // Un contrat rempli pour les siens compte double : il paie et il fait monter.
  if (estAuService(state, c.faction)) {
    crediter(state, Math.round(c.recompense / 7) + 10, log, 'Contrat honoré pour les vôtres');
  }
  state.player.reputation[c.faction] = Math.min(100, (state.player.reputation[c.faction] || 0) + c.reputation);
  state.stats.contratsRemplis = (state.stats.contratsRemplis || 0) + 1;
  log({
    type: 'contrat',
    texte: `Contrat rempli : ${c.titre}. ${c.recompense} cr, réputation +${c.reputation}.`,
    important: true,
  });
}

/** Une heure de suivi : validation, échéances. */
function tickContrats(state, log, ctx) {
  const restants = [];
  for (const c of state.player.contrats) {
    const p = progres(state, c);
    const donneur = colonieParId(state.world, c.colonieId);

    // Validation : il faut qu'un groupe soit au bon endroit, avec la
    // marchandise. Lequel, peu importe — c'est le joueur qui a signé.
    if (p.pret) {
      if (c.type === 'collecte') {
        const porteur = donneur && auLieu(state, donneur.regionId, c.ressource, c.quantite);
        if (porteur) {
          porteur.inventaire[c.ressource] -= c.quantite;
          donneur.stock[c.ressource] = (donneur.stock[c.ressource] || 0) + c.quantite;
          recompenser(state, c, log);
          continue;
        }
      } else if (c.type === 'livraison') {
        const dest = colonieParId(state.world, c.destId);
        const porteur = dest && auLieu(state, dest.regionId, c.ressource, c.quantite);
        if (porteur) {
          porteur.inventaire[c.ressource] -= c.quantite;
          dest.stock[c.ressource] = (dest.stock[c.ressource] || 0) + c.quantite;
          recompenser(state, c, log);
          continue;
        }
      } else if (donneur && groupes(state).some((g) => g.regionId === donneur.regionId)) {
        recompenser(state, c, log);
        continue;
      }
    }

    // Le commanditaire a disparu : plus personne pour payer.
    const mort = (!donneur || donneur.ruine)
      || (c.type === 'livraison' && (() => {
        const d = colonieParId(state.world, c.destId);
        return !d || d.ruine;
      })());
    if (mort) {
      log({ type: 'contrat', texte: `Contrat caduc : ${c.titre}. La ville n’existe plus.`, important: true });
      continue;
    }

    // Échéance dépassée
    if (state.temps > c.echeance) {
      state.player.reputation[c.faction] = Math.max(-100, (state.player.reputation[c.faction] || 0) - 6);
      log({
        type: 'contrat',
        texte: `Contrat échu : ${c.titre}. Réputation entamée.`,
        important: true,
      });
      continue;
    }
    restants.push(c);
  }
  state.player.contrats = restants;
}

/** Là où il faut se rendre pour toucher la prime, pour l'affichage. */
function lieuValidation(state, c) {
  if (c.type === 'livraison') {
    const d = colonieParId(state.world, c.destId);
    return d ? d.nom : '—';
  }
  const donneur = colonieParId(state.world, c.colonieId);
  return donneur ? donneur.nom : '—';
}

// ===== src/events.js =================================================
// Journal de bord et rencontres. Tout se résout automatiquement selon la
// posture et les consignes de l'escouade : c'est ce qui permet à la simulation
// de tourner pendant que le joueur est hors ligne.


const LOG_MAX = 400;

function creerLogger(state) {
  return (entree) => {
    const e = Object.assign({ t: state.temps }, entree);
    // Témoin ou pas : ce qui arrive sous les yeux de l'escouade est su tout de
    // suite, le reste met le temps de la route (voir `nouvellesConnues`).
    if (e.regionId != null && e.vu === undefined) e.vu = estSurveillee(state, e.regionId);
    state.journal.push(e);
    if (state.journal.length > LOG_MAX) state.journal.splice(0, state.journal.length - LOG_MAX);
    if (e.important) state.nonLus = (state.nonLus || 0) + 1;
    return e;
  };
}

// ---------------------------------------------------------------------------
// Utilitaires d'inventaire
// ---------------------------------------------------------------------------

/** Ce qu'un groupe peut encore porter. Chacun porte le sien. */
function ajouterAuSac(state, key, qte, groupe) {
  const g = groupe || groupeActif(state);
  if (!g || qte <= 0) return 0;
  const cap = capacitePortage(state, g);
  const libre = cap - poidsInventaire(g.inventaire);
  const poidsU = COMMODITIES[key] ? COMMODITIES[key].poids : 1;
  const max = poidsU > 0 ? Math.floor(libre / poidsU) : qte;
  const reel = Math.max(0, Math.min(Math.floor(qte), max));
  if (reel > 0) g.inventaire[key] = (g.inventaire[key] || 0) + reel;
  return reel;
}

function reputation(state, faction, delta) {
  // « bandits » n'est pas une faction : on tape sur des pillards, pas sur une
  // institution. Sans ce garde-fou, la table de réputation se remplit de clés
  // qui n'ont ni nom ni couleur, et tout ce qui la parcourt casse.
  if (!faction || faction === 'essaim' || !FACTIONS[faction]) return;
  const r = state.player.reputation;
  r[faction] = Math.max(-100, Math.min(100, (r[faction] || 0) + delta));
}

function factionDominante(state, regionId) {
  const r = state.world.regions[regionId];
  if (r.controle) return r.controle;
  const col = colonieDe(state.world, regionId);
  return col ? col.faction : null;
}

// ---------------------------------------------------------------------------
// Mémoire des morts
// ---------------------------------------------------------------------------

/**
 * Un mort laisse une fiche, pas une ligne qui défile. C'est ce qui donne du
 * poids à une escouade qu'on a fait progresser pendant deux cents heures.
 */
function inscrireAuMemorial(state, c, cause, lieu) {
  if (!state.memorial) state.memorial = [];
  if (state.memorial.some((m) => m.id === c.id)) return;
  const meilleure = SKILL_KEYS.reduce(
    (best, k) => (c.skills[k] > (c.skills[best] ?? 0) ? k : best), SKILL_KEYS[0]
  );
  state.memorial.push({
    id: c.id,
    nom: c.nom,
    archetype: c.archetypeNom,
    t: state.temps,
    cause,
    lieu,
    kills: c.kills,
    horsCombat: c.horsCombat || 0,
    traits: (c.traits || []).slice(0, 3),
    meilleure: `${SKILLS[meilleure]} ${c.skills[meilleure]}`,
  });
  if (state.memorial.length > 60) state.memorial.shift();
}

// ---------------------------------------------------------------------------
// Combat impliquant le joueur
// ---------------------------------------------------------------------------

/** Photographie des compétences, pour pouvoir annoncer les progrès après coup. */
function instantaneComps(squad) {
  const m = {};
  for (const c of squad) m[c.id] = Object.assign({}, c.skills);
  return m;
}

function annoncerProgres(state, avant, log, membres) {
  for (const c of membres) {
    const a = avant[c.id];
    if (!a) continue;
    const montees = SKILL_KEYS.filter((k) => c.skills[k] > (a[k] ?? 0));
    if (!montees.length) continue;
    log({
      type: 'progres',
      texte: `${c.nom} progresse : ${montees.map((k) => `${SKILLS[k]} ${c.skills[k]}`).join(', ')}.`,
    });
  }
}

function combatContre(state, bande, log, ctx, groupe) {
  const rng = ctx.rng;
  const g = groupe || groupeActif(state);
  const compsAvant = instantaneComps(g.membres);
  const posture = POSTURES[state.player.posture] || POSTURES.neutre;
  const squad = g.membres.filter(estVivant);
  // Un élève à l'école ne monte pas au feu : il est en ville, pas au campement.
  const combattants = squad.filter((c) => c.etat !== 'mort' && !occupeParEcole(c));

  // À partir de Capitaine, les siens viennent prêter main-forte chez eux.
  const renforts = [];
  const nbRenforts = renfortsDisponibles(state, g);
  for (let i = 0; i < nbRenforts; i++) {
    const allie = makeCharacter(rng, { niveau: 2 });
    allie.equip.armure = allie.equip.armure || 'plaque';
    allie.renfort = true;
    renforts.push(allie);
  }
  if (renforts.length) {
    log({
      type: 'renfort',
      texte: `${renforts.length} homme${renforts.length > 1 ? 's' : ''} ${FACTIONS[g.allegeance.faction].genitif} accourent.`,
      regionId: g.regionId,
    });
  }

  const res = resoudreCombat(combattants.concat(renforts), bande.membres, {
    rng,
    biome: state.world.regions[g.regionId].biome,
    posture,
    bonusDegats: (state.base.recherche.balistique || 0) * 0.1,
    bonusArmure: (state.base.recherche.blindage || 0) * 0.1,
    // On n'achève pas les hommes à terre sans l'avoir décidé. À 0,06 « par
    // défaut », l'escouade assassinait des blessés que personne ne lui avait
    // demandé de tuer — et se privait des prisonniers qui vont avec.
    letalA: state.player.politique.achever ? 0.45 : 0,
    cohA: rendementCohesion(g),
    letalB: bande.letal,
    // Comment on se bat : décidé à l'avance, valable aussi en votre absence.
    tactique: state.player.tactique || 'ligne',
    viserChefs: !!state.player.politique.viserChefs,
  });

  const lieu = nomRegion(state.world, g.regionId);
  let texte;
  if (res.vainqueur === 'A') {
    const b = butin(bande, rng);
    let ramasse = 0;
    for (const k of Object.keys(b.loot)) ramasse += ajouterAuSac(state, k, b.loot[k], g);
    state.player.credits += b.credits;
    for (const o of b.objets) {
      if (g.objets.length < 30) g.objets.push(o);
    }
    reputation(state, bande.faction, -6);
    // Les ennemis d'un ennemi apprécient
    for (const k of Object.keys(state.world.factions)) {
      if (k === bande.faction || k === 'essaim') continue;
      const enGuerre = state.world.guerres.some(
        (w) => (w.a === k && w.b === bande.faction) || (w.b === k && w.a === bande.faction)
      );
      if (enGuerre) reputation(state, k, 2);
    }
    state.stats.combatsGagnes++;
    compterVictoire(state, bande.faction);
    compterVictoireOrdre(state, bande.faction);
    // Frapper un ennemi déclaré de sa faction, c'est du service rendu.
    const all = g.allegeance;
    if (all && bande.faction && bande.faction !== all.faction) {
      const enGuerreAvec = state.world.guerres.some(
        (w) => (w.a === all.faction && w.b === bande.faction) || (w.b === all.faction && w.a === bande.faction)
      );
      if (enGuerreAvec) crediter(state, 28, log, 'Ennemi déclaré abattu');
    }
    // Ceux qui sont à terre sans être morts. On ne les laisse plus s'évaporer :
    // c'est la seule question du jeu à laquelle le butin ne répond pas.
    const pris = fairePrisonniers(state, g, bande, capturables(g, bande), log);
    texte = `${bande.nom} mis en déroute à ${lieu} — ${ramasse} unités et ${b.credits} cr récupérés`
      + `${pris.length ? `, ${pris.length} prisonnier${pris.length > 1 ? 's' : ''}` : ''}.`;
  } else if (res.vainqueur === 'B') {
    texte = perdreCombat(state, bande, log, ctx, lieu, g);
  } else if (res.fuite === 'degage') {
    texte = `${g.nom} décroche de ${bande.nom} à ${lieu} sans laisser personne. `
      + `On n’a rien pris, on n’a rien perdu.`;
  } else {
    texte = `Accrochage indécis avec ${bande.nom} à ${lieu}. Chacun décroche.`;
  }

  state.stats.combats++;
  const morts = g.membres.filter((c) => c.etat === 'mort' && !c._compte);
  for (const m of morts) {
    m._compte = true;
    inscrireAuMemorial(state, m, `tombé face à ${bande.nom}`, lieu);
    log({ type: 'mort', texte: `${m.nom} est mort à ${lieu}.`, important: true });
  }
  // Un groupe qui perd des siens se délite ; une victoire ressoude.
  g.cohesion = Math.max(0, Math.min(100,
    (g.cohesion ?? 55) + (res.vainqueur === 'A' ? 2.5 : -4) - morts.length * 9));

  // Ceux qui survivent finissent par se faire un nom.
  for (const c of g.membres) {
    if (c.etat === 'mort' || c.surnomGagne) continue;
    const membrePerdu = Object.keys(c.corps).some((k) => c.corps[k].perdu);
    // On compte les mises hors de combat, pas seulement les morts : les ennemis
    // tombent K.O. bien plus souvent qu'ils ne meurent, et achever est
    // désactivé par défaut. À dix-huit *morts*, le seuil n'était jamais atteint
    // par personne — on ne se faisait un nom qu'en perdant un membre.
    if ((c.horsCombat || 0) >= 14 || membrePerdu) {
      c.surnomGagne = true;
      const avant = c.nom;
      c.nom = `${c.nom.split(' ')[0]} ${rng.pick(SURNOMS)}`;
      if (c.nom !== avant) {
        log({ type: 'surnom', texte: `On ne l’appelle plus ${avant}, mais ${c.nom}.`, important: true });
      }
    }
  }

  // Sortir vivants du même combat rapproche ; y laisser quelqu'un aussi, mais
  // dans l'autre sens pour ceux qui n'ont pas tenu leur poste.
  const debouts = g.membres.filter(estDebout);
  for (let i = 0; i < debouts.length; i++) {
    for (let j = i + 1; j < debouts.length; j++) {
      ajusterLien(debouts[i], debouts[j], res.vainqueur === 'A' ? 7 : 3);
    }
  }
  for (const tombe of g.membres.filter((c) => c.etat === 'ko')) {
    for (const d of debouts) ajusterLien(tombe, d, -2);
  }

  annoncerProgres(state, compsAvant, log, g.membres);

  log({
    type: 'combat',
    texte,
    important: true,
    regionId: g.regionId,
    groupe: g.id,
    // On garde le début de l'échange et son épilogue : le détail complet
    // noie l'écran sur mobile.
    detail: res.journal.length > 12
      ? res.journal.slice(0, 7).map((j) => j.txt)
        .concat([`… ${res.journal.length - 12} échanges …`])
        .concat(res.journal.slice(-5).map((j) => j.txt))
      : res.journal.map((j) => j.txt),
  });
  return res;
}

function perdreCombat(state, bande, log, ctx, lieu, g) {
  const rng = ctx.rng;
  state.stats.defaites++;

  if (bande.faction === 'essaim') {
    // L'Essaim ne fait pas de prisonniers
    for (const c of g.membres) {
      if (c.etat === 'ko' && rng.chance(0.3)) {
        blesser(c, 40, 'torse', rng, { letal: true });
      }
    }
    return `L’Essaim submerge l’escouade à ${lieu}.`;
  }

  // Dépouillés et abandonnés plus loin : on survit, on repart de rien — mais
  // pas le ventre vide. Rafler jusqu'à la dernière ration enclenche une
  // spirale : battu, donc affamé, donc incapable de se poser pour récupérer,
  // donc battu de nouveau. Ces gens veulent ce qui se revend, pas des cadavres.
  const bouches = Math.max(1, g.membres.filter(estVivant).length);
  const planchers = { rations: bouches * 5, medkit: 1 };
  let perdu = 0;
  for (const k of COMMODITY_KEYS) {
    const q = g.inventaire[k] || 0;
    const garde = Math.min(q, planchers[k] || 0);
    const pris = Math.round((q - garde) * rng.range(0.4, 0.75));
    g.inventaire[k] = q - pris;
    perdu += pris;
  }
  // On garde de quoi repartir : tout rafler à chaque défaite interdit
  // définitivement de s'équiper, donc de cesser de perdre.
  const cr = Math.round(state.player.credits * rng.range(0.25, 0.55));
  state.player.credits -= cr;
  if (g.objets.length && rng.chance(0.6)) {
    g.objets.splice(rng.int(g.objets.length), 1);
  }
  // Une bête se mène toute seule et se revend bien : c'est la première chose
  // qu'on emmène. C'est aussi ce qui fait qu'on y tient.
  perdreBete(g, rng, log);
  reputation(state, bande.faction, -3);

  // On se réveille ailleurs, quelques heures plus tard. Dépouillés, pas égorgés :
  // ces gens voulaient le sac, pas les cadavres.
  const options = voisins(g.regionId);
  if (options.length) g.regionId = rng.pick(options);
  g.ordre = { type: 'repos' };
  for (const c of g.membres) {
    if (c.etat === 'mort') continue;
    c.sang = Math.min(c.sang, 6);
    if (c.etat === 'ko') c.koHeures = Math.max(c.koHeures, rng.irange(4, 12));
  }
  return `${g.nom} battu à ${lieu} : ${perdu} unités et ${cr} cr perdus, réveil à ${nomRegion(state.world, g.regionId)}.`;
}

// ---------------------------------------------------------------------------
// Table de rencontres
// ---------------------------------------------------------------------------

function bandeLocale(state, ctx, groupe) {
  const rng = ctx.rng;
  const g = groupe || groupeActif(state);
  const regionId = g.regionId;
  const dominante = factionDominante(state, regionId);
  const repu = dominante ? (state.player.reputation[dominante] || 0) : 0;

  // Une faction dont on est mal vu envoie ses hommes ; sinon, la faune du coin.
  // Une prime en cours fait sortir sa cible du bois : accepter un contrat
  // change ce qu'on rencontre, sinon on ne peut jamais l'honorer.
  const vises = new Set(
    state.player.contrats.filter((c) => c.type === 'prime').map((c) => c.cibleFaction)
  );

  let faction;
  if (dominante && repu < -25 && rng.chance(0.6)) faction = dominante;
  else {
    const poids = [
      ['bandits', 3 + (vises.has('bandits') ? 3 : 0)],
      ['essaim', state.world.regions[regionId].biome === 'plastique' ? 2.2 : 1.1],
    ];
    if (dominante) poids.push([dominante, 1.4 + (vises.has(dominante) ? 3 : 0)]);
    // Une faction visée par contrat peut aussi croiser la route hors de chez elle.
    for (const v of vises) {
      if (v !== 'bandits' && v !== dominante && FACTIONS[v]) poids.push([v, 2.2]);
    }
    faction = rng.weighted(poids);
  }
  // Le monde durcit lentement, mais les bandes restent le plus souvent
  // inférieures en nombre : c'est au joueur de choisir quand ça vaut le coup.
  const niveauMonde = Math.min(2, Math.floor(state.temps / 2500));
  const debout = deboutDe(g).length || 1;
  const taille = Math.max(1, Math.round(rng.weighted([
    [1, 3], [2, 3], [3, 2], [debout, 1.5], [debout + 1, 0.6],
  ])));
  return genererBande(rng, faction, Math.min(6, taille), niveauMonde);
}

/**
 * Quand une faction vous déteste assez, elle cesse d'attendre que vous passiez :
 * elle paie des gens pour vous trouver. La réputation devient une menace.
 */
/**
 * Les chasseurs de prime cherchent *vous*, pas un groupe en particulier : le
 * tirage est global, et c'est le groupe qu'ils trouvent qui doit s'expliquer.
 * Un tirage par groupe multiplierait leur fréquence par le nombre de groupes.
 */
function tenterChasseurs(state, log, ctx) {
  const rng = ctx.rng;
  const primes = state.player.primes || (state.player.primes = {});

  // Les rancunes s'émoussent. Sans cet oubli, la réputation n'est qu'un
  // cliquet qui descend : dix accrochages suffisent à se rendre le monde
  // définitivement hostile, et plus rien ne peut réparer ça.
  if (state.temps % 24 === 0) {
    for (const k of Object.keys(state.player.reputation)) {
      const v = state.player.reputation[k];
      if (v === 0) continue;
      // Asymétrique à dessein : une rancune s'émousse vite, un service rendu
      // reste longtemps. Sinon on ne peut ni sortir de l'hostilité, ni
      // accumuler assez d'estime pour être reçu quelque part.
      const pas = v > 0 ? Math.min(v, 0.1) : Math.min(-v, 0.45);
      state.player.reputation[k] = v > 0 ? v - pas : v + pas;
    }
  }

  for (const k of Object.keys(state.player.reputation)) {
    if (!FACTIONS[k] || k === 'essaim') continue;
    const rep = state.player.reputation[k];
    const niveau = rep <= -75 ? 2 : rep <= -50 ? 1 : 0;
    if (niveau > (primes[k] || 0)) {
      primes[k] = niveau;
      log({
        type: 'prime_tete',
        texte: niveau === 2
          ? `${FACTIONS[k].nom} double la prime sur votre tête. On vous cherche activement.`
          : `${FACTIONS[k].nom} met une prime sur votre tête.`,
        important: true,
      });
    } else if (niveau < (primes[k] || 0) && rep > -40) {
      primes[k] = niveau;
      if (niveau === 0) {
        log({ type: 'prime_tete', texte: `${FACTIONS[k].nom} retire la prime sur votre tête.`, important: true });
      }
    }
  }

  const traques = Object.keys(primes).filter((k) => primes[k] > 0 && FACTIONS[k]);
  if (!traques.length) return false;
  const intensite = traques.reduce((t, k) => t + primes[k], 0);
  // Une visite tous les deux à trois mois de jeu : une menace, pas un métronome.
  if (!rng.chance(0.0012 * intensite)) return false;

  // Ils tombent sur l'un des groupes — pas forcément celui qu'on regarde.
  const cibles = groupes(state).filter((gr) => gr.membres.some(estVivant));
  if (!cibles.length) return false;
  const cible = rng.pick(cibles);

  const k = rng.pick(traques);
  const taille = 2 + rng.irange(0, primes[k]);
  const bande = genererBande(rng, k, taille, primes[k]);
  bande.nom = `Chasseurs de prime ${FACTIONS[k].genitif}`;
  bande.letal = 0.3;
  log({
    type: 'chasseurs',
    texte: `Des chasseurs de prime ${FACTIONS[k].genitif} ont retrouvé ${cible.nom}.`,
    important: true,
    regionId: cible.regionId,
    groupe: cible.id,
  });
  const res = combatContre(state, bande, log, ctx, cible);

  // Perdre solde l'affaire : ils ont eu ce qu'ils voulaient. Sinon la prime
  // s'auto-entretient et il n'existe aucune sortie.
  if (res.vainqueur === 'B') {
    primes[k] = Math.max(0, primes[k] - 1);
    state.player.reputation[k] = Math.min(100, (state.player.reputation[k] || 0) + 10);
    log({
      type: 'prime_tete',
      texte: `${FACTIONS[k].nom} considère l’affaire réglée. La prime retombe.`,
      important: true,
    });
  }
  return true;
}

/** Tente une rencontre sur l'heure écoulée. Retourne true si quelque chose est arrivé. */
function tenterRencontre(state, log, ctx, multiplicateur = 1, groupe) {
  const rng = ctx.rng;
  const g = groupe || groupeActif(state);
  const regionId = g.regionId;
  const r = state.world.regions[regionId];
  const posture = POSTURES[state.player.posture] || POSTURES.neutre;
  const col = colonieDe(state.world, regionId);

  // En ville, on est relativement tranquille
  const climat = ctx.climat;
  // Un secteur qu'on ne tient plus n'est pas une statistique : on s'y fait
  // attaquer davantage, et le joueur le sent avant de lire le chiffre.
  let p = r.danger * multiplicateur * (col ? 0.25 : 1) * (climat ? climat.rencontres : 1)
    * menace(state.world, regionId);
  // Furtivité du plus discret de l'escouade
  let furtif = 0;
  const debout = deboutDe(g);
  if (debout.length) {
    furtif = Math.max(...debout.map((c) => comp(c, 'furtivite')));
  }
  p *= 1 - Math.min(0.55, furtif / 190);
  p *= 1 - posture.evitement * 0.7;
  // Une armée dans le secteur, c'est du monde sur les routes
  const armeesIci = state.world.armees.filter((a) => distance(a.regionId, regionId) <= 1).length;
  p *= 1 + armeesIci * 0.6;
  // Une colonne de bêtes chargées se voit de loin, et se convoite. Une troupe
  // nombreuse aussi : on ne fait pas passer trente personnes inaperçues.
  p *= visibiliteAttelage(g);
  p *= 1 + Math.max(0, debout.length - 4) * 0.05;

  if (!rng.chance(Math.min(0.5, p))) return false;

  const type = rng.weighted([
    ['hostile', 5],
    ['epave', 2],
    ['errant', 1.1],
    ['caravane', col ? 0.4 : 1.3],
    ['peage', r.controle ? 1.5 : 0.2],
  ]);

  switch (type) {
    case 'hostile': {
      const bande = bandeLocale(state, ctx, g);
      if (posture.evitement > 0 && rng.chance(posture.evitement * 0.8)) {
        log({ type: 'esquive', texte: `${g.nom} : ${bande.nom} repéré à temps. Contournement.`, regionId, groupe: g.id });
        for (const c of debout) gagnerXp(c, 'furtivite', XP_PRATIQUE);
        return true;
      }
      combatContre(state, bande, log, ctx, g);
      return true;
    }
    case 'epave': {
      const biome = state.world.regions[regionId].biome;
      const table = { dalles: 'composant', friche: 'isotope', plastique: 'polymere', relais: 'composant' };
      const k = table[biome] || rng.pick(['ferraille', 'minerai', 'alliage']);
      const q = rng.irange(3, 14);
      const pris = ajouterAuSac(state, k, q, g);
      const cr = rng.irange(0, 60);
      state.player.credits += cr;
      for (const c of debout) gagnerXp(c, 'ingenierie', XP_PRATIQUE * 1.2);
      log({
        type: 'trouvaille',
        texte: `Épave fouillée : ${pris} ${COMMODITIES[k].nom.toLowerCase()}${cr ? ` et ${cr} cr` : ''}.`,
        regionId,
      });
      return true;
    }
    case 'errant': {
      const max = tailleEscouadeMax(state.base);
      const vivants = tousLesMembres(state).filter(estVivant).length;
      const prix = rng.irange(120, 420);
      if (!state.player.politique.recruter || vivants >= max || state.player.credits < prix) {
        log({
          type: 'rencontre',
          texte: `Un errant propose ses services (${prix} cr). Décliné.`,
          regionId,
          discret: true,
        });
        return true;
      }
      const c = makeCharacter(rng, { niveau: rng.irange(0, 1) });
      state.player.credits -= prix;
      g.membres.push(c);
      log({
        type: 'recrue',
        texte: `${c.nom} (${c.archetypeNom}) rejoint ${g.nom} pour ${prix} cr.`,
        regionId,
        important: true,
        groupe: g.id,
      });
      return true;
    }
    case 'caravane': {
      if (!state.player.politique.commercer) {
        log({ type: 'rencontre', texte: 'Une caravane passe. On la laisse filer.', regionId, discret: true });
        return true;
      }
      const stock = COMMODITY_KEYS.filter((k) => (g.inventaire[k] || 0) > 0);
      if (!stock.length) {
        log({ type: 'rencontre', texte: 'Une caravane passe. Rien à lui vendre.', regionId, discret: true });
        return true;
      }
      const k = rng.pick(stock);
      const q = Math.min(g.inventaire[k], rng.irange(3, 25));
      const negoc = debout.length
        ? debout.reduce((a, b) => (comp(a, 'commerce') >= comp(b, 'commerce') ? a : b))
        : null;
      const bonus = negoc ? comp(negoc, 'commerce') / 260 : 0;
      const prix = Math.round(COMMODITIES[k].prix * (1.15 + bonus) * q);
      g.inventaire[k] -= q;
      state.player.credits += prix;
      if (negoc) gagnerXp(negoc, 'commerce', XP_PRATIQUE * 0.8);
      log({
        type: 'commerce',
        texte: `Caravane : ${q} ${COMMODITIES[k].nom.toLowerCase()} vendus pour ${prix} cr.`,
        regionId,
      });
      return true;
    }
    case 'peage': {
      const f = r.controle || 'bandits';
      const taxe = rng.irange(40, 220);
      // Les siens ne rançonnent pas les leurs, dès le grade d'Agent.
      const monGrade = g.allegeance && g.allegeance.faction === f ? rangDe(g.allegeance) : null;
      if (monGrade && monGrade.index >= 1) {
        log({
          type: 'peage',
          texte: `Barrage ${FACTIONS[f].genitif} : on vous reconnaît, on vous laisse passer.`,
          regionId,
          discret: true,
        });
        return true;
      }
      const agressif = state.player.posture === 'agressif';
      if (!agressif && state.player.credits >= taxe && state.player.politique.payerPeage) {
        state.player.credits -= taxe;
        reputation(state, f, 1);
        log({
          type: 'peage',
          texte: `Péage ${FACTIONS[f] ? FACTIONS[f].nom : 'local'} : ${taxe} cr versés.`,
          regionId,
        });
      } else {
        const bande = genererBande(rng, FACTIONS[f] ? f : 'bandits', rng.irange(2, 4), Math.min(2, Math.floor(state.temps / 900)));
        log({ type: 'peage', texte: `${g.nom} : péage refusé. Ça tourne mal.`, regionId, groupe: g.id });
        reputation(state, f, -8);
        combatContre(state, bande, log, ctx, g);
      }
      return true;
    }
    default:
      return false;
  }
}

/**
 * Aléa environnemental du biome (radiations, pluie acide, éboulement…).
 * `exposition` : 1 en plein travail dehors, ~0.3 au repos ou à l'abri.
 */
function tenterAlea(state, log, ctx, exposition = 1, groupe) {
  const rng = ctx.rng;
  const g = groupe || groupeActif(state);
  const regionId = g.regionId;
  const r = state.world.regions[regionId];
  const h = BIOMES[r.biome].hazard;
  if (!h) return false;
  const col = colonieDe(state.world, regionId);
  const abri = col && !col.ruine ? 0.25 : 1;
  const protege = state.base.fonde && state.base.regionId === regionId ? 0.3 : 1;
  const climat = ctx.climat ? ctx.climat.aleas : 1;
  if (!rng.chance(h.p * exposition * abri * protege * climat)) return false;

  const touches = [];
  for (const c of g.membres) {
    if (!estVivant(c)) continue;
    if (!rng.chance(0.7)) continue;
    const armure = c.equip.armure ? (ITEMS[c.equip.armure].armure || 0) : 0;
    const reduc = 1 - Math.min(0.6, armure / 30);
    const d = h.degats * rng.range(0.6, 1.4) * reduc;
    if (d > 0.5) {
      const res = blesser(c, d, rng.pick(['torse', 'tete', 'brasG', 'jambeD']), rng);
      if (res.mort) log({ type: 'mort', texte: `${c.nom} succombe : ${h.nom.toLowerCase()}.`, important: true });
    }
    c.fatigue = Math.min(120, c.fatigue + h.fatigue * rng.range(0.5, 1.2));
    touches.push(c.nom);
  }
  if (!touches.length) return false;
  log({
    type: 'alea',
    texte: `${h.nom} sur ${nomRegion(state.world, regionId)}. ${touches.length} de ${g.nom} touché(s).`,
    regionId,
    groupe: g.id,
  });
  return true;
}

/** Résumé lisible d'une entrée de journal (utilisé par l'UI). */
function couleurLog(type) {
  switch (type) {
    case 'combat': case 'mort': case 'raid': return 'danger';
    case 'capture': case 'guerre': case 'siege': case 'bataille': return 'guerre';
    case 'trouvaille': case 'commerce': case 'recrue': return 'gain';
    case 'base': case 'recherche': case 'chantier': return 'base';
    default: return 'neutre';
  }
}

// ---------------------------------------------------------------------------
// Sites : la récompense d'aller voir ailleurs
// ---------------------------------------------------------------------------

/**
 * Fouille le site de la région courante. Action ponctuelle : un site ne se
 * fouille qu'une fois, et il peut être gardé.
 */
function fouillerSite(state, rng, log, groupe) {
  const g = groupe || groupeActif(state);
  const r = state.world.regions[g.regionId];
  if (!r.site || !r.site.connu) return { ok: false, motif: 'Aucun site repéré ici.' };
  if (r.site.fouille) return { ok: false, motif: 'Ce site a déjà été vidé.' };
  const debout = deboutDe(g);
  if (!debout.length) return { ok: false, motif: 'Personne n’est en état.' };

  const def = POI[r.site.type];

  // Certains sites demandent de savoir ouvrir une porte.
  if (def.reqIngenierie) {
    const meilleur = Math.max(...debout.map((c) => comp(c, 'ingenierie')));
    if (meilleur < def.reqIngenierie) {
      return { ok: false, motif: `Il faut ${def.reqIngenierie} en ingénierie (meilleur : ${Math.round(meilleur)}).` };
    }
  }

  // Le site est gardé ? On le saura en entrant.
  if (rng.chance(def.danger)) {
    const bande = bandeLocale(state, { rng }, g);
    log({ type: 'site', texte: `${def.nom} : on n’est pas seuls.`, important: true, regionId: r.i });
    const res = combatContre(state, bande, log, { rng }, g);
    if (res.vainqueur !== 'A') {
      return { ok: true, combat: true, gagne: false, motif: 'Le site reste aux autres.' };
    }
  }

  r.site.fouille = true;
  const pris = [];
  for (const k of Object.keys(def.loot)) {
    const [min, max] = def.loot[k];
    const q = rng.irange(min, max);
    if (q <= 0) continue;
    const reel = ajouterAuSac(state, k, q, g);
    if (reel > 0) pris.push(`${reel} ${COMMODITIES[k].nom.toLowerCase()}`);
  }
  const cr = rng.irange(def.credits[0], def.credits[1]);
  state.player.credits += cr;

  const objets = [];
  for (let i = 0; i < (def.objet || 0); i++) {
    if (!rng.chance(0.6)) continue;
    const palier = rng.weighted([[0, 3], [1, 3], [2, 1.6], [3, 0.4]]);
    const choix = Object.keys(PALIERS_ITEM).filter((k) => PALIERS_ITEM[k] === palier);
    if (!choix.length) continue;
    const key = rng.pick(choix);
    if (g.objets.length < 40) {
      g.objets.push(key);
      objets.push(ITEMS[key].nom);
    }
  }

  // Une station météo rend surtout de la carte.
  if (def.revele) {
    let leves = 0;
    for (const reg of state.world.regions) {
      if (reg.decouvert) continue;
      if (distance(reg.i, r.i) > def.revele) continue;
      reg.decouvert = true;
      leves++;
      if (reg.site) reg.site.connu = true;
    }
    if (leves) pris.push(`${leves} secteurs levés`);
  }

  for (const c of debout) gagnerXp(c, 'ingenierie', XP_PRATIQUE * 3);
  state.stats.sitesFouilles = (state.stats.sitesFouilles || 0) + 1;

  const resume = [pris.join(', '), cr ? `${cr} cr` : null, objets.length ? objets.join(', ') : null]
    .filter(Boolean).join(' · ') || 'rien d’exploitable';
  log({
    type: 'trouvaille',
    texte: `${def.nom} fouillé : ${resume}.`,
    important: true,
    regionId: r.i,
    detail: [def.texte],
  });
  return { ok: true, resume };
}

// ===== src/squad.js ==================================================
// Résolution des ordres, heure par heure, groupe par groupe.
//
// Un groupe porte un ordre ; chaque membre peut lui préférer une tâche à lui.
// Le tick partitionne donc les gens debout par tâche effective et résout chaque
// paquet séparément — deux qui fouillent et un qui chasse, c'est deux récoltes.


const ORDRES = {
  repos: { nom: 'Repos', desc: 'Récupération, soins, rien d’autre.', effort: 0 },
  fouille: { nom: 'Fouiller', desc: 'Ratisser la région pour tout ce qui traîne.', effort: 1 },
  mine: { nom: 'Extraire', desc: 'Minerai et métaux, à la force du poignet.', effort: 1.2 },
  chasse: { nom: 'Chasser', desc: 'Biomasse et viande, de quoi manger.', effort: 1 },
  exploration: { nom: 'Explorer', desc: 'Lever la carte alentour et repérer les sites.', effort: 0.9 },
  entrainement: { nom: 'S’entraîner', desc: 'Progresser vite, consommer des vivres.', effort: 1.1 },
  patrouille: { nom: 'Patrouiller', desc: 'Chercher l’affrontement dans le secteur.', effort: 1.1 },
  voyage: { nom: 'En route', desc: 'Déplacement vers une région.', effort: 1 },
};

/**
 * Ce qu'un ordre rapporterait ici, par heure, avant compétences.
 * Sert à l'affichage : un bouton qui ne rend rien doit le dire avant le clic,
 * pas après six heures de travail.
 */
function rendementPrevu(state, type, regionId) {
  const g = groupeActif(state);
  const rid = regionId === undefined ? (g ? g.regionId : 0) : regionId;
  const climat = conditions(state.world, state.temps);
  const r = state.world.regions[rid];
  const biome = BIOMES[r.biome];
  const filtre = FILTRES[type];
  if (filtre === undefined) return null;
  const rendements = Object.assign({}, biome.yields);
  if (type === 'chasse') {
    rendements.biomasse = Math.max(rendements.biomasse || 0, r.biome === 'relais' ? 0.05 : 0.18);
  }
  const out = {};
  let total = 0;
  for (const k of Object.keys(rendements)) {
    if (filtre && !filtre.includes(k)) continue;
    const q = rendements[k] * r.richesse * (1 - r.fouille) * climat.rendement(k);
    if (q <= 0.001) continue;
    out[k] = q;
    total += q;
  }
  return { par: out, total };
}

// ---------------------------------------------------------------------------
// Ordres
// ---------------------------------------------------------------------------

function donnerOrdre(state, ordre, groupe) {
  const g = groupe || groupeActif(state);
