        continue; // l'école est ailleurs
      }

      c.formation.restant -= 1;
      if (c.formation.restant > 0) continue;

      const key = c.formation.key;
      const maison = c.formation.maison;
      const avant = c.skills[DIPLOMES[key].skill];
      libererInstructeur(state, c);
      c.formation = null;
      accorderDiplome(c, key);
      if (log) {
        log({
          type: 'formation',
          texte: `${c.nom} ${maison ? 'achève sa formation' : 'sort diplômé'} : ${DIPLOMES[key].nom}. `
            + `${SKILLS[DIPLOMES[key].skill]} ${avant} → ${c.skills[DIPLOMES[key].skill]}, `
            + 'et apprend désormais plus vite.',
          important: true,
          regionId: g.regionId,
        });
      }
    }
  }
}

// ---------------------------------------------------------------------------
// L'école de l'avant-poste
// ---------------------------------------------------------------------------
//
// Une ville vend une formation ; chez soi, on la transmet. Il faut quelqu'un qui
// sache — un diplômé, ou simplement quelqu'un qui en sait bien plus que ce que
// l'école apprendrait —, de quoi consigner et projeter (l'antenne), et de quoi
// nourrir tout ce monde. C'est plus lent qu'une vraie école, ça ne coûte pas un
// crédit, et ça immobilise deux personnes au lieu d'une : l'élève et le maître.
//
// C'est ce qui donne un débouché au vétéran qu'on a mis six cents heures à
// former, et une raison de rentrer.

/** Ce qu'il faut savoir de plus que le diplôme pour l'enseigner sans l'avoir. */
const MARGE_INSTRUCTEUR = 15;
/** Une transmission maison est plus lente qu'une école qui ne fait que ça. */
const LENTEUR_MAISON = 1.35;
/** Rations prélevées sur l'entrepôt par heure de cours. */
const RATIONS_COURS = 0.5;

/** Quelqu'un est-il occupé — à apprendre ou à enseigner ? */
function occupeParEcole(c) {
  return !!(c && ((c.formation && c.formation.restant > 0) || c.enseigne));
}

/** Les gens présents à l'avant-poste, tous groupes confondus. */
function presentsBase(state) {
  const base = state.base;
  if (!base || !base.fonde) return [];
  const out = [];
  for (const g of groupes(state)) {
    if (g.regionId !== base.regionId) continue;
    for (const c of g.membres) if (estVivant(c)) out.push(c);
  }
  return out;
}

/** Qui peut enseigner quoi, ici et maintenant. */
function ecolesAvantPoste(state) {
  const base = state.base;
  if (!base || !base.fonde) return [];
  if ((base.batiments.antenne || 0) < 1) return [];
  const gens = presentsBase(state);
  const out = [];
  for (const k of DIPLOME_KEYS) {
    const d = DIPLOMES[k];
    const maitre = gens.find((c) => !occupeParEcole(c)
      && ((c.diplomes || []).includes(k) || comp(c, d.skill) >= d.plancher + MARGE_INSTRUCTEUR));
    if (maitre) out.push({ key: k, instructeur: maitre });
  }
  return out;
}

function peutApprendreChezSoi(state, perso, key) {
  const offre = ecolesAvantPoste(state).find((o) => o.key === key);
  if (!offre) return { ok: false, motif: 'Personne ici ne sait l’enseigner.' };
  if (offre.instructeur.id === perso.id) {
    return { ok: false, motif: 'On ne s’enseigne pas à soi-même.' };
  }
  if (!presentsBase(state).some((c) => c.id === perso.id)) {
    return { ok: false, motif: `${perso.nom} n’est pas à l’avant-poste.` };
  }
  if (occupeParEcole(perso)) return { ok: false, motif: `${perso.nom} est déjà pris.` };
  if ((perso.diplomes || []).includes(key)) {
    return { ok: false, motif: `${perso.nom} a déjà ce diplôme.` };
  }
  if (perso.skills[DIPLOMES[key].skill] >= DIPLOMES[key].plancher + 25) {
    return { ok: false, motif: `${perso.nom} en sait déjà plus que le cours.` };
  }
  return { ok: true, instructeur: offre.instructeur };
}

function enseignerChezSoi(state, perso, key, log) {
  const v = peutApprendreChezSoi(state, perso, key);
  if (!v.ok) return v;
  const heures = Math.round(DIPLOMES[key].heures * LENTEUR_MAISON);
  perso.formation = {
    key,
    colonieId: null,
    maison: true,
    instructeurId: v.instructeur.id,
    restant: heures,
    total: heures,
  };
  v.instructeur.enseigne = { key, eleveId: perso.id };
  if (log) {
    log({
      type: 'formation',
      texte: `${v.instructeur.nom} prend ${perso.nom} en formation : ${DIPLOMES[key].court.toLowerCase()}.`,
      important: true,
      regionId: state.base.regionId,
    });
  }
  return { ok: true, heures, instructeur: v.instructeur.nom };
}

/** Libère le maître quand l'élève s'arrête, quelle qu'en soit la raison. */
function libererInstructeur(state, perso) {
  if (!perso.formation || !perso.formation.instructeurId) return;
  for (const g of groupes(state)) {
    for (const c of g.membres) {
      if (c.id === perso.formation.instructeurId && c.enseigne
        && c.enseigne.eleveId === perso.id) delete c.enseigne;
    }
  }
}

const ARMES_PAR_NIVEAU = [

  ['machette', 'clous', 'verrou'],
  ['katana', 'verrou', 'smg'],
  ['katana', 'smg', 'rail', 'masse'],

const ARMURES_PAR_NIVEAU = [
  [null, null, 'cuir'],
  [null, 'cuir', 'plaque'],
  ['cuir', 'plaque', 'kevlar'],
  ['plaque', 'kevlar', 'exo'],
];

function genererBande(rng, factionKey, taille, niveauMonde = 0) {
  const def = BANDES[factionKey] || BANDES.bandits;
  const niv = Math.max(0, Math.min(3, def.niveau + niveauMonde));
  const membres = [];
  for (let i = 0; i < taille; i++) {
    const c = makeCharacter(rng, {
      archetype: rng.pick(def.archetypes),
      niveau: niv,
    });
    c.equip.arme = rng.pick(ARMES_PAR_NIVEAU[niv]);
    c.equip.armure = rng.pick(ARMURES_PAR_NIVEAU[niv]);
    c.faction = factionKey;
    membres.push(c);
  }
  return { nom: def.nom, faction: factionKey, membres, letal: def.letal };
}

// ---------------------------------------------------------------------------
// Tactiques
// ---------------------------------------------------------------------------

/**
 * Comment on se bat, décidé à l'avance et valable aussi en votre absence.
 *
 * Le combat était un dé qu'on subissait, et la mesure était accablante : dix-huit
 * tours de moyenne sur un maximum de vingt-quatre, quatre-vingt-huit pour cent
 * des affrontements finissant par une fuite, un virgule cinq ennemi à terre sur
 * trois — et **zéro mort, jamais, des deux côtés**. La dernière ligne n'était pas
 * un équilibrage prudent mais un bug de structure : `blesser` n'autorise la mort
 * que sur quelqu'un de déjà à terre, et l'on ne visait jamais quelqu'un à terre.
 * Le paramètre de létalité de chaque faction ne servait donc à rien.
 *
 * Une tactique n'est pas un bonus : c'est un pari. Chacune est excellente dans
 * une situation et mauvaise ailleurs, et la situation — le terrain, le rapport
 * de nombre, les armes qu'on porte — change à chaque rencontre. C'est ce qui
 * transforme « on subit » en « on décide », sans rien demander au joueur pendant
 * le combat lui-même : il a décidé avant, comme un vrai chef d'escouade.
 */
const TACTIQUES = {
  ligne: {
    nom: 'Tenir la ligne',
    desc: 'Rester groupés, couvrir ses angles. On encaisse mieux, on frappe moins.',
    quand: 'Quand on est en infériorité, ou qu’on a des blessés à protéger.',
    attaque: 0.82, defense: 1.45, initiative: 1, moral: 1.4,
    terrains: {}, nombre: 0, acharnement: 0.5, rompre: 1,
  },
  charge: {
    nom: 'Charger',
    desc: 'Fondre dessus avant qu’ils s’organisent. Le premier échange décide.',
    quand: 'Quand on est plus forts, et en terrain ouvert.',
    attaque: 1.28, defense: 0.6, initiative: 1.7, moral: 0.9,
    terrains: { steppe: 1.15, dalles: 1.1, desert: 1.05, marais: 0.75, canyons: 0.8, plastique: 0.8 },
    nombre: 0.15, acharnement: 1.4, rompre: 0.7,
  },
  feu: {
    nom: 'Tenir à distance',
    desc: 'Les arrêter avant qu’ils arrivent. Décisif en terrain découvert, inutile dans les cassures.',
    quand: 'Quand on a des armes à feu et de l’espace devant soi.',
    attaque: 1, defense: 1.1, initiative: 1.5, moral: 1,
    terrains: { steppe: 1.3, desert: 1.25, dalles: 1.1, plastique: 0.85, marais: 0.6, canyons: 0.65, friche: 0.9 },
    nombre: 0, tir: 1.6, acharnement: 0.8, rompre: 1.1,
  },
  encerclement: {
    nom: 'Envelopper',
    desc: 'Les prendre de trois côtés. Ne vaut que si l’on est plus nombreux.',
    quand: 'Quand on a le nombre pour soi. Sinon on se disperse pour rien.',
    attaque: 1.12, defense: 0.92, initiative: 1, moral: 1.1,
    terrains: { steppe: 1.1, dalles: 1.05, canyons: 0.75, marais: 0.85 },
    nombre: 0.6, acharnement: 1.1, rompre: 1.4,
  },
  harcelement: {
    nom: 'Harceler',
    desc: 'Frapper et se replier, sans jamais s’engager. On ne gagne pas, on survit.',
    quand: 'Quand on ne peut pas gagner, et qu’on veut partir avec le sac plein.',
    attaque: 0.6, defense: 1.5, initiative: 1, moral: 1.2,
    terrains: { marais: 1.3, canyons: 1.25, friche: 1.2, plastique: 1.15, steppe: 0.8, desert: 0.75 },
    nombre: -0.1, furtif: 1, acharnement: 0.25, rompre: 2.4,
  },
};

const TACTIQUE_KEYS = Object.keys(TACTIQUES);

/**
 * Ce que la tactique vaut ici, contre ceux-là. Un pari, pas un bonus.
 *
 * `partTir` est la part de l'escouade qui porte une arme à feu : tenir à
 * distance avec des machettes n'est pas tenir à distance. Sans ce facteur, la
 * tactique de tir était la meilleure du jeu même en mêlée pure, parce que son
 * bonus de terrain s'appliquait à tout le monde.
 */
function rendementTactique(key, biome, ratioNombre, partTir = 0.5) {
  const t = TACTIQUES[key] || TACTIQUES.ligne;
  const terrain = (t.terrains && t.terrains[biome]) || 1;
  // Le nombre : au-delà de un pour un, l'enveloppement paie ; en dessous, il
  // coûte. Les autres tactiques y sont presque indifférentes.
  const nombre = 1 + (ratioNombre - 1) * (t.nombre || 0);
  // Une tactique qui suppose des armes qu'on n'a pas ne vaut rien.
  const armement = t.tir ? 0.55 + partTir * 0.75 : 1;
  return Math.max(0.35, terrain * nombre * armement);
}

/** Ce qu'on peut dire d'une tactique avant de la choisir, ici et maintenant. */
function apercuTactique(key, biome, ratioNombre, partTir = 0.5) {
  const v = rendementTactique(key, biome, ratioNombre, partTir);
  if (v >= 1.15) return { v, mot: 'bien vu ici', cls: 'ok' };
  if (v >= 0.95) return { v, mot: 'convenable', cls: 'att' };
  return { v, mot: 'mauvais choix ici', cls: 'mal' };
}

// ---------------------------------------------------------------------------
// Combat
// ---------------------------------------------------------------------------

/**
 * Ce que pèse un coup, en face de ce que pèse un corps.
 *
 * C'est le chiffre qui manquait. Une machette rend une dizaine de points nets,
 * un corps en compte deux cent quarante-sept : il fallait vingt-sept coups au
 * but pour abattre quelqu'un, soit un affrontement de dix-huit tours où
 * personne ne tombait jamais. Toute la platitude du combat tenait là — pas dans
 * les règles, dans l'échelle. On mord deux fois plus fort, et un échange
 * commence à vouloir dire quelque chose.
 *
 * Les armes gardent leurs valeurs : elles servent aussi à évaluer un butin et à
 * fixer un prix, et les rééchelonner une à une aurait déplacé toute l'économie
 * pour une raison qui ne la concerne pas.
 */
const MORDANT = 2.3;

function armeDe(c) {
  return (c.equip.arme && ITEMS[c.equip.arme]) || { degats: 4, pen: 0, portee: 'melee', comp: 'melee' };
}

function scoreAttaque(c, arme, bonus) {
  const skill = arme.comp === 'tir' ? 'tir' : 'melee';
  const base = comp(c, skill);
  const dex = comp(c, 'endurance') * 0.15;
  return base + dex + (bonus || 0);
}

function scoreDefense(c) {
  return comp(c, 'melee') * 0.35 + comp(c, 'endurance') * 0.35 + comp(c, 'furtivite') * 0.2 + 8;
}

function ciblesValides(camp) {
  return camp.filter((c) => estDebout(c));
}

function forceCamp(camp) {
  let f = 0;
  for (const c of camp) {
    if (!estDebout(c)) continue;
    const a = armeDe(c);
    f += (comp(c, a.comp === 'tir' ? 'tir' : 'melee') + a.degats * 2 + armureTotale(c)) * pvTotal(c).pct;
  }
  return f;
}

/** Ceux qui sont à terre mais encore en vie : on peut les achever. */
function aTerre(camp) {
  return camp.filter((c) => estVivant(c) && !estDebout(c));
}

/**
 * Résout un affrontement entre deux camps de personnages.
 *
 * ctx : {
 *   rng, biome, posture, bonusDegats, bonusArmure,
 *   tactique          clé de TACTIQUES pour le camp A
 *   letalA, letalB    disposition de chaque camp à achever un homme à terre
 *   cohA              rendement de cohésion du camp A, défaut 1
 *   viserChefs        le camp A vise le plus dangereux plutôt que le plus faible
 * }
 *
 * Retourne { vainqueur, tours, journal, koA, koB, mortsA, mortsB, deroute }
 */
function resoudreCombat(campA, campB, ctx) {
  const rng = ctx.rng;
  const journal = [];
  const posture = ctx.posture || { degats: 1, fuite: 0.3 };
  const biome = BIOMES[ctx.biome];
  const couvert = biome ? (biome.cout > 5 ? 0.12 : 0.04) : 0.06;

  const tac = TACTIQUES[ctx.tactique] || TACTIQUES.ligne;
  const nA = ciblesValides(campA).length || 1;
  const nB = ciblesValides(campB).length || 1;
  const armes = ciblesValides(campA).filter((c) => armeDe(c).comp === 'tir').length;
  const rendu = rendementTactique(ctx.tactique, ctx.biome, nA / nB, armes / nA);

  let tours = 0;
  let fuite = null;
  // Douze tours au lieu de vingt-quatre. La mesure disait dix-huit tours de
  // moyenne : un affrontement qui dure une demi-journée n'est pas un combat,
  // c'est une usure, et le joueur n'y lit rien. On raccourcit et on rend chaque
  // échange plus lourd.
  const maxTours = 12;

  const f0A = forceCamp(campA);
  const f0B = forceCamp(campB);

  while (tours < maxTours) {
    tours++;
    const vivA = ciblesValides(campA);
    const vivB = ciblesValides(campB);
    if (!vivA.length || !vivB.length) break;

    // Rompre le combat. Ce n'était qu'un dé sur le rapport de force ; c'est
    // maintenant une affaire de moral, que la tactique tient ou non. Tenir la
    // ligne fait rester des gens qui auraient fui, harceler fait décrocher au
    // premier accroc — et c'est précisément ce qu'on leur demande.
    const ratioA = forceCamp(campA) / Math.max(1, f0A);
    const ratioB = forceCamp(campB) / Math.max(1, f0B);
    const tenueA = tac.moral * (ctx.cohA || 1);
    if (tours > 1 && ratioA < 0.5 * tac.rompre
        && rng.chance(posture.fuite * tac.rompre / tenueA)) {
      // Décrocher en bon ordre ou se faire disperser : la différence tient à la
      // tactique et à ce qui tient encore debout. Harceler, c'est se dégager
      // sans laisser personne — et ce n'est pas une défaite, c'est le but de la
      // manœuvre. Sans cette distinction, la tactique du faible était
      // simplement la tactique du perdant : zéro victoire et le sac pillé.
      const ordonne = tac.rompre > 2
        && ciblesValides(campA).length >= Math.ceil(campA.length / 2);
      fuite = ordonne ? 'degage' : 'A';
      break;
    }
    // Eux aussi ont un moral, et il casse d'autant plus vite qu'ils voient
    // tomber les leurs. Une bande à moitié à terre ne reste pas.
    const debout = vivB.length;
    const total = campB.length || 1;
    const casse = 0.16 + (1 - debout / total) * 0.5 + (1 - ratioB) * 0.35;
    if (tours > 1 && ratioB < 0.62 && rng.chance(casse)) { fuite = 'B'; break; }

    const ordre = rng.shuffle(
      vivA.map((c) => ({ c, camp: 'A' })).concat(vivB.map((c) => ({ c, camp: 'B' })))
    );

    for (const acteur of ordre) {
      const c = acteur.c;
      if (!estDebout(c)) continue;
      const nous = acteur.camp === 'A';
      const campAdverse = nous ? campB : campA;
      const adverses = ciblesValides(campAdverse);

      // Achever un homme à terre. C'était impossible — `blesser` ne tue que
      // quelqu'un de déjà au sol, et l'on ne visait jamais le sol : la létalité
      // de chaque faction ne servait donc strictement à rien, et personne n'est
      // jamais mort au combat de toute l'histoire du projet. C'est ici que la
      // consigne « achever les ennemis à terre » devient une vraie décision, et
      // ici que l'Essaim devient ce qu'il prétend être.
      // La disposition d'une faction est une inclinaison, pas une cadence :
      // testée à chaque tour et pour chaque combattant, elle vaut bien plus que
      // sa valeur nominale. Un cinquième, et un homme à terre dans un combat
      // qu'on gagne s'en sort presque toujours ; dans un combat qu'on perd,
      // presque jamais. C'est ce qui rend une défaite grave sans rendre chaque
      // égratignure mortelle.
      const disposition = (nous ? (ctx.letalA || 0) : (ctx.letalB || 0)) * 0.2
        * (nous ? tac.acharnement : 1);
      const sol = aTerre(campAdverse);
      if (sol.length && rng.chance(disposition * (adverses.length ? 0.5 : 1))) {
        const victime = rng.pick(sol);
        victime.etat = 'mort';
        c.kills++;
        c.horsCombat = (c.horsCombat || 0) + 1;
        journal.push({ t: 'mort', txt: `${c.nom} achève ${victime.nom} au sol.` });
        continue;
      }
      if (!adverses.length) break;

      const arme = armeDe(c);
      const bonusD = acteur.camp === 'A' ? (ctx.bonusDegats || 0) : 0;
      const bonusArm = acteur.camp === 'A' ? (ctx.bonusArmure || 0) : 0;
      const coups = arme.rafale || 1;

      for (let k = 0; k < coups; k++) {
        const cibles2 = ciblesValides(acteur.camp === 'A' ? campB : campA);
        if (!cibles2.length) break;
        // On vise de préférence le plus amoché : la simulation est cruelle.
        // Sauf consigne contraire — viser les chefs coûte cher et casse leur
        // moral plus vite, parce qu'une bande qui perd son plus dangereux ne
        // reste pas longtemps.
        const chefs = nous && ctx.viserChefs;
        const cible = chefs
          ? cibles2.reduce((a, b) => (forceCamp([a]) >= forceCamp([b]) ? a : b))
          : rng.chance(0.55)
            ? cibles2.reduce((a, b) => (pvTotal(a).pct <= pvTotal(b).pct ? a : b))
            : rng.pick(cibles2);

        // La tactique porte sur l'attaque et la défense, et le premier échange
        // pèse ce que la tactique en fait : une charge décide au contact, un
        // tir décide avant, une ligne ne décide rien et c'est son propos.
        const mult = nous ? tac.attaque * rendu : 1;
        const elan = nous && tours === 1 ? tac.initiative : 1;
        const garde = nous ? 1 : tac.defense * (0.55 + 0.45 * rendu);
        // Une tactique de tir ne vaut que pour ceux qui ont de quoi tirer.
        const arme2 = nous && tac.tir && arme.comp === 'tir' ? tac.tir : 1;
        const att = scoreAttaque(c, arme, nous ? bonusD * 20 : 0) * mult * elan * arme2;
        const def = scoreDefense(cible) * (1 + couvert) * garde
          * (nous ? 1 : (tac.furtif ? 1.15 : 1));
        const p = Math.max(0.08, Math.min(0.94, 0.5 + (att - def) / (att + def + 30)));
        if (!rng.chance(p)) {
          if (rng.chance(0.25)) {
            journal.push({ t: 'rate', txt: `${c.nom} manque ${cible.nom}.` });
          }
          continue;
        }

        const membre = tirerMembre(rng);
        const arm = armureTotale(cible, nous ? 0 : bonusArm);
        // Le rendement de la tactique — le terrain, le rapport de nombre —
        // porte aussi sur ce qu'un coup fait. Réservé à la chance de toucher,
        // il ne servait à rien : à quatre contre trois on touche déjà presque à
        // coup sûr, la probabilité est plafonnée à 0,94, et envelopper à deux
        // contre un ne changeait donc strictement rien. C'est là que la
        // situation doit payer, ou coûter.
        const brut = arme.degats * MORDANT
          * (nous ? Math.pow(rendu, 0.9) : 1)
          * (nous && tours === 1 ? tac.initiative * 0.7 + 0.3 : 1)
          * rng.range(0.75, 1.3)
          * (1 + comp(c, 'force') / 260)
          * (nous ? posture.degats * (1 + bonusD) : 1);
        // L'armure réduit fortement mais ne rend jamais invulnérable : sinon un
        // groupe blindé devient impossible à entamer avec de l'équipement de départ.
        // Une formation serrée n'esquive pas seulement : elle encaisse de biais,
        // pare, et prend les coups sur l'épaule. Sans ça, la garde ne jouait que
        // sur la fréquence des touches et charger dominait partout — cent pour
        // cent de victoires dans tous les cas de figure mesurés, y compris ceux
        // où la tactique était censée être un mauvais choix.
        const absorbe = arm * (1 - arme.pen) * 0.6;
        // Une bande qui se connaît couvre ses angles ; une foule se gêne. La
        // cohésion ne joue que pour le joueur : une bande de pillards n'a pas
        // d'histoire commune à faire valoir.
        const coh = nous ? (ctx.cohA || 1) : 1;
        // La garde joue deux fois, comme l'attaque : sur la fréquence des
        // touches, et sur ce qu'un coup laisse passer. Trois fois — en ajoutant
        // l'armure — et tenir la ligne dominait à son tour. Une tactique doit
        // avoir un revers, pas seulement un avers.
        const encaisse = nous ? 1 : 1 + (tac.defense - 1) * 0.55;
        const net = Math.max(1.5, (brut * coh) / encaisse - absorbe * rng.range(0.5, 1.0));

        // La létalité tient à qui frappe *et* à qui encaisse. Un corps aguerri
        // encaisse un coup qui aurait tué un bleu — c'est le seul endroit du
        // jeu où survivre longtemps finit par payer.
        // Un coup porté ne tue pas quelqu'un qui tient debout : il le met à
        // terre. Mourir se décide au sol, plus haut.
        const res = blesser(cible, net, membre, rng, { letal: false });

        // Se battre forme vite : c'est cher payé, mais ça forme.
        gagnerXp(c, arme.comp === 'tir' ? 'tir' : 'melee', XP_PRATIQUE * 1.2 + net * 0.4);
        gagnerXp(cible, 'endurance', XP_PRATIQUE * 0.6 + net * 0.2);

        if (res.mort) {
          c.kills++;
          c.horsCombat = (c.horsCombat || 0) + 1;
          journal.push({ t: 'mort', txt: `${c.nom} abat ${cible.nom}.` });
        } else if (res.membrePerdu) {
          journal.push({ t: 'membre', txt: `${cible.nom} perd un membre (${membre}).` });
        } else if (res.ko) {
          // Une mise hors de combat est une victoire. Ne compter que les morts
          // laissait tout le monde à zéro — les ennemis tombent K.O. bien plus
          // souvent qu'ils ne meurent — et rendait inatteignable le seuil qui
          // donne un surnom.
          c.horsCombat = (c.horsCombat || 0) + 1;
          journal.push({ t: 'ko', txt: `${cible.nom} s’écroule sous les coups de ${c.nom}.` });
        } else if (journal.length < 40) {
          journal.push({ t: 'coup', txt: `${c.nom} touche ${cible.nom} (${Math.round(net)}).` });
        }
      }
    }
  }

  const deboutA = ciblesValides(campA).length;
  const deboutB = ciblesValides(campB).length;
  let vainqueur = 'nul';
  if (fuite === 'degage') vainqueur = 'nul';
  else if (fuite === 'A') vainqueur = 'B';
  else if (fuite === 'B') vainqueur = 'A';
  else if (deboutA && !deboutB) vainqueur = 'A';
  else if (deboutB && !deboutA) vainqueur = 'B';

  return {
    vainqueur,
    tours,
    fuite,
    // Qui a rompu, et donc laissé des gens sur le terrain. C'est de là que
    // viennent les prisonniers.
    deroute: fuite,
    tactique: ctx.tactique || 'ligne',
    rendu,
    journal,
    koA: campA.filter((c) => c.etat === 'ko').length,
    koB: campB.filter((c) => c.etat === 'ko').length,
    mortsA: campA.filter((c) => c.etat === 'mort').length,
    mortsB: campB.filter((c) => c.etat === 'mort').length,
    survivantsB: campB.filter((c) => estVivant(c)).length,
  };
}

/** Butin ramassé sur une bande vaincue. */
function butin(bande, rng) {
  const loot = {};
  const objets = [];
  let credits = 0;
  for (const m of bande.membres) {
    if (estDebout(m)) continue; // on ne dépouille pas ceux qui tiennent debout
    credits += rng.irange(4, 40);
    const add = (k, n) => { loot[k] = (loot[k] || 0) + n; };
    add('ferraille', rng.irange(1, 5));
    if (rng.chance(0.35)) add('rations', rng.irange(1, 3));
    if (rng.chance(0.2)) add('composant', rng.irange(1, 2));
    if (rng.chance(0.12)) add('medkit', 1);
    if (m.equip.arme && rng.chance(0.4)) objets.push(m.equip.arme);
    if (m.equip.armure && rng.chance(0.3)) objets.push(m.equip.armure);
  }
  return { loot, objets, credits };
}

// ===== src/economy.js ================================================
// Économie locale : chaque colonie produit, consomme, et fixe ses prix à partir
// de son propre stock. Une ville affamée paie les rations au prix fort ; une
// ville assise sur une mine brade son minerai.


/** Stock « confortable » visé par une colonie pour une marchandise. */
function cibleStock(col, key) {
  const p = col.pop;
  switch (key) {
    case 'rations': return p * 0.9;
    case 'biomasse': return p * 0.5;
    case 'ferraille': return p * 0.7;
    case 'minerai': return p * 0.4;
    case 'polymere': return p * 0.35;
    case 'carburant': return p * 0.2;
    case 'alliage': return p * 0.15;
    case 'isotope': return p * 0.06;
    case 'composant': return p * 0.08;
    case 'medkit': return p * 0.03;
    default: return p * 0.3;
  }
}

/** Prix unitaire courant, tiré de la tension offre/demande. */
function prixUnitaire(col, key) {
  const base = COMMODITIES[key].prix;
  const cible = Math.max(1, cibleStock(col, key));
  const stock = Math.max(0, col.stock[key] || 0);
  // Rapport stock/cible → facteur borné [0.45, 3.2]
  const tension = cible / (stock + cible * 0.35);
  const f = Math.max(0.45, Math.min(3.2, Math.pow(tension, 0.85)));
  return base * f * (1 + col.unrest * 0.35);
}

/**
 * Prix effectifs pour le joueur.
 * `habilete` : compétence de commerce du meilleur négociateur (0-100).
 * `repu`     : réputation avec la faction propriétaire (−100..100).
 */
function prixJoueur(col, key, habilete = 0, repu = 0, remise = 0) {
  const p = prixUnitaire(col, key);
  // La marge n'est pas une constante du monde : c'est celle d'un homme, avec
  // son caractère, son métier et ce qu'il pense de vous.
  const marge = Math.max(0.02,
    0.18 + margeMarchand(col) - habilete / 900 - Math.max(0, repu) / 1400 - remise);
  const majorationHostile = repu < -20 ? 0.15 + Math.min(0.4, -repu / 220) : 0;
  // Non arrondi volontairement : arrondir à l'unité écraserait la marge sur les
  // marchandises bon marché et rendrait l'aller-retour achat/revente gratuit.
  return {
    achat: Math.max(0.5, p * (1 + marge + majorationHostile)),
    vente: Math.max(0.25, p * (1 - marge - majorationHostile * 0.5)),
  };
}

/**
 * Fertilité agricole du biome. Une ville ne se contente pas de ramasser ce que
 * le terrain offre : elle cultive. Sans ça, aucune colonie n'est à l'équilibre
 * alimentaire et la carte se vide toute seule en quelques saisons.
 */
const FERTILITE = {
  marais: 1.45, steppe: 1.15, dalles: 0.95, canyons: 0.8,
  plastique: 0.75, friche: 0.7, desert: 0.65, brulees: 0.6, relais: 0.5,
};

// ---------------------------------------------------------------------------
// Métiers d'une ville
// ---------------------------------------------------------------------------

/** Combien de gens travaillent ici. Le reste mange sans produire. */
function actifs(col) {
  return Math.max(1, Math.round(col.pop * PART_ACTIVE));
}

/**
 * Répartition initiale : la vocation du biome, corrigée par le tempérament de
 * la faction. Une ville des canyons fait des mineurs, une commune des marais
 * des paysans, une garnison des miliciens.
 */
function emploisInitiaux(world, col, rng) {
  const biome = world.regions[col.regionId].biome;
  const style = col.faction && FACTIONS[col.faction] ? FACTIONS[col.faction].style : null;
  const poids = {};
  // Tout le monde a un peu de tout — mais pas la même part de tout : voir
  // POIDS_BASE, et la mesure qui l'a rendu nécessaire.
  for (const k of METIER_VILLE_KEYS) poids[k] = POIDS_BASE[k] ?? 0.35;
  const voc = VOCATION_BIOME[biome] || {};
  for (const k of Object.keys(voc)) poids[k] += voc[k];
  const st = (style && VOCATION_STYLE[style]) || {};
  for (const k of Object.keys(st)) poids[k] += st[k];
  // Un peu de bruit : deux villes du même biome ne se ressemblent pas trait
  // pour trait.
  if (rng) for (const k of METIER_VILLE_KEYS) poids[k] *= rng.range(0.8, 1.2);
  return repartir(poids, actifs(col));
}

/** Convertit des poids en effectifs entiers dont la somme vaut `total`. */
function repartir(poids, total) {
  let somme = 0;
  for (const k of METIER_VILLE_KEYS) somme += poids[k];
  const out = {};
  let place = 0;
  for (const k of METIER_VILLE_KEYS) {
    out[k] = Math.floor((poids[k] / somme) * total);
    place += out[k];
  }
  // Le reste va au métier le plus lourd : arrondir vers le bas partout perdrait
  // jusqu'à six personnes par ville.
  let meilleur = METIER_VILLE_KEYS[0];
  for (const k of METIER_VILLE_KEYS) if (poids[k] > poids[meilleur]) meilleur = k;
  out[meilleur] += total - place;
  return out;
}

/** Effectif d'un métier, borné : une ville qui a fondu réaffecte ses gens. */
function emploi(col, key) {
  return Math.max(0, Math.round((col.emplois && col.emplois[key]) || 0));
}

/**
 * La main-d'œuvre se redéploie lentement vers ce qui manque. Une ville qui a
 * faim met des bras aux cultures ; une ville en guerre arme les siens. C'est
 * lent à dessein — on ne reconvertit pas un mineur en paysan en une nuit.
 */
/** Période de reconversion, en heures de jeu. */
const PERIODE_EMPLOIS = 24;

function ajusterEmplois(world, col, rng, dt = 1) {
  if (!col.emplois) { col.emplois = emploisInitiaux(world, col, rng); col.majEmplois = 0; }
  // Une reconversion se compte en semaines : la recalculer à chaque tranche de
  // colonie coûterait huit fois plus cher pour un résultat identique.
  //
  // On compte des heures, pas des appels. Depuis que les villes lointaines
  // avancent par demi-journées (voir PAS_LOIN), compter les appels revenait à
  // reconvertir quatre fois plus lentement là-bas qu'ici — le niveau de détail
  // n'a pas à changer le comportement social d'une ville.
  col.majEmplois = (col.majEmplois || 0) + dt;
  if (col.majEmplois < PERIODE_EMPLOIS) return;
  const pas = col.majEmplois;
  col.majEmplois = 0;
  const cible = actifs(col);
  let total = 0;
  for (const k of METIER_VILLE_KEYS) total += emploi(col, k);
  if (total <= 0) { col.emplois = emploisInitiaux(world, col, rng); return; }

  // La population a bougé : on met à l'échelle avant toute chose.
  if (Math.abs(total - cible) > Math.max(2, cible * 0.04)) {
    const f = cible / total;
    for (const k of METIER_VILLE_KEYS) col.emplois[k] = Math.round(emploi(col, k) * f);
    total = cible;
  }

  // Puis on déplace quelques bras vers ce qui presse.
  const vivres = col.stock.rations || 0;
  const faim = vivres < col.pop * 0.6;
  const menace = (col.assiege || col.declin > 0.3) ? true : false;
  const versQuoi = faim ? 'paysan' : menace ? 'milicien' : null;
  if (!versQuoi) return;
  const bougent = Math.max(1, Math.round(cible * 0.004 * pas));
  // On prend chez le plus gros métier qui n'est pas la cible.
  let source = null;
  for (const k of METIER_VILLE_KEYS) {
    if (k === versQuoi) continue;
    if (!source || emploi(col, k) > emploi(col, source)) source = k;
  }
  if (!source || emploi(col, source) <= bougent) return;
  col.emplois[source] = emploi(col, source) - bougent;
  col.emplois[versQuoi] = emploi(col, versQuoi) + bougent;
}

/**
 * Production horaire d'une colonie, dérivée de qui y travaille. Deux villes de
 * même taille dans le même biome ne rendent plus la même chose si l'une a mis
 * ses bras aux cultures et l'autre à la mine.
 */
function productionColonie(world, col) {
  const biomeKey = world.regions[col.regionId].biome;
  const biome = BIOMES[biomeKey];
  const richesse = world.regions[col.regionId].richesse;
  const prod = {};
  if (!col.emplois) col.emplois = emploisInitiaux(world, col, null);

  // Chaque ressource du biome revient au métier qui la tire : le minerai aux
  // mineurs, le vivant aux paysans, tout le reste — ferraille, polymère,
  // carburant, isotope — à ceux qui démontent.
  //
  // Le coefficient par tête est calibré, pas deviné : à l'ancienne formule la
  // production tenait à `pop × 0.012`, et un actif représente un peu moins d'un
  // dixième d'une population. Le sous-estimer d'un facteur vingt — ce qui était
  // le cas au premier jet — assèche les trésors des factions, qui ne lèvent plus
  // d'armées, et fige la carte politique.
  const PAR_TETE = 0.115 * richesse;
  for (const k of Object.keys(biome.yields)) {
    const gens = k === 'minerai' ? emploi(col, 'mineur')
      : k === 'biomasse' ? emploi(col, 'paysan')
        : emploi(col, 'ferrailleur');
    prod[k] = (prod[k] || 0) + biome.yields[k] * gens * PAR_TETE;
  }

  // Les paysans cultivent en plus de ce qu'ils cueillent : c'est la fertilité du
  // sol qui décide combien, et c'est ce qui met une ville à l'équilibre.
  //
  // Les deux coefficients sortent d'un balayage, pas d'une intuition : ils
  // fixent à la fois le ratio vivres du monde (~1,3, le point où les villes
  // tiennent sans proliférer) et, indirectement, les trésors des factions —
  // trop peu, elles ne lèvent plus d'armées et la carte politique se fige.
  const paysans = emploi(col, 'paysan');
  prod.biomasse = (prod.biomasse || 0) + paysans * 0.02 * (FERTILITE[biomeKey] ?? 1);
  const enRations = Math.min(prod.biomasse, paysans * 0.075);
  prod.rations = (prod.rations || 0) + enRations * 0.85;
  prod.biomasse = Math.max(0, prod.biomasse - enRations);

  // Les artisans transforment. Sans eux, une ville reste un tas de minerai.
  const art = emploi(col, 'artisan');
  if (art > 0) {
    prod.alliage = (prod.alliage || 0) + Math.min(prod.minerai || 0, art * 0.06) * 0.5;
    prod.composant = (prod.composant || 0) + art * 0.0114;
  }
  const med = emploi(col, 'medecin');
  if (med > 0) prod.medkit = (prod.medkit || 0) + med * 0.0015;

  // Le contremaître de la ville, s'il y en a un, fait la différence entre une
  // production qui tourne et une qui traîne.
  const boost = rendementNotables(col);
  if (boost !== 1) for (const k of Object.keys(prod)) prod[k] *= boost;
  return prod;
}

/**
 * Une ville qui manque se rationne avant de mourir. Sans cette élasticité,
 * une mauvaise saison suffit à vider la carte de ses habitants.
 */
/**
 * Ce que les cantiniers font gagner. Servir cinq cents repas à heure fixe, c'est
 * moins de gâchis qu'autant de foyers qui cuisinent chacun pour soi : jusqu'à
 * un cinquième de vivres en moins pour le même nombre de bouches.
 */
function economieCantine(col) {
  const n = emploi(col, 'cantinier');
  if (n <= 0) return 1;
  return 1 - Math.min(0.2, (n / Math.max(1, actifs(col))) * 1.6);
}

function consommationColonie(col) {
  const vivres = col.stock.rations || 0;
  const confort = Math.max(1, col.pop * 0.9);
  const serrage = Math.max(0.45, Math.min(1, 0.45 + (vivres / confort) * 0.9));
  const cantine = economieCantine(col);
  return {
    rations: col.pop * 0.014 * serrage * cantine,
    // On garde le coefficient sous la main : tickColonie en a besoin lui aussi
    // et le recalculer coûterait un deuxième passage sur les métiers.
    cantine,
    biomasse: col.pop * 0.006 * serrage,
    carburant: col.pop * 0.0022 * col.taille * serrage,
    ferraille: col.pop * 0.004,
    composant: col.pop * 0.00018 * col.taille,
    medkit: col.pop * 0.00006,
  };
}

/** Une ville morte ne produit plus, ne commerce plus, ne recrute plus. */
function estVivante(col) {
  return !!col && !col.ruine;
}

/**
 * Une heure de vie économique et sociale pour une colonie.
 * `climat` module les rendements : une saison sèche ne nourrit pas une ville
 * comme une saison de pluies.
 */
function tickColonie(world, col, rng, climat, dt = 1, reputation = 0, log = null, t = 0, present = false) {
  if (col.ruine) return null;
  ajusterEmplois(world, col, rng, dt);
  pourvoirCharges(col, rng, t);
  tickNotables(col, rng, dt, reputation, log, t);
  tickServices(col, rng, dt, t, present);
  const prod = productionColonie(world, col);
  const cons = consommationColonie(col);
  // `dt` : nombre d'heures couvertes par cet appel. Une économie de colonie n'a
  // aucun besoin d'une résolution horaire ; la traiter par tranches divise le
  // coût du tick sans que rien ne se voie en jeu. Une probabilité horaire p
  // devient 1-(1-p)^dt sur la tranche, pas p×dt : la différence compte dès que
  // p n'est plus minuscule.
  const surDt = (p) => (dt === 1 ? p : 1 - Math.pow(1 - p, dt));

  for (const k of COMMODITY_KEYS) {
    if (k === 'rations') continue; // traité à part, c'est la survie
    // Une ville encaisse mieux les saisons qu'une escouade : elle a des
    // réserves, des serres, des habitudes. On amortit donc l'effet de moitié.
    const brut = climat ? climat.rendement(k) : 1;
    const amorti = 1 + (brut - 1) * 0.45;
    const p = (prod[k] || 0) * amorti * dt;
    const c = (cons[k] || 0) * dt;
    col.stock[k] = Math.max(0, (col.stock[k] || 0) + p - c);
  }

  // --- Vivres. On sert ce qu'on peut ; la satiété commande tout le reste.
  const amortiVivant = climat ? 1 + (climat.rendement('rations') - 1) * 0.45 : 1;
  const arrivage = (prod.rations || 0) * amortiVivant * dt;
  const besoin = col.pop * 0.014 * (cons.cantine || 1) * dt;
  const disponible = (col.stock.rations || 0) + arrivage;
  const servi = Math.min(besoin, disponible);
  col.stock.rations = Math.max(0, disponible - servi);
  const satiete = besoin > 0 ? servi / besoin : 1;

  // Surextension : une faction qui tient trop de villes, trop loin de sa
  // capitale, les tient mal. C'est le frein qui empêche un vainqueur d'avaler
  // la carte entière.
  if (col.faction && world.factions[col.faction]) {
    const f = world.factions[col.faction];
    const cap = f.capitale && world.colonies.find((c) => c.id === f.capitale);
    const eloignement = cap ? distanceCases(world, cap.regionId, col.regionId) : 0;
    const surcharge = Math.max(0, f.colonies.length - 3);
    const tension = (eloignement * 0.00016 + surcharge * 0.00035) * dt;
    if (tension > 0) col.unrest = Math.min(1, col.unrest + tension);
  }

  if (satiete < 0.8) {
    // On se serre la ceinture, puis on s'énerve, puis on s'en va.
    col.unrest = Math.min(1, col.unrest + 0.004 * (0.8 - satiete) / 0.8 * dt);
    if (rng.chance(surDt(0.05 * (0.8 - satiete) / 0.8))) {
      col.pop = Math.max(25, col.pop - rng.irange(1, 3));
    }
  } else {
    // Le chef de la ville pèse sur ce que l'agitation retombe ou non : un dur
    // tient sa place, un bonhomme la laisse filer.
    col.unrest = Math.max(0, col.unrest - (0.0035 + ordreDe(col) * 0.006) * dt);
    // La croissance suit l'abondance, pas le hasard seul.
    const abondance = Math.min(1, (col.stock.rations || 0) / Math.max(1, col.pop * 0.6));
    if (rng.chance(surDt(0.03 + abondance * 0.05))) col.pop += rng.irange(0, 2);
  }
  col.pop = Math.min(col.taille * 900, col.pop);

  // Reconstruction de la défense
  // Les ouvriers montent et remontent les murs. Sans eux une ville qui a pris
  // un assaut reste éventrée : la défense repoussait, jamais la muraille.
  const ouvriers = emploi(col, 'ouvrier');
  if (ouvriers > 0 && col.murs < col.taille * 6) {
    col.murs += Math.min(0.02, (ouvriers / Math.max(1, actifs(col))) * 0.09) * dt;
  }

  if (col.defense < col.defenseMax) {
    // Une ville agitée (unrest > 1) voit sa garnison fondre : le terme devient
    // négatif, et il faut donc borner des deux côtés. Sans le plancher, une
    // tranche de douze heures pouvait faire passer la défense sous zéro — ce
    // qui ne s'était jamais vu tant que les tranches faisaient trois heures.
    col.defense = Math.max(0, Math.min(
      col.defenseMax,
      col.defense + col.defenseMax * 0.004 * (1 + ouvriers / Math.max(1, actifs(col)) * 1.2)
        * (1 - col.unrest) * dt
    ));
  }
  col.defenseMax = Math.round(col.pop * 0.09 + col.murs * 12);

  // Plafond de stock : on ne stocke pas l'infini
  for (const k of COMMODITY_KEYS) {
    const plafond = cibleStock(col, k) * 4;
    if (col.stock[k] > plafond) col.stock[k] = plafond;
  }

  // --- Une ville n'est pas un décor : elle grandit ou elle meurt. Mais
  // l'effondrement doit rester un événement marquant, pas la norme : il faut
  // une agonie longue et profonde, et le monde garde toujours un socle de
  // villes vivantes.
  col.declin = col.declin || 0;
  if (col.pop < 55 && col.unrest > 0.75) col.declin += dt;
  else col.declin = Math.max(0, col.declin - 4 * dt);

  // Sécession : une ville occupée, affamée et exaspérée retourne à sa maison
  // d'origine — quitte à la ressusciter. C'est le contre-pouvoir qui empêche
  // la carte de finir en monoculture.
  if (col.factionOrigine && col.faction && col.faction !== col.factionOrigine
      && col.unrest > 0.6 && rng.chance(surDt(0.0012 * (col.unrest - 0.6) / 0.4))
      && world.factions[col.faction].colonies.length > 1) {
    return { evenement: 'secession' };
  }

  // Révolte. Une ville qui gronde à quatre-vingts pour cent n'avait aucune
  // issue : elle mijotait indéfiniment, et l'impôt confiscatoire ou la justice
  // expéditive ne coûtaient rien de plus qu'un chiffre qui montait. Au-delà de
  // ce qu'une population supporte, elle se lève — et c'est la garnison qui
  // décide de la suite, pas un dé.
  //
  // Le seuil et le délai sont hauts, et ce n'est pas de la prudence : dans ce
  // monde, la grogne moyenne est de 0,57 et une trentaine de villes campent
  // au-dessus de 0,78 en permanence. Réglée à 0,78 sans délai, l'émeute
  // remplissait cent vingt lignes du journal sur quatre cents. Une révolte doit
  // rester un événement ; celle qu'on lit trois fois par jour n'en est plus un.
  if (col.faction && col.unrest > SEUIL_REVOLTE
      && t - (col.derniereRevolte || -DELAI_REVOLTE) >= DELAI_REVOLTE
      && rng.chance(surDt(0.0015 * (col.unrest - SEUIL_REVOLTE) / (1 - SEUIL_REVOLTE)))) {
    return { evenement: 'revolte' };
  }

  if (col.pop > col.taille * 620 && col.unrest < 0.3 && col.taille < 3) {
    col.taille += 1;
    col.murs += 2;
    return { evenement: 'croissance' };
  }
  if (col.declin > 900) {
    const vivantes = world.colonies.filter((c) => !c.ruine).length;
    const socle = Math.max(6, Math.round(world.colonies.length * 0.6));
    // On n'abandonne pas la dernière ville d'une faction : ce serait la rayer
    // de la carte par la démographie après l'avoir protégée des armées.
    const derniere = col.faction && world.factions[col.faction]
      && world.factions[col.faction].colonies.length <= 1;
    if (vivantes > socle && !derniere) return { evenement: 'effondrement' };
    col.declin = 600; // en sursis : on ne vide pas la carte
    if (derniere) {
      // Une capitale acculée reçoit du renfort des siens : elle ne meurt pas.
      col.unrest = Math.max(0, col.unrest - 0.02);
      col.pop = Math.max(col.pop, 60);
    }
  }
  return null;
}

/** Au-delà, une ville ne se contente plus de gronder. */
const SEUIL_REVOLTE = 0.86;

/** Une ville qui vient de se soulever ne recommence pas le mois suivant. */
const DELAI_REVOLTE = 900;

/**
 * La ville se lève. Ce qui décide, c'est le rapport de force — une garnison
 * nombreuse derrière de bons murs mate une foule, une garnison fondue par la
 * guerre ne mate rien du tout. On ne tire pas au sort le vainqueur : on
 * compare, et le joueur qui a fait relever les murs de sa ville en récolte le
 * bénéfice exactement là où il l'attendait.
 */
function faireRevolte(world, col, rng, t) {
  col.derniereRevolte = t;
  // Une foule, c'est du monde. Écrite d'abord à 0,045 par tête, elle valait
  // onze hommes pour une ville de trois cents habitants furieux, contre une
  // garnison de soixante-quinze : la garnison gagnait toujours, et l'émeute
  // n'était qu'une ligne de journal. Trois cents personnes en colère, c'est
  // une force réelle — que de bons murs et une garnison entière contiennent,
  // et qu'une garnison fondue par la guerre ne contient pas.
  const foule = col.pop * col.unrest * 0.35 * rng.range(0.8, 1.25);
  const garnison = (col.defense || 0) + col.murs * 3;
  // Une geôle pleine se vide toujours dans une émeute : c'est la première
  // porte qu'on enfonce. (On efface le champ plutôt que d'importer justice.js,
  // qui vient plus tard dans l'ordre des modules.)
  const liberes = col.geole ? col.geole.detenus.length : 0;
  col.geole = null;

  if (garnison >= foule) {
    // Matée. La ville se tait, mais elle se souvient — et elle a payé cher :
    // des morts, des murs ébréchés, une garnison qui n'est plus ce qu'elle
    // était. Une seconde révolte serait bien plus difficile à contenir.
    col.unrest = 0.42;
    col.pop = Math.max(40, Math.round(col.pop * 0.94));
    col.defense = Math.round((col.defense || 0) * 0.45);
    return { issue: 'matee', liberes };
  }

  // La foule l'emporte. Une ville prise de force à quelqu'un revient à sa
  // maison ; une ville qui n'a jamais appartenu qu'à ses maîtres devient libre,
  // c'est-à-dire sans loi. Ce n'est pas une récompense : plus de prime, plus
  // d'intendance, et l'on y vend ce qu'on veut.
  const ancienne = col.faction;
  if (col.factionOrigine && col.factionOrigine !== ancienne
      && world.factions[col.factionOrigine]) {
    const r = faireSecession(world, col);
    return { issue: 'secession', liberes, ...r };
  }
  const f = world.factions[ancienne];
  if (f) {
    f.colonies = f.colonies.filter((id) => id !== col.id);
    if (f.capitale === col.id) f.capitale = f.colonies[0] || null;
  }
  col.faction = null;
  col.factionOrigine = null;
  col.contrats = [];
  col.unrest = 0.5;
  col.defense = Math.round(col.defenseMax * 0.2);
  col.pop = Math.max(40, Math.round(col.pop * 0.9));
  world.regions[col.regionId].controle = null;
  return { issue: 'affranchie', liberes, ancienne };
}

/** Rend une colonie à sa faction d'origine, en la ressuscitant s'il le faut. */
function faireSecession(world, col) {
  const ancienne = col.faction;
  const rendue = col.factionOrigine;
  if (ancienne && world.factions[ancienne]) {
    const f = world.factions[ancienne];
    f.colonies = f.colonies.filter((id) => id !== col.id);
    if (f.capitale === col.id) f.capitale = f.colonies[0] || null;
  }
  col.faction = rendue;
  const cible = world.factions[rendue];
  if (!cible.colonies.includes(col.id)) cible.colonies.push(col.id);
  if (!cible.capitale) cible.capitale = col.id;
  cible.prochainConseil = Math.min(cible.prochainConseil, 20);
  world.regions[col.regionId].controle = rendue;
  col.unrest = 0.3;
  col.defense = Math.round(col.defenseMax * 0.5);
  return { ancienne, rendue, renaissance: cible.colonies.length === 1 };
}

/** Transforme une colonie en ruine : la carte garde la cicatrice. */
function effondrer(world, col) {
  col.ruine = true;
  col.contrats = [];
  col.etal = null;
  const ancienne = col.faction;
  if (ancienne && world.factions[ancienne]) {
    const f = world.factions[ancienne];
    f.colonies = f.colonies.filter((id) => id !== col.id);
    if (f.capitale === col.id) f.capitale = f.colonies[0] || null;
  }
  col.faction = null;
  const r = world.regions[col.regionId];
  r.controle = null;
  // Ce qu'il reste se fouille : une ville morte, c'est un site de plus.
  r.site = { type: 'ville_morte', connu: true, fouille: false };
  return ancienne;
}

// ---------------------------------------------------------------------------
// Transactions du joueur
// ---------------------------------------------------------------------------

function meilleurCommercant(squad) {
  let best = null;
  for (const c of squad) {
    if (c.etat === 'mort') continue;
    if (!best || comp(c, 'commerce') > comp(best, 'commerce')) best = c;
  }
  return best;
}

function poidsInventaire(inv) {
  let w = 0;
  for (const k of Object.keys(inv)) {
    if (!COMMODITIES[k]) continue;
    w += inv[k] * COMMODITIES[k].poids;
  }
  return w;
}

/**
 * Achat par le joueur. Retourne { ok, motif, qte, cout }.
 * Le prix bouge au fur et à mesure de la transaction : acheter tout le stock
 * d'une petite ville coûte cher.
 */
function acheter(state, col, key, qte, groupe) {
  const g = groupe || groupeActif(state);
  const negoc = meilleurCommercant(g.membres);
  const hab = negoc ? comp(negoc, 'commerce') : 0;
  const repu = state.player.reputation[col.faction] || 0;
  let restant = Math.floor(qte);
  let cout = 0;
  let achetes = 0;

  const capacite = capacitePortage(state, g);
  const libre = capacite - poidsInventaire(g.inventaire);
  const poidsU = COMMODITIES[key].poids;
  const maxPoids = poidsU > 0 ? Math.floor(libre / poidsU) : restant;
  if (maxPoids <= 0) return { ok: false, motif: 'Sac plein.', qte: 0, cout: 0 };
  restant = Math.min(restant, maxPoids);

  while (restant > 0) {
    if ((col.stock[key] || 0) < 1) break;
    const p = prixJoueur(col, key, hab, repu, remiseDe(state, col.faction)).achat;
    if (state.player.credits - cout < p) break;
    cout += p;
    col.stock[key] -= 1;
    achetes += 1;
    restant -= 1;
  }
  if (achetes === 0) return { ok: false, motif: 'Rien à acheter à ce prix.', qte: 0, cout: 0 };
  cout = Math.round(cout);
  state.player.credits -= cout;
  g.inventaire[key] = (g.inventaire[key] || 0) + achetes;
  if (negoc) gagnerXp(negoc, 'commerce', XP_PRATIQUE * 0.5 + achetes * 0.3);
  return { ok: true, qte: achetes, cout };
}

function vendre(state, col, key, qte, groupe) {
  const g = groupe || groupeActif(state);
  const negoc = meilleurCommercant(g.membres);
  const hab = negoc ? comp(negoc, 'commerce') : 0;
  const repu = state.player.reputation[col.faction] || 0;
  let restant = Math.min(Math.floor(qte), g.inventaire[key] || 0);
  let gain = 0;
  let vendus = 0;
  while (restant > 0) {
    const p = prixJoueur(col, key, hab, repu, remiseDe(state, col.faction)).vente;
    gain += p;
    col.stock[key] = (col.stock[key] || 0) + 1;
    vendus += 1;
    restant -= 1;
  }
  if (vendus === 0) return { ok: false, motif: 'Rien à vendre.', qte: 0, gain: 0 };
  gain = Math.round(gain);
  g.inventaire[key] -= vendus;
  state.player.credits += gain;
  if (negoc) gagnerXp(negoc, 'commerce', XP_PRATIQUE * 0.5 + vendus * 0.3);
  return { ok: true, qte: vendus, gain };
}

/** Capacité de portage d'un groupe. Ce qu'il porte, il le porte lui-même. */
function capacitePortage(state, groupe) {
  const g = groupe || groupeActif(state);
  let cap = 0;
  const bonus = (state.base.recherche.logistique || 0) * 0.15;
  for (const c of (g ? g.membres : [])) {
    // Un mort ne porte plus rien, un K.O. est lui-même porté par les autres, et
    // un élève est resté en ville avec ses affaires.
    if (c.etat === 'mort' || c.etat === 'ko') continue;
    if ((c.formation && c.formation.restant > 0) || c.enseigne) continue;
    cap += portage(c, bonus);
  }
  // Ce que l'attelage porte à leur place. C'est là tout son intérêt : un convoi
  // qui passe soixante-dix pour cent de ses départs à faire la navette avec la
  // ville n'a pas besoin d'un plus grand sac, il a besoin de quelqu'un pour le
  // porter.
  cap += portageAttelage(g);
  return Math.round(cap);
}

/** Valeur marchande approximative d'un lot, pour l'UI. */
function valeurLot(lot) {
  let v = 0;
  for (const k of Object.keys(lot)) {
    if (COMMODITIES[k]) v += lot[k] * COMMODITIES[k].prix;
  }
  return Math.round(v);
}

// ---------------------------------------------------------------------------
// Étal d'équipement
// ---------------------------------------------------------------------------
// Chaque ville tient boutique selon le style de sa faction et sa taille.
// Le stock se renouvelle : revenir plus tard vaut le coup.

const DUREE_ETAL = 180; // heures avant renouvellement

function genererEtal(rng, world, col, t, bonusPalier = 0) {
  const style = FACTIONS[col.faction] ? FACTIONS[col.faction].style : 'commune';
  const catalogue = ETAL_PAR_STYLE[style] || ETAL_PAR_STYLE.commune;
  const palierMax = Math.min(3, (col.taille >= 3 ? 3 : col.taille >= 2 ? 2 : 1) + bonusPalier);
  const possibles = catalogue.filter((k) => (PALIERS_ITEM[k] ?? 0) <= palierMax);
  const combien = Math.min(possibles.length, rng.irange(2, 2 + col.taille * 2));
  const choisis = rng.shuffle(possibles).slice(0, combien);
  col.etal = {
    expire: t + DUREE_ETAL + rng.irange(0, 80),
    items: choisis.map((key) => ({
      key,
      qte: rng.irange(1, ITEMS[key].type === 'greffe' ? 1 : 3),
      // Chaque ville a sa propre humeur sur les prix
      coef: Number(rng.range(0.85, 1.3).toFixed(2)),
    })),
  };
  return col.etal;
}

function etalDe(world, col, rng, t, bonusPalier = 0) {
  if (!col.etal || t >= col.etal.expire) genererEtal(rng, world, col, t, bonusPalier);
  return col.etal;
}

/** Prix d'un objet pour le joueur, achat et revente. */
function prixItem(col, key, coef = 1, habilete = 0, repu = 0, remise = 0) {
  const base = ITEMS[key].prix * coef * (1 + col.unrest * 0.2);
  const marge = Math.max(0.03, 0.28 - habilete / 700 - Math.max(0, repu) / 900 - remise);
  const hostile = repu < -20 ? 0.2 + Math.min(0.5, -repu / 200) : 0;
  return {
    achat: Math.round(base * (1 + marge + hostile)),
    // On revend toujours mal : les armes d'occasion n'intéressent personne.
    vente: Math.round(base * 0.42 * (1 - hostile * 0.5)),
  };
}

function acheterItem(state, col, index, groupe) {
  const g = groupe || groupeActif(state);
  const etal = col.etal;
  if (!etal || !etal.items[index]) return { ok: false, motif: 'Article déjà parti.' };
  const ligne = etal.items[index];
  if (ligne.qte <= 0) return { ok: false, motif: 'Rupture de stock.' };
  if (g.objets.length >= 40) return { ok: false, motif: 'Réserve d’équipement pleine.' };

  const negoc = meilleurCommercant(g.membres);
  const hab = negoc ? comp(negoc, 'commerce') : 0;
  const repu = state.player.reputation[col.faction] || 0;
  const p = prixItem(col, ligne.key, ligne.coef, hab, repu, remiseDe(state, col.faction)).achat;
  if (state.player.credits < p) return { ok: false, motif: `Il manque ${p - state.player.credits} cr.` };

  state.player.credits -= p;
  ligne.qte -= 1;
  g.objets.push(ligne.key);
  if (negoc) gagnerXp(negoc, 'commerce', XP_PRATIQUE * 1.2);
  return { ok: true, prix: p, nom: ITEMS[ligne.key].nom };
}

function vendreItem(state, col, indexObjet, groupe) {
  const g = groupe || groupeActif(state);
  const key = g.objets[indexObjet];
  if (!key) return { ok: false, motif: 'Objet introuvable.' };
  const negoc = meilleurCommercant(g.membres);
  const hab = negoc ? comp(negoc, 'commerce') : 0;
  const repu = state.player.reputation[col.faction] || 0;
  const p = prixItem(col, key, 1, hab, repu, remiseDe(state, col.faction)).vente;
  g.objets.splice(indexObjet, 1);
  state.player.credits += p;
  if (negoc) gagnerXp(negoc, 'commerce', XP_PRATIQUE * 0.9);
  return { ok: true, prix: p, nom: ITEMS[key].nom };
}

// ===== src/caravanes.js ==============================================
// Caravanes marchandes. Les villes ne vivent pas en vase clos : ce qu'une
// colonie a en trop part chez celle qui en manque, sur des routes qui traversent
// des régions dangereuses. C'est ce qui relie l'économie à la carte — et ce qui
// donne au joueur autre chose à faire que ramasser des cailloux.


/** Au-delà, la carte devient un embouteillage illisible. */
const MAX_CARAVANES = 7;
const HEURES_PAR_CASE = 2;

// ---------------------------------------------------------------------------
// Départ
// ---------------------------------------------------------------------------

/** Ce dont une colonie regorge, au-delà de son confort. */
function surplus(col) {
  const out = [];
  for (const k of COMMODITY_KEYS) {
    const cible = cibleStock(col, k);
    const stock = col.stock[k] || 0;
    if (stock > cible * 1.6 && stock > 25) out.push([k, stock - cible * 1.2]);
  }
  return out;
}

/** Ce qui lui manque cruellement. */
function besoin(col, k) {
  const cible = cibleStock(col, k);
  const stock = col.stock[k] || 0;
  return Math.max(0, cible * 0.8 - stock);
}

function vivante(col) {
  return col && !col.ruine && col.faction;
}

/**
 * Cherche un couple vendeur / acheteur qui a vraiment intérêt à commercer.
 * On ne fabrique pas de trafic pour décorer la carte : s'il n'y a ni surplus
 * ni pénurie, aucune caravane ne part.
 */
function tenterDepart(state, rng, log) {
  const world = state.world;
  if (world.caravanes.length >= MAX_CARAVANES) return null;

  const vendeurs = world.colonies.filter((c) => vivante(c) && surplus(c).length);
  if (!vendeurs.length) return null;
  const de = rng.pick(vendeurs);
  const dispo = surplus(de);

  let meilleur = null;
  for (const [k, qteDispo] of dispo) {
    for (const vers of world.colonies) {
      if (!vivante(vers) || vers.id === de.id) continue;
      const manque = besoin(vers, k);
      if (manque < 12) continue;
      const d = distance(de.regionId, vers.regionId);
      if (d > 7) continue;
      // Le gain vaut-il le trajet ? Écart de prix contre distance.
      const gain = (prixUnitaire(vers, k) - prixUnitaire(de, k)) * Math.min(qteDispo, manque);
      const score = gain / (1 + d * 0.6);
      if (score > 12 && (!meilleur || score > meilleur.score)) {
        meilleur = { k, de, vers, qte: Math.min(qteDispo, manque), score };
      }
    }
  }
  if (!meilleur) return null;

  const route = chemin(world, de.regionId, meilleur.vers.regionId);
  if (!route || !route.length) return null;

  const qte = Math.max(10, Math.round(meilleur.qte * rng.range(0.5, 0.9)));
  de.stock[meilleur.k] = Math.max(0, (de.stock[meilleur.k] || 0) - qte);

  const car = {
    id: idDepuisRng(rng, 'v'),
    faction: de.faction,
    deId: de.id,
    versId: meilleur.vers.id,
    regionId: de.regionId,
    route,
    etape: 0,
    progres: 0,
    cargaison: { [meilleur.k]: qte },
    // Une caravane riche paie des gardes.
    escorte: Math.round(6 + qte * 0.25 * rng.range(0.7, 1.4)),
    depuis: state.temps,
  };
  world.caravanes.push(car);
  // Départs et arrivées ne sont pas journalisés : il en passe des centaines,
  // et le journal est plafonné — elles chasseraient les guerres et les morts
  // de la mémoire du monde. L'écran Monde les montre en direct.
  return car;
}

// ---------------------------------------------------------------------------
// Route
// ---------------------------------------------------------------------------

function retirerCaravane(world, car) {
  const i = world.caravanes.indexOf(car);
  if (i >= 0) world.caravanes.splice(i, 1);
}

function valeurCargaison(car) {
  let v = 0;
  for (const k of Object.keys(car.cargaison)) {
    v += (car.cargaison[k] || 0) * COMMODITIES[k].prix;
  }
  return Math.round(v);
}

function arriver(world, car, log) {
  const vers = colonieParId(world, car.versId);
  if (vivante(vers)) {
    for (const k of Object.keys(car.cargaison)) {
      vers.stock[k] = (vers.stock[k] || 0) + car.cargaison[k];
    }
    // Le vendeur encaisse : le trésor de sa faction s'en ressent.
    const de = colonieParId(world, car.deId);
    if (de && de.faction && world.factions[de.faction]) {
      world.factions[de.faction].tresor += Math.round(valeurCargaison(car) * 0.35);
    }
  }
  retirerCaravane(world, car);
}

function pillee(world, car, par, log) {
  log({
    type: 'caravane',
    texte: `Une caravane ${FACTIONS[car.faction].genitif} est pillée en ${nomRegion(world, car.regionId)}${par ? ` par ${par}` : ''}.`,
    regionId: car.regionId,
    important: true,
  });
  retirerCaravane(world, car);
}

/** Une heure de route pour toutes les caravanes. */
function tickCaravanes(state, log, ctx) {
  const rng = ctx.rng;
  const world = state.world;
  if (!world.caravanes) world.caravanes = [];

  for (const car of world.caravanes.slice()) {
    if (!world.caravanes.includes(car)) continue;

    const vers = colonieParId(world, car.versId);
    if (!vivante(vers)) { retirerCaravane(world, car); continue; }

    // Une colonne ennemie sur la case, et la caravane disparaît.
    const armee = world.armees.find(
      (a) => a.regionId === car.regionId && a.faction !== car.faction
    );
    if (armee && rng.chance(0.5)) {
      world.factions[armee.faction].tresor += Math.round(valeurCargaison(car) * 0.5);
      pillee(world, car, FACTIONS[armee.faction].nom, log);
      continue;
    }

    // Les routes ne sont pas sûres : le danger de la région s'applique.
    const r = world.regions[car.regionId];
    const risque = r.danger * 1.6 * (1 - Math.min(0.7, car.escorte / 60));
    if (rng.chance(risque)) {
      if (rng.chance(0.55)) {
        pillee(world, car, 'des pillards', log);
        continue;
      }
      // Attaque repoussée, mais l'escorte fond.
      car.escorte = Math.max(0, car.escorte - rng.irange(2, 8));
    }

    car.progres += 1;
    if (car.progres < HEURES_PAR_CASE) continue;
    car.progres = 0;

    if (car.etape >= car.route.length) { arriver(world, car, log); continue; }
    car.regionId = car.route[car.etape];
    // Le commerce trace les routes mieux que personne : c'est lui qui passe.
    damer(world, car.regionId, 1.6);
    car.etape++;
    if (car.etape >= car.route.length) arriver(world, car, log);
  }

  // Nouveau départ de temps en temps
  if (state.temps % 9 === 0) tenterDepart(state, rng, log);
}

// ---------------------------------------------------------------------------
// Le joueur s'en mêle
// ---------------------------------------------------------------------------

/** Caravanes présentes dans la région du joueur. */
function caravanesIci(state) {
  const g = groupeActif(state);
  return (state.world.caravanes || []).filter((c) => g && c.regionId === g.regionId);
}

/**
 * Détrousser une caravane. C'est rentable, c'est immédiat, et c'est la manière
 * la plus rapide de se faire haïr d'une faction — donc un vrai choix.
 */
function attaquerCaravane(state, car, rng, log, combatContre, genererBande) {
  if (!state.world.caravanes.includes(car)) {
    return { ok: false, motif: 'La caravane est déjà loin.' };
  }
  const escorteTaille = Math.max(1, Math.min(6, Math.round(car.escorte / 9)));
  const bande = genererBande(rng, car.faction, escorteTaille, Math.min(2, Math.floor(state.temps / 2500)));
  bande.nom = `Escorte ${FACTIONS[car.faction].genitif}`;

  log({
    type: 'caravane',
    texte: `Embuscade sur une caravane ${FACTIONS[car.faction].genitif}.`,
    important: true,
    regionId: car.regionId,
  });

  const res = combatContre(state, bande, log, { rng });
  if (res.vainqueur !== 'A') {
    return { ok: true, gagne: false, motif: 'L’escorte a tenu.' };
  }

  // Le butin, puis l'addition : la faction n'oubliera pas.
  const pris = {};
  for (const k of Object.keys(car.cargaison)) pris[k] = car.cargaison[k];
  retirerCaravane(state.world, car);

  const rep = state.player.reputation;
  if (car.faction && car.faction !== 'essaim') {
    rep[car.faction] = Math.max(-100, (rep[car.faction] || 0) - 22);
    // Une caravane qui n'arrive pas, ce sont des gens qui l'attendaient. Ceux
    // des deux bouts s'en souviennent nommément, pas seulement la faction.
    for (const id of [car.deId, car.versId]) {
      const col = id && state.world.colonies.find((c) => c.id === id);
      if (col) retenirEnVille(col, 'pillage', state.temps, -18);
    }
  }
  state.stats.caravanesPillees = (state.stats.caravanesPillees || 0) + 1;
  return { ok: true, gagne: true, pris };
}

// ===== src/factions.js ===============================================
// Le monde tourne sans le joueur : les factions lèvent des armées, assiègent,
// prennent des colonies, signent des paix. C'est le cœur « vivant » de la sim.


// ---------------------------------------------------------------------------
// Mesures
// ---------------------------------------------------------------------------

function puissance(world, key) {
  const f = world.factions[key];
  if (!f) return 0;
  let p = f.tresor / 60;
  for (const cid of f.colonies) {
    const c = colonieParId(world, cid);
    if (!c) continue;
    p += c.pop * 0.06 + c.defense * 0.5 + c.murs * 4;
  }
  for (const a of world.armees) {
    if (a.faction === key) p += a.force * 0.6;
  }
  return Math.round(p);
}

function enGuerre(world, a, b) {
  if (a === 'essaim' || b === 'essaim') return a !== b;
  return world.guerres.some(
    (g) => (g.a === a && g.b === b) || (g.a === b && g.b === a)
  );
}

function guerresDe(world, key) {
  return world.guerres.filter((g) => g.a === key || g.b === key);
}

function relation(world, a, b) {
  const f = world.factions[a];
  if (!f) return 0;
  return f.relations[b] ?? 0;
}

function majRelation(world, a, b, delta) {
  const fa = world.factions[a];
  const fb = world.factions[b];
  if (!fa || !fb || a === b) return;
  if (a === 'essaim' || b === 'essaim') return;
  const v = Math.max(-100, Math.min(100, (fa.relations[b] ?? 0) + delta));
  fa.relations[b] = v;
  fb.relations[a] = v;
}

function declarerGuerre(world, a, b, t, log, but) {
  if (enGuerre(world, a, b)) return;
  world.guerres.push({ a, b, depuis: t, batailles: 0, but: but || null, initiateur: a });
  majRelation(world, a, b, -60);
  crediterDirigeant(world, a, 'guerre');
  const d = dirigeant(world, a);
  log({
    type: 'guerre',
    texte: `${FACTIONS[a].nom} déclare${FACTIONS[a].pluriel ? 'nt' : ''} la guerre ${FACTIONS[b].datif}`
      + `${but ? ` ${but.texte}` : ''}.${d ? ` ${d.titre} ${d.nom} l’a voulue.` : ''}`,
    factions: [a, b],
  });
}

function signerPaix(world, a, b, t, log, motif) {
  const i = world.guerres.findIndex(
    (g) => (g.a === a && g.b === b) || (g.a === b && g.b === a)
  );
  if (i < 0) return;
  const g = world.guerres[i];
  world.guerres.splice(i, 1);
  majRelation(world, a, b, 45);
  // Une guerre abandonnée sans avoir obtenu ce qu'on cherchait coûte à celui
  // qui l'a déclarée : c'est la façon la plus nette de faire tomber un chef.
  if (motif !== 'atteint' && g.initiateur) crediterDirigeant(world, g.initiateur, 'paix');
  log({
    type: 'paix',
    texte: `${FACTIONS[a].nom} et ${FACTIONS[b].nom} signent une trêve`
      + `${motif === 'atteint' && g.but ? ` — l’affaire est réglée ${g.but.texte}` : ''}.`,
    factions: [a, b],
  });
}

// ---------------------------------------------------------------------------
// Armées
// ---------------------------------------------------------------------------

// Lever des hommes coûte cher : sans ça, les factions passent leur temps à
// s'échanger les mêmes villes et la carte devient du bruit.
function coutArmee(force) {
  return Math.round(force * 5.2);
}

function leverArmee(world, key, force, depuis, cibleId, log) {
  const f = world.factions[key];
  const col = colonieParId(world, cibleId);
  if (!col) return null;
  const route = chemin(world, depuis, col.regionId) || [];
  const a = {
    id: `a${world.prochainArmeeId++}`,
    faction: key,
    regionId: depuis,
    force,
    forceMax: force,
    cible: cibleId,
    route,
    etape: 0,
    progres: 0,
    etat: 'marche',
    ravitaillement: 60 + Math.round(force / 4),
  };
  world.armees.push(a);
  f.tresor -= coutArmee(force);
  log({
    type: 'armee',
    texte: `${FACTIONS[key].nom} lève${FACTIONS[key].pluriel ? 'nt' : ''} une colonne (${force}) en direction de ${col.nom}.`,
    factions: [key],
    regionId: depuis,
  });
  return a;
}

function dissoudre(world, armee) {
  const i = world.armees.indexOf(armee);
  if (i >= 0) world.armees.splice(i, 1);
}

function capturer(world, armee, col, t, log, ctx) {
  // L'avant-poste du joueur : sa vérité est dans `state.base`, pas ici. On
  // prévient l'appelant, qui sait démonter le camp.
  if (col.avantPoste) {
    col.avantPoste = false;
    if (ctx && ctx.perdreAvantPoste) ctx.perdreAvantPoste();
  }
  const ancien = col.faction;
  const nouveau = armee.faction;
  if (ancien && world.factions[ancien]) {
    const fa = world.factions[ancien];
    fa.colonies = fa.colonies.filter((c) => c !== col.id);
    if (fa.capitale === col.id) fa.capitale = fa.colonies[0] || null;
  }

  if (nouveau === 'essaim') {
    // L'Essaim ne gouverne pas : il saigne la ville et repart.
    col.pop = Math.max(40, Math.round(col.pop * 0.55));
    col.unrest = Math.min(1, col.unrest + 0.4);
    for (const k of COMMODITY_KEYS) col.stock[k] = Math.round((col.stock[k] || 0) * 0.35);
    col.defense = 0;
    col.faction = ancien;
    if (ancien && world.factions[ancien] && !world.factions[ancien].colonies.includes(col.id)) {
      world.factions[ancien].colonies.push(col.id);
    }
    log({
      type: 'raid',
      texte: `L’Essaim saccage ${col.nom}. La ville tient, à peine.`,
      regionId: col.regionId,
      factions: [ancien].filter(Boolean),
    });
  } else {
    col.faction = nouveau;
    world.factions[nouveau].colonies.push(col.id);
    world.regions[col.regionId].controle = nouveau;
    for (const v of voisins(col.regionId)) {
      if (world.regions[v].controle === ancien) world.regions[v].controle = nouveau;
    }
    col.pop = Math.max(50, Math.round(col.pop * 0.82));
    col.unrest = Math.min(1, col.unrest + 0.35);
    col.prises = (col.prises || 0) + 1;
    // Prendre une ville assoit celui qui l'a voulue ; la perdre ronge l'autre.
    crediterDirigeant(world, nouveau, 'prise');
    if (ancien) crediterDirigeant(world, ancien, 'perte');
    // Pillage : une partie du stock file dans le trésor du vainqueur
    let butin = 0;
    for (const k of COMMODITY_KEYS) {
      const pris = Math.round((col.stock[k] || 0) * 0.3);
      col.stock[k] -= pris;
      butin += pris;
    }
    world.factions[nouveau].tresor += Math.round(butin * 1.6);
    col.defense = Math.round(col.defenseMax * 0.25);
    log({
      type: 'capture',
      texte: `${FACTIONS[nouveau].nom} s’empare${FACTIONS[nouveau].pluriel ? 'nt' : ''} de ${col.nom}${ancien ? ` (${FACTIONS[ancien].nom})` : ''}.`,
      regionId: col.regionId,
      factions: [nouveau, ancien].filter(Boolean),
    });
    if (ancien) majRelation(world, nouveau, ancien, -25);
  }

  // La colonne fond après la prise : elle devient garnison
  armee.force = Math.round(armee.force * 0.5);
  if (armee.force < 12 || nouveau === 'essaim') dissoudre(world, armee);
  else {
    armee.etat = 'garnison';
    armee.attente = ctx.rng.irange(20, 90);
  }
}

function batailleArmees(world, a, b, t, log, ctx) {
  const rng = ctx.rng;
  const fa = a.force * rng.range(0.75, 1.3);
  const fb = b.force * rng.range(0.75, 1.3);
  const total = fa + fb;
  const pertesA = Math.round(a.force * (fb / total) * rng.range(0.55, 1.05));
  const pertesB = Math.round(b.force * (fa / total) * rng.range(0.55, 1.05));
  a.force = Math.max(0, a.force - pertesA);
  b.force = Math.max(0, b.force - pertesB);
  const g = world.guerres.find(
    (w) => (w.a === a.faction && w.b === b.faction) || (w.a === b.faction && w.b === a.faction)
  );
  if (g) g.batailles++;
  log({
    type: 'bataille',
    texte: `Choc de colonnes : ${FACTIONS[a.faction].nom} (−${pertesA}) contre ${FACTIONS[b.faction].nom} (−${pertesB}).`,
    regionId: a.regionId,
    factions: [a.faction, b.faction],
  });
  for (const armee of [a, b]) {
    if (armee.force <= 8) {
      log({
        type: 'armee',
        texte: `La colonne ${FACTIONS[armee.faction].genitif} est anéantie.`,
        regionId: armee.regionId,
        factions: [armee.faction],
      });
      dissoudre(world, armee);
    }
  }
}

function tickArmee(world, armee, t, log, ctx) {
  const rng = ctx.rng;

  // Ravitaillement : une colonne loin de chez elle finit par se déliter
  armee.ravitaillement -= 1;
  if (armee.ravitaillement <= 0) {
    armee.force -= Math.max(1, Math.round(armee.force * 0.02));
    if (armee.force <= 8) {
      log({
        type: 'armee',
        texte: `La colonne ${FACTIONS[armee.faction].genitif} se disperse, faute de vivres.`,
        regionId: armee.regionId,
        factions: [armee.faction],
      });
      dissoudre(world, armee);
      return;
    }
  }

  if (armee.etat === 'garnison') {
    armee.attente -= 1;
    const col = colonieParId(world, armee.cible);
    if (col) col.defense = Math.min(col.defenseMax, col.defense + armee.force * 0.05);
    if (armee.attente <= 0) dissoudre(world, armee);
    return;
  }

  if (armee.etat === 'marche') {
    const cible = colonieParId(world, armee.cible);
    if (!cible) { dissoudre(world, armee); return; }
    // La cible a changé de mains entre-temps : on rentre
    if (cible.faction === armee.faction) {
      log({
        type: 'armee',
        texte: `La colonne ${FACTIONS[armee.faction].genitif} rebrousse chemin : ${cible.nom} est déjà tombée.`,
        regionId: armee.regionId,
        factions: [armee.faction],
      });
      dissoudre(world, armee);
      return;
    }
    if (!armee.route.length || armee.etape >= armee.route.length) {
      armee.etat = 'siege';
      armee.regionId = cible.regionId;
      log({
        type: 'siege',
        texte: `${FACTIONS[armee.faction].nom} met${FACTIONS[armee.faction].pluriel ? 'tent' : ''} le siège devant ${cible.nom}.`,
        regionId: cible.regionId,
        factions: [armee.faction, cible.faction].filter(Boolean),
      });
      return;
    }
    const prochaine = armee.route[armee.etape];
    armee.progres += 1;
    const cout = Math.max(2, Math.round(2 + (world.regions[prochaine] ? 1 : 0)));
    if (armee.progres >= cout) {
      armee.progres = 0;
      armee.regionId = prochaine;
      armee.etape++;
      // Une colonne en marche entretient la route qu'elle emprunte. Le monde
      // n'attend pas le joueur pour se donner des chemins.
      damer(world, prochaine, 2.5);
      // Rencontre avec une colonne ennemie sur la même case
      const autre = world.armees.find(
        (o) => o !== armee && o.regionId === armee.regionId && o.faction !== armee.faction
          && enGuerre(world, o.faction, armee.faction)
      );
      if (autre) batailleArmees(world, armee, autre, t, log, ctx);
    }
    return;
  }

  if (armee.etat === 'siege') {
    const col = colonieParId(world, armee.cible);
    if (!col) { dissoudre(world, armee); return; }
    if (col.faction === armee.faction) { dissoudre(world, armee); return; }

    // Une capitale se défend comme une capitale : sans ça, une faction se fait
    // rayer de la carte en une campagne et ne revient jamais.
    const estCapitale = col.faction && world.factions[col.faction]
      && world.factions[col.faction].capitale === col.id;
    const derniere = col.faction && world.factions[col.faction]
      && world.factions[col.faction].colonies.length <= 1;
    const acharnement = (estCapitale ? 1.8 : 1) * (derniere ? 1.6 : 1);
    const assaut = armee.force * rng.range(0.5, 1.1);
    const tenue = (col.defense * rng.range(0.6, 1.15) + col.murs * 2) * acharnement;
    if (assaut > tenue) {
      col.defense = Math.max(0, col.defense - assaut * 0.12);
      armee.force -= Math.max(0, Math.round(tenue * 0.02));
    } else {
      col.defense = Math.max(0, col.defense - assaut * 0.05);
      armee.force -= Math.max(1, Math.round(tenue * 0.035));
    }
    col.unrest = Math.min(1, col.unrest + 0.004);

    if (armee.force <= 8) {
      log({
        type: 'siege',
        texte: `Le siège de ${col.nom} est brisé : ${FACTIONS[armee.faction].nom} recule${FACTIONS[armee.faction].pluriel ? 'nt' : ''}.`,
        regionId: col.regionId,
        factions: [armee.faction, col.faction].filter(Boolean),
      });
      if (col.faction && armee.faction !== 'essaim') majRelation(world, armee.faction, col.faction, -8);
      dissoudre(world, armee);
      return;
    }
    if (col.defense <= 1) {
      // On ne raye pas une faction de la carte par les armes. Sa dernière
      // ville tient, quel qu'en soit le prix : c'est ce qui laisse au monde
      // six acteurs plutôt qu'un vainqueur et des ruines.
      const proprio = col.faction && world.factions[col.faction];
      if (proprio && proprio.colonies.length <= 1 && armee.faction !== 'essaim') {
        col.defense = Math.round(col.defenseMax * 0.35);
        col.pop = Math.max(40, Math.round(col.pop * 0.9));
        armee.force = Math.round(armee.force * 0.45);
        log({
          type: 'siege',
          texte: `${col.nom} tient. ${FACTIONS[col.faction].nom} n’a plus que cette ville, et la défend comme telle.`,
          regionId: col.regionId,
          factions: [col.faction, armee.faction],
          important: true,
        });
        if (armee.force <= 8) dissoudre(world, armee);
        else { armee.etat = 'marche'; armee.ravitaillement = Math.min(armee.ravitaillement, 20); }
        return;
      }
      capturer(world, armee, col, t, log, ctx);
    }
  }
}

// ---------------------------------------------------------------------------
// Conseil : décisions périodiques d'une faction
// ---------------------------------------------------------------------------

function coloniesDe(world, key) {
  return world.factions[key].colonies
    .map((id) => colonieParId(world, id))
    .filter((c) => c && !c.ruine);
}

function cibleLaPlusProche(world, key, ennemi) {
  const miennes = coloniesDe(world, key);
  const leurs = coloniesDe(world, ennemi);
  let best = null;
  let bestD = Infinity;
  let depuis = null;
  for (const m of miennes) {
    for (const l of leurs) {
      const d = distance(m.regionId, l.regionId);
      if (d < bestD) { bestD = d; best = l; depuis = m; }
    }
  }
  return best ? { cible: best, depuis, dist: bestD } : null;
}

function conseil(world, key, t, log, ctx) {
  const rng = ctx.rng;
  const f = world.factions[key];
  const mesColonies = coloniesDe(world, key);

  if (key === 'essaim') {
    // L'Essaim n'a pas de politique : il déferle.
    f.prochainConseil = rng.irange(40, 130);
    const toutes = world.colonies.filter((c) => c.faction && c.faction !== 'essaim');
    if (!toutes.length) return;
    const cible = rng.pick(toutes);
    const sauvages = world.regions.filter((r) => !r.colonie && !r.controle);
    const depuis = sauvages.length ? rng.pick(sauvages).i : rng.pick(world.regions).i;
    const force = rng.irange(30, 70) + Math.floor(t / 400);
    const a = leverArmee(world, 'essaim', force, depuis, cible.id, log);
    if (a) f.tresor = 0;
    return;
  }

  if (!mesColonies.length) {
    // Faction éteinte : elle ne délibère plus.
    f.prochainConseil = 400;
    return;
  }

  f.prochainConseil = rng.irange(30, 90);

  // Ce qu'on s'autorise avant de décider ce qu'on fait : l'impôt paie les
  // colonnes, la justice tient les routes, et l'un et l'autre se paient en
  // grogne. La politique intérieure passe donc avant la politique étrangère.
  legiferer(world, key, t, log, ctx);
  // Puis ce qu'on pense de la façon dont gouvernent les autres. Une loi vaut
  // aussi vers l'extérieur.
  jugerLesAutres(world, key);

  // Revenus : l'impôt, au taux que la loi fixe. Ce n'est plus une constante —
  // c'est la première décision d'un Commandeur qui se lit dans les comptes.
  const taux = loisDe(world, key).impot;
  const revenu = mesColonies.reduce((s, c) => s + c.pop * taux * (1 - c.unrest), 0);
  f.tresor += Math.round(revenu);
  // Et ce qu'on prélève au-delà de l'ordinaire se paie en grogne.
  const pression = pressionFiscale(world, key);
  if (pression !== 0) {
    for (const c of mesColonies) {
      c.unrest = Math.max(0, Math.min(1, c.unrest + pression));
    }
  }

  const maPuissance = puissance(world, key);
  const mesGuerres = guerresDe(world, key);

  // 1) Faire la paix si la guerre coûte trop cher
  for (const g of mesGuerres) {
    const autre = g.a === key ? g.b : g.a;
    const duree = t - g.depuis;
    const leur = puissance(world, autre);
    // Une guerre qui a obtenu ce qu'elle voulait s'arrête, même fraîche : c'est
    // ce qui distingue une campagne d'une usure sans objet.
    const but = etatDuBut(world, g, key);
    if (but === 'atteint' || but === 'perdu') {
      signerPaix(world, key, autre, t, log, but);
      continue;
    }
    const fatigue = duree / 900 + g.batailles * 0.08;
    const envie = Math.min(0.7, fatigue * 0.35 + (leur > maPuissance * 1.4 ? 0.25 : 0))
      * penchant(world, key, 'treve');
    if (duree > 220 && rng.chance(envie)) {
